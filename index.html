ts taken with the lens cap on. They remove the sensor's thermal noise.\",\n    lblExposureSame: \"Exposure (same as Lights)\",\n    lblIsoSame: \"ISO (same as Lights)\",\n    lblApertureNoAffect: \"Aperture (doesn't matter, cap on)\",\n    lblEstTime: \"Estimated time\",\n    howtoTitle: \"\ud83d\udcdd How to do it\",\n    darksStep1: \"Cap the lens with the physical lens cap (pointing at something dark doesn't work).\",\n    darksStep4: \"Try to match the ambient temperature you had for the Lights.\",\n    darksStep5: \"You don't need to keep the same framing or focus.\",\n    biasDesc: \"Also called \\\"Offset\\\" frames. Lens cap on, fastest shutter speed your camera allows. They remove the sensor's read noise.\",\n    biasStep1: \"Cap the lens with the physical lens cap.\",\n    biasStep3: \"Set the fastest shutter speed your camera allows (e.g. 1/4000s or faster).\",\n    biasStep4: \"Aperture and temperature don't matter for this frame type.\",\n    lblMinExposure: \"Minimum exposure\",\n    lblApertureNoInfluence: \"Aperture (cap on)\",\n    apertureNoInfluenceVal: \"No effect\",\n    flatsDesc: \"Even, uniform lighting (light panel, dawn sky, or a white t-shirt over the lens). They correct vignetting and dust spots.\",\n    flatsStep1: \"Don't change the framing or focus from the Lights.\",\n    flatsStep4: \"Adjust the exposure time until the histogram sits at about 50%.\",\n    lblApertureSameLights: \"Aperture (same as Lights)\",\n    lblExposureApprox: \"Approx. exposure (adjust to the histogram)\",\n    resumenTitle: \"Session summary\",\n    resumenDesc: \"Estimated total time to take every shot tonight.\",\n    totalLabel: \"estimated total duration\",\n    btnStartPrefix: \"Start with\",\n    btnEditParams: \"\u270f\ufe0f Edit Lights settings\",\n    btnFinishSession: \"\u2705 Finish session\",\n    nameModalTitle: \"Save with a name?\",\n    nameModalText: \"This way you'll recognize this session in your recent sessions.\",\n    nameModalLabel: \"Session name (optional)\",\n    nameModalSave: \"Save\",\n    nameModalSkip: \"Not now\",\n    btnNewSession: \"\ud83d\uddd1\ufe0f Start a new session\",\n    btnReorder: \"\ud83d\udd00 Reorder session\",\n    reorderTitle: \"Reorder session\",\n    reorderText: \"Change the order you want to do the phases in, e.g. if you'd rather do Bias before Flats.\",\n    reorderDone: \"Done\",\n    helpStep1: \"Enter the settings you'll shoot with (Lights): exposure time, ISO, aperture and how many shots you'll take.\",\n    helpStep2: \"The app automatically works out how to take your calibration frames: Darks, Bias and Flats, with their settings and timings.\",\n    helpStep3: \"Go to each tab (Lights, Darks, Bias, Flats) and tick it off once you've taken that batch of shots; the app moves on to the next one for you.\",\n    helpStep4: \"In Summary you can see the total session length, the estimated finish time, and reorder the phases if you prefer.\",\n    recommendedWord: \"Recommended\",\n    shotsToTake: \"shots to take\",\n    confirmTitle: \"Start from scratch?\",\n    confirmText: \"This session and its data saved on the phone will be deleted.\",\n    confirmYes: \"Yes, delete and start\",\n    confirmNo: \"Cancel\",\n    completeTitle: \"Session complete!\",\n    completeText: \"You've marked all 4 phases done: Lights, Darks, Bias and Flats. You're ready to stack your images.\",\n    completeClose: \"Continue in the session\"\n  }\n};\nfunction t(key, vars){\n  let str = (I18N[state.lang] && I18N[state.lang][key]) || I18N.es[key] || key;\n  if(vars){\n    Object.keys(vars).forEach(k=>{ str = str.replace(new RegExp('\\\\{'+k+'\\\\}','g'), vars[k]); });\n  }\n  return str;\n}\nfunction applyTranslations(){\n  document.documentElement.lang = state.lang;\n  document.querySelectorAll('[data-i18n]').forEach(el=>{\n    el.textContent = t(el.getAttribute('data-i18n'));\n  });\n}\n\n// ---------------------------------------------------------------------\n// State\n// ---------------------------------------------------------------------\nconst STORAGE_KEY = 'calibra-session-v1';\n\nfunction defaultState(){\n  return {\n    exposure: 15, iso: 200, aperture: '2.8', numLights: 1, startTime: '',\n    biasExposureInput: '1/4000', flatsExposureInput: '1/100',\n    darksTarget: 20, biasTarget: 50, flatsTarget: 30,\n    phaseOrder: ['lights','darks','flats','bias'],\n    progress: { lights:false, darks:false, bias:false, flats:false },\n    started: false,\n    redMode: false,\n    lang: 'es',\n    history: []\n  };\n}\n\nlet state = load();\ntry{\n  const kitLang = localStorage.getItem('kitLang_v1');\n  if(kitLang){ state.lang = kitLang; }\n  const kitNight = localStorage.getItem('kitNight_v1');\n  if(kitNight){ state.redMode = (kitNight === 'on'); }\n}catch(e){}\ntry{ document.body.classList.toggle('zoom-mode', localStorage.getItem('kitZoom_v1') === 'on'); }catch(e){}\nlet view = state.started ? 'session' : 'home'; // 'home' | 'setup' | 'session'\n\nfunction load(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(raw){\n      const s = Object.assign(defaultState(), JSON.parse(raw));\n      if(typeof s.aperture === 'string' && /^f\\//i.test(s.aperture.trim())){\n        s.aperture = s.aperture.trim().replace(/^f\\//i, '');\n      }\n      return s;\n    }\n  }catch(e){}\n  return defaultState();\n}\nfunction save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }\n\nfunction nowHHMM(){\n  const d = new Date();\n  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');\n}\n\n// ---- Recent sessions history (last 5) ----\nfunction historySnapshot(){\n  return {\n    exposure: state.exposure, iso: state.iso, aperture: state.aperture, numLights: state.numLights,\n    darksTarget: state.darksTarget, biasTarget: state.biasTarget, flatsTarget: state.flatsTarget,\n    phaseOrder: state.phaseOrder.slice(), savedAt: Date.now()\n  };\n}\nfunction pushHistory(){\n  state.history = state.history || [];\n  state.history.unshift(historySnapshot());\n  state.history = state.history.slice(0,5);\n}\nfunction relTime(ts){\n  const diff = Math.max(0, Date.now() - ts);\n  const min = Math.floor(diff/60000);\n  if(min < 1) return t('justNow');\n  if(min < 60) return `${min} ${t('minAgo')}`;\n  const h = Math.floor(min/60);\n  if(h < 24) return `${h} ${t('hAgo')}`;\n  const d = Math.floor(h/24);\n  return `${d} ${t('dAgo')}`;\n}\nfunction renderHistoryList(){\n  const el = document.getElementById('historyList');\n  if(!el) return;\n  const hist = state.history || [];\n  if(!hist.length){ el.style.display = 'none'; el.innerHTML = ''; return; }\n  el.style.display = 'block';\n  el.innerHTML = `<div class=\"history-title\">${t('historyTitle')}</div><div class=\"session-list\">` + hist.map((h,i)=>{\n    const params = `${h.exposure}s \u00b7 ISO ${h.iso} \u00b7 ${h.numLights} Lights${h.aperture ? ' \u00b7 f/'+h.aperture : ''}`;\n    const title = h.name ? h.name : params;\n    const sub = h.name ? (params + ' \u00b7 ' + relTime(h.savedAt)) : relTime(h.savedAt);\n    return `\n    <div class=\"session-row\">\n      <div class=\"session-row-main\" onclick=\"loadHistory(${i})\">\n        <span class=\"dot\"></span>\n        <div class=\"body\">\n          <h3>${title}</h3>\n          <p>${sub}</p>\n        </div>\n      </div>\n      <div class=\"session-row-actions\">\n        <button onclick=\"deleteHistory(${i})\" aria-label=\"${t('historyDelete')}\">\u2715</button>\n      </div>\n    </div>`;\n  }).join('') + '</div>';\n}\nfunction loadHistory(i){\n  const h = (state.history || [])[i];\n  if(!h) return;\n  state.exposure = h.exposure;\n  state.iso = h.iso;\n  state.aperture = h.aperture;\n  state.numLights = h.numLights;\n  state.darksTarget = h.darksTarget;\n  state.biasTarget = h.biasTarget;\n  state.flatsTarget = h.flatsTarget;\n  state.phaseOrder = h.phaseOrder.slice();\n  state.startTime = nowHHMM();\n  state.progress = { lights:false, darks:false, bias:false, flats:false };\n  state.started = true;\n  pushHistory();\n  save();\n  goSession('resumen');\n}\nfunction deleteHistory(i){\n  state.history.splice(i,1);\n  save();\n  renderHistoryList();\n}\n\n// ---- Red night-vision mode ----\nfunction applyRedMode(){\n  document.body.classList.toggle('red', state.redMode);\n}\n\n// ---- Navigation between the three screens ----\nfunction goHome(){ view = 'home'; render(); }\nfunction goHelp(){ view = 'help'; render(); }\nfunction goSetup(){ fillSetupForm(); view = 'setup'; render(); }\nfunction goSession(tab){ view = 'session'; render(); showTab(tab || 'resumen'); }\n\ndocument.getElementById('startNewBtn').addEventListener('click', goSetup);\ndocument.getElementById('headerHelpBtn').addEventListener('click', goHelp);\ndocument.getElementById('backFromHelp').addEventListener('click', goHome);\ndocument.getElementById('backFromSetup').addEventListener('click', ()=>{\n  if(state.started) goSession('resumen'); else goHome();\n});\n\n// ---- Setup form <-> state ----\nfunction fillSetupForm(){\n  document.getElementById('in-exposure').value = state.exposure;\n  document.getElementById('in-iso').value = state.iso;\n  document.getElementById('in-numlights').value = state.numLights;\n  document.getElementById('in-aperture').value = state.aperture;\n  document.getElementById('in-starttime').value = state.startTime || nowHHMM();\n}\n\ndocument.getElementById('startBtn').addEventListener('click', ()=>{\n  const exposure = parseFloat(document.getElementById('in-exposure').value) || 0;\n  const iso = parseInt(document.getElementById('in-iso').value) || 0;\n  const numLights = parseInt(document.getElementById('in-numlights').value) || 0;\n  const aperture = document.getElementById('in-aperture').value.trim();\n  const startTime = document.getElementById('in-starttime').value;\n\n  if(!exposure || !numLights){\n    alert(t('alertMissing'));\n    return;\n  }\n\n  const wasStarted = state.started;\n  const paramsChanged = exposure !== state.exposure || iso !== state.iso;\n  state.exposure = exposure;\n  state.iso = iso;\n  state.numLights = numLights;\n  state.aperture = aperture;\n  state.startTime = startTime;\n  state.biasTarget = state.biasTarget || 50;\n  state.started = true;\n\n  if(!wasStarted || paramsChanged){\n    state.progress = { lights:false, darks:false, bias:false, flats:false };\n  }\n  pushHistory();\n  save();\n  goSession('resumen');\n});\n\n// ---- Helpers ----\nfunction fmtDuration(s){\n  if(s < 30) return '< 1 min';\n  let totalMin = Math.round(s/60);\n  const h = Math.floor(totalMin/60);\n  const m = totalMin%60;\n  if(h > 0) return m > 0 ? `${h}h ${m}min` : `${h}h`;\n  return `${m} min`;\n}\nfunction parseExpToSeconds(str, fallback){\n  if(!str) return fallback;\n  str = str.trim();\n  if(str.includes('/')){\n    const [n,d] = str.split('/').map(parseFloat);\n    if(d) return n/d;\n  }\n  const v = parseFloat(str);\n  return isNaN(v) ? fallback : v;\n}\nfunction displayExp(raw){\n  raw = (raw||'').trim();\n  if(!raw) return '\u2014';\n  return raw.endsWith('s') ? raw : raw + 's';\n}\nfunction dispAperture(){ return state.aperture ? 'f/' + state.aperture : '\u2014'; }\nfunction biasExpSeconds(){ return parseExpToSeconds(state.biasExposureInput, 1/4000); }\nfunction flatsExpSeconds(){ return parseExpToSeconds(state.flatsExposureInput, 1/100); }\nfunction phaseSeconds(phase){\n  if(phase==='lights') return state.numLights*state.exposure;\n  if(phase==='darks') return state.darksTarget*state.exposure;\n  if(phase==='bias') return state.biasTarget * biasExpSeconds();\n  if(phase==='flats') return state.flatsTarget*flatsExpSeconds();\n  return 0;\n}\n\nfunction toggleDone(phase){\n  state.progress[phase] = !state.progress[phase];\n  const justCompleted = state.progress[phase];\n  save();\n  renderPanel(phase);\n  updateProgressBar();\n  checkSessionComplete();\n  if(justCompleted){\n    const idx = state.phaseOrder.indexOf(phase);\n    if(idx > -1 && idx < state.phaseOrder.length - 1) showTab(state.phaseOrder[idx+1]);\n  }\n}\nfunction changeTarget(phase, delta, min, max){\n  let v = (state[phase+'Target']||0) + delta;\n  v = Math.max(min, Math.min(max, v));\n  state[phase+'Target'] = v;\n  save();\n  renderPanel(phase);\n  renderPanel('resumen');\n  updateProgressBar();\n}\n\nfunction doneRowHTML(phase, target, label){\n  const done = !!state.progress[phase];\n  return `<div class=\"done-row ${done?'done':''}\" onclick=\"toggleDone('${phase}')\">\n    <div class=\"checkbox\">${done?'\u2713':''}</div>\n    <div>\n      <div class=\"done-title\">${target} ${label}</div>\n      <div class=\"done-sub\">${done?t('doneDone'):t('donePending')}</div>\n    </div>\n  </div>`;\n}\nfunction targetStepper(phase, min, max){\n  const v = state[phase+'Target'];\n  return `<div class=\"stat target-stat\" style=\"grid-column:1/-1;\">\n    <div>\n      <div class=\"val\" style=\"font-size:17px;\">${v} ${t('shotsToTake')}</div>\n      <div class=\"lbl\">${t('recommendedWord')}: ${min}\u2013${max}</div>\n    </div>\n    <div class=\"stepbtns\">\n      <button class=\"stepbtn\" onclick=\"changeTarget('${phase}',-1,${min},${max})\">\u2013</button>\n      <button class=\"stepbtn\" onclick=\"changeTarget('${phase}',1,${min},${max})\">+</button>\n    </div>\n  </div>`;\n}\n\n// ---- Phase order (tabs + auto-advance + reorder) ----\nconst PHASE_META = {\n  lights: {icon:'\ud83c\udf0c', label:'Lights'},\n  darks:  {icon:'\ud83c\udf11', label:'Darks'},\n  flats:  {icon:'\ud83c\udf1f', label:'Flats'},\n  bias:   {icon:'\u26ab', label:'Bias'}\n};\nlet currentTab = 'resumen';\n\nfunction renderTabsNav(){\n  const inner = document.getElementById('tabsInner');\n  let html = `<button data-tab=\"resumen\" class=\"${currentTab==='resumen'?'active':''}\"><span class=\"ico\">\u23f1\ufe0f</span><span data-i18n=\"tabResumen\">${t('tabResumen')}</span></button>`;\n  state.phaseOrder.forEach(p=>{\n    const m = PHASE_META[p];\n    html += `<button data-tab=\"${p}\" class=\"${currentTab===p?'active':''}\"><span class=\"ico\">${m.icon}</span>${m.label}</button>`;\n  });\n  inner.innerHTML = html;\n  inner.querySelectorAll('button').forEach(b=>{\n    b.addEventListener('click', ()=>showTab(b.dataset.tab));\n  });\n}\n\nfunction movePhase(phase, dir){\n  const idx = state.phaseOrder.indexOf(phase);\n  const newIdx = idx + dir;\n  if(newIdx < 0 || newIdx >= state.phaseOrder.length) return;\n  [state.phaseOrder[idx], state.phaseOrder[newIdx]] = [state.phaseOrder[newIdx], state.phaseOrder[idx]];\n  save();\n  renderReorderList();\n  renderTabsNav();\n  renderPanel('resumen');\n}\n\nfunction renderReorderList(){\n  const el = document.getElementById('reorderList');\n  el.innerHTML = state.phaseOrder.map((p,i)=>{\n    const m = PHASE_META[p];\n    return `<div class=\"reorder-row\">\n      <span class=\"reorder-icon\">${m.icon}</span>\n      <span class=\"reorder-label\">${m.label}</span>\n      <div class=\"reorder-btns\">\n        <button class=\"stepbtn\" onclick=\"movePhase('${p}',-1)\" ${i===0?'disabled':''}>\u2191</button>\n        <button class=\"stepbtn\" onclick=\"movePhase('${p}',1)\" ${i===state.phaseOrder.length-1?'disabled':''}>\u2193</button>\n      </div>\n    </div>`;\n  }).join('');\n}\nfunction showReorderModal(){\n  renderReorderList();\n  document.getElementById('reorderModal').classList.add('show');\n}\nfunction hideReorderModal(){ document.getElementById('reorderModal').classList.remove('show'); }\ndocument.getElementById('reorderDoneBtn').addEventListener('click', hideReorderModal);\n\n// ---- Panels ----\nfunction renderPanel(phase){\n  const el = document.getElementById('panel-'+phase);\n  if(!el) return;\n\n  if(phase === 'resumen'){\n    const lightsSec = phaseSeconds('lights');\n    const darksSec = phaseSeconds('darks');\n    const biasSec = phaseSeconds('bias');\n    const flatsSec = phaseSeconds('flats');\n    const totalSec = lightsSec + darksSec + biasSec + flatsSec;\n\n    let endTimeHTML = '';\n    if(state.startTime){\n      const [h,m] = state.startTime.split(':').map(Number);\n      const start = new Date(); start.setHours(h,m,0,0);\n      const end = new Date(start.getTime() + totalSec*1000);\n      const endStr = end.toTimeString().slice(0,5);\n      const dayNote = end.getDate() !== start.getDate() ? ' (+1)' : '';\n      endTimeHTML = `<div class=\"summary-time-row\"><span>\ud83d\udd58 ${state.startTime}</span><span>\u2192</span><span>\ud83c\udfc1 ${endStr}${dayNote}</span></div>`;\n    }\n\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\u23f1\ufe0f</span>${t('resumenTitle')}</h2></div>\n      <p class=\"phase-desc\">${t('resumenDesc')}</p>\n      <div class=\"card\" style=\"padding:14px;\">\n        <div class=\"summary-total\">\n          <div class=\"summary-total-val\">${fmtDuration(totalSec)}</div>\n          <div class=\"summary-total-lbl\">${t('totalLabel')}</div>\n        </div>\n        ${endTimeHTML}\n        <div class=\"summary-breakdown\">\n          ${state.phaseOrder.map(p=>`<div><span>${PHASE_META[p].icon} ${PHASE_META[p].label}</span><span>${fmtDuration(phaseSeconds(p))}</span></div>`).join('')}\n        </div>\n      </div>\n      <div class=\"resumen-actions\">\n        <button class=\"primary-btn\" id=\"startLightsBtn\">${PHASE_META[state.phaseOrder[0]].icon} ${t('btnStartPrefix')} ${PHASE_META[state.phaseOrder[0]].label}</button>\n        <button class=\"ghost-btn\" id=\"reorderBtn\">${t('btnReorder')}</button>\n        <button class=\"ghost-btn\" id=\"editParamsBtn\">${t('btnEditParams')}</button>\n        <button class=\"ghost-btn danger\" id=\"newSessionBtn\">${t('btnNewSession')}</button>\n      </div>\n    `;\n    document.getElementById('startLightsBtn').addEventListener('click', ()=>showTab(state.phaseOrder[0]));\n    document.getElementById('reorderBtn').addEventListener('click', showReorderModal);\n    document.getElementById('editParamsBtn').addEventListener('click', goSetup);\n    document.getElementById('newSessionBtn').addEventListener('click', showConfirmModal);\n  }\n\n  if(phase === 'lights'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf0c</span>Lights</h2></div>\n      <p class=\"phase-desc\">${t('lightsDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${state.exposure}s</div><div class=\"lbl\">${t('lblExposureStat')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblSensitivity')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureStat')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(state.numLights*state.exposure)}</div><div class=\"lbl\">${t('lblTotalTime')}</div></div>\n      </div>\n      ${doneRowHTML('lights', state.numLights, 'Lights')}\n    `;\n  }\n\n  if(phase === 'darks'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf11</span>Darks</h2></div>\n      <p class=\"phase-desc\">${t('darksDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${state.exposure}s</div><div class=\"lbl\">${t('lblExposureSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureNoAffect')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(state.darksTarget*state.exposure)}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('darksStep1')}</li>\n          <li>${t('darksStep4')}</li>\n          <li>${t('darksStep5')}</li>\n        </ol>\n      </div>\n      ${targetStepper('darks', 10, 30)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('darks', state.darksTarget, 'Darks')}\n    `;\n  }\n\n  if(phase === 'bias'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\u26ab</span>Bias</h2></div>\n      <p class=\"phase-desc\">${t('biasDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${displayExp(state.biasExposureInput)}</div><div class=\"lbl\">${t('lblMinExposure')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${t('apertureNoInfluenceVal')}</div><div class=\"lbl\">${t('lblApertureNoInfluence')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(phaseSeconds('bias'))}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('biasStep1')}</li>\n          <li>${t('biasStep3')}</li>\n          <li>${t('biasStep4')}</li>\n        </ol>\n      </div>\n      ${targetStepper('bias', 20, 100)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('bias', state.biasTarget, 'Bias')}\n    `;\n  }\n\n  if(phase === 'flats'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf1f</span>Flats</h2></div>\n      <p class=\"phase-desc\">${t('flatsDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${displayExp(state.flatsExposureInput)}</div><div class=\"lbl\">${t('lblExposureApprox')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureSameLights')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(phaseSeconds('flats'))}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('flatsStep1')}</li>\n          <li>${t('flatsStep4')}</li>\n        </ol>\n      </div>\n      ${targetStepper('flats', 20, 40)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('flats', state.flatsTarget, 'Flats')}\n    `;\n  }\n}\nfunction renderAllPanels(){ ['resumen','lights','darks','bias','flats'].forEach(renderPanel); }\n\nfunction updateProgressBar(){\n  const phases = ['lights','darks','bias','flats'];\n  const doneCount = phases.filter(p=>state.progress[p]).length;\n  const pct = Math.round(100*doneCount/phases.length);\n  document.getElementById('progressFill').style.width = pct + '%';\n  document.getElementById('progressText').textContent = `${doneCount} / ${phases.length} ${t('progressPhrase')}`;\n  document.getElementById('progressPct').textContent = pct + '%';\n}\n\n// ---- Tabs ----\nfunction showTab(name){\n  currentTab = name;\n  ['resumen','lights','darks','bias','flats'].forEach(p=>{\n    document.getElementById('panel-'+p).style.display = (p===name)?'block':'none';\n  });\n  document.querySelectorAll('nav.tabs button').forEach(b=>{\n    b.classList.toggle('active', b.dataset.tab===name);\n  });\n  window.scrollTo(0,0);\n}\n\n// ---- Completion modal ----\nfunction checkSessionComplete(){\n  const phases = ['lights','darks','bias','flats'];\n  if(phases.every(p=>state.progress[p])) showCompleteModal();\n}\nfunction showCompleteModal(){ document.getElementById('completeModal').classList.add('show'); }\nfunction hideCompleteModal(){ document.getElementById('completeModal').classList.remove('show'); }\ndocument.getElementById('modalCloseBtn').addEventListener('click', hideCompleteModal);\ndocument.getElementById('modalFinishBtn').addEventListener('click', ()=>{\n  hideCompleteModal();\n  showNameModal();\n});\ndocument.getElementById('modalNewSessionBtn').addEventListener('click', ()=>{\n  hideCompleteModal();\n  showConfirmModal();\n});\n\n// ---- Save session with an optional name ----\nfunction showNameModal(){\n  document.getElementById('nameModalInput').value = '';\n  document.getElementById('nameModal').classList.add('show');\n  setTimeout(() => { document.getElementById('nameModalInput').focus(); }, 60);\n}\nfunction hideNameModal(){ document.getElementById('nameModal').classList.remove('show'); }\nfunction finishWithName(name){\n  if(name && state.history && state.history.length){ state.history[0].name = name; }\n  state.started = false;\n  save();\n  renderHistoryList();\n  goHome();\n}\ndocument.getElementById('nameModalSaveBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('nameModalInput').value.trim();\n  hideNameModal();\n  finishWithName(val || null);\n});\ndocument.getElementById('nameModalSkipBtn').addEventListener('click', ()=>{\n  hideNameModal();\n  finishWithName(null);\n});\ndocument.getElementById('nameModalInput').addEventListener('keydown', e=>{\n  if(e.key === 'Enter') document.getElementById('nameModalSaveBtn').click();\n});\n\n// ---- Custom confirm modal (native confirm() can be silently blocked in webviews) ----\nfunction showConfirmModal(){ document.getElementById('confirmModal').classList.add('show'); }\nfunction hideConfirmModal(){ document.getElementById('confirmModal').classList.remove('show'); }\ndocument.getElementById('confirmNoBtn').addEventListener('click', hideConfirmModal);\ndocument.getElementById('confirmYesBtn').addEventListener('click', ()=>{\n  hideConfirmModal();\n  const keepHistory = state.history;\n  const keepLang = state.lang;\n  const keepRed = state.redMode;\n  state = defaultState();\n  state.history = keepHistory;\n  state.lang = keepLang;\n  state.redMode = keepRed;\n  save();\n  goHome();\n});\n\n// ---- Master render ----\nfunction render(){\n  applyRedMode();\n  applyTranslations();\n  document.getElementById('home-view').style.display = view==='home' ? 'flex' : 'none';\n  document.getElementById('help-view').style.display = view==='help' ? 'block' : 'none';\n  document.getElementById('setup-view').style.display = view==='setup' ? 'block' : 'none';\n  document.getElementById('session-view').style.display = view==='session' ? 'block' : 'none';\n  document.getElementById('tabsNav').style.display = view==='session' ? 'block' : 'none';\n  document.getElementById('progressWrap').style.display = view==='session' ? 'block' : 'none';\n\n  if(view==='home'){\n    renderHistoryList();\n  }\n  if(view==='session'){\n    renderTabsNav();\n    renderAllPanels();\n    updateProgressBar();\n  }\n  window.scrollTo(0,0);\n}\n\nrender();\n<\/script>\n</body>\n</html>\n" },
  photopack:  { label: 'Mochila',                            html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Mochila\">\n<meta name=\"theme-color\" content=\"#0A0D10\">\n<title>Mochila \u2014 Checklist de fotograf\u00eda</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#0A0D10;\n    --surface:#12171B;\n    --surface-2:#1A2126;\n    --border:#262F35;\n    --text:#EAEFEA;\n    --text-dim:#889199;\n    --accent:#FF7A29;\n    --accent-ink:#241000;\n    --warn:#FFC24B;\n    --danger:#FF5D5D;\n    --radius:10px;\n    --font-display:'Sora',sans-serif;\n    --font-body:'Inter',sans-serif;\n    --tap:44px;\n    color-scheme: dark;\n  }\n  body.night-mode{\n    --bg:#0F0303;\n    --surface:#1B0505;\n    --surface-2:#250707;\n    --border:#3A0C0C;\n    --text:#FF7A6E;\n    --text-dim:#8F4238;\n    --accent:#FF4433;\n    --accent-ink:#180200;\n    --warn:#FF5A3C;\n    --danger:#FF3B2E;\n  }\n\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--bg);\n    color:var(--text);\n    font-family:var(--font-body);\n    -webkit-font-smoothing:antialiased;\n    min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--font-display);margin:0;}\n  button{font-family:var(--font-body);cursor:pointer;}\n  input,select,textarea{font-family:var(--font-body);}\n\n  #app{max-width:1100px;margin:0 auto;padding:0 0 48px;}\n\n  /* Topbar */\n  .topbar{\n    display:flex;align-items:center;justify-content:space-between;\n    padding:18px 16px 10px;\n    padding-top:max(18px, calc(env(safe-area-inset-top) + 14px));\n  }\n  .brand{display:flex;align-items:center;gap:8px;}\n  .brand-mark{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:30px;height:30px;border-radius:50%;\n    background:var(--accent);color:var(--accent-ink);\n    font-size:14px;font-weight:800;font-family:var(--font-display);\n  }\n  .brand h1{font-size:19px;font-weight:700;letter-spacing:-0.01em;}\n  .brand h1 .accent{color:var(--accent);}\n  .mode-toggles{display:flex;gap:6px;}\n  .icon-btn{\n    width:var(--tap);height:var(--tap);border-radius:50%;\n    border:1px solid var(--border);background:var(--surface);\n    color:var(--text-dim);font-size:17px;\n    display:flex;align-items:center;justify-content:center;\n    transition:border-color .15s, color .15s, background .15s;\n  }\n  .icon-btn.on{border-color:var(--accent);color:var(--accent);background:var(--surface-2);}\n  .icon-btn:active{transform:scale(.94);}\n\n  /* List bar */\n  .list-bar{\n    padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;\n  }\n  select#listSelect{\n    flex:1 1 180px;min-width:140px;\n    background:var(--surface);color:var(--text);\n    border:1px solid var(--border);border-radius:8px;\n    padding:10px 12px;font-size:14.5px;font-weight:600;\n  }\n  .list-actions{display:flex;gap:6px;flex-wrap:wrap;}\n  .ghost-btn{\n    background:transparent;border:1px solid var(--border);color:var(--text-dim);\n    border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600;\n    white-space:nowrap;\n  }\n  .ghost-btn:hover{border-color:var(--accent);color:var(--text);}\n  .primary-btn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;}\n  .accent-btn{\n    background:var(--accent);color:var(--accent-ink);border:none;\n    border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700;\n  }\n  .accent-btn:active{transform:scale(.97);}\n\n  /* Weight panel */\n  .weight-panel{padding:4px 16px 14px;}\n  .weight-numbers{\n    display:flex;align-items:baseline;gap:6px;font-family:var(--font-display);\n    font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text);\n  }\n  .weight-numbers .sep{color:var(--text-dim);font-weight:400;}\n  #weightMax{color:var(--text-dim);font-weight:500;}\n  .items-count{margin-left:auto;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--text-dim);}\n  .weight-bar{\n    height:9px;border-radius:999px;background:var(--surface-2);\n    border:1px solid var(--border);overflow:hidden;\n  }\n  .weight-fill{\n    height:100%;width:0%;background:var(--accent);\n    transition:width .35s cubic-bezier(.2,.8,.2,1), background .3s;\n    border-radius:999px;\n  }\n  .weight-fill.warn{background:var(--warn);}\n  .weight-fill.danger{background:var(--danger);}\n\n  /* Tabs (mobile) */\n  .tabs{display:none;}\n  .tab{\n    flex:1;padding:12px;border-radius:999px;border:1.5px solid var(--border);\n    background:var(--surface);color:var(--text-dim);font-weight:700;font-size:14px;\n    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;\n  }\n  .tab.active{\n    background:var(--accent);color:var(--accent-ink);border-color:var(--accent);\n    box-shadow:0 3px 12px rgba(0,0,0,.28);\n    transform:translateY(-1px);\n  }\n\n  .checklist-list-title{\n    font-family:var(--font-display);font-weight:800;font-size:19px;\n    color:var(--text);margin:2px 0 14px;letter-spacing:-0.01em;\n    display:flex;align-items:center;gap:8px;\n  }\n\n  main.panels{padding:0 16px;}\n  .panel{display:none;}\n  .panel.active{display:block;}\n\n  /* Category groups */\n  details.category{\n    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n    border-radius:0 var(--radius) var(--radius) 0;margin-bottom:10px;overflow:hidden;\n  }\n  details.category[open] summary{border-bottom:1px solid var(--border);}\n  summary.category-head{\n    list-style:none;cursor:pointer;padding:13px 14px;\n    display:flex;align-items:center;gap:10px;\n    font-family:var(--font-display);font-weight:700;font-size:14px;\n  }\n  summary.category-head::-webkit-details-marker{display:none;}\n  .cat-icon{width:19px;height:19px;flex:none;color:var(--accent);}\n  .cat-name{flex:1;}\n  .cat-meta{font-family:var(--font-body);font-weight:500;font-size:12.5px;color:var(--text-dim);}\n  .chevron{width:14px;height:14px;color:var(--text-dim);transition:transform .2s;flex:none;}\n  details[open] .chevron{transform:rotate(90deg);}\n\n  .item-row{\n    display:flex;align-items:center;gap:10px;padding:11px 14px;\n    border-top:1px solid var(--border);\n  }\n  .item-row:first-of-type{border-top:none;}\n  .item-name{flex:1;font-size:14.5px;font-weight:500;}\n  .item-weight{font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}\n\n  .row-add{\n    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--accent);font-size:17px;font-weight:700;\n    display:flex;align-items:center;justify-content:center;flex:none;\n  }\n  .row-add:active{transform:scale(.9);}\n  .row-edit-actions{display:flex;gap:6px;flex:none;}\n  .row-edit-actions button{\n    width:30px;height:30px;border-radius:7px;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text-dim);font-size:13px;\n  }\n\n  /* Checklist row */\n  .check-row{\n    display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border);\n  }\n  .check-row:first-of-type{border-top:none;}\n  .check-row.packed .item-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}\n  .checkbox{\n    width:23px;height:23px;border-radius:7px;border:2px solid var(--border);\n    flex:none;display:flex;align-items:center;justify-content:center;\n    color:var(--accent-ink);font-size:14px;font-weight:900;\n  }\n  .check-row.packed .checkbox{background:var(--accent);border-color:var(--accent);}\n  .qty-stepper{display:flex;align-items:center;gap:6px;flex:none;}\n  .qty-stepper button{\n    width:26px;height:26px;border-radius:50%;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;\n  }\n  .qty-stepper span{min-width:16px;text-align:center;font-size:13px;font-weight:600;}\n  .row-remove{\n    width:28px;height:28px;flex:none;border-radius:7px;border:none;background:transparent;\n    color:var(--text-dim);font-size:17px;\n  }\n  .row-remove:hover{color:var(--danger);}\n\n  .empty-state{padding:36px 20px;text-align:center;color:var(--text-dim);}\n  .empty-state .em-icon{font-size:26px;display:block;margin-bottom:8px;}\n  .empty-state p{margin:0;font-size:13.5px;line-height:1.5;}\n\n  .catalog-toolbar{display:flex;gap:8px;margin-bottom:12px;}\n  #searchInput{\n    flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);\n    border-radius:8px;padding:11px 13px;font-size:14px;\n  }\n  #searchInput::placeholder{color:var(--text-dim);}\n\n  .tip-banner{\n    margin:18px 16px 0;padding:13px 14px;border-radius:8px;\n    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n    font-size:12.5px;color:var(--text-dim);line-height:1.55;\n    display:flex;gap:10px;align-items:flex-start;\n  }\n  .tip-banner b{color:var(--text);}\n  .tip-close{background:none;border:none;color:var(--text-dim);font-size:16px;margin-left:auto;flex:none;}\n\n  /* Modal */\n  .modal-overlay{\n    position:fixed;inset:0;background:rgba(3,5,6,.72);\n    display:none;align-items:flex-end;justify-content:center;z-index:50;\n    backdrop-filter:blur(2px);\n  }\n  .modal-overlay.open{display:flex;}\n  .modal{\n    background:var(--surface);border:1px solid var(--border);\n    border-radius:16px 16px 0 0;width:100%;max-width:480px;\n    padding:20px;max-height:88vh;overflow-y:auto;position:relative;\n  }\n  @media(min-width:640px){\n    .modal-overlay{align-items:center;}\n    .modal{border-radius:14px;}\n  }\n  .modal h2{font-size:17px;margin-bottom:14px;}\n  .field{margin-bottom:13px;}\n  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}\n  .field input,.field select,.field textarea{\n    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);\n    border-radius:8px;padding:10px 12px;font-size:14.5px;\n  }\n  .field textarea{min-height:90px;resize:vertical;font-family:var(--font-body);}\n  .modal-actions{display:flex;gap:8px;margin-top:16px;}\n  .modal-actions button{flex:1;padding:12px;border-radius:999px;font-weight:700;font-size:14px;}\n  .modal-actions .cancel{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;}\n  .modal-actions .confirm{background:var(--accent);border:none;color:var(--accent-ink);}\n  .modal-close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:18px;}\n  .modal-sub{font-size:12.5px;color:var(--text-dim);margin:-8px 0 14px;line-height:1.5;}\n  .share-json{\n    width:100%;min-height:120px;background:var(--surface-2);border:1px solid var(--border);\n    color:var(--text-dim);border-radius:8px;padding:10px;font-size:11.5px;font-family:monospace;\n  }\n\n  /* Zoom mode */\n  body.zoom-mode{ zoom:1.25; }\n  ::-webkit-scrollbar{width:8px;}\n  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}\n\n  #printArea{display:none;}\n  @media print{\n    body *{visibility:hidden;}\n    #printArea, #printArea *{visibility:visible;}\n    #printArea{\n      display:block;position:absolute;top:0;left:0 ext-decoration:none;font-weight:700;}\n  .home-disclaimer a:hover{text-decoration:underline;}\n</style>\n\n<style id=\"unified-theme-override\">\n  :root{\n    --bg:#060a16;\n    --surface:#0f1730;\n    --surface-2:#141d3d;\n    --border:#22305c;\n    --text:#f2efe4;\n    --text-dim:#8993b8;\n    --accent:#d9a05c;\n    --accent-ink:#1a1200;\n    --warn:#e4894a;\n    --danger:#ff5d5d;\n    --font-display:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --font-body:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n</style>\n<style id=\"unified-components-override\">\n  .accent-btn, .modal-actions .confirm, .modal-actions .cancel{\n    border-radius: 12px !important;\n  }\n  .home-btn{\n    border: 1px solid var(--border) !important;\n    border-left: 1px solid var(--border) !important;\n    border-radius: 16px !important;\n    background: var(--surface) !important;\n  }\n  .home-btn-icon{\n    width:44px !important; height:44px !important;\n    border-radius:12px !important;\n    background: var(--surface-2) !important;\n    display:flex !important; align-items:center !important; justify-content:center !important;\n    font-size:20px !important;\n  }\n</style>\n</head>\n<body>\n\n<div id=\"homeScreen\" class=\"home-screen\" style=\"display:none;\">\n  <div class=\"topbar\">\n    <div class=\"topline\">\n      <div class=\"topbar-text\">\n        <p class=\"eyebrow\" id=\"homeEyebrow\">Tu mochila</p>\n        <h1 id=\"homeAppName\">Mochila<span class=\"accent\">.</span></h1>\n      </div>\n      <div class=\"mode-toggles\">\n        <button id=\"btnHomeHelp\" class=\"icon-btn\" title=\"Ayuda\">\u2753</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"homeSubtitle\"></p>\n  </div>\n  <div class=\"home-content\">\n\n    <button class=\"primary-btn\" id=\"btnCreateBag\">\u2795 <span id=\"btnCreateBagLabel\">Crear mochila nueva</span></button>\n\n    <div id=\"bagListWrap\" style=\"margin-top:18px;text-align:left;\"></div>\n\n    <button class=\"ghost-btn\" id=\"btnImportHome\" style=\"width:100%;margin-top:6px;\"></button>\n  </div>\n</div>\n\n<div id=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <button id=\"btnHome\" class=\"icon-btn\" title=\"Inicio\" style=\"margin-right:2px;\">\u2302</button>\n      <span class=\"brand-mark\">\ud83c\udf92</span>\n      <h1 id=\"topbarAppName\">Mochila<span class=\"accent\">.</span></h1>\n    </div>\n    <div class=\"mode-toggles\">\n      <button id=\"btnHelpTop\" class=\"icon-btn\" title=\"Ayuda\">\u2754</button>\n      <button id=\"btnSettings\" class=\"icon-btn\" title=\"Ajustes\">\u2699</button>\n    </div>\n  </header>\n\n  <main class=\"panels\">\n    <section id=\"panelChecklist\" class=\"panel active\">\n      <button class=\"ghost-btn back-link-btn\" id=\"btnBackToBags\">\u2039 <span id=\"btnBackToBagsLabel\">Mochilas</span></button>\n      <div id=\"checklistListTitle\" class=\"checklist-list-title\"></div>\n      <div class=\"weight-panel\" style=\"padding:0 0 14px;\">\n        <div class=\"weight-numbers\">\n          <span id=\"weightCurrent\">0</span> g <span class=\"sep\">/</span> <span id=\"weightMax\">8000</span> g\n          <span id=\"itemsCount\" class=\"items-count\"></span>\n        </div>\n        <div class=\"weight-bar\"><div id=\"weightFill\" class=\"weight-fill\"></div></div>\n      </div>\n      <button id=\"btnAddItemsToBag\" class=\"primary-btn\" style=\"margin-bottom:10px;\"></button>\n      <div style=\"display:flex;justify-content:flex-end;margin-bottom:8px;\">\n        <button id=\"btnUncheckAll\" class=\"ghost-btn\"></button>\n      </div>\n      <div id=\"checklistContent\"></div>\n      <button id=\"btnViewBag\" class=\"primary-btn\" style=\"margin-top:14px;\"></button>\n      <button id=\"btnShare\" class=\"ghost-btn\" style=\"width:100%;margin-top:8px;\"></button>\n    </section>\n    <section id=\"panelCatalog\" class=\"panel\">\n      <button class=\"ghost-btn back-link-btn\" id=\"btnBackToBag\">\u2039 <span id=\"btnBackToBagLabel\">Volver</span></button>\n      <div id=\"catalogScreenTitle\" class=\"checklist-list-title\"></div>\n      <button id=\"btnGoToEquipo\" class=\"ghost-btn\" style=\"width:100%;margin-bottom:10px;\">\ud83e\uddf0 Gestionar mi equipo</button>\n      <div class=\"catalog-toolbar\">\n        <input id=\"searchInput\" type=\"search\">\n      </div>\n      <div id=\"catalogList\"></div>\n    </section>\n  </main>\n</div>\n\n<!-- Modal: settings -->\n<div class=\"modal-overlay\" id=\"modalSettings\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalSettings\">\u2715</button>\n    <h2 id=\"settingsModalTitle\"></h2>\n    <div class=\"field\">\n      <label id=\"labelMaxWeight\"></label>\n      <input type=\"number\" id=\"maxWeightInput\" step=\"0.1\" min=\"0\">\n    </div>\n    <p class=\"modal-sub\" id=\"maxWeightHint\"></p>\n    <button class=\"choice-btn\" id=\"btnOpenHelp\"><span class=\"choice-flag\">\u2754</span><span id=\"btnOpenHelpLabel\"></span></button>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnFullExport\"></button>\n      <button class=\"cancel\" id=\"btnFullImport\"></button>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnResetApp\"></button>\n      <button class=\"confirm\" id=\"btnSettingsDone\" data-close=\"modalSettings\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: full backup export -->\n<div class=\"modal-overlay\" id=\"modalFullExport\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalFullExport\">\u2715</button>\n    <h2 id=\"fullExportTitle\"></h2>\n    <p class=\"modal-sub\" id=\"fullExportHint\"></p>\n    <textarea class=\"share-json\" id=\"fullExportText\" readonly></textarea>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCopyFullExport\"></button>\n      <button class=\"confirm\" id=\"btnDownloadFullExport\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: full backup import -->\n<div class=\"modal-overlay\" id=\"modalFullImport\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalFullImport\">\u2715</button>\n    <h2 id=\"fullImportTitle\"></h2>\n    <p class=\"modal-sub\" id=\"fullImportHint\"></p>\n    <div class=\"field\">\n      <input type=\"file\" id=\"fullImportFile\" accept=\"application/json,.json\">\n    </div>\n    <div class=\"field\">\n      <textarea class=\"share-json\" id=\"fullImportText\"></textarea>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCancelFullImport\" data-close=\"modalFullImport\"></button>\n      <button class=\"confirm\" id=\"btnDoFullImport\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: share/export -->\n<div class=\"modal-overlay\" id=\"modalShare\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalShare\">\u2715</button>\n    <h2 id=\"shareModalTitle\"></h2>\n    <p class=\"modal-sub\" id=\"shareModalHint\"></p>\n    <textarea class=\"share-json\" id=\"shareText\" readonly></textarea>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCopyShare\"></button>\n      <button class=\"confirm\" id=\"btnDownloadShare\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: import -->\n<div class=\"modal-overlay\" id=\"modalImport\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalImport\">\u2715</button>\n    <h2 id=\"importModalTitle\"></h2>\n    <p class=\"modal-sub\" id=\"importModalHint\"></p>\n    <div class=\"field\">\n      <input type=\"file\" id=\"importFile\" accept=\"application/json,.json\">\n    </div>\n    <div class=\"field\">\n      <textarea class=\"share-json\" id=\"importText\"></textarea>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCancelImport\" data-close= ction]\");\n    if (!btn) return;\n    var action = btn.getAttribute(\"data-action\");\n    var itemId = btn.getAttribute(\"data-item\");\n    var list = activeList();\n    if (action === \"add-to-list\"){\n      if (!list) return;\n      var existing = list.items.filter(function(x){return x.itemId===itemId;})[0];\n      if (existing){ existing.qty += 1; }\n      else { list.items.push({itemId:itemId, qty:1, packed:false}); }\n      renderWeight(); renderChecklist(); renderCatalog(); save();\n      btn.style.transform = \"scale(1.25)\";\n      setTimeout(function(){ btn.style.transform=\"\"; }, 140);\n    }\n  });\n\n  document.getElementById(\"checklistContent\").addEventListener(\"click\", function(e){\n    var btn = e.target.closest(\"[data-action]\");\n    if (!btn) return;\n    var action = btn.getAttribute(\"data-action\");\n    var itemId = btn.getAttribute(\"data-item\");\n    var list = activeList();\n    if (!list) return;\n    var entry = list.items.filter(function(x){return x.itemId===itemId;})[0];\n    if (!entry) return;\n    if (action === \"toggle-pack\"){ entry.packed = !entry.packed; }\n    else if (action === \"qty-inc\"){ entry.qty += 1; }\n    else if (action === \"qty-dec\"){ entry.qty = Math.max(1, entry.qty - 1); }\n    else if (action === \"remove\"){ list.items = list.items.filter(function(x){return x.itemId!==itemId;}); }\n    renderWeight(); renderChecklist(); renderCatalog(); save();\n  });\n\n  // ---------- share / export ----------\n  document.getElementById(\"btnUncheckAll\").addEventListener(\"click\", function(){\n    var list = activeList();\n    if (!list) return;\n    list.items.forEach(function(it){ it.packed = false; });\n    renderWeight(); renderChecklist(); renderCatalog(); save();\n  });\n\n  function renderBagModal(){\n    var list = activeList();\n    var packed = (list ? list.items : []).filter(function(it){ return it.packed; });\n    var total = 0;\n    var html = \"\";\n    if (!packed.length){\n      html = '<p style=\"color:var(--text-dim);\">'+t(\"bag_empty_text\")+'</p>';\n    } else {\n      html = '<div>';\n      packed.forEach(function(it){\n        var ci = catalogItem(it.itemId);\n        if (!ci) return;\n        var w = ci.weight * it.qty;\n        total += w;\n        html += '<div style=\"display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);\">';\n        html += '<span>'+esc(displayName(ci))+(it.qty>1?' \u00d7'+it.qty:'')+'</span>';\n        html += '<span style=\"color:var(--text-dim);font-variant-numeric:tabular-nums;\">'+w.toLocaleString(\"es-ES\")+' g</span>';\n        html += '</div>';\n      });\n      html += '<div style=\"display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid var(--accent);font-weight:800;font-family:var(--font-display);\">';\n      html += '<span>'+t(\"bag_total_label\")+'</span><span>'+total.toLocaleString(\"es-ES\")+' g</span></div></div>';\n    }\n    document.getElementById(\"bagModalTitle\").textContent = t(\"bag_title\") + (list ? \": \" + listDisplayName(list) : \"\");\n    document.getElementById(\"bagModalBody\").innerHTML = html;\n    document.getElementById(\"bagLuckyMsg\").textContent = t(\"bag_lucky_msg\");\n  }\n  document.getElementById(\"btnViewBag\").addEventListener(\"click\", function(){\n    renderBagModal();\n    openModal(\"modalBag\");\n  });\n\n  // ---------- tiny dependency-free PDF writer (no external libs, no print dialog) ----------\n  function pdfEscape(s){\n    s = String(s);\n    var out = \"\";\n    for (var i=0;i<s.length;i++){\n      var c = s.charCodeAt(i);\n      if (c > 255) continue; // drop characters the base PDF font can't render (emoji, etc.)\n      var ch = s[i];\n      if (ch === \"\\\\\" || ch === \"(\" || ch === \")\") out += \"\\\\\" + ch;\n      else out += ch;\n    }\n    return out;\n  }\n\n  function buildSimplePdfBlob(opts){\n    var pageWidth = 595, pageHeight = 842, marginX = 50, colX = pageWidth - marginX - 90;\n    var pages = [];\n    var cs = \"\";\n    var y = pageHeight - 60;\n\n    function flushPage(){ pages.push(cs); cs = \"\"; }\n    function ensureRoom(minY){ if (y < minY){ flushPage(); y = pageHeight - 60; } }\n    function text(str, x, yy, font, size){\n      cs += \"BT /\" + font + \" \" + size + \" Tf 1 0 0 1 \" + x.toFixed(1) + \" \" + yy.toFixed(1) + \" Tm (\" + pdfEscape(str) + \") Tj ET\\n\";\n    }\n    function hrule(yy){\n      cs += \"0.6 w\\n\" + marginX + \" \" + yy.toFixed(1) + \" m \" + (pageWidth - marginX) + \" \" + yy.toFixed(1) + \" l S\\n\";\n    }\n\n    text(opts.title || \"Mochila\", marginX, y, \"F2\", 18); y -= 20;\n    if (opts.subtitle){ text(opts.subtitle, marginX, y, \"F1\", 9); y -= 24; } else { y -= 10; }\n\n    if (!opts.rows.length){\n      text(opts.emptyText, marginX, y, \"F1\", 11);\n    } else {\n      text(opts.itemCol, marginX, y, \"F2\", 10);\n      text(opts.weightCol, colX, y, \"F2\", 10);\n      y -= 4; hrule(y); y -= 14;\n      opts.rows.forEach(function(r){\n        ensureRoom(70);\n        text(r.name, marginX, y, \"F1\", 10);\n        text(r.weight, colX, y, \"F1\", 10);\n        y -= 16;\n      });\n      ensureRoom(90);\n      y -= 2; hrule(y); y -= 18;\n      text(opts.totalLabel, marginX, y, \"F2\", 12);\n      text(opts.totalValue, colX, y, \"F2\", 12);\n      y -= 26;\n      if (opts.footer){ text(opts.footer, marginX, y, \"F1\", 11); }\n    }\n    flushPage();\n\n    var n = pages.length;\n    var fontRegNum = 3 + n + n;\n    var fontBoldNum = fontRegNum + 1;\n    var objs = {};\n    objs[1] = \"<< /Type /Catalog /Pages 2 0 R >>\";\n    var kids = [];\n    for (var i=0;i<n;i++){ kids.push((3+i)+\" 0 R\"); }\n    objs[2] = \"<< /Type /Pages /Kids [\"+kids.join(\" \")+\"] /Count \"+n+\" >>\";\n    for (var i=0;i<n;i++){\n      var pageObjNum = 3+i;\n      var contentObjNum = 3+n+i;\n      objs[pageObjNum] = \"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 \"+pageWidth+\" \"+pageHeight+\"] /Resources << /Font << /F1 \"+fontRegNum+\" 0 R /F2 \"+fontBoldNum+\" 0 R >> >> /Contents \"+contentObjNum+\" 0 R >>\";\n    }\n    for (var i=0;i<n;i++){\n      var contentObjNum = 3+n+i;\n      var stream = pages[i];\n      objs[contentObjNum] = \"<< /Length \"+stream.length+\" >>\\nstream\\n\"+stream+\"endstream\";\n    }\n    objs[fontRegNum] = \"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\";\n    objs[fontBoldNum] = \"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\";\n\n    var maxObjNum = fontBoldNum;\n    var body = \"%PDF-1.4\\n\";\n    var offsets = [0];\n    for (var num=1; num<=maxObjNum; num++){\n      offsets[num] = body.length;\n      body += num+\" 0 obj\\n\"+objs[num]+\"\\nendobj\\n\";\n    }\n    var xrefOffset = body.length;\n    body += \"xref\\n0 \"+(maxObjNum+1)+\"\\n0000000000 65535 f \\n\";\n    for (var num=1; num<=maxObjNum; num++){\n      var off = String(offsets[num]);\n      while (off.length < 10) off = \"0\" + off;\n      body += off+\" 00000 n \\n\";\n    }\n    body += \"trailer\\n<< /Size \"+(maxObjNum+1)+\" /Root 1 0 R >>\\nstartxref\\n\"+xrefOffset+\"\\n%%EOF\";\n\n    var bytes = new Uint8Array(body.length);\n    for (var i=0;i<body.length;i++){ bytes[i] = body.charCodeAt(i) & 0xFF; }\n    return new Blob([bytes], {type:\"application/pdf\"});\n  }\n\n  document.getElementById(\"btnExportBagPdf\").addEventListener(\"click\", function(){\n    try{\n      var list = activeList();\n      var packed = (list ? list.items : []).filter(function(it){ return it.packed; });\n      var listName = listDisplayName(list || {name:\"\"});\n      var dateStr = new Date().toLocaleDateString();\n      var total = 0;\n      var rows = [];\n      packed.forEach(function(it){\n        var ci = catalogItem(it.itemId);\n        if (!ci) return;\n        var w = ci.weight * it.qty;\n        total += w;\n        rows.push({ name: displayName(ci) + (it.qty > 1 ? \" x\" + it.qty : \"\"), weight: w.toLocaleString(\"es-ES\") + \" g\" });\n      });\n      var blob = buildSimplePdfBlob({\n        title: listName || \"Mochila\",\n        subtitle: \"Mochila - \" + t(\"print_generated_on\") + \" \" + dateStr,\n        rows: rows,\n        itemCol: t(\"print_item_col\"),\n        weightCol: t(\"print_weight_col\"),\n        totalLabel: t(\"print_total_row\"),\n        totalValue: total.toLocaleString(\"es-ES\") + \" g\",\n        footer: t(\"bag_lucky_msg\"),\n        emptyText: t(\"bag_empty_text\")\n      });\n      var url = URL.createObjectURL(blob);\n      var a = document.createElement(\"a\");\n      var fileSlug = (listName || \"mochila\").toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-+|-+$/g, \"\") || \"mochila\";\n      a.href = url; a.download = \"mochila-\" + fileSlug + \".pdf\";\n      document.body.appendChild(a); a.click(); document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n    }catch(e){\n      showInfo(t(\"pdf_lib_unavailable_msg\"));\n    }\n  });\n\n  document.getElementById(\"btnShare\").addEventListener(\"click\", function(){\n    var list = activeList();\n    if (!list){ return; }\n    var usedIds = {};\n    list.items.forEach(function(it){ usedIds[it.itemId] = true; });\n    var usedCatIds = {};\n    var catalogSubset = equipoCatalog.filter(function(ci){\n      if (!usedIds[ci.id]) return false;\n      usedCatIds[ci.category] = true;\n      return true;\n    }).map(function(ci){\n      var o = {id:ci.id, name:displayName(ci), weight:ci.weight, category:ci.category};\n      if (ci.i18nKey) o.i18nKey = ci.i18nKey;\n      return o;\n    });\n    var categorySubset = equipoCategories.filter(function(c){ return usedCatIds[c.id]; }).map(function(c){\n      return {id:c.id, name:categoryName(c), icon:c.icon};\n    });\n    var payload = {\n      app:\"photopack\", version:2,\n      list: {name:listDisplayName(list), items:list.items},\n      catalog: catalogSubset,\n      categories: categorySubset\n    };\n    document.getElementById(\"shareText\").value = JSON.stringify(payload, null, 0);\n    openModal(\"modalShare\");\n  });\n  document.getElementById(\"btnCopyShare\").addEventListener(\"click\", function(){\n    var ta = document.getElementById(\"shareText\");\n    ta.select();\n    try{ document.execCommand(\"copy\"); }catch(e){}\n    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});\n    var btn = document.getElementById(\"btnCopyShare\");\n    var old = btn.textContent; btn.textContent = t(\"copied_msg\");\n    setTimeout(function(){ btn.textContent = old; }, 1400);\n  });\n  document.getElementById(\"btnDownloadShare\").addEventListener(\"click\", function(){\n    var text = document.getElementById(\"shareText\").value;\n    var list = activeList();\n    var blob = new Blob([text], {type:\"application/json\"});\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url;\n    a.download = \"photopack-\" + (list ? listDisplayName(list).toLowerCase().replace(/[^a-z0-9]+/g,\"-\") : \"checklist\") + \".json\";\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  });\n\n  // ---------- import ----------\n  document.getElementById(\"btnImportHome\").addEventListener(\"click\", function(){\n    document.getElementById(\"importText\").value = \"\";\n    document.getElementById(\"importFile\").value = \"\";\n    openModal(\"modalImport\");\n  });\n  document.getElementById(\"importFile\").addEventListener(\"change\", function(e){\n    var file = e.target.files[0];\n    if (!file) return;\n    var reader = new FileReader();\n    reader.onload = function(){ document.getElementById(\"importText\").value = reader.result; };\n    reader.readAsText(file);\n  });\n  document.getElementById(\"btnDoImport\").addEventListener(\"click\", function(){\n    var raw = document.getElementById(\"importText\").value.trim();\n    if (!raw){ showInfo(t(\"alert_import_empty\")); return; }\n    var payload;\n    try{ payload = JSON.parse(raw); }catch(e){ showInfo(t(\"alert_import_invalid\")); return; }\n    if (!payload || !payload.list || !payload.catalog){ showInfo(t(\"alert_import_format\")); return; }\n\n    loadEquipo();\n    var equipoChanged = false;\n    (payload.categories || []).forEach(function(cat){\n      if (!categoryById(cat.id)){ equipoCategories.push({id:cat.id, name:cat.name, icon:cat.icon||\"otros\"}); equipoChanged = true; }\n    });\n\n    var idMap = {};\n    (payload.catalog || []).forEach(function(ci){\n      var existing = null;\n      if (ci.i18nKey) existing = equipoCatalog.filter(function(x){return x.i18nKey===ci.i18nKey;})[0];\n      if (!existing) existing = findByDisplayName(equipoCatalog, ci.name);\n      if (existing){ idMap[ci.id] = existing.id; }\n      else {\n        var newId = uid();\n        idMap[ci.id] = newId;\n        var newItem = {id:newId, name:ci.name, weight:ci.weight, category: categoryById(ci.category) ? ci.category : (equipoCategories[0]?equipoCategories[0].id:\"otros\")};\n        if (ci.i18nKey) newItem.i18nKey = ci.i18nKey;\n        equipoCatalog.push(newItem);\n        equipoChanged = true;\n      }\n    });\n    if (equipoChanged) saveEquipo();\n\n    var newItems = (payload.list.items || []).map(function(it){\n      return {itemId: idMap[it.itemId] || it.itemId, qty: it.qty || 1, packed: false};\n    });\n    var newList = {id: uid(), name: payload.list.name || t(\"imported_list_name\"), items: newItems};\n    state.lists.push(newList);\n    state.activeListId = newList.id;\n    save();\n    closeModal(\"modalImport\");\n    showAppView();\n    switchTab(\"checklist\");\n    renderAll();\n  });\n\n  // ---------- home screen navigation ----------\n  function showHome(){\n    renderBagList();\n    document.getElementById(\"homeScreen\").style.display = \"block\";\n    document.getElementById(\"app\").style.display = \"none\";\n  }\n  function showAppView(){\n    document.getElementById(\"homeScreen\").style.display = \"none\";\n    document.getElementById(\"app\").style.display = \"\";\n  }\n  document.getElementById(\"btnHome\").addEventListener(\"click\", showHome);\n  document.getElementById(\"btnOpenHelp\").addEventListener(\"click\", function(){ closeModal(\"modalSettings\"); openModal(\"modalHelp\"); });\n  document.getElementById(\"btnHelpTop\").addEventListener(\"click\", function(){ openModal(\"modalHelp\"); });\n\n  // ---------- init ----------\n  syncModeButtons();\n  renderAll();\n  showHome();\n})();\n<\/script>\n</body>\n</html>\n" },
  histograma: { label: 'Controlar histograma',               html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Controlar histograma</title>\n<style>\n  :root{\n    --void:#060a16;\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --line:#22305c;\n    --star:#f2efe4;\n    --dim:#8993b8;\n    --brass:#d9a05c;\n    --brass-dim:#8a6a3e;\n    --nebula:#7c8fff;\n    --ok:#6fcf8f;\n    --warn:#e4894a;\n    --bad:#ff6b6b;\n    --radius:16px;\n    --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  body.red{\n    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;\n    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20;\n    --nebula:#ff6b6b; --ok:#ff9d6b; --warn:#ff9d6b; --bad:#ff4d4d;\n  }\n  body.zoom-mode{ zoom:1.25; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--void); color:var(--star); font-family:var(--sans);\n    -webkit-font-smoothing:antialiased; min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--sans);margin:0;}\n  button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent;}\n\n  .app{max-width:720px;margin:0 auto;}\n\n  header{\n    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;\n    background:var(--panel);border-bottom:1px solid var(--line);\n  }\n  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;}\n  .header-text{min-width:0;}\n  .eyebrow{color:var(--brass);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  header h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;}\n  header .sub{color:var(--dim);font-size:13px;line-height:1.5;margin:10px 0 0;}\n  .icon-row{display:flex;gap:8px;flex:none;}\n  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--star);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;}\n\n  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:50;}\n  .modal-overlay.open{display:flex;}\n  .modal-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;}\n  .modal-close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;}\n  .ghost-btn{padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--star);font-size:14px;cursor:pointer;}\n  @media (min-width:640px){ .modal-overlay{align-items:center;} .modal-card{border-radius:20px;} }\n\n  main{padding:16px 16px 48px;}\n\n  /* Intro explainer */\n  .intro-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}\n  .intro-card-head .ic{font-size:20px;}\n  .intro-card-head h2{font-size:15px;font-weight:700;}\n  .modal-card p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--dim);}\n  .modal-card p:last-of-type{margin-bottom:0;}\n  .intro-bar-wrap{margin:14px 0 4px;}\n  .intro-bar{height:20px;border-radius:6px;background:linear-gradient(90deg,#000 0%,#666 50%,#fff 100%);border:1px solid var(--line);}\n  .intro-bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim);}\n  .intro-bar-labels span:first-child{display:flex;align-items:center;gap:4px;}\n  .intro-bar-labels span:last-child{display:flex;align-items:center;gap:4px;}\n\n  .tabs{display:flex;gap:6px;padding:0 16px;margin-bottom:14px;overflow-x:auto;}\n  .tab{\n    flex:none;background:var(--panel);border:1px solid var(--line);color:var(--dim);\n    border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;\n  }\n  .tab.active{background:var(--brass);border-color:var(--brass);color:var(--void);}\n\n  .panel{display:none;}\n  .panel.active{display:block;}\n\n  .hist-chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 8px;margin-bottom:14px;}\n  .hist-chart-title{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}\n  .hist-chart-title .hint-tag{color:var(--brass);text-transform:none;letter-spacing:0;font-weight:600;white-space:nowrap;}\n  .hist-chart svg{display:block;width:100%;height:auto;}\n  .hist-chart svg .curve-fill{fill:var(--brass);opacity:.55;}\n  .hist-chart svg .curve-line{fill:none;stroke:var(--brass);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;}\n  .hist-chart svg .grid-line{stroke:var(--line);stroke-width:1;}\n  .hist-chart svg .base-line{stroke:var(--line);stroke-width:1.5;}\n  .hist-chart svg .zone-strip-neutral{fill:var(--panel-2);}\n  .hist-chart svg .zone-strip-good{fill:var(--ok);}\n  .hist-chart svg .zone-strip-bad{fill:var(--bad);}\n  .hist-chart svg .zone-strip-label{font-size:11px;font-weight:800;fill:var(--void);font-family:var(--sans);}\n  .hist-zone-labels{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px;}\n  .hist-zone-labels span{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.2;}\n  .hist-zone-labels span.key{color:var(--brass);font-weight:700;}\n  .legend-row{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}\n  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);}\n  .legend-dot{width:10px;height:10px;border-radius:3px;flex:none;}\n  .legend-dot.good{background:var(--ok);}\n  .legend-dot.bad{background:var(--bad);}\n\n  .guide-row{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;}\n  .guide-row.good{border-left-color:var(--ok);}\n  .guide-row.mid{border-left-color:var(--brass);}\n  .guide-row.bad{border-left-color:var(--bad);}\n  .guide-icon{font-size:18px;flex:none;line-height:1.4;}\n  .guide-text{font-size:13.5px;line-height:1.55;color:var(--star);}\n  .guide-text b{color:var(--star);}\n\n  .sentence-box{background:rgba(217,160,92,.1);border:1px solid var(--brass);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-size:13.5px;line-height:1.6;}\n  .sentence-box b{color:var(--brass);}\n\n  .compare-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}\n  .compare-label{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}\n  .compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}\n  .compare-cell{font-size:12.5px;line-height:1.4;}\n  .compare-cell .mode-tag{display:block;font-size:10.5px;font-weight:700;color:var(--brass);margin-bottom:3px;}\n\n  .final-box{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:6px;}\n  .final-box p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--dim);}\n  .final-box p:last-child{margin-bottom:0;}\n  .final-box b{color:var(--star);}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n  <header>\n    <div class=\"topline\">\n      <div class=\"header-text\">\n        <p class=\"eyebrow\" id=\"eyebrowText\">Gu\u00eda r\u00e1pida</p>\n        <h1 id=\"titleText\">Controlar histograma</h1>\n      </div>\n      <div class=\"icon-row\">\n        <button class=\"icon-btn\" id=\"infoBtn\" title=\"\u00bfQu\u00e9 es el histograma?\">\u2139\ufe0f</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"subText\">Compara la forma de tu histograma con la de referencia mientras haces la foto.</p>\n  </header>\n\n  <div class=\"modal-overlay\" id=\"infoModal\">\n    <div class=\"modal-card\">\n      <button class=\"modal-close-x\" id=\"infoCloseBtn\">\u2715</button>\n      <div class=\"intro-card-head\"><span class=\"ic\">\ud83d\udca1</span><h2 id=\"infoModalTitle\">\u00bfQu\u00e9 es el histograma?</h2></div>\n      <p id=\"infoModalP1\">Es un gr\u00e1fico que muestra tu c\u00e1mara: a la izquierda quedan las partes m\u00e1s <b style=\"color:var(--star)\">oscuras</b> de la foto, a la derecha las m\u00e1s <b style=\"color:var(--star)\">claras</b>. La altura de la curva indica cu\u00e1nta foto tiene ese tono.</p>\n      <p id=\"infoModalP2\">No hay una forma \"perfecta\" \u00fanica: la forma buena cambia seg\u00fan lo que fotograf\u00edes. Aqu\u00ed tienes 3 formas de referencia \u2014 comp\u00e1ralas con el histograma que te muestra tu c\u00e1mara en la pantalla.</p>\n      <div class=\"intro-bar-wrap\">\n        <div class=\"intro-bar\"></div>\n        <div class=\"intro-bar-labels\">\n          <span id=\"introBarDark\">\u2b05\ufe0f Oscuro</span>\n          <span id=\"introBarLight\">Claro \u27a1\ufe0f</span>\n        </div>\n      </div>\n      <button class=\"ghost-btn\" id=\"infoDoneBtn\" style=\"width:100%;margin-top:16px;\">Entendido</button>\n    </div>\n  </div>\n\n  <main>\n    <div class=\"tabs\" id=\"tabs\" style=\"padding:0;margin-bottom:14px;\">\n      <button class=\"tab active\" data-tab=\"astro\">\ud83c\udf0c <span id=\"tabAstro\">V\u00eda L\u00e1ctea</span></button>\n      <button class=\"tab\" data-tab=\"sol\">\ud83c\udf05 <span id=\"tabSol\">Sol</span></button>\n      <button class=\"tab\" data-tab=\"paisaje\">\ud83c\udf33 <span id=\"tabPaisaje\">Paisaje</span></button>\n      <button class=\"tab\" data-tab=\"comparar\">\ud83d\udcca <span id=\"tabComparar\">Comparar</span></button>\n    </div>\n\n    <!-- ASTRO -->\n    <section class=\"panel active\" id=\"panel-astro\">\n      <div class=\"hist-chart\">\n        <div class=\"hist-chart-title\"><span class=\"chart-ref-text\">Forma de referencia</span><span class=\"hint-tag chart-hint-text\">\ud83d\udc41\ufe0f comp\u00e1rala con tu c\u00e1mara</span></div>\n        <svg viewBox=\"0 0 400 148\" preserveAspectRatio=\"none\">\n          <line class=\"grid-line\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"160\" y1=\"0\" x2=\"160\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"240\" y1=\"0\" x2=\"240\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"base-line\" x1=\"0\" y1=\"128\" x2=\"400\" y2=\"128\"/>\n          <path class=\"curve-fill\" d=\"M0,128 L10,90 L30,40 L60,15 L90,12 L130,35 L170,65 L220,95 L280,115 L340,124 L400,128 Z\"/>\n          <path class=\"curve-line\" d=\"M0,128 L10,90 L30,40 L60,15 L90,12 L130,35 L170,65 L220,95 L280,115 L340,124 L400,128\"/>\n          <rect class=\"zone-strip-good\" x=\"0\" y=\"134\" width=\"160\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-neutral\" x=\"162\" y=\"134\" width=\"156\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-bad\" x=\"320\" y=\"134\" width=\"80\" height=\"12\" rx=\"3\"/>\n        </svg>\n        <div class=\"hist-zone-labels zone-labels-row\">\n          <span>Oscuro</span><span class=\"key\">Sombra</span><span>Medio</span><span>Luz</span><span>Muy claro</span>\n        </div>\n        <div class=\"legend-row\">\n          <div class=\"legend-item\"><span class=\"legend-dot good\"></span><span class=\"legend-good-text\">Zona buena</span></div>\n          <div class=\"legend-item\"><span class=\"legend-dot bad\"></span><span class=\"legend-bad-text\">Evita acumular aqu\u00ed</span></div>\n        </div>\n      </div>\n\n      <div class=\"guide-row good\">\n        <span class=\"guide-icon\">\u2705</span>\n        <div class=\"guide-text\" id=\"astroGood\"><b>Aqu\u00ed debe estar casi toda tu foto:</b> el cielo oscuro y las estrellas d\u00e9biles de la V\u00eda L\u00e1ctea.</div>\n      </div>\n      <div class=\"guide-row mid\">\n        <span class=\"guide-icon\">\ud83d\udfe1</span>\n        <div class=\"guide-text\" id=\"astroMid\"><b>Est\u00e1 bien que haya algo aqu\u00ed:</b> alguna estructura de la V\u00eda L\u00e1ctea y estrellas algo m\u00e1s brillantes.</div>\n      </div>\n      <div class=\"guide-row bad\">\n        <span class=\"guide-icon\">\ud83d\udeab</span>\n        <div class=\"guide-text\" id=\"astroBad\"><b>Evita que se acumule mucho aqu\u00ed:</b> si el lado derecho tiene un pico grande, el cielo pierde su aspecto natural de noche.</div>\n      </div>\n\n      <div class=\"sentence-box\" id=\"astroSentence\">\ud83c\udfaf <b>En una frase:</b> la curva pegada a la izquierda, sin tocar el borde del todo.</div>\n    </section>\n\n    <!-- SOL -->\n    <section class=\"panel\" id=\"panel-sol\">\n      <div class=\"hist-chart\">\n        <div class=\"hist-chart-title\"><span class=\"chart-ref-text\">Forma de referencia</span><span class=\"hint-tag chart-hint-text\">\ud83d\udc41\ufe0f comp\u00e1rala con tu c\u00e1mara</span></div>\n        <svg viewBox=\"0 0 400 148\" preserveAspectRatio=\"none\">\n          <line class=\"grid-line\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"160\" y1=\"0\" x2=\"160\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"240\" y1=\"0\" x2=\"240\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"base-line\" x1=\"0\" y1=\"128\" x2=\"400\" y2=\"128\"/>\n          <path class=\"curve-fill\" d=\"M0,126 L40,110 L90,80 L140,
