<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Photo liveTools</title>
<style>
  :root{
    --void:#060a16;
    --panel:#0f1730;
    --panel-2:#141d3d;
    --line:#22305c;
    --star:#f2efe4;
    --dim:#8993b8;
    --brass:#d9a05c;
    --brass-dim:#8a6a3e;
    --nebula:#7c8fff;
    --ok:#6fcf8f;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  body.red{
    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;
    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20;
  }
  body.zoom-mode{ zoom:2; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--void); color:var(--star); font-family:var(--sans);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  #home{padding:28px 20px 40px; display:flex; flex-direction:column; flex:1;}
  .home-header{text-align:center; margin-bottom:6px;}
  .home-stars{font-size:10.5px; letter-spacing:.16em; color:var(--dim); font-weight:600; text-transform:uppercase;}
  .home-title{font-size:24px; font-weight:800; letter-spacing:-.01em; margin:6px 0 4px;}
  .home-sub{color:var(--dim); font-size:13.5px; line-height:1.55; margin:0 auto 26px; max-width:340px;}

  .lang-switch{display:flex; justify-content:center; gap:6px; margin:0 0 22px;}
  .lang-switch button{
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
    font-family:var(--sans); font-size:12.5px; font-weight:700; padding:7px 14px;
    border-radius:999px; cursor:pointer;
  }
  .lang-switch button.active{background:var(--brass); border-color:var(--brass); color:var(--void);}

  .mode-switch{display:flex; justify-content:center; gap:8px; margin:0 0 22px;}
  .mode-switch button{
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
    font-size:16px; padding:8px 16px;
    border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mode-switch button.active{background:var(--brass); border-color:var(--brass); color:var(--void);}

  .tiles{display:flex; flex-direction:column; gap:14px;}
  .tile{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:16px 16px; cursor:pointer; color:inherit; width:100%;
    transition:border-color .15s ease, transform .1s ease;
  }
  .tile:active{transform:scale(.985); border-color:var(--brass-dim);}
  .tile-glyph{
    flex:none; width:52px; height:52px; border-radius:14px; background:var(--panel-2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .tile-body{flex:1; min-width:0;}
  .tile-body h3{margin:0 0 3px; font-size:16px; font-weight:700;}
  .tile-body p{margin:0; font-size:12.5px; color:var(--dim); line-height:1.45;}
  .tile-arrow{flex:none; color:var(--dim); font-size:18px;}

  .home-footer{margin-top:auto; padding-top:36px; text-align:center;}
  .home-footer a{color:var(--brass); font-size:13px; text-decoration:none;}
  .home-footer .copyright{color:var(--dim); font-size:11px; margin-top:6px;}

  #tool-wrap{display:none; position:fixed; inset:0; background:var(--void); z-index:10; flex-direction:column;}
  #tool-topbar{
    display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:none;
  }
  #tool-back{
    display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--star); font-family:var(--sans); font-size:13px; font-weight:600;
    border-radius:10px; padding:8px 12px; cursor:pointer;
  }
  #tool-back:active{opacity:.7;}
  #tool-label{font-size:12.5px; color:var(--dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #tool-iframe-holder{flex:1; position:relative;}
  #tool-iframe-holder iframe{position:absolute; inset:0; width:100%; height:100%; border:none; background:var(--void); display:none;}
</style>
</head>
<body>
<div class="shell">

  <div id="home">
    <div class="home-header">
      <div class="home-stars">✦ &nbsp; ✧ &nbsp; ✦</div>
      <div class="home-title" id="shellTitle">Photo liveTools</div>
      <p class="home-sub" id="shellSub">Tus herramientas en un solo sitio: gestiona tu equipo, planifica la sesión, calcula la calibración y prepara la mochila.</p>
    </div>

    <div class="lang-switch" id="langSwitch">
      <button data-lang="es">ES</button>
      <button data-lang="ca">CA</button>
      <button data-lang="en">EN</button>
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button id="kitNightBtn" title="Modo nocturno">🌙</button>
      <button id="kitZoomBtn" title="Zoom x2">🔍</button>
    </div>

    <div class="tiles">
      <button class="tile" data-tool="equipo">
        <div class="tile-glyph">📷</div>
        <div class="tile-body">
          <h3 id="tileTitle-equipo">Mi equipo</h3>
          <p id="tileDesc-equipo">Tu stock de material: cámaras, objetivos, trípodes, trackers, filtros y más.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>

      <button class="tile" data-tool="photopack">
        <div class="tile-glyph">🎒</div>
        <div class="tile-body">
          <h3 id="tileTitle-photopack">Mochila</h3>
          <p id="tileDesc-photopack">Checklist de la mochila: elige de tu equipo lo que te llevas a cada salida.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>

      <button class="tile" data-tool="via_lactea">
        <div class="tile-glyph">🌌</div>
        <div class="tile-body">
          <h3 id="tileTitle-via_lactea">Planificar sesión astrofotografía</h3>
          <p id="tileDesc-via_lactea">Diseña tu noche: encuadre, horarios y equipo para la sesión.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>

      <button class="tile" data-tool="calibra">
        <div class="tile-glyph">🔭</div>
        <div class="tile-body">
          <h3 id="tileTitle-calibra">Tomas calibración astrofotografía</h3>
          <p id="tileDesc-calibra">Calcula tus tomas de calibración: Darks, Bias y Flats a partir de los Lights.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>

      <button class="tile" data-tool="histograma">
        <div class="tile-glyph">📊</div>
        <div class="tile-body">
          <h3 id="tileTitle-histograma">Controlar histograma</h3>
          <p id="tileDesc-histograma">Guía rápida: cómo debería verse el histograma en Vía Láctea, Sol y paisaje.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>
    </div>

    <div class="home-footer">
      <a href="https://www.instagram.com/livetgn/" target="_blank" rel="noopener">@livetgn</a>
      <div class="copyright">&copy; <span id="copyYear"></span></div>
    </div>
  </div>

  <div id="tool-wrap">
    <div id="tool-topbar">
      <button id="tool-back">← <span id="backBtnLabel">Inicio</span></button>
      <div id="tool-label"></div>
    </div>
    <div id="tool-iframe-holder"></div>
  </div>

</div>

<script>
document.getElementById('copyYear').textContent = new Date().getFullYear();

const TOOLS = {
  equipo:     { label: 'Mi equipo',                          html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Mi equipo\">\n<meta name=\"theme-color\" content=\"#060a16\">\n<title>Mi equipo \u2014 Stock de material</title>\n<style>\n  :root{\n    --bg:#060a16;\n    --surface:#0f1730;\n    --surface-2:#141d3d;\n    --border:#22305c;\n    --text:#f2efe4;\n    --text-dim:#8993b8;\n    --accent:#d9a05c;\n    --accent-ink:#1a1200;\n    --warn:#e4894a;\n    --danger:#ff5d5d;\n    --radius:12px;\n    --font-display: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --font-body: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --tap:44px;\n    color-scheme: dark;\n  }\n  body.night-mode{\n    --bg:#0a0000;\n    --surface:#1a0303;\n    --surface-2:#220505;\n    --border:#4a0d0d;\n    --text:#ff6b6b;\n    --text-dim:#a34444;\n    --accent:#ff8a5b;\n    --accent-ink:#2a0e00;\n    --warn:#ff9d6b;\n    --danger:#ff6b6b;\n  }\n  body.zoom-mode{ zoom:2; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--bg);\n    color:var(--text);\n    font-family:var(--font-body);\n    -webkit-font-smoothing:antialiased;\n    min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--font-display);margin:0;}\n  button{font-family:var(--font-body);cursor:pointer;-webkit-tap-highlight-color:transparent;}\n  input,select,textarea{font-family:var(--font-body);}\n  #app{margin:0 auto;padding:0 0 48px;}\n  .page-inner{max-width:720px;margin:0 auto;}\n\n  .topbar{display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px 14px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}\n  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto;width:100%;}\n  .topbar-text{min-width:0;}\n  .topbar .eyebrow{color:var(--accent);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  .topbar-text h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.01em;}\n  .topbar .sub{color:var(--text-dim);font-size:13px;line-height:1.5;margin:10px auto 0;max-width:720px;width:100%;box-sizing:border-box;}\n  .icon-row{display:flex;gap:8px;flex:none;}\n  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;}\n\n  .intro{padding:16px 16px 4px;}\n  .intro p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}\n\n  .toolbar{display:flex;gap:8px;padding:14px 16px 8px;}\n  .toolbar input[type=search]{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;height:44px;color:var(--text);font-size:14px;}\n  .toolbar input[type=search]::placeholder{color:var(--text-dim);}\n  .accent-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius);padding:0 18px;height:44px;font-weight:700;font-size:14px;white-space:nowrap;}\n  .ghost-btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:0 16px;height:40px;font-weight:600;font-size:13px;}\n\n  main{padding:4px 16px 24px;}\n\n  details.category{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;}\n  summary.category-head{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:14.5px;}\n  summary.category-head::-webkit-details-marker{display:none;}\n  .cat-icon{width:26px;height:26px;flex:none;color:var(--accent);}\n  .cat-icon svg{width:100%;height:100%;}\n  .cat-name{flex:1;}\n  .cat-meta{color:var(--text-dim);font-size:12.5px;font-weight:600;}\n  .chevron{width:16px;height:16px;color:var(--text-dim);transition:transform .15s ease;flex:none;}\n  details[open] .chevron{transform:rotate(90deg);}\n\n  .item-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--border);}\n  .item-name{flex:1;font-size:14px;font-weight:600;min-width:0;}\n  .item-spec{display:block;font-size:11.5px;color:var(--text-dim);font-weight:400;margin-top:2px;}\n  .item-weight{font-size:12.5px;color:var(--text-dim);white-space:nowrap;}\n  .row-edit-actions{display:flex;gap:6px;flex:none;}\n  .row-edit-actions button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:14px;}\n\n  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}\n  .empty-state .em-icon{font-size:34px;display:block;margin-bottom:10px;}\n\n  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:50;}\n  #modalConfirm{z-index:60;}\n  .modal-overlay.open{display:flex;}\n  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow-y:auto;position:relative;}\n  @media (min-width:640px){ .modal-overlay{align-items:center;} .modal{border-radius:20px;} }\n  .modal-close-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:14px;}\n  .modal h2{font-size:18px;margin-bottom:16px;padding-right:30px;}\n  .field{margin-bottom:14px;}\n  .field label{display:block;font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}\n  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:44px;color:var(--text);font-size:14.5px;}\n  .modal-actions{display:flex;gap:10px;margin-top:18px;}\n  .modal-actions button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14px;}\n  .modal-actions .cancel{background:var(--surface-2);border:1px solid var(--border);color:var(--text);}\n  .modal-actions .confirm{background:var(--accent);border:none;color:var(--accent-ink);}\n  .modal-actions .danger{background:var(--danger);border:none;color:#2a0000;}\n  .modal-sub{font-size:12.5px;color:var(--text-dim);margin:-8px 0 16px;}\n\n  .help-body p{font-size:13.5px;line-height:1.6;color:var(--text-dim);margin:0 0 12px;}\n  .help-body b{color:var(--text);}\n\n  .lang-row{display:flex;gap:8px;}\n  .lang-row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:700;font-size:13px;}\n  .lang-row button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}\n\n  .footer-credit{text-align:center;padding:20px;font-size:11px;color:var(--text-dim);}\n  .footer-credit a{color:var(--accent);text-decoration:none;font-weight:700;}\n\n  .choice-btn{\n    display:flex;align-items:center;gap:10px;width:100%;text-align:left;\n    padding:14px;border-radius:10px;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text);font-size:15px;font-weight:600;margin-bottom:8px;\n  }\n  .choice-flag{width:22px;text-align:center;flex:none;font-size:15px;}\n\n  .preload-banner{\n    display:flex;align-items:center;gap:12px;width:100%;text-align:left;\n    padding:12px 14px;border-radius:14px;border:1px solid var(--accent);\n    background:rgba(217,160,92,0.12);color:var(--text);\n  }\n  .preload-banner-icon{\n    flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);\n    display:flex;align-items:center;justify-content:center;font-size:18px;\n  }\n  .preload-banner-text{flex:1;display:flex;flex-direction:column;min-width:0;}\n  .preload-banner-title{font-size:14.5px;font-weight:700;color:var(--accent);}\n  .preload-banner-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}\n  .preload-banner-arrow{flex:none;color:var(--accent);font-size:18px;}\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"topbar\">\n    <div class=\"topline\">\n      <div class=\"topbar-text\">\n        <p class=\"eyebrow\" id=\"topbarEyebrow\">Tu equipo</p>\n        <h1 id=\"appTitle\">\ud83d\udcf7 Mi equipo</h1>\n      </div>\n      <div class=\"icon-row\">\n        <button id=\"btnHelp\" class=\"icon-btn\" title=\"Ayuda\">\u2753</button>\n        <button id=\"btnSettings\" class=\"icon-btn\" title=\"Ajustes\">\u2699</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"introText\">Este es tu stock de material. Se usa en Mochila (para preparar la mochila) y en el Planificador de V\u00eda L\u00e1ctea (para calcular encuadres).</p>\n  </div>\n\n  <div class=\"page-inner\">\n    <div style=\"padding:14px 16px 4px;\">\n      <button id=\"btnPreloadBanner\" class=\"preload-banner\">\n        <span class=\"preload-banner-icon\">\ud83d\udcf7</span>\n        <span class=\"preload-banner-text\">\n          <span class=\"preload-banner-title\" id=\"preloadBannerTitle\">Precargar \u00edtems</span>\n          <span class=\"preload-banner-sub\" id=\"preloadBannerSub\">Marcas de c\u00e1mara o \u00edtems de ejemplo</span>\n        </span>\n        <span class=\"preload-banner-arrow\">\u203a</span>\n      </button>\n    </div>\n\n    <div class=\"toolbar\">\n      <input id=\"searchInput\" type=\"search\" placeholder=\"Buscar\u2026\">\n      <button id=\"btnEdit\" class=\"ghost-btn\">Editar</button>\n      <button id=\"btnAddItem\" class=\"accent-btn\">+ \u00cdtem</button>\n    </div>\n\n    <main>\n      <div id=\"catalogList\"></div>\n    </main>\n  </div>\n</div>\n\n<!-- Modal: add/edit item -->\n<div class=\"modal-overlay\" id=\"modalItem\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalItem\">\u2715</button>\n    <h2 id=\"itemModalTitle\">Nuevo \u00edtem</h2>\n    <div class=\"field\">\n      <label id=\"labelItemName\">Nombre</label>\n      <input type=\"text\" id=\"itemName\" placeholder=\"Ej. Filtro ND 1000\">\n    </div>\n    <div class=\"field\">\n      <label id=\"labelItemWeight\">Peso (gramos)</label>\n      <input type=\"number\" id=\"itemWeight\" min=\"0\" placeholder=\"Ej. 60\">\n    </div>\n    <div class=\"field\">\n      <label id=\"labelItemCategory\">Categor\u00eda</label>\n      <select id=\"itemCategory\"></select>\n    </div>\n    <div class=\"field\" id=\"newCatField\" style=\"display:none;\">\n      <label id=\"labelNewCatName\">Nombre de la nueva categor\u00eda</label>\n      <input type=\"text\" id=\"newCatName\" placeholder=\"Ej. Drone\">\n    </div>\n    <div class=\"field\" id=\"itemSensorField\" style=\"display:none;\">\n      <label id=\"labelItemSensor\">Sensor</label>\n      <select id=\"itemSensor\">\n        <option value=\"1\">Full Frame (35mm) \u2014 x1</option>\n        <option value=\"1.5\">APS-C Nikon/Sony/Fuji \u2014 x1.5</option>\n        <option value=\"1.6\">APS-C Canon \u2014 x1.6</option>\n        <option value=\"2\">Micro 4/3 \u2014 x2</option>\n        <option value=\"custom\">Personalizado</option>\n      </select>\n    </div>\n    <div class=\"field\" id=\"itemCropField\" style=\"display:none;\">\n      <label id=\"labelItemCrop\">Factor de recorte</label>\n      <input type=\"number\" id=\"itemCrop\" value=\"1\" min=\"1\" step=\"0.1\">\n    </div>\n    <div class=\"field\" id=\"itemFocalField\" style=\"display:none;\">\n      <label id=\"labelItemFoca px solid var(--border); color: var(--text); border-radius: 9px; padding: 11px 12px; font-size: 15px; font-family: 'Inter', sans-serif; }\n[data-mode=\"night\"] .field input, [data-mode=\"night\"] .field select{ background: #150303; }\n.field input:focus, .field select:focus{ outline: none; border-color: var(--gold); }\n.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n.field-hint{ font-size: 12px; color: var(--text-faint); margin-top: -6px; }\ninput.title-input{ background: transparent; border:none; border-bottom: 2px solid var(--border); color:#fff; font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:600; padding: 6px 2px; width:100%; }\ninput.title-input:focus{ outline:none; border-bottom-color: var(--gold); }\n\n.exposure-hint{ font-size: 12.5px; color: var(--text-faint); }\n.exposure-hint button{ background: none; border: none; color: var(--gold); font-size: 12.5px; cursor: pointer; padding: 0; text-decoration: underline; }\n.exposure-hint.is-custom{ color: var(--warn); }\n\n.results{ background: #0D1122; border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; }\n[data-mode=\"night\"] .results{ background: #150303; }\n.results .res .rlabel{ font-size: 11.5px; color: var(--text-faint); margin-bottom: 3px; }\n.results .res .rvalue{ font-size: 19px; font-weight: 600; color: var(--gold); }\n.results-note{ grid-column: 1 / -1; font-size: 12.5px; color: var(--text-dim); border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 2px; }\n.results-warn{ grid-column: 1 / -1; font-size: 12.5px; color: var(--warn); border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 2px; }\n\n.wizard-nav{ display:flex; gap:10px; margin-top: 1.75rem; }\n.wizard-nav button{ flex:1; padding: 14px; border-radius: 12px; font-size: 14.5px; font-weight:600; cursor:pointer; font-family:'Space Grotesk', sans-serif; }\n.wizard-nav .nav-back{ background:none; border:1px solid var(--border-soft); color: var(--text-dim); flex: 0 0 auto; padding-left:22px; padding-right:22px; }\n.wizard-nav .nav-back:hover{ border-color: var(--gold); color: var(--gold); }\n.wizard-nav .nav-next{ background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold); }\n.wizard-nav .nav-next:hover{ background:#7A6440; color:#fff; }\n\n/* ---- settings ---- */\n.settings-section{ background: var(--panel); border: 1px solid var(--border-soft); border-radius: 14px; padding: 1.25rem 1.4rem; margin-bottom: 1.1rem; }\n.settings-section h2{ font-size: 15.5px; margin: 0 0 1rem; color: #fff; }\n.cat-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 1rem; gap: 10px; }\n.cat-header h2{ margin:0; }\n.cat-header .del-mini{ font-size:12.5px; width:auto; padding:6px 10px; border-radius:7px; border:1px solid var(--border-soft); }\n.cat-form{ display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; margin-bottom: 1rem; }\n.cat-form .field{ min-width: 140px; flex:1; }\n.cat-form button{ background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold); padding: 0 16px; height: 42px; border-radius: 9px; font-size: 13.5px; cursor: pointer; }\n.cat-form button:hover{ background: #7A6440; color: #fff; }\n.cat-list{ display:flex; flex-direction: column; gap: 6px; }\n.cat-item{ display:flex; align-items:center; justify-content: space-between; background: #0D1122; border: 1px solid var(--border-soft); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }\n[data-mode=\"night\"] .cat-item{ background: #150303; }\n.del-mini{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:15px; }\n.del-mini:hover{ color: var(--warn); }\n.empty-hint{ color: var(--text-faint); font-size: 13px; margin: 0; }\n\n/* ---- summary view ---- */\n.timeline-box{ background: var(--panel); border: 1px solid var(--border-soft); border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 1.4rem; }\n.timeline-box h3{ font-size: 13px; color: var(--text-dim); margin: 0 0 .75rem; font-weight: 500; }\n.tl-row{ display:flex; gap: 12px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--border-soft); }\n.tl-row:last-child{ border-bottom: none; }\n.tl-time{ color: var(--gold); font-family:'Space Grotesk', sans-serif; font-weight: 600; min-width: 52px; }\n.s-card{ background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.3rem 1.4rem; margin-bottom: 1.1rem; }\n.s-card-warn{ border-color: var(--warn); }\n.s-card-head{ display:flex; align-items:baseline; justify-content: space-between; gap:12px; flex-wrap: wrap; margin-bottom: .3rem; }\n.s-card-head h2{ font-size: 18px; margin: 0; color: #fff; }\n.s-time-range{ font-family:'Space Grotesk', sans-serif; font-weight: 600; color: var(--gold); font-size: 14.5px; }\n.s-equip{ color: var(--text-dim); font-size: 13px; margin: 0 0 .9rem; }\n.s-equip-list{ margin: 0 0 .9rem; display:flex; flex-direction:column; gap: 3px; }\n.s-equip-list .s-equip-item{ color: var(--text-dim); font-size: 13px; }\n.s-instruction{ font-size: 14.5px; line-height: 1.6; margin: 0 0 1.1rem; border-left: 3px solid var(--gold); background:#0D1122; padding: 10px 14px; border-radius: 0 8px 8px 0; }\n[data-mode=\"night\"] .s-instruction{ background:#150303; }\n.hero-stats{ display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.5rem; }\n.hero-stat{ flex:1; min-width: 130px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display:flex; align-items:center; gap: 12px; }\n.hero-stat .hs-icon{ font-size: 20px; width:38px; height:38px; border-radius:10px; background:var(--gold-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0; }\n.hero-stat .hs-value{ font-size: 20px; font-weight:600; color: var(--gold); font-family:'Space Grotesk', sans-serif; line-height:1.1; }\n.hero-stat .hs-label{ font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }\n.hour-ruler{ position:relative; height:24px; margin: 2px 0 12px; }\n.hour-ruler-line{ position:absolute; left:0; right:0; top:16px; height:1px; background: var(--border-soft); }\n.hour-tick{\n  position:absolute; top:0; transform:translateX(-50%); font-size:10.5px; color: var(--text-faint);\n  font-family:'Space Grotesk', sans-serif; font-weight:600; white-space:nowrap;\n}\n.hour-tick::after{\n  content:''; position:absolute; left:50%; top:15px; width:1px; height:6px; background: var(--border-soft);\n}\n.gantt{ display:flex; flex-direction:column; gap: 10px; }\n.gantt-row{ display:flex; align-items:center; gap: 10px; }\n.gantt-label{ width: 96px; flex-shrink:0; font-size: 12px; color: var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n.gantt-bar-track{ position:relative; flex:1; height: 26px; background: #0D1122; border-radius: 7px; overflow:hidden; }\n[data-mode=\"night\"] .gantt-bar-track{ background:#150303; }\n.gantt-bar{ position:absolute; top:0; bottom:0; border-radius:7px; background: var(--gold); display:flex; align-items:center; padding: 0 8px; font-size: 10.5px; font-weight:600; color: var(--bg); white-space:nowrap; overflow:hidden; }\n.card-dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); display:inline-block; margin-right:8px; flex-shrink:0; }\n.progress-track{ background:#0D1122; border-radius:6px; height:8px; overflow:hidden; margin-top: 14px; }\n[data-mode=\"night\"] .progress-track{ background:#150303; }\n.progress-fill{ height:100%; border-radius:6px; background: var(--gold); }\n.progress-label{ font-size:11px; color:var(--text-faint); margin-top:5px; display:flex; justify-content:space-between; }\n.spec-toggle{ background:none; border:none; color: var(--gold); font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline; margin-top: 1rem; font-family:'Inter', sans-serif; }\n.s-stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }\n.s-stat-box{ background: #0D1122; border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; text-align:center; }\n[data-mode=\"night\"] .s-stat-box{ background: #150303; }\n.s-stat-box .s-icon{ font-size: 15px; margin-bottom: 4px; }\n.s-label{ font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }\n.s-value{ font-size: 18px; font-weight: 600; color: var(--gold); font-family:'Space Grotesk', sans-serif; }\n.s-alert{ color: var(--warn); font-size: 13px; margin: .9rem 0 0; }\n.spec-list{ margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); }\n.spec-row{ display:flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border-soft); }\n.spec-row:last-child{ border-bottom: none; }\n.spec-label{ color: var(--text-faint); }\n.spec-value{ color: var(--text); font-weight: 500; text-align: right; }\n.s-totals{ display:flex; gap: 22px; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 14px; padding: 1.1rem 1.3rem; margin-top: .5rem; }\n.t-label{ font-size: 11px; color: var(--text-faint); }\n.t-value{ font-size: 19px; font-weight: 600; color: var(--gold); font-family:'Space Grotesk', sans-serif; }\n\n/* ---- help modal ---- */\n.help-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200; }\n.help-card{ background: var(--panel); border:1px solid var(--border); border-radius:16px; padding:1.4rem 1.5rem; max-width:480px; width:100%; max-height:82vh; overflow-y:auto; }\n.help-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: .5rem; gap:10px; }\n.help-head h2{ margin:0; font-size:18px; color:#fff; }\n.help-body{ font-size:13.5px; line-height:1.65; color: var(--text-dim); }\n.help-body h3{ font-size:13px; color: var(--gold); margin: 1.1rem 0 .35rem; }\n.help-body h3:first-child{ margin-top:0; }\n.help-body p{ margin: 0 0 .5rem; }\n.help-body strong{ color: var(--text); font-weight:600; }\n\n@media (max-width: 560px){\n  .field-row{ grid-template-columns: 1fr; }\n  .s-stat-grid{ grid-template-columns: repeat(2, 1fr); }\n}\n.modal-overlay{\n  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;\n  display:flex; align-items:center; justify-content:center; padding: 20px;\n}\n.modal-box{\n  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;\n  padding: 1.5rem; max-width: 420px; width: 100%;\n}\n.modal-box p{ margin: 0 0 1.25rem; font-size: 14.5px; line-height: 1.6; color: var(--text); }\n.modal-actions{ display:flex; justify-content:flex-end; gap: 10px; }\n.modal-actions button{\n  border-radius: 8px; padding: 9px 16px; font-size: 13.5px; cursor:pointer; font-family:'Inter', sans-serif;\n  background: none; border: 1px solid var(--border-soft); color: var(--text-dim);\n}\n.modal-actions button:hover{ border-color: var(--gold); color: var(--gold); }\n.modal-actions button.btn-danger{ color: #ff8a8a; border-color: #4a2020; }\n.modal-actions button.btn-danger:hover{ background: #ff8a8a; color: var(--bg); }\n</style>\n\n<style id=\"unified-theme-override\">\n  :root{\n    --bg:#060a16;\n    --bg-arc: linear-gradient(180deg, #0a0f1f 0%, #0f1730 55%, #141d3d 100%);\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --border:#22305c;\n    --border-soft:#1a2547;\n    --text:#f2efe4;\n    --text-dim:#8993b8;\n    --text-faint:#5f6790;\n    --gold:#d9a05c;\n    --gold-dim:#8a6a3e;\n    --blue:#7c8fff;\n    --blue-dim:#2b3f5c;\n    --rose:#dd8098;\n    --rose-dim:#4c2c39;\n    --warn:#e4894a;\n    --ok:#6fcf8f;\n  }\n  *, *::before, *::after{\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n</style>\n<style id=\"unified-components-override\">\n  .big-add, .summary-btn{\n    background: var(--gold) !important;\n    border: none !important;\n    color: #1a1200 !important;\n    width: 100% !important;\n    display: flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    padding: 15px !important;\n    border-radius: 12px !important;\n    font-weight: 700 !important;\n    font-size: 15px !important;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n  .wizard-nav .nav-next{\n    background: var(--gold) !important;\n    border: none !important;\n    color: #1a1200 !important;\n    flex: 1 !important;\n    display: flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    padding: 15px !important;\n    border-radius: 12px !important;\n    font-weight: 700 !important;\n    font-size: 15px !important;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n  .big-add:hover, .summary-btn:hover, .wizard-nav .nav-next:hover{\n    background: var(--gold) !important;\n    color: #1a1200 !important;\n    opacity:.92;\n  }\n  .wizard-nav button{ border-radius:12px !important; font-weight:700 !important; }\n  .tile, .cam-card, .history-item{ border-radius:16px !important; }\n  .icon-btn{ width:42px !important; height:42px !important; border-radius:50% !important; }\n</style>\n</head>\n<body>\n\n<!-- ============ HOME ============ -->\n<div id=\"view-home\" class=\"view active\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\">Planificador de sesi\u00f3n</p><h1>Planificar sesi\u00f3n astrofotograf\u00eda</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\">Elige el tipo de sesi\u00f3n para empezar a planificarla, c\u00e1mara a c\u00e1mara.</p>\n    </div>\n  </div>\n  <main><div class=\"tile-list\" id=\"homeTiles\"></div></main>\n</div>\n\n<!-- ============ CONFIG (lista de c\u00e1maras) ============ -->\n<div id=\"view-config\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\">Planificador de sesi\u00f3n</p><h1>Tu sesi\u00f3n</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\">Estas son las c\u00e1maras configuradas para esta sesi\u00f3n. A\u00f1ade tantas como necesites y genera el resumen cuando termines.</p>\n    </div>\n  </div>\n  <main>\n    <div class=\"topbar\">\n      <button class=\"btn-ghost\" id=\"backBtn\">\u2190 Inicio</button>\n      <button class=\"btn-ghost btn-danger\" id=\"resetBtn\">\u27f3 Nueva sesi\u00f3n</button>\n      <span class=\"type-badge\" id=\"typeBadge\"></span>\n    </div>\n    <div id=\"blockList\"></div>\n    <button class=\"summary-btn\" id=\"summaryBtn\">Generar resumen de la sesi\u00f3n</button>\n    <div class=\"history\" id=\"historyWrap\" style=\"display:none\">\n      <h2>Res\u00famenes generados en esta sesi\u00f3n</h2>\n      <div id=\"historyList\"></div>\n    </div>\n  </main>\n</div>\n\n<!-- ============ WIZARD (alta/edici\u00f3n de una c\u00e1mara) ============ -->\n<div id=\"view-wizard\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\" id=\"wizardEyebrow\">Nueva c\u00e1mara</p><h1 id=\"wizardTitle\">Configura tu c\u00e1mara</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\">Rellena los datos paso a paso. Podr\u00e1s revisar y ajustar todo antes de guardar.</p>\n    </div>\n  </div>\n  <main>\n    <div class=\"stepper\" id=\"stepper\"></div>\n    <div id=\"wizardContent\"></div>\n    <div class=\"wizard-nav\">\n      <button class=\"nav-back\" id=\"wizardBack\">\u2190 Atr\u00e1s</button>\n      <button class=\"nav-next\" id=\"wizardNext\">Siguiente \u2192</button>\n    </div>\n  </main>\n</div>\n\n<!-- ============ SETTINGS ============ -->\n<!-- ============ SUMMARY ============ -->\n<div id=\"view-summary\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\">Plan de la sesi\u00f3n</p><h1>Resumen para el terreno</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\" id=\"summaryMeta\"></p>\n    </div>\n  </div>\n  <main>\n    <div class=\"topbar\">\n      <button class=\"btn-ghost\" id=\"summaryBackBtn\">\u2190 Tu sesi\u00f3n</button>\n      <button class=\"btn-ghost\" id=\"summaryCopyBtn\">Copiar como texto</button>\n      <button class=\"btn-ghost\" id=\"summaryHomeBtn\" style=\"margin-left:auto\">Ir al inicio</button>\n    </div>\n    <div id=\"summaryContent\"></div>\n  </main>\n</div>\n\n<!-- ============ AYUDA ============ -->\n<div id=\"helpOverlay\" class=\"help-overlay\" style=\"display:none\">\n  <div class=\"help-card\">\n    <div class=\"help-head\">\n      <h2>C\u00f3mo funciona</h2>\n      <button class=\"icon-btn\" id=\"helpClose\" title=\"Cerrar\">\u2715</button>\n    </div>\n    <div class=\"help-body\">\n      <h3>1. Elige el tipo de sesi\u00f3n</h3>\n      <p>En el inicio eliges entre <strong>Panor\u00e1mica de V\u00eda L\u00e1ctea</strong> (varios paneles verticales que luego se unen) o <strong>Foto \u00fanica</strong> (un solo encuadre por c\u00e1mara).</p>\n\n      <h3>2. A\u00f1ade tus c\u00e1maras</h3>\n      <p>En \"Tu sesi\u00f3n\" pulsa \"A\u00f1adir c\u00e1mara\" y rellena el asistente en 3 pasos: equipo (c\u00e1mara, objetivo, tipo de foto, filtro), montaje y horario (tr\u00edpode, tracker, hora de inicio/fin, paneles), y exposici\u00f3n (con un valor recomendado que puedes ajustar). Puedes tener varias c\u00e1maras a la vez, cada una con su propio horario.</p>\n\n      <h3>3. Da de alta tu equipo</h3>\n      <p>Registra tus c\u00e1maras, objetivos, tr\u00edpodes, trackers y filtros desde Mi equipo (una sola vez); aqu\u00ed en el Planificador aparecer\u00e1n listos para elegir en cada c\u00e1mara sin escribirlos de nuevo. Un mismo elemento no se puede asignar a dos c\u00e1maras a la vez en la misma sesi\u00f3n.</p>\n\n      <h3>4. Genera el resumen</h3>\n      <p>Cuando termines de configurar, pulsa \"Generar resumen de la sesi\u00f3n\". Ver\u00e1s la cronolog\u00eda de la noche y una ficha detallada por c\u00e1mara (horario, ajustes y n\u00famero de fotos) pensada para consultar en el terreno mientras disparas.</p>\n\n      <h3>Modo nocturno</h3>\n      <p>El icono de luna cambia toda la app a tonos rojos para proteger tu visi\u00f3n nocturna mientras fotograf\u00edas.</p>\n\n      <h3>Reiniciar o empezar de nuevo</h3>\n      <p>Desde el inicio puedes reiniciar la sesi\u00f3n actual (borra las c\u00e1maras pero mantiene el tipo) o elegir un tipo de sesi\u00f3n distinto para empezar de cero.</p>\n    </div>\n  </div>\n</div>\n\n<div id=\"confirmOverlay\" class=\"modal-overlay\" style=\"display:none\">\n  <div class=\"modal-box\">\n    <p id=\"confirmMessage\"></p>\n    <div class=\"modal-actions\">\n      <button id=\"confirmCancel\" class=\"btn-ghost\">Cancelar</button>\n      <button id=\"confirmOk\" class=\"btn-ghost btn-danger\">Confirmar</button>\n    </div>\n  </div>\n</div>\n\n<div id=\"nameOverlay\" class=\"modal-overlay\" style=\"display:none\">\n  <div class=\"modal-box\">\n    <p>\u00bfQuieres guardar esta sesi\u00f3n con un nombre? As\u00ed la reconocer\u00e1s f\u00e1cilmente en \"Tus sesiones\".</p>\n    <div class=\"field\">\n      <label>Nombre de la sesi\u00f3n (opcional)</label>\n      <input type=\"text\" id=\"nameInput\" placeholder=\"Ej. Salida al Montseny\">\n    </div>\n    <div class=\"modal-actions\">\n      <button id=\"nameSkip\" class=\"btn-ghost\">Ahora no</button>\n      <button id=\"nameSave\" class=\"btn-ghost\">Guardar</button>\n    </div>\n  </div>\n</div>\n\n<script>\nconst SENSORS = [\n  { label: 'Full Frame (35mm) \u2014 x1', value: '1' },\n  { label: 'APS-C Nikon/Sony/Fuji \u2014 x1.5', value: '1.5' },\n  { label: 'APS-C Canon \u2014 x1.6', value: '1.6' },\n  { label: 'Micro 4/3 \u2014 x2', value: '2' },\n  { label: 'Personalizado', value: 'custom' },\n];\n\nlet blocks = [];\nlet counter = 0;\nlet sessionType = null;\nlet sessionId = null;\nlet sessionName = null;\nlet summaryHistory = [];\nlet sessions = [];\nlet nightMode = false;\nlet catalog = { cameras: [], lenses: [], tripods: [], trackers: [], filters: [], customCategories: [] };\nlet settingsReturnView = 'home';\n\n/* wizard state */\nlet draftBlock = null;\nlet wizardStep = 1;\nlet wizardEditingId = null;\nconst WIZARD_STEPS = ['Equipo', 'Par\u00e1metros', 'Horario'];\n\n/* ---------- PERSISTENCE ---------- */\nfunction loadSessions(){\n  try{\n    const raw = localStorage.getItem('mw_sessions_v1');\n    if(raw) sessions = JSON.parse(raw) || [];\n  }catch(e){ sessions = []; }\n}\nfunction saveSessions(){ try{ localStorage.setItem('mw_sessions_v1', JSON.stringify(sessions)); }catch(e){} }\nfunction persistActiveSession(){\n  if(!sessionId) return;\n  const idx = sessions.findIndex(s => s.id === sessionId);\n  if(!blocks.length){\n    if(idx >= 0) sessions.splice(idx, 1);\n    return;\n  }\n  const record = { id: sessionId, type: sessionType, name: sessionName, blocks: JSON.parse(JSON.stringify(blocks)), counter, updatedAt: Date.now() };\n  if(idx >= 0) sessions[idx] = record; else sessions.push(record);\n}\nfunction syncSession(){ persistActiveSession(); saveSessions(); }\n\nconst PBL_CATEGORY_MAP = { camaras: 'cameras', objetivos: 'lenses', tripode: 'tripods', trackers: 'trackers', filtros: 'filters' };\nfunction loadCatalog(){\n  catalog = { cameras:[], lenses:[], tripods:[], trackers:[], filters:[], customCategories:[] };\n  try{\n    const raw = localStorage.getItem('equipoApp_v1');\n    if(!raw) return;\n    const pbl = JSON.parse(raw);\n    (pbl.catalog || []).forEach(ci => {\n      const type = PBL_CATEGORY_MAP[ci.category];\n      if(!type) return;\n      if(type === 'cameras') catalog.cameras.push({ id: ci.id, name: ci.name, sensor: ci.sensor || '1', customCrop: ci.customCrop || 1 });\n      else if(type === 'lenses') catalog.lenses.push({ id: ci.id, name: ci.name, focal: ci.focal || 0 });\n      else if(type === 'filters') catalog.filters.push({ id: ci.id, name: ci.name, type: ci.filterType || 'RGB' });\n      else catalog[type].push({ id: ci.id, name: ci.name });\n    });\n  }catch(e){}\n}\nfunction saveCatalog(){ /* el equipo se gestiona en Mi equipo; aqu\u00ed solo se lee */ }\nfunction applyNightMode(on, persist){\n  nightMode = on;\n  if(on) document.documentElement.setAttribute('data-mode', 'night');\n  else document.documentElement.removeAttribute('data-mode');\n  if(persist !== false){ try{ localStorage.setItem('mw_night_v1', on ? '1' : '0'); }catch(e){} }\n  document.querySelectorAll('.night-icon').forEach(btn => { btn.textContent = on ? '\u2600' : '\ud83c\udf19'; });\n}\nfunction loadNightPref(){\n  let on = false;\n  try{ on = localStorage.getItem('kitNight_v1') === 'on'; }catch(e){}\n  applyNightMode(on, false);\n}\n\n/* ---------- HELPERS ---------- */\nfunction escapeHtml(str){ return String(str).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction sessionMinutes(start, end){\n  if(!start || !end) return 0;\n  const [sh,sm] = start.split(':').map(Number);\n  const [eh,em] = end.split(':').map(Number);\n  let s = sh*60+sm, e = eh*60+em;\n  if(e <= s) e += 24*60;\n  return e - s;\n}\nfunction fmtHM(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h > 0 ? `${h}h ${m}m` : `${m}m`; }\nfunction fmtMS(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return m > 0 ? `${m}m ${s}s` : `${s}s`; }\nfunction catalogItem(type, id){ return catalog[type].find(x => x.id === id) || null; }\nfunction lensDisplayName(lens){\n  if(!lens) return '';\n  return /\\d+(?:[.,]\\d+)?\\s*mm\\b/i.test(lens.name) ? lens.name : `${lens.name} ${lens.focal}mm`;\n}\nfunction lensFocalDefault(lens){\n  if(!lens) return undefined;\n  const name = String(lens.name);\n  const rangeMatch = name.match(/(\\d+(?:[.,]\\d+)?)\\s*-\\s*(\\d+(?:[.,]\\d+)?)\\s*mm/i);\n  if(rangeMatch) return Number(rangeMatch[1].replace(',', '.'));\n  const singleMatch = name.match(/(\\d+(?:[.,]\\d+)?)\\s*mm/i);\n  if(singleMatch) return Number(singleMatch[1].replace(',', '.'));\n  return lens.focal || undefined;\n}\nfunction el(tag, attrs, children){\n  const e = document.createElement(tag);\n  for(const k in (attrs||{})){\n    const v = attrs[k];\n    if(v === null || v === undefined) continue;\n    if(k === 'class') e.className = v;\n    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);\n    else e.setAttribute(k, v);\n  }\n  (children||[]).forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));\n  return e;\n}\nfunction field(labelText, inputEl){ return el('div', {class:'field'}, [el('label', {}, [labelText]), inputEl]); }\nfunction selectWithValue(options, currentValue, onChange){\n  const select = el('select', {oninput: e => onChange(e.target.value)});\n  options.forEach(([value, label]) => select.appendChild(el('option', {value}, [label])));\n  select.value = currentValue || '';\n  return select;\n}\nconst BLOCK_FIELD_BY_TYPE = { cameras:'cameraId', lenses:'lensId', tripods:'tripodId', trackers:'trackerId', filters:'filterId' };\nfunction isItemUsedElsewhere(type, itemId, excludeBlockId){\n  if(!itemId) return false;\n  const field = BLOCK_FIELD_BY_TYPE[type];\n  if(!field) return false;\n  return blocks.some(b => b.id !== excludeBlockId && b[field] === itemId);\n}\nfunction catalogSelect(labelText, type, currentId, placeholder, onChange, excludeBlockId){\n  const available = catalog[type].filter(i => i.id === currentId || !isItemUsedElsewhere(type, i.id, excludeBlockId));\n  const options = [['', placeholder]].concat(available.map(i => [i.id, i.name]));\n  return field(labelText, selectWithValue(options, currentId, onChange));\n}\n\nfunction checkRow(text, checked, onClick){\n  return el('div', {class:'check-row-item' + (checked ? ' checked' : ''), onclick: onClick}, [\n    el('div', {class:'check-mark'}, [checked ? '\u2713' : '']),\n    el('div', {class:'check-row-label'}, [text]),\n  ]);\n}\nfunction catalogCheckList(labelText, type, currentId, placeholder, onChange, excludeBlockId){\n  const available = catalog[type].filter(i => i.id === currentId || !isItemUsedElsewhere(type, i.id, excludeBlockId));\n  const wrap = el('div', {class:'field'}, [el('label', {}, [labelText])]);\n  const list = el('div', {class:'check-list'});\n  list.appendChild(checkRow(placeholder, !currentId, () => onChange('')));\n  if(!available.length){\n    list.appendChild(el('div', {class:'check-list-empty'}, ['No tienes ninguno registrado en Mi equipo.']));\n  }\n  available.forEach(i => {\n    list.appendChild(checkRow(i.name, i.id === currentId, () => onChange(i.id)));\n  });\n  wrap.appendChild(list);\n  return wrap;\n}\n\n/* ---------- BLOCK MODEL ---------- */\nfunction newBlock(overrides){\n  counter++;\n  return Object.assign({\n    id: 'b' + counter + '_' + Date.now(),\n    name: 'C\u00e1mara ' + counter,\n    cameraId: '', lensId: '', tripodId: '', trackerId: '', filterId: '',\n    focal: 17,\n    type: 'RGB', mount: 'tripode', panels: 1,\n    start: '22:00', end: '23:00', gap: 2,\n    exposureSec: '',\n  }, overrides || {});\n}\nfunction defaultBlockForType(type){\n  if(type === 'panoramica') return newBlock({ focal:17, type:'RGB', mount:'tripode', panels:8, start:'22:00', end:'23:00', gap:2 });\n  return newBlock({ focal:24, type:'RGB', mount:'tripode', panels:1, start:'22:00', end:'23:00', gap:2 });\n}\nfunction getBlockCrop(b){\n  const cam = catalogItem('cameras', b.cameraId);\n  if(cam) return cam.sensor === 'custom' ? (Number(cam.customCrop) || 1) : Number(cam.sensor);\n  return 1;\n}\n\n/* ---------- CALCULATIONS ---------- */\nfunction computeBlock(b){\n  const panels = sessionType === 'unica' ? 1 : Math.max(1, Math.round(Number(b.panels)) || 1);\n  const totalMin = sessionMinutes(b.start, b.end);\n  const totalSec = totalMin * 60;\n  const perPanelSec = totalSec / panels;\n  const exposure = Number(b.exposureSec) > 0 ? Number(b.exposureSec) : 15;\n  const gap = Math.max(0, Number(b.gap) || 0);\n  const cycle = exposure + gap;\n  const photosPerPanel = cycle > 0 ? Math.floor(perPanelSec / cycle) : 0;\n  const integrationPerPanel = photosPerPanel * exposure;\n  const totalPhotos = photosPerPanel * panels;\n  const insufficientTime = totalSec > 0 && photosPerPanel < 1;\n  return { totalMin, perPanelSec, exposure, photosPerPanel, integrationPerPanel, totalPhotos, insufficientTime, panels };\n}\n\n/* ---------- VIEW NAVIGATION ---------- */\nfunction showView(name){\n  ['home','config','wizard','summary'].forEach(v => document.getElementById('view-'+v).classList.toggle('active', v === name));\n  window.scrollTo({top:0});\n}\nfunction currentView(){\n  return ['home','config','wizard','summary'].find(v => document.getElementById('view-'+v).classList.contains('active')) || 'home';\n}\nwindow.goToHome = function(){ syncSession(); renderHomeTiles(); showView('home'); };\n\n/* ---------- HOME ---------- */\nfunction renderHomeTiles(){\n  const wrap = document.getElementById('homeTiles');\n  wrap.innerHTML = '';\n\n  wrap.appendChild(el('p', {class:'section-label'}, ['Nueva sesi\u00f3n']));\n  wrap.appendChild(el('div', {class:'session-choices'}, [\n    el('button', {class:'primary-btn', onclick: () => startSession('panoramica')}, ['\ud83c\udf0c Panor\u00e1mica de V\u00eda L\u00e1ctea']),\n    el('button', {class:'primary-btn', onclick: () => startSession('unica')}, ['1\ufe0f\u20e3 Foto \u00fanica']),\n  ]));\n\n  const saved = sessions.filter(s => s.blocks && s.blocks.length > 0).slice().sort((a,b) => b.updatedAt - a.updatedAt);\n  if(saved.length){\n    wrap.appendChild(el('p', {class:'section-label'}, ['Tus sesiones']));\n    const listWrap = el('div', {class:'session-list'});\n    saved.forEach(s => {\n      const isActive = s.id === sessionId;\n      const typeLabel = s.type === 'panoramica' ? 'Panor\u00e1mica de V\u00eda L\u00e1ctea' : 'Foto \u00fanica';\n      const mainPart = el('div', {class:'session-row-main', onclick: () => openSession(s.id)}, [\n        el('span', {class:'dot'}, []),\n        el('div', {class:'body'}, [\n          el('h3', {}, [s.name ? s.name : typeLabel]),\n          el('p', {}, [(s.name ? typeLabel + ' \u00b7 ' : '') + `${s.blocks.length} c\u00e1mara(s)` + (isActive ? ' \u00b7 en curso' : '')]),\n        ]),\n      ]);\n      const viewBtn = el('button', {title:'Ver resumen', onclick: () => viewSessionSummary(s.id)}, ['\ud83d\udcca']);\n      const delBtn = el('button', {title:'Eliminar sesi\u00f3n', onclick: () => deleteSession(s.id)}, ['\u2715']);\n      const row = el('div', {class:'session-row' + (isActive ? ' active' : '')}, [\n        mainPart,\n        el('div', {class:'session-row-actions'}, [viewBtn, delBtn]),\n      ]);\n      listWrap.appendChild(row);\n    });\n    wrap.appendChild(listWrap);\n  }\n}\n\nfunction startSession(type){\n  syncSession();\n  sessionType = type;\n  sessionId = 'sess_' + Date.now();\n  sessionName = null;\n  counter = 0;\n  summaryHistory = [];\n  blocks = [];\n  renderBlockList();\n  showView('config');\n}\n\nfunction openSession(id){\n  syncSession();\n  const rec = sessions.find(s => s.id === id);\n  if(!rec) return;\n  sessionType = rec.type;\n  sessionId = rec.id;\n  sessionName = rec.name || null;\n  blocks = JSON.parse(JSON.stringify(rec.blocks));\n  counter = rec.counter || 0;\n  summaryHistory = [];\n  renderBlockList();\n  showView('config');\n}\n\nfunction viewSessionSummary(id){\n  syncSession();\n  const rec = sessions.find(s => s.id === id);\n  if(!rec) return;\n  sessionType = rec.type;\n  sessionId = rec.id;\n  sessionName = rec.name || null;\n  blocks = JSON.parse(JSON.stringify(rec.blocks));\n  counter = rec.counter || 0;\n  summaryHistory = [];\n  const data = buildSummaryData();\n  renderSummaryView(data);\n  showView('summary');\n}\n\nfunction deleteSession(id){\n  showConfirm('\u00bfEliminar esta sesi\u00f3n guardada? Se perder\u00e1n todas sus c\u00e1maras.', () => {\n    sessions = sessions.filter(s => s.id !== id);\n    saveSessions();\n    if(id === sessionId){ sessionType = null; sessionId = null; blocks = []; counter = 0; summaryHistory = []; }\n    renderHomeTiles();\n  });\n}\n\nfunction resetCurrentSession(onDone){\n  showConfirm('\u00bfReiniciar esta sesi\u00f3n? Se perder\u00e1n todas las c\u00e1maras configuradas.', () => {\n    counter = 0;\n    summaryHistory = [];\n    blocks = [];\n    if(onDone) onDone();\n  });\n}\nfunction resetSession(){\n  resetCurrentSession(renderBlockList);\n}\n\ndocument.getElementById('backBtn').addEventListener('click', () => window.goToHome());\ndocument.getElementById('resetBtn').addEventListener('click', resetSession);\n\nfunction sensorLabel(item){\n  const found = SENSORS.find(s => s.value === item.sensor);\n  return item.sensor === 'custom' ? `Personalizado (x${Number(item.customCrop)||1})` : (found ? found.label : 'Full Frame (35mm) \u2014 x1');\n}\n/* ---------- BLOCK LIST (config view) ---------- */\nfunction renderTypeBadge(){\n  const badge = document.getElementById('typeBadge');\n  badge.textContent = sessionType === 'panoramica' ? 'Panor\u00e1mica de V\u00eda L\u00e1ctea' : 'Foto \u00fanica';\n  badge.className = 'type-badge' + (sessionType === 'unica' ? ' unica' : '');\n}\nfunction camCardStats(b, res){\n  if(res.insufficientTime) return 'Tiempo insuficiente para una foto con esta configuraci\u00f3n';\n  const unit = sessionType === 'panoramica' ? `${res.photosPerPanel} fotos/panel \u00b7 ${res.panels} paneles` : `${res.photosPerPanel} fotos`;\n  return `${unit} \u00b7 ${res.exposure.toFixed(1)}s \u00b7 ${res.totalPhotos} fotos totales`;\n}\nfunction renderBlockList(){\n  renderTypeBadge();\n  const listEl = document.getElementById('blockList');\n  listEl.innerHTML = '';\n\n  if(blocks.length === 0){\n    listEl.appendChild(el('div', {class:'empty-state'}, [\n      el('p', {}, ['Todav\u00eda no has a\u00f1adido ninguna c\u00e1mara a esta sesi\u00f3n.']),\n      el('button', {class:'big-add', onclick: () => openWizard(null)}, ['+ A\u00f1adir tu primera c\u00e1mara']),\n    ]));\n    document.getElementById('summaryBtn').disabled = true;\n  } else {\n    document.getElementById('summaryBtn').disabled = false;\n    blocks.forEach(b => {\n      const res = computeBlock(b);\n      const lens = catalogItem('lenses', b.lensId);\n      const cam = catalogItem('cameras', b.cameraId);\n      const line = [lens ? lens.name : `${b.focal}mm`, cam ? cam.name : null, `${b.start}\u2013${b.end}`].filter(Boolean).join(' \u00b7 ');\n\n      listEl.appendChild(el('div', {class:'cam-card'}, [\n        el('div', {class:'cam-main'}, [\n          el('h3', {}, [b.name, el('span', {class:'badge ' + (b.type === 'HA' ? 'ha' : 'rgb')}, [b.type])]),\n          el('p', {class:'cam-line'}, [line]),\n          el('p', {class: 'cam-stats' + (res.insufficientTime ? ' cam-alert' : '')}, [camCardStats(b, res)]),\n        ]),\n        el('div', {class:'cam-actions'}, [\n          el('button', {class:'icon-mini', title:'Editar', onclick: () => openWizard(b.id)}, ['\u270e']),\n          el('button', {class:'icon-mini del', title:'Eliminar', onclick: () => {\n            showConfirm(`\u00bfEliminar \"${b.name}\"?`, () => { blocks = blocks.filter(x => x.id !== b.id); renderBlockList(); });\n          }}, ['\u2715']),\n        ]),\n      ]));\n    });\n    listEl.appendChild(el('button', {class:'add-more', onclick: () => openWizard(null)}, ['+ A\u00f1adir otra c\u00e1mara']));\n  }\n  renderHistory();\n  syncSession();\n}\n\nfunction renderHistory(){\n  const wrap = document.getElementById('historyWrap');\n  const list = document.getElementById('historyList');\n  list.innerHTML = '';\n  if(summaryHistory.length === 0){ wrap.style.display = 'none'; return; }\n  wrap.style.display = 'block';\n  summaryHistory.forEach(item => {\n    const timeStr = item.timestamp.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});\n    list.appendChild(el('div', {class:'history-item'}, [\n      el('span', {class:'h-meta'}, [el('strong', {}, [timeStr]), ` \u2014 ${item.totalPhotos} fotos, ${item.blockCount} c\u00e1mara(s)`]),\n      el('div', {class:'h-actions'}, [\n        el('button', {onclick: () => { renderSummaryView(item.data); showView('summary'); }}, ['Ver']),\n        el('button', {class:'del', onclick: () => { summaryHistory = summaryHistory.filter(x => x.id !== item.id); renderHistory(); }}, ['Eliminar']),\n      ]),\n    ]));\n  });\n}\n\n/* ---------- WIZARD ---------- */\nfunction openWizard(blockId){\n  loadCatalog();\n  if(blockId){\n    const orig = blocks.find(x => x.id === blockId);\n    draftBlock = Object.assign({}, orig);\n    wizardEditingId = blockId;\n  } else {\n    draftBlock = defaultBlockForType(sessionType);\n    draftBlock.name = 'C\u00e1mara ' + (blocks.length + 1);\n    wizardEditingId = null;\n  }\n  wizardStep = 1;\n  document.getElementById('wizardEyebrow').textContent = wizardEditingId ? 'Editar c\u00e1mara' : 'Nueva c\u00e1mara';\n  renderWizard();\n  showView('wizard');\n}\n\nfunction renderStepper(){\n  const wrap = document.getElementById('stepper');\n  wrap.innerHTML = '';\n  WIZARD_STEPS.forEach((label, i) => {\n    const n = i + 1;\n    const cls = n === wizardStep ? 'active' : (n < wizardStep ? 'done' : '');\n    wrap.appendChild(el('div', {class: 'step-dot ' + cls}, [\n      el('div', {class:'bar'}),\n      el('div', {class:'lbl'}, [`${n}. ${label}`]),\n    ]));\n  });\n}\n\nlet wizardResultsEl = null, wizardExposureInput = null;\n\nfunction refreshWizardResults(){\n  if(!wizardResultsEl) return;\n  const res = computeBlock(draftBlock);\n  const newResults = buildResultsEl(draftBlock, res);\n  wizardResultsEl.replaceWith(newResults);\n  wizardResultsEl = newResults;\n}\n\nfunction buildResultsEl(b, res){\n  const children = [\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, ['Duraci\u00f3n de la sesi\u00f3n']), el('div', {class:'rvalue'}, [fmtHM(res.totalMin)])]),\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, [sessionType === 'panoramica' ? 'Tiempo por panel' : 'Tiempo disponible']), el('div', {class:'rvalue'}, [fmtMS(res.perPanelSec)])]),\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, ['Exposici\u00f3n por foto']), el('div', {class:'rvalue'}, [res.exposure.toFixed(1) + ' s'])]),\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, [sessionType === 'panoramica' ? 'Fotos por panel' : 'Fotos a hacer']), el('div', {class:'rvalue'}, [String(res.photosPerPanel)])]),\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, ['Integraci\u00f3n']), el('div', {class:'rvalue'}, [fmtMS(res.integrationPerPanel)])]),\n    el('div', {class:'res'}, [el('div', {class:'rlabel'}, ['Total de fotos']), el('div', {class:'rvalue'}, [String(res.totalPhotos)])]),\n  ];\n  if(res.insufficientTime){\n    children.push(el('div', {class:'results-warn'},\n      ['El tiempo disponible no alcanza ni para una foto con esta exposici\u00f3n e intervalo \u2014 acorta el intervalo, baja la exposici\u00f3n o ampl\u00eda la sesi\u00f3n.']\n    ));\n  }\n  return el('div', {class:'results'}, children);\n}\n\nfunction renderWizard(){\n  renderStepper();\n  const b = draftBlock;\n  const content = document.getElementById('wizardContent');\n  content.innerHTML = '';\n  wizardResultsEl = null;\n  document.getElemen ', {type:'time', value: b.end, oninput: e => { b.end = e.target.value; refreshWizardResults(); }});\n    fields.push(el('div', {class:'field-row'}, [field('Hora de inicio', startInput), field('Hora de fin', endInput)]));\n    fields.push(el('p', {class:'field-hint'}, ['Ajusta el horario seg\u00fan la visibilidad del n\u00facleo gal\u00e1ctico o el l\u00edmite de altura de arco que quieras evitar.']));\n    const res = computeBlock(b);\n    wizardResultsEl = buildResultsEl(b, res);\n    fields.push(wizardResultsEl);\n    content.appendChild(el('div', {class:'field-stack'}, fields));\n  }\n}\n\ndocument.getElementById('wizardNext').addEventListener('click', () => {\n  if(wizardStep < 3){ wizardStep++; renderWizard(); return; }\n  if(wizardEditingId){\n    const idx = blocks.findIndex(x => x.id === wizardEditingId);\n    if(idx >= 0) blocks[idx] = draftBlock;\n  } else {\n    blocks.push(draftBlock);\n  }\n  draftBlock = null;\n  renderBlockList();\n  showView('config');\n});\ndocument.getElementById('wizardBack').addEventListener('click', () => {\n  if(wizardStep > 1){ wizardStep--; renderWizard(); return; }\n  draftBlock = null;\n  renderBlockList();\n  showView('config');\n});\n\n/* ---------- SUMMARY ---------- */\nfunction equipItems(b){\n  const items = [];\n  const cam = catalogItem('cameras', b.cameraId);\n  const lens = catalogItem('lenses', b.lensId);\n  items.push('\ud83d\udcf7 ' + (cam ? cam.name : 'Sin c\u00e1mara registrada'));\n  items.push('\ud83d\udd0e ' + (lens ? lens.name : `${b.focal}mm`));\n  items.push((b.type === 'HA' ? '\ud83d\udd34 H\u03b1 (narrowband)' : '\ud83c\udf08 RGB'));\n  const filt = catalogItem('filters', b.filterId);\n  if(filt) items.push('\ud83c\udf9a ' + filt.name);\n  items.push(b.mount === 'tripode' ? '\u26f0\ufe0f Sin seguimiento' : '\ud83c\udfaf Con seguimiento');\n  const trip = catalogItem('tripods', b.tripodId);\n  if(trip) items.push('\ud83e\uddbf ' + trip.name);\n  const trk = catalogItem('trackers', b.trackerId);\n  if(trk) items.push('\u2b50 ' + trk.name);\n  return items;\n}\nfunction instructionLine(b, res){\n  if(sessionType === 'panoramica'){\n    return `Dispara ${res.photosPerPanel} fotos de ${res.exposure.toFixed(1)}s en cada uno de los ${res.panels} paneles (gira al siguiente panel cuando completes las tomas). Termina antes de las ${b.end}.`;\n  }\n  return `Dispara ${res.photosPerPanel} fotos de ${res.exposure.toFixed(1)}s. Termina antes de las ${b.end}.`;\n}\nfunction specRows(b, res){\n  const cam = catalogItem('cameras', b.cameraId);\n  const lens = catalogItem('lenses', b.lensId);\n  const filt = catalogItem('filters', b.filterId);\n  const sensorText = cam ? sensorLabel(cam) : 'Full Frame (35mm) \u2014 x1 (sin c\u00e1mara registrada)';\n  const trip = catalogItem('tripods', b.tripodId);\n  const trk = catalogItem('trackers', b.trackerId);\n  const rows = [\n    ['C\u00e1mara', cam ? cam.name : '\u2014'],\n    ['Objetivo', lens ? lensDisplayName(lens) : `${b.focal}mm`],\n    ['Sensor', sensorText],\n    ['Tipo de foto', b.type === 'HA' ? 'H\u03b1 (narrowband)' : 'RGB'],\n    ['Filtro', filt ? filt.name : 'Ninguno'],\n    ['Tr\u00edpode', trip ? trip.name : 'Ninguno'],\n    ['Tracker', trk ? trk.name : 'Ninguno'],\n    ['Tipo de seguimiento', b.mount === 'tripode' ? 'Sin seguimiento (tr\u00edpode fijo)' : 'Con seguimiento (tracker activo)'],\n    ['Horario', `${b.start} \u2192 ${b.end}`],\n  ];\n  if(sessionType === 'panoramica') rows.push(['Paneles verticales', String(res.panels)]);\n  rows.push(['Intervalo entre disparos', `${b.gap} s`]);\n  rows.push(['Exposici\u00f3n por foto', `${res.exposure.toFixed(1)} s`]);\n  rows.push([sessionType === 'panoramica' ? 'Fotos por panel' : 'Fotos a hacer', String(res.photosPerPanel)]);\n  if(sessionType === 'panoramica') rows.push(['Integraci\u00f3n por panel', fmtMS(res.integrationPerPanel)]);\n  rows.push(['Total de fotos del bloque', String(res.totalPhotos)]);\n  return rows;\n}\n\nlet currentSummaryData = null;\n\nfunction buildSummaryData(){\n  const results = blocks.map(b => ({ b, res: computeBlock(b) }));\n  const totalPhotos = results.reduce((a,{res}) => a + res.totalPhotos, 0);\n  const totalIntegrationMin = results.reduce((a,{res}) => a + (res.totalPhotos * res.exposure) / 60, 0);\n  const timeline = [];\n  results.forEach(({b}) => { timeline.push({ t: b.start, label: `${b.name} \u2014 empieza` }); timeline.push({ t: b.end, label: `${b.name} \u2014 termina` }); });\n  timeline.sort((a,c) => a.t.localeCompare(c.t));\n  const cards = results.map(({b, res}) => ({\n    name: b.name,\n    timeRange: `${b.start} \u2192 ${b.end}`,\n    equipItems: equipItems(b).concat(sessionType === 'panoramica' ? [`${res.panels} paneles`] : []),\n    instruction: instructionLine(b, res),\n    stats: [\n      ['\u2728', 'Exposici\u00f3n', res.exposure.toFixed(1) + ' s'],\n      ['\ud83d\udd0e', 'Objetivo', `${b.focal}mm`],\n      ['\ud83d\udcf8', sessionType === 'panoramica' ? 'Fotos/panel' : 'Fotos', String(res.photosPerPanel)],\n      ['\u03a3', 'Total de fotos', String(res.totalPhotos)],\n    ],\n    progressPct: res.perPanelSec > 0 ? Math.round((res.integrationPerPanel / res.perPanelSec) * 100) : 0,\n    specRows: specRows(b, res),\n    insufficientTime: res.insufficientTime,\n    start: b.start, end: b.end,\n  }));\n  return { sessionType, generatedAt: new Date().toLocaleString('es-ES'), timeline, cards, totals: { blockCount: blocks.length, totalPhotos, totalIntegrationMin } };\n}\n\nfunction buildGanttRows(cards){\n  const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };\n  const spans = cards.map(c => {\n    let s = toMin(c.start), e = toMin(c.end);\n    if(e <= s) e += 24*60;\n    return { start:s, end:e, label:c.name, range:`${c.start} \u2192 ${c.end}` };\n  });\n  const minStart = Math.min(...spans.map(s => s.start));\n  const maxEnd = Math.max(...spans.map(s => s.end));\n  const span = Math.max(1, maxEnd - minStart);\n  return spans.map((s,i) => ({\n    label: s.label, range: s.range,\n    leftPct: ((s.start - minStart) / span) * 100,\n    widthPct: Math.max(3, ((s.end - s.start) / span) * 100),\n    opacity: (1 - (i % 4) * 0.2).toFixed(2),\n  }));\n}\n\nfunction buildTimelineTicks(cards){\n  const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };\n  const spans = cards.map(c => { let s = toMin(c.start), e = toMin(c.end); if(e <= s) e += 24*60; return {s,e}; });\n  const minStart = Math.min(...spans.map(s => s.s));\n  const maxEnd = Math.max(...spans.map(s => s.e));\n  const span = Math.max(1, maxEnd - minStart);\n  const ticks = [];\n  const firstHour = Math.ceil(minStart / 60) * 60;\n  for(let t = firstHour; t <= maxEnd; t += 60){\n    const pct = ((t - minStart) / span) * 100;\n    const hh = Math.floor((t % (24 * 60)) / 60);\n    ticks.push({ pct, label: String(hh).padStart(2, '0') + ':00' });\n  }\n  if(!ticks.length || ticks[0].pct > 4) ticks.unshift({ pct: 0, label: String(Math.floor((minStart % (24*60)) / 60)).padStart(2,'0') + ':' + String(minStart % 60).padStart(2,'0') });\n  return ticks;\n}\n\nfunction renderSummaryView(data){\n  currentSummaryData = data;\n  const typeLabel = data.sessionType === 'panoramica' ? 'Panor\u00e1mica de V\u00eda L\u00e1ctea' : 'Foto \u00fanica';\n  document.getElementById('summaryMeta').textContent =\n    (sessionName ? sessionName + ' \u00b7 ' : '') + `${typeLabel} \u00b7 generado el ${data.generatedAt}`;\n  const content = document.getElementById('summaryContent');\n  content.innerHTML = '';\n\n  content.appendChild(el('div', {class:'hero-stats'}, [\n    el('div', {class:'hero-stat'}, [el('div', {class:'hs-icon'}, ['\ud83d\udcf7']), el('div', {}, [el('div', {class:'hs-value'}, [String(data.totals.blockCount)]), el('div', {class:'hs-label'}, ['C\u00e1maras'])])]),\n    el('div', {class:'hero-stat'}, [el('div', {class:'hs-icon'}, ['\u2728']), el('div', {}, [el('div', {class:'hs-value'}, [String(data.totals.totalPhotos)]), el('div', {class:'hs-label'}, ['Fotos totales px; height:32px; border-radius:9px; border:2px solid var(--dim); flex:none;\n    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--void);\n  }\n  .done-row.done .checkbox{background:var(--ok); border-color:var(--ok);}\n  .done-row .done-title{font-weight:700; font-size:16px;}\n  .done-row.done .done-title{color:var(--dim); text-decoration:line-through;}\n  .done-row .done-sub{font-size:12px; color:var(--dim); margin-top:2px;}\n\n  .note{\n    font-size:12.5px; color:var(--dim); line-height:1.6; background:var(--panel-2);\n    border-left:3px solid var(--brass-dim); border-radius:8px; padding:10px 12px; margin-bottom:6px;\n  }\n\n  .howto{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px 14px 6px; margin-bottom:16px;}\n  .howto-title{font-size:13px; font-weight:700; margin-bottom:10px;}\n  .howto ol{list-style:none; margin:0; padding:0; counter-reset:step;}\n  .howto ol li{\n    counter-increment:step; display:flex; gap:10px; align-items:flex-start;\n    font-size:13px; color:var(--star); line-height:1.5; padding-bottom:12px;\n  }\n  .howto ol li::before{\n    content:counter(step); flex:none; width:20px; height:20px; border-radius:50%;\n    background:var(--brass-dim); color:var(--star); font-size:11px; font-weight:700;\n    display:flex; align-items:center; justify-content:center; font-family:var(--mono);\n  }\n\n  .summary-total{text-align:center; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line);}\n  .summary-total-val{font-family:var(--mono); font-size:34px; font-weight:700; color:var(--brass); letter-spacing:-.01em;}\n  .summary-total-lbl{font-size:12.5px; color:var(--dim); margin-top:2px;}\n  .summary-time-row{\n    display:flex; align-items:center; justify-content:center; gap:10px; font-family:var(--mono); font-size:13px;\n    color:var(--star); background:var(--panel-2); border:1px solid var(--line); border-radius:10px;\n    padding:9px 10px; margin-bottom: .primary-btn{margin-bottom:10px;}\n\n  .reorder-row{\n    display:flex; align-items:center; gap:12px; padding:12px 4px;\n    border-bottom:1px solid var(--line);\n  }\n  .reorder-row:last-child{border-bottom:none;}\n  .reorder-icon{font-size:20px; flex:none;}\n  .reorder-label{flex:1; font-weight:600; font-size:14px;}\n  .reorder-btns{display:flex; gap:6px;}\n  .reorder-btns button:disabled{opacity:.25; cursor:default;}\n</style>\n</head>\n<body>\n<div class=\"app\">\n  <header>\n    <div class=\"topline\">\n      <div class=\"brand\">\n        <span class=\"stars\" data-i18n=\"eyebrow\">SESI\u00d3N DE CALIBRACI\u00d3N</span>\n        <h1>Tomas calibraci\u00f3n astrofotograf\u00eda</h1>\n      </div>\n      <div class=\"header-actions\">\n        <button class=\"modebtn\" id=\"headerHelpBtn\" title=\"Ayuda\">\u2753</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"headerSub\" data-i18n=\"homeText\">Indica los par\u00e1metros de tus Lights y te genero el plan de Darks, Bias y Flats para calibrar tu sesi\u00f3n, con los tiempos totales.</p>\n  </header>\n\n  <div class=\"progress-wrap\" id=\"progressWrap\">\n    <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"></div></div>\n    <div class=\"progress-label\"><span id=\"progressText\">0 / 4</span><span id=\"progressPct\">0%</span></div>\n  </div>\n\n  <main>\n    <!-- HOME VIEW -->\n    <div id=\"home-view\">\n      <p class=\"section-label\" data-i18n=\"newSessionLabel\">Nueva sesi\u00f3n</p>\n      <button class=\"primary-btn\" id=\"startNewBtn\" data-i18n=\"homeBtn\">\ud83c\udf0c Nueva sesi\u00f3n</button>\n\n      <div class=\"history-list\" id=\"historyList\" style=\"display:none;\"></div>\n\n    </div>\n\n    <!-- HELP VIEW -->\n    <div id=\"help-view\" style=\"display:none;\">\n      <div class=\"back-link\" id=\"backFromHelp\"><span data-i18n=\"setupBack\">\u2039 Volver</span></div>\n      <div class=\"card\">\n        <h2 data-i18n=\"helpTitle\">C\u00f3mo funciona Tomas calibraci\u00f3n astrofotograf\u00eda</h2>\n      </div>\n      <div class=\"howto\">\n        <ol>\n          <li data-i18n=\"helpStep1\">Indica los par\u00e1metros de tus Lights: tiempo de exposici\u00f3n, ISO, apertura y cu\u00e1ntas fotos vas a hacer.</li>\n          <li data-i18n=\"helpStep2\">La app calcula autom\u00e1ticamente cu\u00e1ntas Darks, Bias y Flats necesitas y con qu\u00e9 ajustes hacerlos.</li>\n          <li data-i18n=\"helpStep3\">Ve marcando cada fase como hecha a medida que la completas; puedes reordenar el orden desde el Resumen.</li>\n          <li data-i18n=\"helpStep4\">Consulta en todo momento el tiempo total estimado de la sesi\u00f3n en la pesta\u00f1a Resumen.</li>\n        </ol>\n      </div>\n\n      <div class=\"card\">\n        <h2 data-i18n=\"helpInstallTitle\">\ud83d\udcf1 A\u00f1adir a la pantalla de inicio</h2>\n        <p class=\"sub\" data-i18n=\"helpInstallText\">As\u00ed podr\u00e1s abrir la app como si fuera una aplicaci\u00f3n normal, sin buscarla en el navegador.</p>\n      </div>\n\n      <div class=\"howto\">\n        <div class=\"howto-title\" data-i18n=\"helpIosTitle\">En iPhone / iPad (Safari)</div>\n        <ol>\n          <li data-i18n=\"helpIosStep1\">Abre esta p\u00e1gina con Safari.</li>\n          <li data-i18n=\"helpIosStep2\">Toca el icono de compartir (el cuadrado con la flecha hacia arriba), en la barra inferior.</li>\n          <li data-i18n=\"helpIosStep3\">Desliza hacia abajo y toca \"A\u00f1adir a pantalla de inicio\".</li>\n          <li data-i18n=\"helpIosStep4\">Toca \"A\u00f1adir\" arriba a la derecha.</li>\n        </ol>\n      </div>\n\n      <div class=\"howto\">\n        <div class=\"howto-title\" data-i18n=\"helpAndroidTitle\">En Android (Chrome)</div>\n        <ol>\n          <li data-i18n=\"helpAndroidStep1\">Abre esta p\u00e1gina con Chrome.</li>\n          <li data-i18n=\"helpAndroidStep2\">Toca el men\u00fa de los tres puntos, arriba a la derecha.</li>\n          <li data-i18n=\"helpAndroidStep3\">Toca \"A\u00f1adir a pantalla de inicio\" o \"Instalar aplicaci\u00f3n\".</li>\n          <li data-i18n=\"helpAndroidStep4\">Confirma tocando \"A\u00f1adir\" o \"Instalar\".</li>\n        </ol>\n      </div>\n    </div>\n\n    <!-- SETUP VIEW -->\n    <div id=\"setup-view\" style=\"display:none;\">\n      <div class=\"back-link\" id=\"backFromSetup\"><span data-i18n=\"setupBack\">\u2039 Volver</span></div>\n      <div class=\"card\">\n        <h2 data-i18n=\"setupTitle\">Par\u00e1metros de tus Lights</h2>\n        <p class=\"sub\" data-i18n=\"setupExplain\">Los Lights son las fotos normales que le haces al objeto (una galaxia, una nebulosa, la V\u00eda L\u00e1ctea...): las que despu\u00e9s apilar\u00e1s para conseguir la imagen final. A partir de estos datos calculo tus tomas de calibraci\u00f3n: Darks, Bias y Flats.</p>\n\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label data-i18n=\"lblExposure\">Tiempo exposici\u00f3n (s)</label>\n            <input type=\"number\" id=\"in-exposure\" placeholder=\"15\" min=\"0\" step=\"0.1\">\n          </div>\n          <div class=\"field\">\n            <label>ISO</label>\n            <input type=\"number\" id=\"in-iso\" placeholder=\"200\" min=\"0\">\n          </div>\n        </div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label data-i18n=\"lblNumLights\">N\u00ba de Lights</label>\n            <input type=\"number\" id=\"in-numlights\" placeholder=\"1\" min=\"0\">\n          </div>\n          <div class=\"field\">\n            <label data-i18n=\"lblAperture\">Apertura (n\u00ba f)</label>\n            <input type=\"text\" id=\"in-aperture\" placeholder=\"2.8\">\n          </div>\n        </div>\n        <div class=\"field\">\n          <label data-i18n=\"lblStartTime\">Hora de inicio (opcional)</label>\n          <input type=\"time\" id=\"in-starttime\">\n        </div>\n      </div>\n\n      <button class=\"primary-btn\" id=\"startBtn\" data-i18n=\"btnGenerate\">Generar plan de sesi\u00f3n</button>\n    </div>\n\n    <!-- SESSION VIEW -->\n    <div id=\"session-view\">\n      <div id=\"panel-resumen\"></div>\n      <div id=\"panel-lights\" style=\"display:none;\"></div>\n      <div id=\"panel-darks\" style=\"display:none;\"></div>\n      <div id=\"panel-bias\" style=\"display:none;\"></div>\n      <div id=\"panel-flats\" style=\"display:none;\"></div>\n    </div>\n  </main>\n\n  <nav class=\"tabs\" id=\"tabsNav\">\n    <div class=\"tabs-inner\" id=\"tabsInner\"></div>\n  </nav>\n\n  <div class=\"modal-overlay\" id=\"confirmModal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-glyph\">\ud83d\uddd1\ufe0f</div>\n      <h3 data-i18n=\"confirmTitle\">\u00bfEmpezar de cero?</h3>\n      <p data-i18n=\"confirmText\">Se borrar\u00e1 esta sesi\u00f3n y sus datos guardados en el tel\u00e9fono.</p>\n      <button class=\"primary-btn\" id=\"confirmYesBtn\" data-i18n=\"confirmYes\">S\u00ed, borrar y empezar</button>\n      <button class=\"ghost-btn\" id=\"confirmNoBtn\" data-i18n=\"confirmNo\">Cancelar</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"completeModal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-glyph\">\ud83c\udf89</div>\n      <h3 data-i18n=\"completeTitle\">\u00a1Sesi\u00f3n completada!</h3>\n      <p data-i18n=\"completeText\">Has marcado como hechas las 4 fases: Lights, Darks, Bias y Flats. Ya puedes apilar tus im\u00e1genes.</p>\n      <button class=\"primary-btn\" id=\"modalFinishBtn\" data-i18n=\"btnFinishSession\">\u2705 Finalizar sesi\u00f3n</button>\n      <button class=\"ghost-btn\" id=\"modalCloseBtn\" data-i18n=\"completeClose\">Seguir en la sesi\u00f3n</button>\n      <button class=\"ghost-btn danger\" id=\"modalNewSessionBtn\" data-i18n=\"btnNewSession\">\ud83d\uddd1\ufe0f Empezar sesi\u00f3n nueva</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"reorderModal\">\n    <div class=\"modal-card\" style=\"text-align:left;\">\n      <h3 data-i18n=\"reorderTitle\" style=\"text-align:center;\">Reordenar sesi\u00f3n</h3>\n      <p data-i18n=\"reorderText\" style=\"text-align:center;\">Cambia el orden en el que quieres hacer las fases, por ejemplo si prefieres los Bias antes que los Flats.</p>\n      <div id=\"reorderList\"></div>\n      <button class=\"primary-btn\" id=\"reorderDoneBtn\" data-i18n=\"reorderDone\" style=\"margin-top:16px;\">Listo</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"nameModal\">\n    <div class=\"modal-card\" style=\"text-align:left;\">\n      <h3 style=\"text-align:center;\" data-i18n=\"nameModalTitle\">\u00bfGuardar con un nombre?</h3>\n      <p style=\"text-align:center;\" data-i18n=\"nameModalText\">As\u00ed reconocer\u00e1s esta sesi\u00f3n en tus sesiones recientes.</p>\n      <div class=\"field\">\n        <label data-i18n=\"nameModalLabel\">Nombre de la sesi\u00f3n (opcional)</label>\n        <input type=\"text\" id=\"nameModalInput\" placeholder=\"Ej. Nebulosa de Ori\u00f3n\">\n      </div>\n      <button class=\"primary-btn\" id=\"nameModalSaveBtn\" data-i18n=\"nameModalSave\" style=\"margin-bottom:10px;\">Guardar</button>\n      <button class=\"ghost-btn\" id=\"nameModalSkipBtn\" data-i18n=\"nameModalSkip\">Ahora no</button>\n    </div>\n  </div>\n</div>\n\n<script>\n// ---------------------------------------------------------------------\n// i18n\n// ---------------------------------------------------------------------\nconst I18N = {\n  es: {\n    eyebrow: \"SESI\u00d3N DE CALIBRACI\u00d3N\",\n    homeText: \"Indica los par\u00e1metros de tus Lights y te genero el plan de Darks, Bias y Flats para calibrar tu sesi\u00f3n, con los tiempos totales.\",\n    newSessionLabel: \"Nueva sesi\u00f3n\",\n    homeBtn: \"\ud83c\udf0c Nueva sesi\u00f3n\",\n    homeFooterCredit: \"App creada por\",\n    homeCopyright: \"Todos los derechos reservados.\",\n    helpBtn: \"\u2753 C\u00f3mo funciona la app\",\n    historyTitle: \"\ud83d\udd58 Sesiones
