'\ud83c\udfaf <b>En una frase:</b> cuanto m\u00e1s ancha y repartida est\u00e9 la curva, mejor \u2014 aprovechas todo lo que tu c\u00e1mara puede captar.',\n      cmpLabel1:\"Forma del histograma\", cmp1a:\"Pegado a la izquierda\", cmp1b:\"Extendido\", cmp1c:\"Ancho y repartido\",\n      cmpLabel2:\"Lo m\u00e1s importante\", cmp2a:\"Las sombras y estrellas d\u00e9biles\", cmp2b:\"Las luces (nubes y cielo)\", cmp2c:\"Un poco de todo\",\n      cmpLabel3:\"Lo que hay que evitar\", cmp3a:\"Pico grande a la derecha\", cmp3b:\"Nubes todas quemadas\", cmp3c:\"Pegarse del todo a un lado\",\n      cmpLabel4:\"Si algo se satura, \u00bfpasa algo?\", cmp4a:\"Una estrella suelta: no pasa nada\", cmp4b:\"El propio sol: no pasa nada\", cmp4c:\"Mejor evitarlo en ambos lados\",\n      finalTitle:'\ud83d\udccc <b>Resumen f\u00e1cil</b>',\n      finalAstro:'\ud83c\udf0c <b>Astro:</b> todo a la izquierda, sin tocar los negros.',\n      finalSol:'\ud83c\udf05 <b>Sol:</b> cuida las nubes y el cielo, el sol puede quemarse.',\n      finalPaisaje:'\ud83c\udf33 <b>Paisaje:</b> cuanto m\u00e1s ancho, mejor \u2014 sin pegarte a ning\u00fan lado.'\n    },\n    ca: {\n      eyebrow:\"Guia r\u00e0pida\", title:\"Controlar l'histograma\",\n      sub:\"Compara la forma del teu histograma amb la de refer\u00e8ncia mentre fas la foto.\",\n      infoModalTitle:\"Qu\u00e8 \u00e9s l'histograma?\",\n      infoModalP1:'\u00c9s un gr\u00e0fic que mostra la teva c\u00e0mera: a l\\'esquerra queden les parts m\u00e9s <b style=\"color:var(--star)\">fosques</b> de la foto, a la dreta les m\u00e9s <b style=\"color:var(--star)\">clares</b>. L\\'al\u00e7ada de la corba indica quanta foto t\u00e9 aquest to.',\n      infoModalP2:\"No hi ha una forma \\\"perfecta\\\" \u00fanica: la forma bona canvia segons qu\u00e8 fotografi\u00efs. Aqu\u00ed tens 3 formes de refer\u00e8ncia \u2014 compara-les amb l'histograma que et mostra la teva c\u00e0mera a la pantalla.\",\n      introBarDark:\"\u2b05\ufe0f Fosc\", introBarLight:\"Clar \u27a1\ufe0f\", infoDone:\"Ent\u00e8s\",\n      tabAstro:\"Via L\u00e0ctia\", tabSol:\"Sol\", tabPaisaje:\"Paisatge\", tabComparar:\"Comparar\",\n      chartRef:\"Forma de refer\u00e8ncia\", chartHint:\"\ud83d\udc41\ufe0f compara-la amb la teva c\u00e0mera\",\n      zoneLabels:[\"Fosc\",\"Ombra\",\"Mitj\u00e0\",\"Llum\",\"Molt clar\"],\n      legendGood:\"Zona bona\", legendBad:\"Evita acumular aqu\u00ed\",\n      astroGood:'<b>Aqu\u00ed ha d\\'estar gaireb\u00e9 tota la teva foto:</b> el cel fosc i les estrelles febles de la Via L\u00e0ctia.',\n      astroMid:'<b>Est\u00e0 b\u00e9 que hi hagi una mica aqu\u00ed:</b> alguna estructura de la Via L\u00e0ctia i estrelles una mica m\u00e9s brillants.',\n      astroBad:'<b>Evita que s\\'acumuli molt aqu\u00ed:</b> si el costat dret t\u00e9 un pic gran, el cel perd el seu aspecte natural de nit.',\n      astroSentence:'\ud83c\udfaf <b>En una frase:</b> la corba enganxada a l\\'esquerra, sense tocar del tot la vora.',\n      solGood:'<b>Aqu\u00ed ha d\\'estar gaireb\u00e9 tota la teva foto:</b> el cel i el paisatge il\u00b7luminats per la llum de la posta.',\n      solMid:'<b>Est\u00e0 b\u00e9 que hi hagi una mica aqu\u00ed:</b> les zones d\\'ombra (siluetes) i el propi sol, molt brillant.',\n      solBad:'<b>Evita que s\\'acumuli molt aqu\u00ed:</b> si els n\u00favols s\\'ajunten tots a l\\'extrem dret, en perds el color i la forma per sempre.',\n      solSentence:'\ud83c\udfaf <b>En una frase:</b> protegeix el cel i els n\u00favols \u2014 que el propi sol es cremi una mica no passa res.',\n      paisajeGood:'<b>La teva foto s\\'ha de repartir per gaireb\u00e9 tot el gr\u00e0fic:</b> ombres, tons mitjans i llums, tots amb una mica d\\'informaci\u00f3.',\n      paisajeMid:'<b>Est\u00e0 b\u00e9 tenir una mica als extrems:</b> una mica de negre pur i una mica de blanc pur \u00e9s normal.',\n      paisajeBad:'<b>Evita que s\\'enganxi del tot a un extrem:</b> perdries per sempre el detall de les ombres o dels n\u00favols.',\n      paisajeSentence:'\ud83c\udfaf <b>En una frase:</b> com m\u00e9s ampla i repartida estigui la corba, millor \u2014 aprofites tot el que la teva c\u00e0mera pot captar.',\n      cmpLabel1:\"Forma de l'histograma\", cmp1a:\"Enganxat a l'esquerra\", cmp1b:\"Est\u00e8s\", cmp1c:\"Ample i repartit\",\n      cmpLabel2:\"El m\u00e9s important\", cmp2a:\"Les ombres i estrelles febles\", cmp2b:\"Les llums (n\u00favols i cel)\", cmp2c:\"Una mica de tot\",\n      cmpLabel3:\"El que cal evitar\", cmp3a:\"Pic gran a la dreta\", cmp3b:\"N\u00favols tots cremats\", cmp3c:\"Enganxar-se del tot a un costat\",\n      cmpLabel4:\"Si alguna cosa se satura, passa res?\", cmp4a:\"Una estrella solta: no passa res\", cmp4b:\"El propi sol: no passa res\", cmp4c:\"Millor evitar-ho als dos costats\",\n      finalTitle:'\ud83d\udccc <b>Resum f\u00e0cil</b>',\n      finalAstro:'\ud83c\udf0c <b>Astro:</b> tot a l\\'esquerra, sense tocar els negres.',\n      finalSol:'\ud83c\udf05 <b>Sol:</b> cuida els n\u00favols i el cel, el sol es pot cremar.',\n      finalPaisaje:'\ud83c\udf33 <b>Paisatge:</b> com m\u00e9s ample, millor \u2014 sense enganxar-te a cap costat.'\n    },\n    en: {\n      eyebrow:\"Quick guide\", title:\"Histogram control\",\n      sub:\"Compare the shape of your histogram with the reference one while you shoot.\",\n      infoModalTitle:\"What is the histogram?\",\n      infoModalP1:'It\\'s a graph that shows your camera: on the left are the <b style=\"color:var(--star)\">darkest</b> parts of the photo, on the right the <b style=\"color:var(--star)\">brightest</b>. The height of the curve shows how much of the photo has that tone.',\n      infoModalP2:\"There's no single \\\"perfect\\\" shape: the right shape changes depending on what you're shooting. Here are 3 reference shapes \u2014 compare them with the histogram your camera shows on screen.\",\n      introBarDark:\"\u2b05\ufe0f Dark\", introBarLight:\"Light \u27a1\ufe0f\", infoDone:\"Got it\",\n      tabAstro:\"Milky Way\", tabSol:\"Sunset\", tabPaisaje:\"Landscape\", tabComparar:\"Compare\",\n      chartRef:\"Reference shape\", chartHint:\"\ud83d\udc41\ufe0f compare it with your camera\",\n      zoneLabels:[\"Dark\",\"Shadow\",\"Mid\",\"Light\",\"Very light\"],\n      legendGood:\"Good zone\", legendBad:\"Avoid piling up here\",\n      astroGood:'<b>Almost all of your photo should be here:</b> the dark sky and the faint stars of the Milky Way.',\n      astroMid:'<b>It\\'s fine to have a bit here:</b> some Milky Way structure and slightly brighter stars.',\n      astroBad:'<b>Avoid a big pile-up here:</b> if the right side has a large spike, the sky loses its natural night-time look.',\n      astroSentence:'\ud83c\udfaf <b>In one line:</b> the curve hugging the left, without quite touching the edge.',\n      solGood:'<b>Almost all of your photo should be here:</b> the sky and landscape lit by the sunset light.',\n      solMid:'<b>It\\'s fine to have a bit here:</b> the shadow areas (silhouettes) and the sun itself, very bright.',\n      solBad:'<b>Avoid a big pile-up here:</b> if the clouds all bunch up at the right edge, you lose their colour and shape for good.',\n      solSentence:'\ud83c\udfaf <b>In one line:</b> protect the sky and the clouds \u2014 it\\'s fine if the sun itself blows out a little.',\n      paisajeGood:'<b>Your photo should spread across almost the whole graph:</b> shadows, midtones and highlights, all with some information.',\n      paisajeMid:'<b>It\\'s fine to have a little at each end:</b> a touch of pure black and pure white is normal.',\n      paisajeBad:'<b>Avoid it sticking fully to one end:</b> you\\'d lose shadow or cloud detail for good.',\n      paisajeSentence:'\ud83c\udfaf <b>In one line:</b> the wider and more spread out the curve, the better \u2014 you\\'re using all your camera can capture.',\n      cmpLabel1:\"Histogram shape\", cmp1a:\"Hugging the left\", cmp1b:\"Spread out\", cmp1c:\"Wide and spread out\",\n      cmpLabel2:\"What matters most\", cmp2a:\"The shadows and faint stars\", cmp2b:\"The highlights (clouds and sky)\", cmp2c:\"A bit of everything\",\n      cmpLabel3:\"What to avoid\", cmp3a:\"Big spike on the right\", cmp3b:\"Fully blown-out clouds\", cmp3c:\"Sticking fully to one side\",\n      cmpLabel4:\"If something clips, does it matter?\", cmp4a:\"One stray star: no problem\", cmp4b:\"The sun itself: no problem\", cmp4c:\"Better to avoid on both sides\",\n      finalTitle:'\ud83d\udccc <b>Quick summary</b>',\n      finalAstro:'\ud83c\udf0c <b>Milky Way:</b> everything to the left, without touching the blacks.',\n      finalSol:'\ud83c\udf05 <b>Sunset:</b> protect the clouds and sky, the sun can blow out.',\n      finalPaisaje:'\ud83c\udf33 <b>Landscape:</b> the wider the better \u2014 don\\'t stick to either side.'\n    }\n  };\n  function t(key){ return (I18N[kitLang] && I18N[kitLang][key]) || I18N.es[key] || key; }\n\n  function applyI18nStatic(){\n    document.title = t(\"title\");\n    document.getElementById(\"eyebrowText\").textContent = t(\"eyebrow\");\n    document.getElementById(\"titleText\").textContent = t(\"title\");\n    document.getElementById(\"subText\").textContent = t(\"sub\");\n    document.getElementById(\"infoModalTitle\").textContent = t(\"infoModalTitle\");\n    document.getElementById(\"infoModalP1\").innerHTML = t(\"infoModalP1\");\n    document.getElementById(\"infoModalP2\").textContent = t(\"infoModalP2\");\n    document.getElementById(\"introBarDark\").textContent = t(\"introBarDark\");\n    document.getElementById(\"introBarLight\").textContent = t(\"introBarLight\");\n    document.getElementById(\"infoDoneBtn\").textContent = t(\"infoDone\");\n    document.getElementById(\"tabAstro\").textContent = t(\"tabAstro\");\n    document.getElementById(\"tabSol\").textContent = t(\"tabSol\");\n    document.getElementById(\"tabPaisaje\").textContent = t(\"tabPaisaje\");\n    document.getElementById(\"tabComparar\").textContent = t(\"tabComparar\");\n    document.querySelectorAll(\".chart-ref-text\").forEach(function(el){ el.textContent = t(\"chartRef\"); });\n    document.querySelectorAll(\".chart-hint-text\").forEach(function(el){ el.textContent = t(\"chartHint\"); });\n    document.querySelectorAll(\".zone-labels-row\").forEach(function(row){\n      const spans = row.querySelectorAll(\"span\");\n      t(\"zoneLabels\").forEach(function(txt, i){ if(spans[i]) spans[i].textContent = txt; });\n    });\n    document.querySelectorAll(\".legend-good-text\").forEach(function(el){ el.textContent = t(\"legendGood\"); });\n    document.querySelectorAll(\".legend-bad-text\").forEach(function(el){ el.textContent = t(\"legendBad\"); });\n    [\"astroGood\",\"astroMid\",\"astroBad\",\"astroSentence\",\"solGood\",\"solMid\",\"solBad\",\"solSentence\",\n     \"paisajeGood\",\"paisajeMid\",\"paisajeBad\",\"paisajeSentence\"].forEach(function(id){\n      document.getElementById(id).innerHTML = t(id);\n    });\n    [\"cmpLabel1\",\"cmp1a\",\"cmp1b\",\"cmp1c\",\"cmpLabel2\",\"cmp2a\",\"cmp2b\",\"cmp2c\",\n     \"cmpLabel3\",\"cmp3a\",\"cmp3b\",\"cmp3c\",\"cmpLabel4\",\"cmp4a\",\"cmp4b\",\"cmp4c\"].forEach(function(id){\n      document.getElementById(id).textContent = t(id);\n    });\n    [\"finalTitle\",\"finalAstro\",\"finalSol\",\"finalPaisaje\"].forEach(function(id){\n      document.getElementById(id).innerHTML = t(id);\n    });\n  }\n  applyI18nStatic();\n\n  function openInfoModal(){ document.getElementById(\"infoModal\").classList.add(\"open\"); }\n  function closeInfoModal(){ document.getElementById(\"infoModal\").classList.remove(\"open\"); }\n  document.getElementById(\"infoBtn\").addEventListener(\"click\", openInfoModal);\n  document.getElementById(\"infoCloseBtn\").addEventListener(\"click\", closeInfoModal);\n  document.getElementById(\"infoDoneBtn\").addEventListener(\"click\", closeInfoModal);\n  document.getElementById(\"infoModal\").addEventListener(\"click\", function(e){\n    if (e.target.id === \"infoModal\") closeInfoModal();\n  });\n\n  document.getElementById(\"tabs\").addEventListener(\"click\", function(e){\n    var btn = e.target.closest(\".tab\");\n    if(!btn) return;\n    var key = btn.getAttribute(\"data-tab\");\n    document.querySelectorAll(\".tab\").forEach(function(b){ b.classList.toggle(\"active\", b === btn); });\n    document.querySelectorAll(\".panel\").forEach(function(p){ p.classList.toggle(\"active\", p.id === \"panel-\" + key); });\n  });\n})();\n<\/script>\n</body>\n</html>\n" },
  cielo:      { label: 'Horarios del cielo',                 html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Horarios del cielo</title>\n<style>\n  :root{\n    --void:#060a16;\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --line:#22305c;\n    --star:#f2efe4;\n    --dim:#8993b8;\n    --brass:#d9a05c;\n    --brass-dim:#8a6a3e;\n    --nebula:#7c8fff;\n    --ok:#6fcf8f;\n    --warn:#e4894a;\n    --radius:16px;\n    --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  body.red{\n    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;\n    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20;\n    --nebula:#ff6b6b; --ok:#ff9d6b; --warn:#ff9d6b;\n  }\n  body.zoom-mode{ zoom:1.25; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--void); color:var(--star); font-family:var(--sans);\n    -webkit-font-smoothing:antialiased; min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--sans);margin:0;}\n  button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent;}\n  input{font-family:var(--sans);}\n\n  .app{max-width:720px;margin:0 auto;}\n\n  header{\n    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;\n    background:var(--panel);border-bottom:1px solid var(--line);\n  }\n  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;}\n  .header-text{min-width:0;}\n  .eyebrow{color:var(--brass);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  header h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;}\n  header .sub{color:var(--dim);font-size:13px;line-height:1.5;margin:10px 0 0;}\n  .icon-row{display:flex;gap:8px;flex:none;}\n  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--star);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;}\n\n  main{padding:16px 16px 48px;}\n\n  .controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;overflow:hidden;}\n  .controls-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}\n  .field-mini{flex:1;min-width:110px;}\n  .field-mini label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}\n  .field-mini{width:100%;}\n  .field-mini input{width:100%;max-width:100%;box-sizing:border-box;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--star);font-size:14px;}\n\n  .date-field-wrap{position:relative;width:100%;}\n  .date-display-btn{\n    width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;\n    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;\n    color:var(--star);font-size:14px;font-family:var(--sans);text-align:left;\n  }\n  .date-cal-icon{flex:none;font-size:15px;opacity:.85;}\n  .date-native-input{\n    position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;\n    cursor:pointer;\n  }\n  .field-mini input::-webkit-calendar-picker-indicator{filter:invert(0.7);}\n  .loc-btn{flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--brass);font-size:13px;font-weight:700;white-space:nowrap;}\n  .loc-status{font-size:11.5px;color:var(--dim);margin-top:8px;}\n\n  .side-by-side{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;align-items:stretch;margin-bottom:16px;}\n  .side-by-side .controls{margin-bottom:0;}\n  @media (max-width:360px){ .side-by-side{grid-template-columns:1fr;} }\n  .city-field{position:relative;min-width:0;}\n  .city-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:230px;overflow-y:auto;z-index:30;display:none;box-shadow:0 8px 20px rgba(0,0,0,.35);}\n  .city-dropdown.show{display:block;}\n  .city-dropdown-item{padding:10px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--star);}\n  .city-dropdown-item:last-child{border-bottom:none;}\n  .city-dropdown-item:active{background:var(--panel);}\n  .city-dropdown-item .cd-sub{font-size:11px;color:var(--dim);margin-top:1px;}\n\n  .timeline-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}\n  .timeline-title{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}\n  .timeline-track{position:relative;height:54px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}\n  .timeline-track svg{display:block;width:100%;height:100%;}\n  .timeline-markers{position:relative;height:30px;margin-top:2px;}\n  .tl-marker{position:absolute;top:0;transform:translateX(-50%);font-size:15px;line-height:1;}\n  .timeline-hours{position:relative;height:16px;margin-top:2px;}\n  .tl-hour{position:absolute;top:0;transform:translateX(-50%);font-size:9.5px;color:var(--dim);}\n  .legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}\n  .legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);}\n  .legend-dot{width:9px;height:9px;border-radius:3px;flex:none;}\n\n  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}\n  .info-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;}\n  .info-card .ic-label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:5px;}\n  .info-card .ic-value{font-size:15px;font-weight:700;color:var(--star);line-height:1.4;}\n  .info-card .ic-value .sep{color:var(--dim);font-weight:400;font-size:12px;margin:0 3px;}\n  .info-card.full{grid-column:1 / -1;}\n\n  .pill-table{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;margin-bottom:12px;}\n  .pill-table-title{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 6px;}\n  .pill-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);}\n  .pill-row:first-of-type{border-top:none;}\n  .pill-icon{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden;}\n  .pill-icon.grad-civil{background:linear-gradient(90deg,#c0512f,#5b5fae,#2b3f8f);}\n  .pill-icon.grad-nautic{background:linear-gradient(90deg,#2b3f8f,#1c2a63,#12193f);}\n  .pill-icon.grad-astro{background:linear-gradient(90deg,#12193f,#0a0e26,#05070f);}\n  .pill-icon.grad-blue{background:linear-gradient(90deg,#2d6fd6,#1b3f8f);}\n  .pill-icon.grad-gold{background:linear-gradient(90deg,#e0a63c,#c9762c);}\n  .pill-icon.sun-icon{background:var(--panel-2);}\n  .pill-icon.moon-icon{background:var(--panel-2);}\n  .pill-label{font-weight:700;font-size:13px;min-width:66px;flex:none;}\n  .pill-values{flex:1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}\n  .pill-value{font-size:12.5px;color:var(--star);white-space:nowrap;}\n  .pill-value .dash{color:var(--dim);margin:0 3px;}\n  .pill-az{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--star);white-space:nowrap;}\n  .az-dot{width:17px;height:17px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#1a1200;font-weight:900;}\n  .az-dot.rise{background:#f0c750;}\n  .az-dot.set{background:#e0692f;}\n  .az-dot.moonrise{background:#7bc3ea;}\n  .az-dot.moonset{background:#3d5fd6;}\n\n  .moon-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}\n  .moon-card svg{flex:none;}\n  .moon-info{flex:1;min-width:0;}\n  .moon-info .mi-name{font-size:16px;font-weight:700;margin-bottom:4px;}\n  .moon-info .mi-pct{font-size:13px;color:var(--brass);font-weight:700;margin-bottom:4px;}\n  .moon-info .mi-age{font-size:12px;color:var(--dim);}\n\n  .gc-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--dim);line-height:1.5;background:var(--panel-2);border-radius:12px;padding:11px 13px;margin-bottom:6px;}\n\n  .moon-night-card{display:flex; flex-direction:column; align-items:flex-start; gap:6px; border-radius:var(--radius); padding:14px 15px; border:1.5px solid var(--line); height:100%; box-sizing:border-box;}\n  .moon-night-card.ok{background:rgba(111,207,143,.12); border-color:var(--ok);}\n  .moon-night-card.warn{background:rgba(228,137,74,.12); border-color:var(--warn);}\n  .moon-night-card .mn-icon{font-size:26px; flex:none; line-height:1;}\n  .moon-night-card .mn-title{font-size:15.5px; font-weight:700; line-height:1.3;}\n  .moon-night-card .mn-sub{font-size:13px; color:var(--dim); line-height:1.4;}\n  .moon-night-card.ok .mn-title{color:var(--ok);}\n  .moon-night-card.warn .mn-title{color:var(--warn);}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n  <header>\n    <div class=\"topline\">\n      <div class=\"header-text\">\n        <p class=\"eyebrow\" id=\"eyebrowText\">Gu\u00eda visual</p>\n        <h1 id=\"titleText\">Horarios del cielo</h1>\n      </div>\n      <div class=\"icon-row\">\n        <button class=\"icon-btn\" id=\"infoBtn\" title=\"C\u00f3mo se calcula\">\u2139\ufe0f</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"subText\">Centro gal\u00e1ctico, crep\u00fasculos, sol, luna y fase lunar para tu ubicaci\u00f3n y fecha, todo en una vista.</p>\n  </header>\n\n  <div class=\"modal-overlay\" id=\"infoModal\">\n    <div class=\"modal-card\">\n      <button class=\"modal-close-x\" id=\"infoCloseBtn\">\u2715</button>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\"><span style=\"font-size:20px;\">\ud83d\udca1</span><h2 id=\"infoTitleText\" style=\"font-size:15px;font-weight:700;\">\u00bfDe d\u00f3nde salen estos datos?</h2></div>\n      <p id=\"infoP1Text\">Los horarios se calculan a partir de la posici\u00f3n real del Sol, la Luna y el centro de la V\u00eda L\u00e1ctea para la fecha y coordenadas que indiques \u2014 no son datos guardados, se calculan al momento.</p>\n      <p id=\"infoP2Text\">El centro gal\u00e1ctico se considera \"visible\" cuando est\u00e1 por encima del horizonte (0\u00b0) <b style=\"color:var(--star)\">y</b> ya ha terminado el crep\u00fasculo astron\u00f3mico (noche cerrada de verdad). Para fotografiarlo con buen resultado sueles necesitar adem\u00e1s que est\u00e9 bastante m\u00e1s alto sobre el horizonte.</p>\n      <p id=\"infoP3Text\">Escribe el nombre de tu ciudad y elige una de la lista, o pulsa el bot\u00f3n GPS para tu posici\u00f3n actual.</p>\n      <button class=\"ghost-btn\" id=\"infoDoneBtn\" style=\"width:100%;margin-top:6px;\">Entendido</button>\n    </div>\n  </div>\n\n  <main>\n    <div class=\"side-by-side\">\n      <div class=\"controls\">\n        <div class=\"field-mini\" style=\"margin-bottom:10px;\">\n          <label id=\"lblDate\">Fecha</label>\n          <div class=\"date-field-wrap\">\n            <button type=\"button\" class=\"date-display-btn\" id=\"dateDisplayBtn\">\n              <span id=\"dateDisplayText\">\u2014</span>\n              <span class=\"date-cal-icon\">\ud83d\udcc5</span>\n            </button>\n            <input type=\"date\" id=\"inDate\" class=\"date-native-input\">\n          </div>\n        </div>\n        <div class=\"controls-row\">\n          <div class=\"field-mini city-field\" style=\"flex:1;\">\n            <label id=\"lblCity\">Ciudad</label>\n            <input type=\"text\" id=\"inCity\" placeholder=\"Ej. Barcelona\" autocomplete=\"off\">\n            <div class=\"city-dropdown\" id=\"cityDropdown\"></div>\n          </div>\n          <button class=\"loc-btn\" id=\"btnLocate\">\ud83d\udccd GPS</button>\n        </div>\n        <div class=\"loc-status\" id=\"locStatus\">Escribe una ciudad o pulsa GPS para tu ubicaci\u00f3n.</div>\n      </div>\n\n      <div id=\"moonNightCard\"></div>\n    </div>\n\n    <div class=\"timeline-box\">\n      <div class=\"timeline-title\" id=\"timelineTitleText\">La noche de un vistazo</div>\n      <div class=\"timeline-track\"><svg id=\"tlSvg\" viewBox=\"0 0 720 54\" preserveAspectRatio=\"none\"></svg></div>\n      <div class=\"timeline-markers\" id=\"tlMarkers\"></div>\n      <div class=\"timeline-hours\" id=\"tlHours\"></div>\n      <div class=\"legend-row\">\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#8fc7ff;\"></span><span id=\"legendDayText\">D\u00eda</span></div>\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#e4894a;\"></span><span id=\"legendCivilText\">Crep\u00fasculo civil</span></div>\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#3d4fa0;\"></span><span id=\"legendNauticText\">N\u00e1utico</span></div>\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#1a2050;\"></span><span id=\"legendAstroText\">Astron\u00f3mico</span></div>\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#000000;border:1px solid var(--line);\"></span><span id=\"legendNightText\">Noche sin luna</span></div>\n        <div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:#2e3868;\"></span><span id=\"legendNightMoonText\">Noche con luna</span></div>\n      </div>\n    </div>\n\n    <div class=\"cards-grid\" id=\"gcCards\"></div>\n\n    <div class=\"pill-table\" id=\"twilightTable\"></div>\n    <div class=\"pill-table\" id=\"blueGoldTable\"></div>\n    <div class=\"pill-table\" id=\"sunMoonTable\"></div>\n\n    <div class=\"moon-card\">\n      <svg id=\"moonSvg\" width=\"72\" height=\"72\" viewBox=\"0 0 100 100\"></svg>\n      <div class=\"moon-info\">\n        <div class=\"mi-name\" id=\"moonName\">\u2014</div>\n        <div class=\"mi-pct\" id=\"moonPct\">\u2014</div>\n        <div class=\"mi-age\" id=\"moonAge\">\u2014</div>\n      </div>\n    </div>\n  </main>\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  /* ---------- shared kit settings ---------- */\n  try{ if (localStorage.getItem(\"kitNight_v1\") === \"on\") document.body.classList.add(\"red\"); }catch(e){}\n  try{ if (localStorage.getItem(\"kitZoom_v1\") === \"on\") document.body.classList.add(\"zoom-mode\"); }catch(e){}\n\n  /* ---------- i18n ---------- */\n  let kitLang = \"es\";\n  try{ kitLang = localStorage.getItem(\"kitLang_v1\") || \"es\"; }catch(e){}\n\n  const I18N = {\n    es: {\n      eyebrow:\"Gu\u00eda visual\", title:\"Horarios del cielo\",\n      sub:\"Centro gal\u00e1ctico, crep\u00fasculos, sol, luna y fase lunar para tu ubicaci\u00f3n y fecha, todo en una vista.\",\n      infoTitle:\"\u00bfDe d\u00f3nde salen estos datos?\",\n      infoP1:\"Los horarios se calculan a partir de la posici\u00f3n real del Sol, la Luna y el centro de la V\u00eda L\u00e1ctea para la fecha y coordenadas que indiques \u2014 no son datos guardados, se calculan al momento.\",\n      infoP2:\"El centro gal\u00e1ctico se considera \\\"visible\\\" cuando est\u00e1 por encima del horizonte (0\u00b0) <b style=\\\"color:var(--star)\\\">y</b> ya ha terminado el crep\u00fasculo astron\u00f3mico (noche cerrada de verdad). Para fotografiarlo con buen resultado sueles necesitar adem\u00e1s que est\u00e9 bastante m\u00e1s alto sobre el horizonte.\",\n      infoP3:\"Escribe el nombre de tu ciudad y elige una de la lista, o pulsa el bot\u00f3n GPS para tu posici\u00f3n actual.\",\n      infoDone:\"Entendido\",\n      lblDate:\"Fecha\", lblCity:\"Ciudad\", cityPlaceholder:\"Ej. Barcelona\", btnGps:\"\ud83d\udccd GPS\",\n      locDefault:\"Usando Madrid como referencia. Escribe tu ciudad o pulsa GPS.\",\n      locSaved:\"Ubicaci\u00f3n guardada: \", locSearching:\"Buscando tu ubicaci\u00f3n\u2026\",\n      locNoGeo:\"Tu navegador no permite geolocalizaci\u00f3n.\", locGpsFail:\"No se pudo obtener tu ubicaci\u00f3n. Prueba a escribir tu ciudad.\",\n      locGps:\"Tu ubicaci\u00f3n GPS \u2014 \",\n      noResults:\"Sin resultados\", noResultsOffline:\"Sin resultados (sin conexi\u00f3n, prueba otro nombre)\",\n      timelineTitle:\"La noche de un vistazo\",\n      legendDay:\"D\u00eda\", legendCivil:\"Crep\u00fasculo civil\", legendNautic:\"N\u00e1utico\", legendAstro:\"Astron\u00f3mico\", legendNight:\"Noche sin luna\", legendNightMoon:\"Noche con luna\",\n      gcFrom:\"\ud83c\udf0c Centro gal\u00e1ctico visible desde\", gcTo:\"\ud83c\udf0c Centro gal\u00e1ctico visible hasta\",\n      twilightTitle:\"Crep\u00fasculos\", lblCivil:\"Civil\", lblNautic:\"N\u00e1utico\", lblAstro:\"Astron\u00f3mico\",\n      blueGoldTitle:\"Hora azul y hora dorada\", lblBlue:\"H. azul\", lblGold:\"H. dorada\",\n      sunMoonTitle:\"Sol y luna\", lblSun:\"Sol\", lblMoon:\"Luna\",\n      moonNew:\"Luna nueva\", moonCrescent:\"Creciente\", moonFirstQ:\"Cuarto creciente\", moonWaxGib:\"Gibosa creciente\",\n      moonFull:\"Luna llena\", moonWanGib:\"Gibosa menguante\", moonLastQ:\"Cuarto menguante\", moonWaning:\"Menguante\",\n      illuminated:\"% iluminada\", daysSinceNew:\" d\u00edas desde la luna nueva\",\n      notVisible:\"No visible hoy\",\n      noMoonRangeTitle:\"Sin luna de {start} a {end}\", noWindowTitle:\"Con luna toda la noche cerrada\",\n      noMoonSub:\"Cielo oscuro ideal para fotografiar objetos d\u00e9biles: V\u00eda L\u00e1ctea, nebulosas, galaxias.\",\n      moonAllNightSub:\"{pct}% iluminada. Su brillo puede dificultar ver objetos d\u00e9biles. Mejor para paisaje nocturno o la propia luna.\",\n      moonUntilSub:\"Antes de esa hora hay luna (hasta las {time}, {pct}% iluminada).\",\n      moonFromSub:\"A partir de las {time} sale la luna ({pct}% iluminada) y aportar\u00e1 algo de luz.\"\n    },\n    ca: {\n      eyebrow:\"Guia visual\", title:\"Horaris del cel\",\n      sub:\"Centre gal\u00e0ctic, crepuscles, sol, lluna i fase lunar per a la teva ubicaci\u00f3 i data, tot en una vista.\",\n      infoTitle:\"D'on surten aquestes dades?\",\n      infoP1:\"Els horaris es calculen a partir de la posici\u00f3 real del Sol, la Lluna i el centre de la Via L\u00e0ctia per a la data i coordenades que indiquis \u2014 no s\u00f3n dades desades, es calculen al moment.\",\n      infoP2:\"El centre gal\u00e0ctic es considera \\\"visible\\\" quan \u00e9s per sobre de l'horitz\u00f3 (0\u00b0) <b style=\\\"color:var(--star)\\\">i</b> ja ha acabat el crepuscle astron\u00f2mic (nit tancada de veritat). Per fotografiar-lo amb bon resultat sol caldre a m\u00e9s que estigui bastant m\u00e9s alt sobre l'horitz\u00f3.\",\n      infoP3:\"Escriu el nom de la teva ciutat i tria'n una de la llista, o prem el bot\u00f3 GPS per a la teva posici\u00f3 actual.\",\n      infoDone:\"Ent\u00e8s\",\n      lblDate:\"Data\", lblCity:\"Ciutat\", cityPlaceholder:\"Ex. Barcelona\", btnGps:\"\ud83d\udccd GPS\",\n      locDefault:\"Fent servir Madrid com a refer\u00e8ncia. Escriu la teva ciutat o prem GPS.\",\n      locSaved:\"Ubicaci\u00f3 desada: \", locSearching:\"Cercant la teva ubicaci\u00f3\u2026\",\n      locNoGeo:\"El teu navegador no permet geolocalitzaci\u00f3.\", locGpsFail:\"No s'ha pogut obtenir la teva ubicaci\u00f3. Prova d'escriure la teva ciutat.\",\n      locGps:\"La teva ubicaci\u00f3 GPS \u2014 \",\n      noResults:\"Sense resultats\", noResultsOffline:\"Sense resultats (sense connexi\u00f3, prova un altre nom)\",\n      timelineTitle:\"La nit d'un cop d'ull\",\n      legendDay:\"Dia\", legendCi he galactic center is considered \\\"visible\\\" when it's above the horizon (0\u00b0) <b style=\\\"color:var(--star)\\\">and</b> astronomical twilight has already ended (true darkness). To photograph it well you'll usually also need it noticeably higher above the horizon.\",\n      infoP3:\"Type your city name and pick one from the list, or tap the GPS button for your current position.\",\n      infoDone:\"Got it\",\n      lblDate:\"Date\", lblCity:\"City\", cityPlaceholder:\"E.g. Barcelona\", btnGps:\"\ud83d\udccd GPS\",\n      locDefault:\"Using Madrid as a reference. Type your city or tap GPS.\",\n      locSaved:\"Saved location: \", locSearching:\"Finding your location\u2026\",\n      locNoGeo:\"Your browser doesn't support geolocation.\", locGpsFail:\"Couldn't get your location. Try typing your city instead.\",\n      locGps:\"Your GPS location \u2014 \",\n      noResults:\"No results\", noResultsOffline:\"No results (offline, try another name)\",\n      timelineTitle:\"Tonight at a glance\",\n      legendDay:\"Day\", legendCivil:\"Civil twilight\", legendNautic:\"Nautical\", legendAstro:\"Astronomical\", legendNight:\"No-moon night\", legendNightMoon:\"Moonlit night\",\n      gcFrom:\"\ud83c\udf0c Galactic center visible from\", gcTo:\"\ud83c\udf0c Galactic center visible until\",\n      twilightTitle:\"Twilights\", lblCivil:\"Civil\", lblNautic:\"Nautical\", lblAstro:\"Astronomical\",\n      blueGoldTitle:\"Blue hour and golden hour\", lblBlue:\"Blue h.\", lblGold:\"Golden h.\",\n      sunMoonTitle:\"Sun and moon\", lblSun:\"Sun\", lblMoon:\"Moon\",\n      moonNew:\"New moon\", moonCrescent:\"Waxing crescent\", moonFirstQ:\"First quarter\", moonWaxGib:\"Waxing gibbous\",\n      moonFull:\"Full moon\", moonWanGib:\"Waning gibbous\", moonLastQ:\"Last quarter\", moonWaning:\"Waning crescent\",\n      illuminated:\"% illuminated\", daysSinceNew:\" days since new moon\",\n      notVisible:\"Not visible today\",\n      noMoonRangeTitle:\"No moon from {start} to {end}\", noWindowTitle:\"Moon up all night\",\n      noMoonSub:\"Ideal dark sky for shooting faint targets: Milky Way, nebulae, galaxies.\",\n      moonAllNightSub:\"{pct}% illuminated. Its brightness can make faint targets harder to see. Better for night landscapes or the moon itself.\",\n      moonUntilSub:\"Before that time the moon is up (until {time}, {pct}% illuminated).\",\n      moonFromSub:\"From {time} the moon rises ({pct}% illuminated) and adds some light.\"\n    }\n  };\n  function t(key){ return (I18N[kitLang] && I18N[kitLang][key]) || I18N.es[key] || key; }\n  function tf(key, vars){\n    let s = t(key);\n    Object.keys(vars).forEach(function(k){ s = s.split('{'+k+'}').join(vars[k]); });\n    return s;\n  }\n\n  function applyI18nStatic(){\n    document.title = t(\"title\");\n    document.getElementById(\"eyebrowText\").textContent = t(\"eyebrow\");\n    document.getElementById(\"titleText\").textContent = t(\"title\");\n    document.getElementById(\"subText\").textContent = t(\"sub\");\n    document.getElementById(\"infoTitleText\").textContent = t(\"infoTitle\");\n    document.getElementById(\"infoP1Text\").textContent = t(\"infoP1\");\n    document.getElementById(\"infoP2Text\").innerHTML = t(\"infoP2\");\n    document.getElementById(\"infoP3Text\").textContent = t(\"infoP3\");\n    document.getElementById(\"infoDoneBtn\").textContent = t(\"infoDone\");\n    document.getElementById(\"lblDate\").textContent = t(\"lblDate\");\n    document.getElementById(\"lblCity\").textContent = t(\"lblCity\");\n    document.getElementById(\"inCity\").placeholder = t(\"cityPlaceholder\");\n    document.getElementById(\"btnLocate\").textContent = t(\"btnGps\");\n    document.getElementById(\"timelineTitleText\").textContent = t(\"timelineTitle\");\n    document.getElementById(\"legendDayText\").textContent = t(\"legendDay\");\n    document.getElementById(\"legendCivilText\").textContent = t(\"legendCivil\");\n    document.getElementById(\"legendNauticText\").textContent = t(\"legendNautic\");\n    document.getElementById(\"legendAstroText\").textContent = t(\"legendAstro\");\n    document.getElementById(\"legendNightText\").textContent = t(\"legendNight\");\n    document.getElementById(\"legendNightMoonText\").textContent = t(\"legendNightMoon\");\n  }\n  applyI18nStatic();\n\n  /* ---------- astronomy engine ---------- */\n  function toRad(d){ return d*Math.PI/180; }\n  function toDeg(r){ return r*180/Math.PI; }\n  function norm360(d){ d = d % 360; if(d<0) d+=360; return d; }\n\n  function julianDay(date){\n    const Y = date.getUTCFullYear();\n    let M = date.getUTCMonth()+1;\n    const D = date.getUTCDate() + (date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600)/24;\n    let y = Y, m = M;\n    if(m <= 2){ y -= 1; m += 12; }\n    const A = Math.floor(y/100);\n    const B = 2 - A + Math.floor(A/4);\n    return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + D + B - 1524.5;\n  }\n\n  function sunPosition(jd){\n    const T = (jd - 2451545.0)/36525;\n    const L0 = norm360(280.46646 + 36000.76983*T + 0.0003032*T*T);\n    const M = norm360(357.52911 + 35999.05029*T - 0.0001537*T*T);\n    const C = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(toRad(M))\n            + (0.019993 - 0.000101*T)*Math.sin(toRad(2*M))\n            + 0.000289*Math.sin(toRad(3*M));\n    const trueLong = L0 + C;\n    const omega = 125.04 - 1934.136*T;\n    const lambda = trueLong - 0.00569 - 0.00478*Math.sin(toRad(omega));\n    const epsilon0 = 23 + (26 + (21.448 - T*(46.815 + T*(0.00059 - T*0.001813)))/60)/60;\n    const epsilon = epsilon0 + 0.00256*Math.cos(toRad(omega));\n    const ra = norm360(toDeg(Math.atan2(Math.cos(toRad(epsilon))*Math.sin(toRad(lambda)), Math.cos(toRad(lambda)))));\n    const dec = toDeg(Math.asin(Math.sin(toRad(epsilon))*Math.sin(toRad(lambda))));\n    return {ra, dec, eclLon: norm360(lambda)};\n  }\n\n  function moonPosition(jd){\n    const T = (jd - 2451545.0) / 36525;\n    const Lp = norm360(218.3164477 + 481267.88123421*T - 0.0015786*T*T);\n    const D = norm360(297.8501921 + 445267.1114034*T - 0.0018819*T*T);\n    const M = norm360(357.5291092 + 35999.0502909*T - 0.0001536*T*T);\n    const Mp = norm360(134.9633964 + 477198.8675055*T + 0.0087414*T*T);\n    const F = norm360(93.2720950 + 483202.0175233*T - 0.0036539*T*T);\n    const Dr=toRad(D), Mr=toRad(M), Mpr=toRad(Mp), Fr=toRad(F);\n\n    let lon = Lp\n      + 6.288774*Math.sin(Mpr) + 1.274027*Math.sin(2*Dr - Mpr) + 0.658314*Math.sin(2*Dr)\n      + 0.213618*Math.sin(2*Mpr) - 0.185116*Math.sin(Mr) - 0.114332*Math.sin(2*Fr)\n      + 0.058793*Math.sin(2*Dr - 2*Mpr) + 0.057066*Math.sin(2*Dr - Mr - Mpr) + 0.053322*Math.sin(2*Dr + Mpr)\n      + 0.045758*Math.sin(2*Dr - Mr) - 0.040923*Math.sin(Mr - Mpr) - 0.034720*Math.sin(Dr)\n      - 0.030383*Math.sin(Mr + Mpr) + 0.015327*Math.sin(2*Dr - 2*Fr) - 0.012528*Math.sin(Mpr + 2*Fr)\n      + 0.010980*Math.sin(Mpr - 2*Fr) + 0.010675*Math.sin(4*Dr - Mpr) + 0.010034*Math.sin(3*Mpr)\n      + 0.008548*Math.sin(4*Dr - 2*Mpr);\n\n    let lat =\n        5.128122*Math.sin(Fr) + 0.280602*Math.sin(Mpr + Fr) + 0.277693*Math.sin(Mpr - Fr)\n      + 0.173237*Math.sin(2*Dr - Fr) + 0.055413*Math.sin(2*Dr - Mpr + Fr) + 0.046271*Math.sin(2*Dr - Mpr - Fr)\n      + 0.032573*Math.sin(2*Dr + Fr) + 0.017198*Math.sin(2*Mpr + Fr) + 0.009266*Math.sin(2*Dr + Mpr - Fr)\n      + 0.008822*Math.sin(2*Mpr - Fr);\n\n    lon = norm360(lon);\n    const epsilon = toRad(23.4392911 - 0.0130042*T);\n    const lonR = toRad(lon), latR = toRad(lat);\n    const ra = norm360(toDeg(Math.atan2(Math.sin(lonR)*Math.cos(epsilon) - Math.tan(latR)*Math.sin(epsilon), Math.cos(lonR))));\n    const dec = toDeg(Math.asin(Math.sin(latR)*Math.cos(epsilon) + Math.cos(latR)*Math.sin(epsilon)*Math.sin(lonR)));\n    return {ra, dec, eclLon: lon};\n  }\n\n  function greenwichSiderealTime(jd){\n    const T = (jd - 2451545.0) / 36525;\n    let gst = 280.46061837 + 360.98564736629*(jd - 2451545.0) + 0.000387933*T*T - T*T*T/38710000;\n    return norm360(gst);\n  }\n\n  function altitudeAt(raDeg, decDeg, jd, lat, lon){\n    const gst = greenwichSiderealTime(jd);\n    const lst = norm360(gst + lon);\n    let H = lst - raDeg;\n    H = ((H+180) % 360 + 360) % 360 - 180;\n    const Hr = toRad(H);\n    const latR = toRad(lat), decR = toRad(decDeg);\n    const alt = Math.asin(Math.sin(latR)*Math.sin(decR) + Math.cos(latR)*Math.cos(decR)*Math.cos(Hr));\n    return toDeg(alt);\n  }\n\n  function azimuthAt(raDeg, decDeg, jd, lat, lon){\n    const gst = greenwichSiderealTime(jd);\n    const lst = norm360(gst + lon);\n    let H = lst - raDeg;\n    H = ((H+180) % 360 + 360) % 360 - 180;\n    const Hr = toRad(H);\n    const latR = toRad(lat), decR = toRad(decDeg);\n    const azY = Math.sin(Hr);\n    const azX = Math.cos(Hr)*Math.sin(latR) - Math.tan(decR)*Math.cos(latR);\n    return norm360(toDeg(Math.atan2(azY, azX)) + 180);\n  }\n\n  const GC_RA = 266.417, GC_DEC = -29.008;\n\n  // find rise/set crossings within [start, start+24h]; getRaDec(jd) => {ra,dec}\n  function findCrossingsGeneric(signalFn, startDate, stepMin){\n    stepMin = stepMin || 8;\n    let prevAlt = null, prevJd = null;\n    const events = [];\n    for(let m=0; m<=24*60; m+=stepMin){\n      const t = new Date(startDate.getTime() + m*60000);\n      const jd = julianDay(t);\n      const alt = signalFn(jd);\n      if(prevAlt !== null && Math.sign(alt) !== Math.sign(prevAlt) && alt !== 0 && prevAlt !== 0){\n        let loJd=prevJd, hiJd=jd, loA=prevAlt;\n        for(let i=0;i<25;i++){\n          const midJd = (loJd+hiJd)/2;\n          const midA = signalFn(midJd);\n          if(Math.sign(midA) === Math.sign(loA)){ loJd=midJd; loA=midA; } else { hiJd=midJd; }\n        }\n        const crossJd = (loJd+hiJd)/2;\n        const crossMs = startDate.getTime() + (crossJd - julianDay(startDate))*86400000;\n        events.push({type: prevAlt<0?'rise':'set', time: new Date(crossMs)});\n      }\n      prevAlt = alt; prevJd = jd;\n    }\n    return events;\n  }\n\n  function findCrossings(getRaDec, startDate, lat, lon, threshold){\n    return findCrossingsGeneric(function(jd){\n      const rd = getRaDec(jd);\n      return altitudeAt(rd.ra, rd.dec, jd, lat, lon) - threshold;\n    }, startDate);\n  }\n\n  // GC \"practically visible\" = above horizon AND sky astronomically dark (matches how astrophoto apps define it)\n  function findGcVisibility(startDate, lat, lon){\n    return findCrossingsGeneric(function(jd){\n      const gcAlt = altitudeAt(GC_RA, GC_DEC, jd, lat, lon);\n      const sun = sunPosition(jd);\n      const sunAlt = altitudeAt(sun.ra, sun.dec, jd, lat, lon);\n      return Math.min(gcAlt, -18 - sunAlt);\n    }, startDate);\n  }\n\n  // How much of astronomical night has the moon below the horizon (best for deep-sky astrophotography)\n  function computeMoonlessWindow(astroDusk, astroDawn, lat, lon){\n    if(!astroDusk || !astroDawn) return null;\n    const stepMin = 5;\n    let darkNoMoonMin = 0, totalMin = 0;\n    const t0 = astroDusk.getTime(), t1 = astroDawn.getTime();\n    if(t1 <= t0) return null;\n    for(let ms = t0; ms < t1; ms += stepMin*60000){\n      const d = new Date(ms);\n      const jd = julianDay(d);\n      const mp = moonPosition(jd);\n      const alt = altitudeAt(mp.ra, mp.dec, jd, lat, lon);\n      totalMin += stepMin;\n      if(alt <= 0) darkNoMoonMin += stepMin;\n    }\n    // find the moon transition (rise/set) closest to the astro-night window, if any\n    const transition = findCrossingsGeneric(function(jd){\n      const mp = moonPosition(jd);\n      return altitudeAt(mp.ra, mp.dec, jd, lat, lon) - (-0.583);\n    }, new Date(t0 - 6*3600000)).find(function(e){ return e.time.getTime() > t0 && e.time.getTime() < t1; });\n    return {darkNoMoonMin, totalMin, moonUpMin: totalMin - darkNoMoonMin, transition};\n  }\n\n  function altitudeSamples(getRaDec, startDate, lat, lon, stepMin){\n    const out = [];\n    for(let m=0; m<=24*60; m+=stepMin){\n      const t = new Date(startDate.getTime() + m*60000);\n      const jd = julianDay(t);\n      const rd = getRaDec(jd);\n      out.push(altitudeAt(rd.ra, rd.dec, jd, lat, lon));\n    }\n    return out;\n  }\n\n  /* ---------- helpers ---------- */\n  function fmtTime(d){\n    if(!d) return \"\u2014\";\n    return d.toLocaleTimeString(\"es-ES\", {hour:\"2-digit\", minute:\"2-digit\"});\n  }\n  function firstOfType(events, type){\n    const f = events.filter(e => e.type === type);\n    return f.length ? f[0].time : null;\n  }\n\n  /* ---------- moon phase svg ---------- */\n  function moonPhaseSvgMarkup(phaseAngleDeg, r){\n    r = r || 44;\n    const cx = 50, cy = 50;\n    const codeAngle = norm360(180 - phaseAngleDeg);\n    const theta = toRad(codeAngle);\n    const rx = Math.abs(r * Math.cos(theta));\n    const sweepOuter = codeAngle < 180 ? 1 : 0;\n    const sweepInner = codeAngle < 90 ? 1 : (codeAngle < 180 ? 0 : (codeAngle < 270 ? 1 : 0));\n    const d = `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${sweepOuter} ${cx} ${cy+r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy-r} Z`;\n    return `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"#232838\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n            <path d=\"${d}\" fill=\"#f2e8c9\"/>\n            <circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/>`;\n  }\n\n  function moonPhaseName(phaseAngleDeg){\n    if(phaseAngleDeg < 10 || phaseAngleDeg >= 350) return t(\"moonNew\");\n    if(phaseAngleDeg < 80) return t(\"moonCrescent\");\n    if(phaseAngleDeg < 100) return t(\"moonFirstQ\");\n    if(phaseAngleDeg < 170) return t(\"moonWaxGib\");\n    if(phaseAngleDeg < 190) return t(\"moonFull\");\n    if(phaseAngleDeg < 260) return t(\"moonWanGib\");\n    if(phaseAngleDeg < 280) return t(\"moonLastQ\");\n    return t(\"moonWaning\");\n  }\n\n  /* ---------- main compute + render ---------- */\n  function computeAndRender(){\n    const dateStr = document.getElementById(\"inDate\").value;\n    const lat = currentLat, lon = currentLon;\n    if(!dateStr || lat === null || lon === null || isNaN(lat) || isNaN(lon)) return;\n\n    const [Y,M,D] = dateStr.split(\"-\").map(Number);\n    // window: local noon of selected date -> local noon next day, approximated in UTC using a fixed offset guess (device local offset)\n    const localOffsetMin = -(new Date(Y, M-1, D, 12, 0, 0)).getTimezoneOffset();\n    const startLocalNoon = new Date(Date.UTC(Y, M-1, D, 12, 0, 0) - localOffsetMin*60000);\n\n    const sunEvents = findCrossings((jd)=>sunPosition(jd), startLocalNoon, lat, lon, -0.833);\n    const civilEvents = findCrossings((jd)=>sunPosition(jd), startLocalNoon, lat, lon, -6);\n    const nauticalEvents = findCrossings((jd)=>sunPosition(jd), startLocalNoon, lat, lon, -12);\n    const astroEvents = findCrossings((jd)=>sunPosition(jd), startLocalNoon, lat, lon, -18);\n    const moonEvents = findCrossings((jd)=>moonPosition(jd), startLocalNoon, lat, lon, -0.583);\n    const gcEvents = findGcVisibility(startLocalNoon, lat, lon);\n    const blueEvents = findCrossingsGeneric(function(jd){\n      const sp = sunPosition(jd);\n      const alt = altitudeAt(sp.ra, sp.dec, jd, lat, lon);\n      return Math.min(alt-(-6), -4-alt);\n    }, startLocalNoon);\n    const goldenEvents = findCrossingsGeneric(function(jd){\n      const sp = sunPosition(jd);\n      const alt = altitudeAt(sp.ra, sp.dec, jd, lat, lon);\n      return Math.min(alt-(-4), 6-alt);\n    }, startLocalNoon);\n\n    const sunset = firstOfType(sunEvents, \"set\");\n    const sunrise = firstOfType(sunEvents.slice().reverse(), \"rise\") || firstOfType(sunEvents,\"rise\");\n    const civilDusk = firstOfType(civilEvents, \"set\");\n    const civilDawn = civilEvents.filter(e=>e.type===\"rise\").pop() ? civilEvents.filter(e=>e.type===\"rise\").pop().time : null;\n    const nauticalDusk = firstOfType(nauticalEvents, \"set\");\n    const nauticalDawn = nauticalEvents.filter(e=>e.type===\"rise\").pop() ? nauticalEvents.filter(e=>e.type===\"rise\").pop().time : null;\n    const astroDusk = firstOfType(astroEvents, \"set\");\n    const astroDawn = astroEvents.filter(e=>e.type===\"rise\").pop() ? astroEvents.filter(e=>e.type===\"rise\").pop().time : null;\n    const moonRise = firstOfType(moonEvents, \"rise\");\n    const moonSet = firstOfType(moonEvents, \"set\");\n    const gcRise = firstOfType(gcEvents, \"rise\");\n    const gcSet = firstOfType(gcEvents, \"set\");\n\n    function splitEveningMorning(events){\n      const mid = new Date(startLocalNoon.getTime() + 12*3600000);\n      return {\n        evening: events.filter(function(e){ return e.time < mid; }),\n        morning: events.filter(function(e){ return e.time >= mid; })\n      };\n    }\n    function pairRiseSet(list){\n      const rise = list.filter(function(e){ return e.type===\"rise\"; })[0];\n      const set = list.filter(function(e){ return e.type===\"set\"; })[0];\n      return {rise: rise?rise.time:null, set: set?set.time:null};\n    }\n    const blueSplit = splitEveningMorning(blueEvents);\n    const blueMorning = pairRiseSet(blueSplit.morning);\n    const blueEvening = pairRiseSet(blueSplit.evening);\n    const goldenSplit = splitEveningMorning(goldenEvents);\n    const goldenMorning = pairRiseSet(goldenSplit.morning);\n    const goldenEvening = pairRiseSet(goldenSplit.evening);\n\n  function azAt(getRaDec, time){\n      if(!time) return null;\n      const jd = julianDay(time);\n      const rd = getRaDec(jd);\n      return azimuthAt(rd.ra, rd.dec, jd, lat, lon);\n    }\n    const sunsetAz = azAt((jd)=>sunPosition(jd), sunset);\n    const sunriseAz = azAt((jd)=>sunPosition(jd), sunrise);\n    const moonRiseAz = azAt((jd)=>moonPosition(jd), moonRise);\n    const moonSetAz = azAt((jd)=>moonPosition(jd), moonSet);\n\n    // moon phase (at local midnight-ish of the selected night, i.e. start+12h)\n    const midDate = new Date(startLocalNoon.getTime() + 12*3600000);\n    const jdMid = julianDay(midDate);\n    const sunP = sunPosition(jdMid), moonP = moonPosition(jdMid);\n    const phaseAngle = norm360(moonP.eclLon - sunP.eclLon);\n    const illum = (1-Math.cos(toRad(phaseAngle)))/2;\n    const moonAgeDays = phaseAngle/360*29.53;\n\n    // ---- moon presence during astronomical night (key for deep-sky planning) ----\n    function moonDuringNight(){\n      if(!astroDusk || !astroDawn) return {status:'unknown'};\n      const jdDusk = julianDay(astroDusk);\n      const mpDusk = moonPosition(jdDusk);\n      const duskAlt = altitudeAt(mpDusk.ra, mpDusk.dec, jdDusk, lat, lon);\n      const startUp = duskAlt > -0.583;\n      const within = moonEvents.filter(function(e){ return e.time > astroDusk && e.time < astroDawn; }).sort(function(a,b){ return a.time - b.time; });\n      if(within.length === 0) return { status: startUp ? 'all' : 'none' };\n      const ev = within[0];\n      if(ev.type === 'set') return { status:'untilThen', time: ev.time };\n      return { status:'fromThen', time: ev.time };\n    }\n    const moonNight = moonDuringNight();\n    const illumPct = Math.round(illum*100);\n    let moonNightHtml = '';\n    if(moonNight.status === 'none'){\n      moonNightHtml = '<div class=\"moon-night-card ok\"><span class=\"mn-icon\">\ud83c\udf11</span><div><div class=\"mn-title\">'+tf('noMoonRangeTitle',{start:fmtTime(astroDusk),end:fmtTime(astroDawn)})+'</div><div class=\"mn-sub\">'+t('noMoonSub')+'</div></div></div>';\n    } else if(moonNight.status === 'all'){\n      moonNightHtml = '<div class=\"moon-night-card warn\"><span class=\"mn-icon\">\ud83c\udf15</span><div><div class=\"mn-title\">'+t('noWindowTitle')+'</div><div class=\"mn-sub\">'+tf('moonAllNightSub',{pct:illumPct})+'</div></div></div>';\n    } else if(moonNight.status === 'untilThen'){\n      moonNightHtml = '<div class=\"moon-night-card warn\"><span class=\"mn-icon\">\ud83c\udf17</span><div><div class=\"mn-title\">'+tf('noMoonRangeTitle',{start:fmtTime(moonNight.time),end:fmtTime(astroDawn)})+'</div><div class=\"mn-sub\">'+tf('moonUntilSub',{time:fmtTime
