    descHintText: 'Write even a quick idea and tap \u201cImprove with AI\u201d to turn it into a ready caption, in the language chosen above.',\n      aiErrorEmpty: 'Write an idea or draft of the description first.',\n      aiErrorFail: 'Could not process the text right now. Please try again in a few seconds.',\n      undo: 'Undo AI improvement',\n      regenerate: '\ud83d\udd01 Generate another version',\n      generating: 'Generating\u2026',\n      translating: 'Translating\u2026',\n      secTitleCamaras: 'Cameras',\n      secTitleObjetivos: 'Lenses',\n      secTitleTripode: 'Tripod and accessories',\n      secTitleFiltros: 'Filters',\n      secTitleVarios: 'Other',\n      descShort: 'Description',\n      hashtagShort: 'Hashtags',\n      addItem: 'Add item',\n      equipoNoteText: '\ud83d\udcf7 This list is your real My Gear stock. To add or remove something, tap here to open My Gear.',\n      addPlaceholder: 'Item text (e.g. UV filter @brand)',\n      add: 'Add',\n      cancel: 'Cancel',\n      save: 'Save',\n      editNote: 'Once saved, this text will be used the same in all three languages.',\n      hashtagLabelText: '\ud83c\udff7\ufe0f Hashtags',\n      hashtagHint: 'Feel free to edit these. Tapping the button below will generate the final text.',\n      hashtagPresetsLabel: 'Tap to load example hashtags, or the \u270e to set your own',\n      editPresetPrompt: 'Type your hashtags for this group (space-separated):',\n      presetVialacteaLabel: 'Milky Way', presetPaisajeLabel: 'Night landscape', presetLunaLabel: 'Moon', presetGeneralLabel: 'My Hashtags', presetAtardecerLabel: 'Sunset',\n      previewTitleText: 'Preview',\n      previewScreenTitle: 'Preview',\n      copy: 'Copy',\n      copied: 'Copied \u2713',\n      outputPlaceholder: 'The final, ready-to-copy text will appear here\u2026',\n      next: 'Next',\n      back: 'Back',\n      generateLabel: 'Generate preview',\n      startOver: 'Start over',\n      stepPrefix: 'Step',\n      stepMiddle: 'of',\n      loadPresetLabel: '\ud83d\udcc2 Load a saved selection',\n      savePresetLabel: '\ud83d\udcbe Save this gear selection',\n      presetNamePlaceholder: 'Name (e.g. Full moon, Milky Way\u2026)',\n      presetSave: 'Save',\n      presetCancel: 'Cancel',\n      presetUse: 'Use',\n      presetSaved: 'Selection saved successfully.',\n      presetSaveError: 'Could not save the selection.',\n      presetLoaded: 'Selection loaded.',\n      refinePlaceholder: 'Tell the AI how you want the text (e.g. shorter, more poetic\u2026)',\n      refineApply: 'Apply',\n      refineApplying: 'Applying\u2026',\n      homeLabel: '\u2190 Home',\n      homeTitle: 'What do you want to do?',\n      homeSubtitle: 'Generate the text for your next post or manage your gear.',\n      homeNewTitle: 'New post',\n      homeNewDesc: 'Write the description and pick your gear step by step',\n      homeLoadTitle: 'Load a saved selection',\n      homeLoadDesc: 'Reuse the gear from a previous session',\n      homeManageTitle: 'Manage my gear',\n      homeManageDesc: 'Open My Gear to add or remove cameras, lenses, filters\u2026',\n      loadScreenTitle: 'Load a saved selection',\n      loadPresetEmpty: 'You don\u2019t have any saved selections yet.',\n      manageScreenTitle: 'Manage my gear',\n      backToMenu: '\u2190 Menu',\n    },\n  };\n  function t(key){ return (UI_STRINGS[state.lang] && UI_STRINGS[state.lang][key]) || UI_STRINGS.es[key] || ''; }\n\n  const GROUPS = ['camaras','objetivos','tripodes','accesorios','filtros','varios'];\n  const items = {};\n\n  function stripFns(arr){ return arr.map(it=> Object.assign({}, it)); }\n\n  function loadEquipoStock(){\n    try{\n      const raw = localStorage.getItem('equipoApp_v1');\n      if(!raw) return null;\n      const data = JSON.parse(raw);\n      return data.catalog || [];\n    }catch(e){ return null; }\n  }\n  function iconForCategory(cat){\n    const map = {camaras:'\ud83d\udcf7', objetivos:'\ud83d\udd73\ufe0f', tripode:'\ud83d\udd2d', trackers:'\ud83d\udce1', filtros:'\u26ab', accesorios:'\ud83d\udcd0', energia:'\ud83d\udd0b', iluminacion:'\ud83d\udca1', ropa:'\ud83e\udde5', mochila:'\ud83c\udf92'};\n    return map[cat] || '\u2699\ufe0f';\n  }\n  function buildMiEquipoItems(catalog, categories){\n    return catalog.filter(i => categories.includes(i.category)).map(i => ({\n      id: 'eq_' + i.id,\n      icon: iconForCategory(i.category),\n      i18n: S(i.name),\n      fromEquipo: true,\n    }));\n  }\n  const MI_EQUIPO_MAPPING = {\n    camaras: ['camaras'],\n    objetivos: ['objetivos'],\n    tripodes: ['tripode'],\n    accesorios: ['accesorios','trackers','energia','iluminacion','mochila'],\n  };\n\n  let hasEquipoCatalog = false;\n\n  async function loadItems(){\n    const catalog = loadEquipoStock();\n    hasEquipoCatalog = !!catalog;\n    for(const group of GROUPS){\n      if(catalog && MI_EQUIPO_MAPPING[group]){\n        items[group] = buildMiEquipoItems(catalog, MI_EQUIPO_MAPPING[group]);\n        continue;\n      }\n      if(catalog && group === 'filtros'){\n        items[group] = buildMiEquipoItems(catalog, ['filtros']).concat(stripFns(DEFAULTS.filtros));\n        continue;\n      }\n      try{\n        const res = await storageGet(STORAGE_PREFIX + group);\n        items[group] = (res && res.value) ? JSON.parse(res.value) : stripFns(DEFAULTS[group]);\n      }catch(e){\n        items[group] = stripFns(DEFAULTS[group]);\n      }\n    }\n  }\n  async function saveItems(group){\n    try{ await storageSet(STORAGE_PREFIX + group, JSON.stringify(items[group])); }\n    catch(e){ console.error('No se pudo guardar', group, e); }\n  }\n\n  function getTemplate(item){ return (TEMPLATE_FNS[item.id] || {})[state.lang] || null; }\n\n  const state = {\n    camaras:{}, objetivos:{}, filtros:{}, varios:{}, accesorios:{},\n    tripode:null,\n    values:{},\n    lang:'es'\n  };\n\n  function getDisplayText(item){\n    if(item.i18n){\n      const loc = item.i18n[state.lang] || item.i18n.es;\n      if(loc) return loc.text || loc.label || '';\n    }\n    return item.text || item.label || '';\n  }\n  function getSuffix(inp){\n    if(!inp.suffix) return '';\n    if(typeof inp.suffix === 'object') return inp.suffix[state.lang] || inp.suffix.es || '';\n    return inp.suffix;\n  }\n  function itemLineText(item){\n    const tpl = getTemplate(item);\n    if(tpl){\n      const v = state.values[item.id] || {};\n      return `${item.icon} ${tpl(v)}`;\n    }\n    return `${item.icon} ${getDisplayText(item)}`;\n  }\n  function escapeHtml(s){\n    const d = document.createElement('div');\n    d.textContent = s;\n    return d.innerHTML;\n  }\n  function displayHtml(item){\n    const esc = escapeHtml(getDisplayText(item));\n    return esc.replace(/@[\\w.]+/g, m=>`<span class=\"item-account\">${m}</span>`);\n  }\n  function svgTrash(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6\"/></svg>'; }\n  function svgEdit(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/></svg>'; }\n  function svgPlus(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>'; }\n\n  const GROUP_INPUT_TYPE = { camaras:'checkbox', objetivos:'checkbox', tripodes:'radio', accesorios:'checkbox', filtros:'checkbox', varios:'checkbox' };\n\n  function isMiEquipoGroup(group){\n    return hasEquipoCatalog && (MI_EQUIPO_MAPPING[group] || group === 'filtros');\n  }\n  function buildEquipoNote(){\n    const note = document.createElement('div');\n    note.className = 'equipo-note';\n    note.innerHTML = `<span>${escapeHtml(t('equipoNoteText'))}</span>`;\n    note.addEventListener('click', ()=>{\n      if(window.parent && typeof window.parent.openTool === 'function'){ window.parent.openTool('equipo'); }\n    });\n    return note;\n  }\n  function buildAddRowOrNote(group){\n    return isMiEquipoGroup(group) ? buildEquipoNote() : buildAddRow(group);\n  }\n\n  function renderGroup(group){\n    const inputType = GROUP_INPUT_TYPE[group];\n    const selContainer = document.getElementById('list-' + group);\n    if(selContainer){\n      selContainer.innerHTML = '';\n      items[group].forEach(item=>{ selContainer.appendChild(buildRow(item, group, inputType, true)); });\n      selContainer.appendChild(buildAddRowOrNote(group));\n    }\n    const mgContainer = document.getElementById('manage-' + group);\n    if(mgContainer){\n      mgContainer.innerHTML = '';\n      items[group].forEach(item=>{ mgContainer.appendChild(buildRow(item, group, inputType, false)); });\n      mgContainer.appendChild(buildAddRowOrNote(group));\n    }\n  }\n  function renderAll(){\n    GROUPS.forEach(g=> renderGroup(g));\n  }\n\n  function buildRow(item, group, inputType, selectable){\n    const row = document.createElement('div');\n    row.className = 'item-row';\n\n    let input = null;\n    if(selectable){\n      input = document.createElement('input');\n      input.type = inputType;\n      if(inputType === 'radio'){ input.name = 'tripode'; }\n      input.checked = inputType === 'checkbox' ? !!state[group][item.id] : state.tripode === item.id;\n    }\n\n    const labelWrap = document.createElement('div');\n    labelWrap.className = 'item-label';\n\n    const textSpan = document.createElement('span');\n    textSpan.className = 'item-text';\n    textSpan.innerHTML = `<span class=\"item-icon\">${item.icon}</span>${displayHtml(item)}`;\n    if(selectable){\n      textSpan.addEventListener('click', ()=>{\n        if(inputType === 'radio'){ input.checked = true; } else { input.checked = !input.checked; }\n        input.dispatchEvent(new Event('change'));\n      });\n    } else {\n      textSpan.style.cursor = 'default';\n    }\n    labelWrap.appendChild(textSpan);\n\n    let inputsWrap = null;\n    const tpl = getTemplate(item);\n    if(selectable && tpl && item.inputs){\n      inputsWrap = document.createElement('div');\n      inputsWrap.className = 'item-inputs';\n      if(state[group][item.id] || (inputType==='radio' && state.tripode===item.id)) inputsWrap.classList.add('active');\n      item.inputs.forEach(inp=>{\n        const fld = document.createElement('input');\n        fld.type = 'text';\n        fld.placeholder = inp.placeholder;\n        fld.inputMode = 'decimal';\n        const saved = (state.values[item.id] || {})[inp.key];\n        if(saved) fld.value = saved;\n        fld.addEventListener('input', ()=>{\n          if(!state.values[item.id]) state.values[item.id] = {};\n          state.values[item.id][inp.key] = fld.value.trim();\n        });\n        inputsWrap.appendChild(fld);\n        const sfx = getSuffix(inp);\n        if(sfx){\n          const suf = document.createElement('span');\n          suf.className = 'input-suffix';\n          suf.textContent = sfx;\n          inputsWrap.appendChild(suf);\n        }\n      });\n      labelWrap.appendChild(inputsWrap);\n    }\n\n    let editForm = null;\n    if(!item.system && !item.fromEquipo){\n      editForm = document.createElement('div');\n      editForm.className = 'edit-form';\n      const iconInput = document.createElement('input');\n      iconInput.className = 'edit-icon';\n      iconInput.type = 'text';\n      iconInput.value = item.icon;\n      iconInput.maxLength = 4;\n      const textInput = document.createElement('input');\n      textInput.className = 'edit-text';\n      textInput.type = 'text';\n      textInput.value = getDisplayText(item);\n      const note = document.createElement('div');\n      note.className = 'edit-note';\n      note.textContent = item.i18n ? t('editNote') : '';\n      const btnRow = document.createElement('div');\n      btnRow.className = 'edit-form-btns';\n      const saveBtn = document.createElement('button');\n      saveBtn.className = 'mini-btn save';\n      saveBtn.type = 'button';\n      saveBtn.textContent = t('save');\n      const cancelBtn = document.createElement('button');\n      cancelBtn.className = 'mini-btn cancel';\n      cancelBtn.type = 'button';\n      cancelBtn.textContent = t('cancel');\n      btnRow.appendChild(saveBtn);\n      btnRow.appendChild(cancelBtn);\n      editForm.appendChild(iconInput);\n      editForm.appendChild(textInput);\n      if(note.textContent) editForm.appendChild(note);\n      editForm.appendChild(btnRow);\n      labelWrap.appendChild(editForm);\n\n      saveBtn.addEventListener('click', ()=>{\n        item.icon = iconInput.value.trim() || item.icon;\n        item.text = textInput.value.trim() || getDisplayText(item);\n        delete item.i18n;\n        saveItems(group);\n        editForm.classList.remove('active');\n        renderGroup(group);\n      });\n      cancelBtn.addEventListener('click', ()=>{\n        iconInput.value = item.icon;\n        textInput.value = getDisplayText(item);\n        editForm.classList.remove('active');\n      });\n    }\n\n    const actions = document.createElement('div');\n    actions.className = 'item-actions';\n    if(editForm){\n      const editBtn = document.createElement('button');\n      editBtn.className = 'icon-btn edit';\n      editBtn.type = 'button';\n      editBtn.innerHTML = svgEdit();\n      editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); editForm.classList.toggle('active'); });\n      actions.appendChild(editBtn);\n    }\n    const delBtn = document.createElement('button');\n    delBtn.className = 'icon-btn delete';\n    delBtn.type = 'button';\n    delBtn.innerHTML = svgTrash();\n    delBtn.addEventListener('click', (e)=>{\n      e.stopPropagation();\n      items[group] = items[group].filter(x=>x.id !== item.id);\n      if(inputType === 'radio' && state.tripode === item.id) state.tripode = null;\n      delete state[group][item.id];\n      delete state.values[item.id];\n      saveItems(group);\n      renderGroup(group);\n      updateCounts();\n    });\n    if(!item.fromEquipo) actions.appendChild(delBtn);\n\n    if(selectable){\n      input.addEventListener('change', ()=>{\n        if(inputType === 'checkbox'){\n          state[group][item.id] = input.checked;\n          if(inputsWrap) inputsWrap.classList.toggle('active', input.checked);\n        } else {\n          if(input.checked){ state.tripode = item.id; }\n        }\n        updateCounts();\n      });\n      row.appendChild(input);\n    }\n    row.appendChild(labelWrap);\n    row.appendChild(actions);\n    return row;\n  }\n\n  function buildAddRow(group){\n    const inputType = GROUP_INPUT_TYPE[group];\n    const wrap = document.createElement('div');\n    wrap.className = 'add-row';\n\n    const trigger = document.createElement('button');\n    trigger.type = 'button';\n    trigger.className = 'add-trigger';\n    trigger.innerHTML = svgPlus() + '<span>' + escapeHtml(t('addItem')) + '</span>';\n\n    const form = document.createElement('div');\n    form.className = 'add-form';\n    const iconInput = document.createElement('input');\n    iconInput.className = 'add-icon';\n    iconInput.type = 'text';\n    iconInput.placeholder = '\ud83d\udd27';\n    iconInput.maxLength = 4;\n    const textInput = document.createElement('input');\n    textInput.className = 'add-text';\n    textInput.type = 'text';\n    textInput.placeholder = t('addPlaceholder');\n    const btnRow = document.createElement('div');\n    btnRow.className = 'edit-form-btns';\n    const addBtn = document.createElement('button');\n    addBtn.className = 'mini-btn save';\n    addBtn.type = 'button';\n    addBtn.textContent = t('add');\n    const cancelBtn = document.createElement('button');\n    cancelBtn.className = 'mini-btn cancel';\n    cancelBtn.type = 'button';\n    cancelBtn.textContent = t('cancel');\n    btnRow.appendChild(addBtn);\n    btnRow.appendChild(cancelBtn);\n    form.appendChild(iconInput);\n    form.appendChild(textInput);\n    form.appendChild(btnRow);\n\n    trigger.addEventListener('click', ()=>{ form.classList.add('active'); trigger.style.display = 'none'; textInput.focus(); });\n    cancelBtn.addEventListener('click', ()=>{ form.classList.remove('active'); trigger.style.display = 'flex'; iconInput.value=''; textInput.value=''; });\n    addBtn.addEventListener('click', ()=>{\n      const txt = textInput.value.trim();\n      if(!txt){ textInput.focus(); return; }\n      items[group].push({ id:newId(group), icon: iconInput.value.trim() || '\u2728', text: txt });\n      saveItems(group);\n      renderGroup(group);\n      updateCounts();\n    });\n\n    wrap.appendChild(trigger);\n    wrap.appendChild(form);\n    return wrap;\n  }\n\n  function countChecked(group){ return Object.values(state[group]).filter(Boolean).length; }\n  function setCount(id, n){ const el = document.getElementById(id); el.textContent = n; el.classList.toggle('show', n>0); }\n  function updateCounts(){\n    setCount('count-camaras', countChecked('camaras'));\n    setCount('count-objetivos', countChecked('objetivos'));\n    setCount('count-tripode', (state.tripode?1:0) + countChecked('accesorios'));\n    setCount('count-filtros', countChecked('filtros'));\n    setCount('count-varios', countChecked('varios'));\n  }\n\n  function generate(){\n    const lines = [];\n    items.camaras.forEach(i=>{ if(state.camaras[i.id]) lines.push(itemLineText(i)); });\n    items.objetivos.forEach(i=>{ if(state.objetivos[i.id]) lines.push(itemLineText(i)); });\n    if(state.tripode){\n      const tItem = items.tripodes.find(x=>x.id===state.tripode);\n      if(tItem) lines.push(itemLineText(tItem));\n    }\n    items.accesorios.forEach(i=>{ if(state.accesorios[i.id]) lines.push(itemLineText(i)); });\n    items.filtros.forEach(i=>{ if(state.filtros[i.id]) lines.push(itemLineText(i)); });\n    items.varios.forEach(i=>{ if(state.varios[i.id]) lines.push(itemLineText(i)); });\n\n    const desc = document.getElementById('descInput').value.trim();\n    const hashtags = document.getElementById('hashtagInput').value.trim();\n    const sep = '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500';\n\n    const parts = [];\n    if(desc) parts.push(desc);\n    if(lines.length){ parts.push(sep); parts.push(lines.join('\\n')); }\n    if(hashtags){ if(lines.length || desc) parts.push(sep); parts.push(hashtags); }\n    return parts.join('\\n');\n  }\n\n  // ---------- Navigation (home / load presets / manage gear / wizard / preview) ----------\n  const STEP_IDS = ['desc','camaras','objetivos','tripode','filtros','varios','hashtags'];\n  const STEP_TITLE_KEYS = ['descShort','secTitleCamaras','secTitleObjetivos','secTitleTripode','secTitleFiltros','secTitleVarios','hashtagShort'];\n  let mode = 'home'; // 'home' | 'load' | 'manage' | 'wizard' | 'preview'\n  let currentStepIndex = 0;\n\n  function screenEl(id){ return document.getElementById('screen-' + id); }\n  function hideAllScreens(){ document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active')); }\n\n  function showHome(){\n    mode = 'home';\n    hideAllScreens();\n    screenEl('home').classList.add('active');\n    updateChrome();\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n  function showLoadPresets(){\n    mode = 'load';\n    hideAllScreens();\n    screenEl('loadpresets').classList.add('active');\n    refreshFullPresetList();\n    updateChrome();\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n  function showManage(){\n    mode = 'manage';\n    hideAllScreens();\n    screenEl('manage').classList.add('active');\n    updateChrome();\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n  function showStep(index){\n    index = Math.max(0, Math.min(STEP_IDS.length - 1, index));\n    mode = 'wizard';\n    currentStepIndex = index;\n    hideAllScreens();\n    screenEl(STEP_IDS[index]).classList.add('active');\n    updateChrome();\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n\n  function autoSizeOutput(){\n    const el = document.getElementById('output');\n    el.style.height = 'auto';\n    el.style.height = (el.scrollHeight + 4) + 'px';\n  }\n\n  function showPreview(){\n    mode = 'preview';\n    hideAllScreens();\n    screenEl('preview').classList.add('active');\n    document.getElementById('output').value = generate();\n    autoSizeOutput();\n    updateChrome();\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n\n  function updateChrome(){\n    document.getElementById('progressDots').style.display = (mode === 'wizard' || mode === 'preview') ? 'flex' : 'none';\n    document.getElementById('homeBtn').style.display = (mode === 'home') ? 'none' : '';\n    updateProgressUI();\n    updateFooter();\n  }\n\n  function updateProgressUI(){\n    document.querySelectorAll('.progress-dot').forEach(dot=>{\n      const idx = parseInt(dot.dataset.index, 10);\n      dot.classList.remove('current','done','preview-active');\n      if(mode === 'preview'){ dot.classList.add('done'); }\n      else if(idx === currentStepIndex && mode === 'wizard'){ dot.classList.add('current'); }\n      else if(idx < currentStepIndex && mode === 'wizard'){ dot.classList.add('done'); }\n    });\n  }\n\n  function updateStepLabels(){\n    STEP_IDS.forEach((id, i)=>{\n      const el = document.getElementById('stepLabel-' + i);\n      if(el) el.textContent = `${t('stepPrefix')} ${i+1} ${t('stepMiddle')} ${STEP_IDS.length}`;\n    });\n  }\n\n  function updateFooter(){\n    const footerEl = document.querySelector('.wizard-footer');\n    const backBtn = document.getElementById('footerBack');\n    const fwdBtn = document.getElementById('footerForward');\n\n    if(mode === 'home'){\n      footerEl.style.display = 'none';\n      return;\n    }\n    footerEl.style.display = 'flex';\n\n    if(mode === 'load' || mode === 'manage'){\n      backBtn.style.display = 'flex';\n      backBtn.classList.add('full');\n      backBtn.textContent = t('backToMenu');\n      fwdBtn.style.display = 'none';\n      return;\n    }\n\n    backBtn.classList.remove('full');\n    fwdBtn.style.display = 'flex';\n    if(mode === 'preview'){\n      backBtn.style.display = 'flex';\n      backBtn.textContent = '\u2190 ' + t('back');\n      fwdBtn.textContent = t('startOver');\n    } else {\n      backBtn.style.display = currentStepIndex === 0 ? 'none' : 'flex';\n      backBtn.textContent = '\u2190 ' + t('back');\n      if(currentStepIndex === STEP_IDS.length - 1){\n        fwdBtn.textContent = t('generateLabel');\n      } else {\n        fwdBtn.textContent = t('next') + ': ' + t(STEP_TITLE_KEYS[currentStepIndex + 1]) + ' \u2192';\n      }\n    }\n  }\n\n  document.getElementById('footerBack').addEventListener('click', ()=>{\n    if(mode === 'load' || mode === 'manage'){ showHome(); }\n    else if(mode === 'preview'){ showStep(STEP_IDS.length - 1); }\n    else if(mode === 'wizard' && currentStepIndex > 0){ showStep(currentStepIndex - 1); }\n  });\n  document.getElementById('footerForward').addEventListener('click', ()=>{\n    if(mode === 'preview'){ doReset(); showHome(); }\n    else if(mode === 'wizard'){\n      if(currentStepIndex < STEP_IDS.length - 1){ showStep(currentStepIndex + 1); }\n      else { showPreview(); }\n    }\n  });\n  document.getElementById('progressDots').addEventListener('click', (e)=>{\n    if(mode !== 'wizard' && mode !== 'preview') return;\n    const dot = e.target.closest('.progress-dot');\n    if(!dot) return;\n    showStep(parseInt(dot.dataset.index, 10));\n  });\n\n  document.getElementById('homeBtn').addEventListener('click', ()=>{ showHome(); });\n  document.getElementById('homeNewBtn').addEventListener('click', ()=>{ doReset(); showStep(0); });\n  document.getElementById('homeLoadBtn').addEventListener('click', ()=>{ showLoadPresets(); });\n\n  function applyStaticUI(){\n    document.title = t('pageTitle');\n    document.documentElement.lang = state.lang;\n    document.getElementById('kickerText').textContent = t('kicker');\n    document.getElementById('headerSub').textContent = t('headerSub');\n    document.getElementById('mainTitle').textContent = t('mainTitle');\n    document.getElementById('homeLabel').textContent = t('homeLabel');\n    document.getElementById('descLabelText').textContent = t('descLabelText');\n    if(!aiBusy) document.getElementById('aiLabel').textContent = t('aiImprove');\n    document.getElementById('descInput').placeholder = t('descPlaceholder');\n    document.getElementById('descHintText').textContent = t('descHintText');\n    document.getElementById('undoBtn').textContent = t('undo');\n    if(!aiBusy) document.getElementById('regenBtn').textContent = t('regenerate');\n    document.getElementById('secTitleCamaras').textContent = t('secTitleCamaras');\n    document.getElementById('secTitleObjetivos').textContent = t('secTitleObjetivos');\n    document.getElementById('secTitleTripode').textContent = t('secTitleTripode');\n    document.getElementById('secTitleFiltros').textContent = t('secTitleFiltros');\n    document.getElementById('secTitleVarios').textContent = t('secTitleVarios');\n    document.getElementById('hashtagLabelText').textContent = t('hashtagLabelText');\n    document.getElementById('hashtagHint').textContent = t('hashtagHint');\n    document.getElementById('hashtagPresetsLabel').textContent = t('hashtagPresetsLabel');\n    document.getElementById('presetVialacteaLabel').textContent = t('presetVialacteaLabel');\n    document.getElementById('presetPaisajeLabel').textContent = t('presetPaisajeLabel');\n    document.getElementById('presetLunaLabel').textContent = t('presetLunaLabel');\n    document.getElementById('presetGeneralLabel').textContent = t('presetGeneralLabel');\n    document.getElementById('presetAtardecerLabel').textContent = t('presetAtardecerLabel');\n    document.getElementById('previewTitleText').textContent = t('previewTitleText');\n    document.getElementById('previewScreenTitle').textContent = t('previewScreenTitle');\n    if(!copyBusy) document.getElementById('copyLabel').textContent = t('copy');\n    document.getElementById('output').placeholder = t('outputPlaceholder');\n    document.getElementById('savePresetLabel').textContent = t('savePresetLabel');\n    document.getElementById('presetNameInput').placeholder = t('presetNamePlaceholder');\n    document.getElementById('presetSaveConfirm').textContent = t('presetSave');\n    document.getElementById('presetSaveCancel').textContent = t('presetCancel');\n    document.getElementById('refineInput').placeholder = t('refinePlaceholder');\n    if(!aiBusy) document.getElementById('refineLabel').textContent = t('refineApply');\n    document.getElementById('homeNewTitle').textContent = t('homeNewTitle');\n    document.getElementById('homeLoadTitle').textContent = t('homeLoadTitle');\n    document.getElementById('loadScreenTitle').textContent = t('loadScreenTitle');\n    document.getElementById('loadPresetEmptyMsg').textContent = t('loadPresetEmpty');\n    document.getElementById('manageScreenTitle').textContent = t('manageScreenTitle');\n    document.getElementById('manageTitleCamaras').textContent = t('secTitleCamaras');\n    document.getElementById('manageTitleObjetivos').textContent = t('secTitleObjetivos');\n    document.getElementById('manageTitleTripode').textContent = t('secTitleTripode');\n    document.getElementById('manageTitleFiltros').textContent = t('secTitleFiltros');\n    document.getElementById('manageTitleVarios').textContent = t('secTitleVarios');\n    updateStepLabels();\n    updateFooter();\n  }\n\n  async function init(){\n    try{\n      const kitLang = localStorage.getItem('kitLang_v1');\n      if(kitLang && ['es','ca','en'].includes(kitLang)) state.lang = kitLang;\n    }catch(e){}\n    try{ if (localStorage.getItem('kitNight_v1') === 'on') document.body.classList.add('red'); }catch(e){}\n    try{ if (localStorage.getItem('kitZoom_v1') === 'on') document.body.classList.add('zoom-mode'); }catch(e){}\n    await loadItems();\n    renderAll();\n    updateCounts();\n    applyStaticUI();\n    document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('active', b.dataset.lang === state.lang));\n    showHome();\n  }\n\n  // ---------- AI helper (improve / regenerate / undo / translate on language change) ----------\n  let aiBusy = false;\n  let aiSessionActive = false;\n  let originalDraftForAI = null;\n  let programmaticDescUpdate = false;\n\n  const descInputEl = document.getElementById('descInput');\n  const aiBtn = document.getElementById('aiBtn');\n  const aiIcon = document.getElementById('aiIcon');\n  const aiLabel = document.getElementById('aiLabel');\n  const aiError = document.getElementById('aiError');\n  const undoRow = document.getElementById('undoRow');\n  const regenBtn = document.getElementById('regenBtn');\n  const undoBtn = document.getElementById('undoBtn');\n  const refineRow = document.getElementById('refineRow');\n  const refineInput = document.getElementById('refineInput');\n  const refineBtn = document.getElementById('refineBtn');\n  const refineIcon = document.getElementById('refineIcon');\n  const refineLabel = document.getElementById('refineLabel');\n  const LANG_NAMES = { es:'Spanish (Castilian)', ca:'Catalan', en:'English' };\n\n  function setDescValue(text){\n    programmaticDescUpdate = true;\n    descInputEl.value = text;\n  }\n  descInputEl.addEventListener('input', ()=>{\n    if(programmaticDescUpdate){ programmaticDescUpdate = false; return; }\n    aiSessionActive = false;\n    originalDraftForAI = null;\n    undoRow.classList.remove('show');\n    refineRow.classList.remove('show');\n  });\n\n  function setAIBusy(busy, labelKey){\n    aiBusy = busy;\n    aiBtn.disabled = busy;\n    regenBtn.disabled = busy;\n    undoBtn.disabled = busy;\n    refineBtn.disabled = busy;\n    refineInput.disabled = busy;\n    document.querySelectorAll('.lang-opt').forEach(b=>b.disabled = busy);\n    if(busy){\n      aiIcon.classList.add('spin');\n      aiLabel.textContent = t(labelKey || 'aiImproving');\n      if(labelKey === 'generating') regenBtn.textContent = t('generating');\n      if(labelKey === 'refining'){ refineIcon.classList.add('spin'); refineLabel.textContent = t('refineApplying'); }\n    } else {\n      aiIcon.classList.remove('spin');\n      aiLabel.textContent = t('aiImprove');\n      regenBtn.textContent = t('regenerate');\n      refineIcon.classList.remove('spin');\n      refineLabel.textContent = t('refineApply');\n    }\n  }\n\n  async function callClaude(prompt){\n    const response = await fetch('https://api.anthropic.com/v1/messages', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({\n        model: 'claude-sonnet-4-6',\n        max_tokens: 1000,\n        messages: [{ role: 'user', content: prompt }]\n      })\n    });\n    if(!response.ok) throw new Error('Respuesta no v\u00e1lida del servicio');\n    const data = await response.json();\n    const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text);\n    const result = textBlocks.join('\\n').trim().replace(/^\"|\"$/g,'');\n    if(!result) throw new Error('No se recibi\u00f3 texto de la IA');\n    return result;\n  }\n\n  function buildImprovePrompt(draft, wantVariation){\n    return 'You are helping a nature and astrophotography photographer craft an Instagram caption. '\n      + 'Rewrite the user draft/idea below into a polished caption of 2 to 4 sentences: warm and evocative but natural, not exaggerated or padded. '\n      + (wantVariation ? 'Produce a fresh alternative version, phrased differently from a typical rewrite. ' : '')\n      + 'Do not include hashtags and do not mention camera gear (that is added separately). '\n      + `Write the final caption in ${LANG_NAMES[state.lang]}. `\n      + 'Return ONLY the final caption text, with no quotes and no explanations.\\n\\n'\n      + 'User draft: \"' + draft + '\"';\n  }\n\n  function buildRefinePrompt(currentText, instruction){\n    return 'You are helping a nature and astrophotography photographer refine an Instagram caption. '\n      + 'Here is the current caption draft:\\n\"' + currentText + '\"\\n\\n'\n      + 'Revise it following this instruction from the user: \"' + instruction + '\". '\n      + 'Keep it a natural, evocative caption of roughly 2 to 4 sentences unless the instruction says otherwise. '\n      + 'Do not include hashtags and do not mention camera gear (that is added separately). '\n      + `Write the final caption in ${LANG_NAMES[state.lang]}. `\n      + 'Return ONLY the final caption text, with no quotes and no explanations.';\n  }\n\n  async function performImprove(draft, isRegenerate){\n    aiError.classList.remove('show');\n    setAIBusy(true, isRegenerate ? 'generating' : 'aiImproving');\n    try{\n      const improved = await callClaude(buildImprovePrompt(draft, isRegenerate));\n      if(!isRegenerate) originalDraftForAI = draft;\n      setDescValue(improved);\n      aiSessionActive = true;\n      undoRow.classList.add('show');\n      refineRow.classList.add('show');\n    }catch(err){\n      console.error(err);\n      aiError.textContent = t('aiErrorFail');\n      aiError.classList.add('show');\n    }finally{\n      setAIBusy(false);\n    }\n  }\n\n  async function performRefine(instruction){\n    const base = descInputEl.value.trim();\n    if(!base || !instruction) return;\n    aiError.classList.remove('show');\n    setAIBusy(true, 'refining');\n    try{\n      const revised = await callClaude(buildRefinePrompt(base, instruction));\n      setDescValue(revised);\n      aiSessionActive = true;\n      undoRow.classList.add('show');\n      refineRow.classList.add('show');\n      refineInput.value = '';\n    }catch(err){\n      console.error(err);\n      aiError.textContent = t('aiErrorFail');\n      aiError.classList.add('show');\n    }finally{\n      setAIBusy(false);\n    }\n  }\n\n  aiBtn.addEventListener('click', ()=>{\n    const draft = descInputEl.value.trim();\n    if(!draft){\n      aiError.classList.remove('show');\n      aiError.textContent = t('aiErrorEmpty');\n      aiError.classList.add('show');\n      return;\n    }\n    performImprove(draft, false);\n  });\n  regenBtn.addEventListener('click', ()=>{\n    if(!originalDraftForAI) return;\n    performImprove(originalDraftForAI, true);\n  });\n  undoBtn.addEventListener('click', ()=>{\n    if(originalDraftForAI !== null){\n      setDescValue(originalDraftForAI);\n      originalDraftForAI = null;\n      aiSessionActive = false;\n      undoRow.classList.remove('show');\n      refineRow.classList.remove('show');\n    }\n  });\n  refineBtn.addEventListener('click', ()=>{\n    const instruction = refineInput.value.trim();\n    if(!instruction){ refineInput.focus(); return; }\n    performRefine(instruction);\n  });\n  refineInput.addEventListener('keydown', (e)=>{\n    if(e.key === 'Enter'){ e.preventDefault(); refineBtn.click(); }\n  });\n\n  // Copy button\n  let copyBusy = false;\n  const HASHTAG_PRESETS_DEFAULT = {\n    vialactea: '#astrofotografia #vialactea #milkyway #nightsky #starrynight',\n    paisaje: '#nightphotography #longexposure #landscapephotography #nightsky',\n    luna: '#luna #moon #moonphotography #lunarphotography',\n    general: '#astrophotography #space #universe #stargazing #cosmos',\n    atardecer: '#sunset #atardecer #goldenhour #sunsetphotography #dusk',\n  };\n  const HASHTAG_PRESETS_KEY = 'postigHashtagPresets_v1';\n  let HASHTAG_PRESETS = Object.assign({}, HASHTAG_PRESETS_DEFAULT);\n  try{\n    const saved = JSON.parse(localStorage.getItem(HASHTAG_PRESETS_KEY) || '{}');\n    HASHTAG_PRESETS = Object.assign({}, HASHTAG_PRESETS_DEFAULT, saved);\n  }catch(e){}\n  function saveHashtagPreset(key, value){\n    HASHTAG_PRESETS[key] = value;\n    try{\n      const saved = JSON.parse(localStorage.getItem(HASHTAG_PRESETS_KEY) || '{}');\n      saved[key] = value;\n      localStorage.setItem(HASHTAG_PRESETS_KEY, JSON.stringify(saved));\n    }catch(e){}\n  }\n  let editingPresetKey = null;\n  function openPresetEdit(key){\n    editingPresetKey = key;\n    document.getElementById('presetEditTitle').textContent = t('editPresetPrompt');\n    document.getElementById('presetEditTextarea').value = HASHTAG_PRESETS[key] || '';\n    document.getElementById('presetEditSaved').classList.remove('show');\n    document.getElementById('presetEditOverlay').classList.add('open');\n    setTimeout(()=>{ document.getElementById('presetEditTextarea').focus(); }, 50);\n  }\n  function closePresetEdit(){\n    document.getElementById('presetEditOverlay').classList.remove('open');\n    document.getElementById('presetEditSaved').classList.remove('show');\n    editingPresetKey = null;\n  }\n  document.getElementById('presetEditCancel').addEventListener('click', closePresetEdit);\n  document.getElementById('presetEditOverlay').addEventListener('click', (e)=>{\n    if(e.target.id === 'presetEditOverlay') closePresetEdit();\n  });\n  document.getElementById('presetEditSave').addEventListener('click', ()=>{\n    const val = document.getElementById('presetEditTextarea').value.trim();\n    if(editingPresetKey && val){\n      saveHashtagPreset(editingPresetKey, val);\n      document.getElementById('presetEditSaved').classList.add('show');\n      setTimeout(closePresetEdit, 700);\n    } else {\n      closePresetEdit();\n    }\n  });\n\n  document.getElementById('hashtagPresets').addEventListener('click', (e)=>{\n    const editIcon = e.target.closest('.chip-edit');\n    if(editIcon){\n      e.stopPropagation();\n      openPresetEdit(editIcon.dataset.edit);\n      return;\n    }\n    const btn = e.target.closest('.hashtag-preset-chip');\n    if(!btn) return;\n    const preset = HASHTAG_PRESETS[btn.dataset.preset];\n    if(!preset) return;\n    document.getElementById('hashtagInput').value = preset;\n  });\n\n  document.getElementById('copyBtn').addEventListener('click', ()=>{\n    const out = document.getElementById('output');\n    out.select();\n    out.setSelectionRange(0, out.value.length);\n    let ok = false;\n    try{\n      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(out.value); ok = true; }\n      else { ok = document.execCommand('copy'); }\n    }catch(e){ try{ ok = document.execCommand('copy'); }catch(e2){ ok = false; } }\n    const btn = document.getElementById('copyBtn');\n    const label = document.getElementById('copyLabel');\n    if(ok){\n      copyBusy = true;\n      btn.classList.add('copied'); label.textContent = t('copied');\n      setTimeout(()=>{ btn.classList.remove('copied'); label.textContent = t('copy'); copyBusy = false; }, 1600);\n    }\n  });\n\n  function doReset(){\n    GROUPS.forEach(g=>{ if(state[g]) state[g] = {}; });\n    state.tripode = null;\n    state.values = {};\n    descInputEl.value = '';\n    document.getElementById('hashtagInput').value = '#astrofotografia #vialactea #nightsky';\n    aiError.classList.remove('show');\n    undoRow.classList.remove('show');\n    refineRow.classList.remove('show');\n    refineInput.value = '';\n    aiSessionActive = false;\n    originalDraftForAI = null;\n    document.getElementById('output').value = '';\n    renderAll();\n    updateCounts();\n  }\n\n  // ---------- Save / load gear selections (presets) ----------\n  const PRESET_INDEX_KEY = 'presets:index';\n  function presetKey(id){ return 'preset:' + id; }\n\n  async function loadPresetIndex(){\n    try{\n      const res = await storageGet(PRESET_INDEX_KEY);\n      return (res && res.value) ? JSON.parse(res.value) : [];\n    }catch(e){ return []; }\n  }\n  async function savePresetIndex(list){\n    try{ await storageSet(PRESET_INDEX_KEY, JSON.stringify(list)); }\n    catch(e){ console.error('No se pudo guardar el \u00edndice de selecciones', e); }\n  }\n\n  function collectCurrentSelection(){\n    return {\n      camaras: Object.assign({}, state.camaras),\n      objetivos: Object.assign({}, state.objetivos),\n      tripode: state.tripode,\n      accesorios: Object.assign({}, state.accesorios),\n      filtros: Object.assign({}, state.filtros),\n      varios: Object.assign({}, state.varios),\n      values: JSON.parse(JSON.stringify(state.values)),\n      hashtags: document.getElementById('hashtagInput').value,\n    };\n  }\n\n  function applySelection(sel){\n    state.camaras = Object.assign({}, sel.camaras || {});\n    state.objetivos = Object.assign({}, sel.objetivos || {});\n    state.tripode = sel.tripode || null;\n    state.accesorios = Object.assign({}, sel.accesorios || {});\n    state.filtros = Object.assign({}, sel.filtros || {});\n    state.varios = Object.assign({}, sel.varios || {});\n    state.values = JSON.parse(JSON.stringify(sel.values || {}));\n    if(sel.hashtags) document.getElementById('hashtagInput').value = sel.hashtags;\n    renderAll();\n    updateCounts();\n  }\n\n  function formatPresetDate(ts){\n    try{ return new Date(ts).toLocaleDateString(); }catch(e){ return ''; }\n  }\n\n  async function refreshFullPresetList(){\n    const idx = await loadPresetIndex();\n    const listEl = document.getElementById('loadPresetListFull');\n    const emptyMsg = document.getElementById('loadPresetEmptyMsg');\n    listEl.innerHTML = '';\n    if(!idx.length){\n      emptyMsg.style.display = 'block';\n      return;\n    }\n    emptyMsg.style.display = 'none';\n    idx.slice().reverse().forEach(p=>{\n      const row = document.createElement('div');\n      row.className = 'preset-row';\n\n      const info = document.createElement('div');\n      info.className = 'preset-info';\n      const nameEl = document.createElement('div');\n      nameEl.className = 'preset-name';\n      nameEl.textContent = p.name;\n      const dateEl = document.createElement('div');\n      dateEl.className = 'preset-date';\n      dateEl.textContent = formatPresetDate(p.savedAt);\n      info.appendChild(nameEl);\n      info.appendChild(dateEl);\n\n      const useBtn = document.createElement('button');\n      useBtn.className = 'preset-use-btn';\n      useBtn.type = 'button';\n      useBtn.textContent = t('presetUse');\n      useBtn.addEventListener('click', async ()=>{\n        try{\n          const res = await storageGet(presetKey(p.id));\n          if(res && res.value){\n            applySelection(JSON.parse(res.value));\n            showStep(0);\n          }\n        }catch(e){ console.error(e); }\n      });\n\n      const delBtn = document.createElement('button');\n      delBtn.className = 'icon-btn delete';\n      delBtn.type = 'button';\n      delBtn.innerHTML = svgTrash();\n      delBtn.addEventListener('click', async ()=>{\n        const newIdx = idx.filter(x=>x.id !== p.id);\n        await savePresetIndex(newIdx);\n        try{ await storageDelete(presetKey(p.id)); }catch(e){}\n        refreshFullPresetList();\n      });\n\n      row.appendChild(info);\n      row.appendChild(useBtn);\n      row.appendChild(delBtn);\n      listEl.appendChild(row);\n    });\n  }\n\n  document.getElementById('savePresetTrigger').addEventListener('click', ()=>{\n    document.getElementById('savePresetForm').classList.add('active');\n    document.getElementById('savePresetTrigger').style.display = 'none';\n    document.getElementById('presetNameInput').focus();\n  });\n  document.getElementById('presetSaveCancel').addEventListener('click', ()=>{\n    document.getElementById('savePresetForm').classList.remove('active');\n    document.getElementById('savePresetTrigger').style.display = 'flex';\n    document.getElementById('presetNameInput').value = '';\n  });\n  document.getElementById('presetSaveConfirm').addEventListener('click', async ()=>{\n    const nameInput = document.getElementById('presetNameInput');\n    const name = nameInput.value.trim();\n    const msg = document.getElementById('presetMsg');\n    if(!name){ nameInput.focus(); return; }\n    const id = 'p_' + Date.now().toString(36) + Math.floor(Math.random()*1000);\n    try{\n      await storageSet(presetKey(id), JSON.stringify(collectCurrentSelection()));\n      const idx = await loadPresetIndex();\n      idx.push({ id, name, savedAt: Date.now() });\n      await savePresetIndex(idx);\n      msg.textContent = t('presetSaved');\n      msg.style.color = 'var(--ok)';\n      msg.classList.add('show');\n      nameInput.value = '';\n      document.getElementById('savePresetForm').classList.remove('active');\n      document.getElementById('savePresetTrigger').style.display = 'flex';\n      refreshFullPresetList();\n      setTimeout(()=>{ msg.classList.remove('show'); }, 2600);\n    }catch(e){\n      console.error(e);\n      msg.textContent = t('presetSaveError');\n      msg.style.color = 'var(--danger)';\n      msg.classList.add('show');\n    }\n  });\n\n  init();\n})();\n<\/script>\n\n</body>\n</html>\n" },
  temporada:  { label: 'Vía Láctea de temporada',             html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>V\u00eda L\u00e1ctea de temporada</title>\n<style>\n  :root{\n    --void:#060a16;\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --line:#22305c;\n    --star:#f2efe4;\n    --dim:#8993b8;\n    --brass:#d9a05c;\n    --brass-dim:#8a6a3e;\n    --nebula:#7c8fff;\n    --ok:#6fcf8f;\n    --radius:16px;\n    --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  body.red{\n    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;\n    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20; --nebula:#ff6b6b; --ok:#ff9d6b;\n  }\n  body.zoom-mode{ zoom:1.25; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--void); color:var(--star); font-family:var(--sans);\n    -webkit-font-smoothing:antialiased; min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--sans);margin:0;}\n  button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent;}\n\n  .app{max-width:720px;margin:0 auto;}\n\n  header{\n    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;\n    background:var(--panel);border-bottom:1px solid var(--line);\n  }\n  .eyebrow{color:var(--brass);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  header h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;}\n  header .sub{color:var(--dim);font-size:13px;line-height:1.5;margin:10px 0 0;}\n\n  main{padding:16px 16px 48px;}\n\n  .controls-row{display:flex;gap:10px;margin-bottom:10px;}\n  .field-mini label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}\n  .date-field-wrap, .time-field-wrap{position:relative;width:100%;}\n  .date-display-btn, .time-display-btn{\n    width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;\n    padding:10px 11px;color:var(--star);font-size:14px;font-family:var(--sans);text-align:left;\n  }\n  .date-native-input, .time-native-input{\n    position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer;\n  }\n  .position-note{font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 14px;text-align:center;}\n  .position-note b{color:var(--brass);}\n  .season-toggle{display:flex;gap:8px;margin-bottom:16px;}\n  .season-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--dim);font-size:14.5px;font-weight:700;}\n  .season-btn.active{border-color:var(--brass);background:rgba(217,160,92,.14);color:var(--brass);}\n\n  .sky-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;overflow:hidden;}\n  .gauge-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;}\n  .gauge-title{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}\n  .gauge-box svg{display:block;width:100%;height:auto;border-radius:8px;overflow:hidden;}\n  .sky-box svg{display:block;width:100%;height:auto;}\n  .marker-label{font-size:8.5px;font-family:var(--sans);fill:var(--star);}\n\n  .season-desc{font-size:12.5px;color:var(--dim);line-height:1.55;margin:0 0 16px;padding:0 2px;}\n\n  .season-list{display:flex;flex-direction:column;gap:10px;}\n  .season-item{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}\n  .season-item-icon{flex:none;width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:16px;}\n  .season-item-name{font-size:13.5px;font-weight:700;margin-bottom:2px;}\n  .season-item-desc{font-size:12px;color:var(--dim);line-height:1.4;}\n\n  .home-footer{padding-top:20px; text-align:center;}\n  .home-footer .copyright{color:var(--dim); font-size:10px;}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n  <header>\n    <p class=\"eyebrow\" id=\"eyebrowText\">Gu\u00eda visual</p>\n    <h1 id=\"titleText\">V\u00eda L\u00e1ctea de temporada</h1>\n    <p class=\"sub\" id=\"subText\">As\u00ed se ve el arco de la V\u00eda L\u00e1ctea y sus nebulosas m\u00e1s famosas, seg\u00fan la \u00e9poca del a\u00f1o.</p>\n  </header>\n\n  <main>\n    <div class=\"controls-row\">\n      <div class=\"field-mini\" style=\"flex:1;\">\n        <label id=\"lblDate\">Fecha</label>\n        <div class=\"date-field-wrap\">\n          <button type=\"button\" class=\"date-display-btn\" id=\"dateDisplayBtn\"><span id=\"dateDisplayText\">\u2014</span></button>\n          <input type=\"date\" id=\"inDate\" class=\"date-native-input\">\n        </div>\n      </div>\n      <div class=\"field-mini\" style=\"flex:1;\">\n        <label id=\"lblTime\">Hora</label>\n        <div class=\"time-field-wrap\">\n          <button type=\"button\" class=\"time-display-btn\" id=\"timeDisplayBtn\"><span id=\"timeDisplayText\">\u2014</span></button>\n          <input type=\"time\" id=\"inTime\" class=\"time-native-input\">\n        </div>\n      </div>\n    </div>\n    <p class=\"position-note\" id=\"positionNote\"></p>\n\n    <div class=\"season-toggle\">\n      <button type=\"button\" class=\"season-btn\" id=\"btnSeasonSummer\">\u2600\ufe0f <span id=\"seasonSummerLabel\">Verano</span></button>\n      <button type=\"button\" class=\"season-btn\" id=\"btnSeasonWinter\">\u2744\ufe0f <span id=\"seasonWinterLabel\">Invierno</span></button>\n    </div>\n\n    <div class=\"sky-box\">\n      <svg id=\"skySvg\" viewBox=\"0 0 400 260\" preserveAspectRatio=\"xMidYMid meet\"></svg>\n    </div>\n\n    <div class=\"gauge-box\">\n      <div class=\"gauge-title\" id=\"gaugeTitleText\">Posici\u00f3n ahora mismo</div>\n      <svg id=\"gaugeSvg\" viewBox=\"0 0 400 90\" preserveAspectRatio=\"xMidYMid meet\"></svg>\n    </div>\n\n    <p class=\"season-desc\" id=\"seasonDescText\"></p>\n    <div class=\"season-list\" id=\"seasonList\"></div>\n\n    <div class=\"home-footer\">\n      <div class=\"copyright\">&copy; <span id=\"copyYear\"></span> Photo liveTools</div>\n    </div>\n  </main>\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  try{ if (localStorage.getItem(\"kitNight_v1\") === \"on\") document.body.classList.add(\"red\"); }catch(e){}\n  try{ if (localStorage.getItem(\"kitZoom_v1\") === \"on\") document.body.classList.add(\"zoom-mode\"); }catch(e){}\n  let kitLang = \"es\";\n  try{ kitLang = localStorage.getItem(\"kitLang_v1\") || \"es\"; }catch(e){}\n\n  const I18N = {\n    es: {\n      eyebrow:\"Gu\u00eda visual\", title:\"V\u00eda L\u00e1ctea de temporada\",\n      sub:\"As\u00ed se ve el arco de la V\u00eda L\u00e1ctea y sus nebulosas m\u00e1s famosas, seg\u00fan la \u00e9poca del a\u00f1o.\",\n      seasonSummer:\"Verano\", seasonWinter:\"Invierno\",\n      lblDate:\"Fecha\", lblTime:\"Hora\", gaugeTitle:\"Posici\u00f3n ahora mismo\",\n      posVisible:\"Ahora mismo est\u00e1 a <b>{alt}\u00b0</b> sobre el horizonte, hacia el <b>{dir}</b>.\",\n      posBelow:\"Ahora mismo est\u00e1 bajo el horizonte, no es visible a esa hora.\",\n      summerDesc:\"De mayo a septiembre, el n\u00facleo de la V\u00eda L\u00e1ctea (hacia Sagitario) es el gran protagonista de las noches de verano, junto a sus nebulosas m\u00e1s brillantes.\",\n      winterDesc:\"De noviembre a febrero, la regi\u00f3n de Ori\u00f3n domina el cielo de invierno, con algunas de las nebulosas m\u00e1s fotografiadas del firmamento.\",\n      summer: [\n        {icon:\"\ud83c\udf0c\", name:\"Centro gal\u00e1ctico (Sagitario)\", desc:\"El n\u00facleo brillante de la V\u00eda L\u00e1ctea, repleto de nebulosas y campos de estrellas.\", x:160,y:195,r:9,color:\"#e8b878\",label:\"Centro gal\u00e1ctico\"},\n        {icon:\"\ud83c\udf38\", name:\"M8 \u2014 Nebulosa Laguna\", desc:\"Gran nube de gas rosada, visible incluso con prism\u00e1ticos.\", x:135,y:208,r:5,color:\"#e87ba0\",label:\"M8\"},\n        {icon:\"\ud83d\udd3a\", name:\"M20 \u2014 Nebulosa Tr\u00edfida\", desc:\"Combina nebulosa de emisi\u00f3n (rosa) y de reflexi\u00f3n (azul) en un mismo objeto.\", x:170,y:180,r:5,color:\"#a17be8\",label:\"M20\"},\n        {icon:\"\ud83e\udd85\", name:\"M16 \u2014 Nebulosa del \u00c1guila\", desc:\"Cuna de nuevas estrellas, hogar de los famosos \u00abPilares de la Creaci\u00f3n\u00bb.\", x:232,y:132,r:5,color:\"#e87ba0\",label:\"M16\"},\n        {icon:\"\u03a9\", name:\"M17 \u2014 Nebulosa Omega\", desc:\"Nube con forma de cisne o herradura, muy brillante en banda H-alfa.\", x:256,y:116,r:5,color:\"#e87ba0\",label:\"M17\"},\n        {icon:\"\ud83c\udf10\", name:\"M22\", desc:\"Uno de los c\u00famulos globulares m\u00e1s brillantes y cercanos del cielo.\", x:196,y:158,r:4.5,color:\"#bcd4f2\",label:\"M22\"},\n        {icon:\"\ud83c\udf0e\", name:\"NGC 7000 \u2014 Nebulosa Norteam\u00e9rica\", desc:\"Nube con la silueta del continente americano, en la constelaci\u00f3n del Cisne.\", x:322,y:70,r:6,color:\"#e8607a\",label:\"NGC 7000\"},\n      ],\n      winter: [\n        {icon:\"\ud83c\udf87\", name:\"M42 \u2014 Nebulosa de Ori\u00f3n\", desc:\"La nebulosa de emisi\u00f3n m\u00e1s brillante del cielo nocturno, visible a simple vista.\", x:205,y:168,r:8,color:\"#e8607a\",label:\"M42\"},\n        {icon:\"\ud83d\udc34\", name:\"IC 434 \u2014 Cabeza de Caballo\", desc:\"Silueta oscura con forma de caballo, junto a la estrella Alnitak.\", x:222,y:183,r:4.5,color:\"#a15a4a\",label:\"IC 434\"},\n        {icon: ,0.8,0],[300,35,1,2],[340,20,0.7,0],[370,50,0.9,1],\n    [30,150,0.8,0],[80,170,0.9,2],[130,240,0.7,0],[170,250,0.8,1],[220,230,0.9,0],[260,250,0.7,2],\n    [300,200,0.8,0],[340,220,1,1],[380,180,0.7,0],[10,220,0.9,2],[380,100,0.8,0],[350,140,0.7,1],\n    [50,230,0.8,0],[100,100,0.7,2],[240,190,0.6,0],[290,150,0.8,1],[330,90,0.7,0],[190,220,0.7,2],\n    [5,50,0.6,0],[25,120,0.9,1],[65,200,0.7,0],[115,230,0.6,2],[155,60,0.8,0],[200,90,0.6,1],\n    [245,60,0.9,0],[280,80,0.7,2],[320,120,0.6,0],[360,150,0.8,1],[390,220,0.7,0],[10,180,0.6,2],\n    [400,60,0.8,0],[400,140,0.6,1],[8,10,0.7,0],[210,10,0.6,2],[275,200,0.7,0],[315,230,0.6,1]\n  ];\n  const STAR_TINTS = [\"var(--star)\",\"#cfe0ff\",\"#fff2d6\"];\n\n  function seededRandom(seed){\n    let s = seed % 2147483647; if(s <= 0) s += 2147483646;\n    return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };\n  }\n  function quadPoint(p0,p1,p2,t){\n    const mt = 1-t;\n    return [mt*mt*p0[0]+2*mt*t*p1[0]+t*t*p2[0], mt*mt*p0[1]+2*mt*t*p1[1]+t*t*p2[1]];\n  }\n  function bandPoint(wp, t){\n    return t <= 0.5 ? quadPoint(wp[0],wp[1],wp[2], t*2) : quadPoint(wp[2],wp[3],wp[4], (t-0.5)*2);\n  }\n\n  const BAND_WAYPOINTS = {\n    summer: [[40,255],[140,210],[190,160],[250,110],[340,55]],\n    winter: [[60,255],[140,220],[200,170],[260,110],[320,50]],\n  };\n\n  function buildSkySvg(season){\n    const data = I18N[kitLang] && I18N[kitLang][season] ? I18N[kitLang][season] : I18N.es[season];\n    const wp = BAND_WAYPOINTS[season];\n    const bandPath = \"M \"+wp[0][0]+\",\"+wp[0][1]+\" Q \"+wp[1][0]+\",\"+wp[1][1]+\" \"+wp[2][0]+\",\"+wp[2][1]+\n                      \" Q \"+wp[3][0]+\",\"+wp[3][1]+\" \"+wp[4][0]+\",\"+wp[4][1];\n\n    // background stars, with subtle color tints and twinkle-size variation\n    let stars = \"\";\n    BG_STARS.forEach(function(s){\n      stars += '<circle cx=\"'+s[0]+'\" cy=\"'+s[1]+'\" r=\"'+s[2]+'\" fill=\"'+STAR_TINTS[s[3]]+'\" opacity=\"0.6\"/>';\n    });\n\n    // dense unresolved-star texture scattered along the band, denser near its centerline\n    const rand = seededRandom(season === \"summer\" ? 1337 : 4242);\n    let bandStars = \"\";\n    for(let i=0;i<260;i++){\n      const t = rand();\n      const [bx,by] = bandPoint(wp, t);\n      const spread = 16 * Math.pow(rand(), 1.8); // bias towards small offsets = denser core\n      const angle = rand()*Math.PI*2;\n      const px = bx + Math.cos(angle)*spread;\n      const py = by + Math.sin(angle)*spread*0.6;\n      const r = 0.35 + rand()*0.55;\n      const op = (0.25 + rand()*0.45) * (1 - spread/20);\n      if(op <= 0) continue;\n      bandStars += '<circle cx=\"'+px.toFixed(1)+'\" cy=\"'+py.toFixed(1)+'\" r=\"'+r.toFixed(2)+'\" fill=\"#f4efe0\" opacity=\"'+op.toFixed(2)+'\"/>';\n    }\n\n    // dust lane: a darker, slightly offset ribbon cutting through part of the band (like the Great Rift)\n    const dp0 = bandPoint(wp, 0.08), dp1 = bandPoint(wp, 0.5), dp2 = bandPoint(wp, 0.85);\n    const dustPath = \"M \"+dp0[0].toFixed(1)+\",\"+(dp0[1]+3).toFixed(1)+\n                      \" Q \"+dp1[0].toFixed(1)+\",\"+(dp1[1]+5).toFixed(1)+\" \"+dp2[0].toFixed(1)+\",\"+(dp2[1]+2).toFixed(1);\n\n    let markers = \"\";\n    data.forEach(function(m, idx){\n      const gid = \"neb\"+season+idx;\n      markers += '<radialGradient id=\"'+gid+'\" cx=\"50%\" cy=\"50%\" r=\"50%\">'\n        + '<stop offset=\"0%\" stop-color=\"'+m.color+'\" stop-opacity=\"0.95\"/>'\n        + '<stop offset=\"45%\" stop-color=\"'+m.color+'\" stop-opacity=\"0.55\"/>'\n        + '<stop offset=\"100%\" stop-color=\"'+m.color+'\" stop-opacity=\"0\"/>'\n        + '</radialGradient>';\n    });\n    data.forEach(function(m){\n      markers += '<circle cx=\"'+m.x+'\" cy=\"'+m.y+'\" r=\"'+(m.r*3.4)+'\" fill=\"url(#neb'+season+data.indexOf(m)+')\"/>';\n      markers += '<circle cx=\"'+m.x+'\" cy=\"'+m.y+'\" r=\"'+(m.r*0.55)+'\" fill=\"#fff\" opacity=\"0.85\"/>';\n      const ly = m.y - m.r*2.4 - 4;\n      markers += '<t toRad(decDeg);\n    const alt = Math.asin(Math.sin(latR)*Math.sin(decR) + Math.cos(latR)*Math.cos(decR)*Math.cos(Hr));\n    const azY = Math.sin(Hr);\n    const azX = Math.cos(Hr)*Math.sin(latR) - Math.tan(decR)*Math.cos(latR);\n    const az = norm360(toDeg(Math.atan2(azY, azX)) + 180);\n    return { alt: toDeg(alt), az: az };\n  }\n  const ANCHOR = {\n    summer: { ra: 266.417, dec: -29.008 },   // galactic center (Sagittarius)\n    winter: { ra: 83.82, dec: -5.39 },        // Orion Nebula region\n  };\n  function getLocation(){\n    try{\n      const saved = JSON.parse(localStorage.getItem(\"cieloLoc_v1\"));\n      if(saved && typeof saved.lat === \"number\") return {lat: saved.lat, lon: saved.lon, label: saved.label};\n    }catch(e){}\n    return {lat: 40.4168, lon: -3.7038, label: null};\n  }\n  const COMPASS_DIRS = { es:[\"N\",\"NE\",\"E\",\"SE\",\"S\",\"SO\",\"O\",\"NO\"], ca:[\"N\",\"NE\",\"E\",\"SE\",\"S\",\"SO\",\"O\",\"NO\"], en:[\"N\",\"NE\",\"E\",\"SE\",\"S\",\"SW\",\"W\",\"NW\"] };\n  function compassDir(az){\n    const dirs = COMPASS_DIRS[kitLang] || COMPASS_DIRS.es;\n    return dirs[Math.round(norm360(az)/45) % 8];\n  }\n\n  let currentSeason = \"summer\";\n\n  function getSelectedDateObj(){\n    const dStr = document.getElementById(\"inDate\").value;\n    const tStr = document.getElementById(\"inTime\").value;\n    if(!dStr || !tStr) return new Date();\n    const [y,m,d] = dStr.split(\"-\").map(Number);\n    const [hh,mm] = tStr.split(\":\").map(Number);\n    return new Date(y, m-1, d, hh, mm);\n  }\n\n  function renderPosition(season){\n    const loc = getLocation();\n    const dateObj = getSelectedDateObj();\n    const anchor = ANCHOR[season];\n    const jd = julianDay(dateObj);\n    const pos = altAzAt(anchor.ra, anchor.dec, jd, loc.lat, loc.lon);\n    document.getElementById(\"gaugeSvg\").outerHTML = buildPositionGauge(pos).replace(\"<svg\", '<svg id=\"gaugeSvg\"');\n    const noteEl = document.getElementById(\"positionNote\");\n    if(pos.alt > 0){\n      noteEl.innerHTML = tf(\"posVisible\", {alt: Math.round(pos.alt), dir: compassDir(pos.az)});\n    } else {\n      noteEl.textContent = t(\"posBelow\");\n    }\n  }\n\n  function renderSeason(season){\n    currentSeason = season;\n    document.getElementById(\"btnSeasonSummer\").classList.toggle(\"active\", season === \"summer\");\n    document.getElementById(\"btnSeasonWinter\").classList.toggle(\"active\", season === \"winter\");\n    document.querySelector(\".sky-box\").innerHTML = buildSkySvg(season);\n\n    const data = I18N[kitLang] || I18N.es;\n    document.getElementById(\"seasonDescText\").textContent = season === \"summer\" ? data.summerDesc : data.winterDesc;\n    const items = season === \"summer\" ? data.summer : data.winter;\n    document.getElementById(\"seasonList\").innerHTML = items.map(function(it){\n      return '<div class=\"season-item\"><div class=\"season-item-icon\">'+it.icon+'</div><div><div class=\"season-item-name\">'+it.name+'</div><div class=\"season-item-desc\">'+it.desc+'</div></div></div>';\n    }).join(\"\");\n\n    renderPosition(season);\n  }\n\n  function seasonForToday(){\n    const month = new Date().getMonth() + 1;\n    return (month >= 5 && month <= 9) ? \"summer\" : \"winter\";\n  }\n  function seasonForDate(dateStr){\n    if(!dateStr) return seasonForToday();\n    const month = Number(dateStr.split(\"-\")[1]);\n    return (month >= 5 && month <= 9) ? \"summer\" : \"winter\";\n  }\n\n  document.getElementById(\"btnSeasonSummer\").addEventListener(\"click\", function(){ renderSeason(\"summer\"); });\n  document.getElementById(\"btnSeasonWinter\").addEventListener(\"click\", function(){ renderSeason(\"winter\"); });\n\n  // ---- date/time fields ----\n  const todayStr = (function(){\n    const d = new Date();\n    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,\"0\"), day = String(d.getDate()).padStart(2,\"0\");\n    return y+\"-\"+m+\"-\"+day;\n  })();\n  const nowTimeStr = (function(){\n    const d = new Date();\n    return String(d.getHours()).padStart(2,\"0\")+\":\"+String(d.getMinutes()).padStart(2,\"0\");\n  })();\n  document.getElementById(\"inDate\").value = todayStr;\n  document.getElementById(\"inTime\").value = nowTimeStr;\n\n  function updateDateDisplay(){\n    const val = document.getElementById(\"inDate\").value;\n    const el = document.getElementById(\"dateDisplayText\");\n    if(!val){ el.textContent = \"\u2014\"; return; }\n    const [y,m,d] = val.split(\"-\").map(Number);\n    const dt = new Date(y, m-1, d);\n    const locale = kitLang === \"en\" ? \"en-GB\" : (kitLang === \"ca\" ? \"ca-ES\" : \"es-ES\");\n    el.textContent = dt.toLocaleDateString(locale, {day:\"numeric\", month:\"short\", year:\"numeric\"});\n  }\n  function updateTimeDisplay(){\n    const val = document.getElementById(\"inTime\").value;\n    document.getElementById(\"timeDisplayText\").textContent = val || \"\u2014:\u2014\";\n  }\n  updateDateDisplay();\n  updateTimeDisplay();\n  document.getElementById(\"inDate\").addEventListener(\"change\", function(){ updateDateDisplay(); renderSeason(seasonForDate(document.getElementById(\"inDate\").value)); });\n  document.getElementById(\"inTime\").addEventListener(\"change\", function(){ updateTimeDisplay(); renderPosition(currentSeason); });\n  document.getElementById(\"dateDisplayBtn\").addEventListener(\"click\", function(){\n    const input = document.getElementById(\"inDate\");\n    if(typeof input.showPicker === \"function\"){ try{ input.showPicker(); }catch(e){} }\n  });\n  document.getElementById(\"timeDisplayBtn\").addEventListener(\"click\", function(){\n    const input = document.getElementById(\"inTime\");\n    if(typeof input.showPicker === \"function\"){ try{ input.showPicker(); }catch(e){} }\n  });\n\n  renderSeason(seasonForToday());\n})();\n<\/script>\n</body>\n</html>\n" }

const home = document.getElementById('home');
const toolWrap = document.getElementById('tool-wrap');
const holder = document.getElementById('tool-iframe-holder');
const toolLabel = document.getElementById('tool-label');
const backBtn = document.getElementById('tool-back');

const iframeCache = {};

function getIframe(key){
  if (iframeCache[key]) return iframeCache[key];
  const iframe = document.createElement('iframe');
  holder.appendChild(iframe);
  iframe.srcdoc = TOOLS[key].html;
  iframeCache[key] = iframe;
  return iframe;
}

function openTool(key){
  Object.values(iframeCache).forEach(f => f.style.display = 'none');
  const wasCached = !!iframeCache[key];
  const iframe = getIframe(key);
  iframe.style.display = 'block';
  toolLabel.textContent = TOOLS[key].label;
  home.style.display = 'none';
  toolWrap.style.display = 'flex';
  if (wasCached && key === 'via_lactea'){
    try{
      if (iframe.contentWindow && typeof iframe.contentWindow.goToHome === 'function'){
        iframe.contentWindow.goToHome();
      }
    }catch(e){}
  }
}

function goHome(){
  toolWrap.style.display = 'none';
  home.style.display = 'flex';
}

document.querySelectorAll('.tile').forEach(btn => {
  btn.addEventListener('click', () => openTool(btn.dataset.tool));
});
backBtn.addEventListener('click', goHome);

function applyShellI18n(){
  const lang = getKitLang();
  const dict = SHELL_I18N[lang] || SHELL_I18N.es;
  document.getElementById('shellTitle').textContent = dict.title;
  document.getElementById('shellSub').textContent = dict.sub;
  document.getElementById('backBtnLabel').textContent = dict.back;
  Object.keys(dict.tiles).forEach(key => {
    const t = dict.tiles[key];
    const titleEl = document.getElementById('tileTitle-' + key);
    const descEl = document.getElementById('tileDesc-' + key);
    if (titleEl) titleEl.textContent = t.title;
    if (descEl) descEl.textContent = t.desc;
    if (TOOLS[key]) TOOLS[key].label = t.title;
  });
  if (!home.style.display || home.style.display === 'flex') {
    // home visible, nothing else to refresh
  } else if (toolWrap.style.display === 'flex') {
    // currently inside a tool: keep the breadcrumb label in sync too
    const activeKey = Object.keys(iframeCache).find(k => iframeCache[k].style.display !== 'none');
    if (activeKey) toolLabel.textContent = dict.tiles[activeKey].title;
  }
}

function setKitLang(lang){
  try{ localStorage.setItem(KIT_LANG_KEY, lang); }catch(e){}
  Object.keys(iframeCache).forEach(key => {
    holder.removeChild(iframeCache[key]);
    delete iframeCache[key];
  });
  syncLangSwitch();
  applyShellI18n();
}
function syncLangSwitch(){
  const current = getKitLang();
  document.querySelectorAll('#langSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === current);
  });
}
document.querySelectorAll('#langSwitch button').forEach(btn => {
  btn.addEventListener('click', () => setKitLang(btn.dataset.lang));
});
syncLangSwitch();
applyShellI18n();

function detectOS(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isIOS) return 'ios';
  if(/Android/.test(ua)) return 'android';
  return 'other';
}

  if(os === 'ios'){
    html += '<p class="install-p">' + ti('iosIntro') + '</p>';
    html += '<ul class="install-steps">';
    ['iosStep1','iosStep2','iosStep3','iosStep4'].forEach((k,i) => {
      html += '<li><span class="num">'+(i+1)+'</span><span>'+ti(k)+'</span></li>';
    });
    html += '</ul>';
  } else if(os === 'android'){
    if(deferredInstallPrompt){
      html += '<p class="install-p">' + ti('androidIntro') + '</p>';
      html += '<button class="install-btn-native" id="androidInstallNativeBtn">'+ti('androidBtn')+'</button>';
    } else {
      html += '<p class="install-p">' + ti('androidFallbackIntro') + '</p>';
      html += '<ul class="install-steps">';
      ['androidStep1','androidStep2','androidStep3','androidStep4'].forEach((k,i) => {
        html += '<li><span class="num">'+(i+1)+'</span><span>'+ti(k)+'</span></li>';
      });
      html += '</ul>';
    }
  } else {
    html += '<p class="install-p">' + ti('otherIntro') + '</p>';
  }
  body.innerHTML = html;
  const nativeBtn = document.getElementById('androidInstallNativeBtn');
  if(nativeBtn){
    nativeBtn.addEventListener('click', async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      closeInstallModal();
    });
  }
}
function openInstallModal(){ renderInstallModal(); document.getElementById('installModal').classList.add('open'); }
function closeInstallModal(){ document.getElementById('installModal').classList.remove('open'); }
document.getElementById('kitInstallBtn').addEventListener('click', openInstallModal);
document.getElementById('installCloseBtn').addEventListener('click', closeInstallModal);
document.getElementById('installDoneBtn').addEventListener('click', closeInstallModal);
document.getElementById('installModal').addEventListener('click', (e) => {
  if(e.target.id === 'installModal') closeInstallModal();
});
</script>

</body>
</html>
