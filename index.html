   if (e.target.id === \"infoModal\") closeInfoModal();\n  });\n})();\n<\/script>\n\n<style>\n  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:50;}\n  .modal-overlay.open{display:flex;}\n  .modal-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;}\n  .modal-card p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--dim);}\n  .modal-card p:last-of-type{margin-bottom:0;}\n  .modal-close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;}\n  .ghost-btn{padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--star);font-size:14px;cursor:pointer;}\n  @media (min-width:640px){ .modal-overlay{align-items:center;} .modal-card{border-radius:20px;} }\n</style>\n</body>\n</html>\n" },
  postig:     { label: 'Generador de post',                  html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1\">\n<title id=\"pageTitle\">Generador de Post IG \u00b7 Equipo</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg-0:#060A14;\n    --bg-1:#0C1526;\n    --card:#101B30;\n    --card-2:#0E1728;\n    --line:rgba(232,236,244,0.08);\n    --line-strong:rgba(232,236,244,0.14);\n    --text:#E8ECF4;\n    --text-dim:#8B96AC;\n    --moon:#d9a05c;\n    --moon-dim:rgba(217,160,92,0.15);\n    --nebula:#7B8FD9;\n    --nebula-dim:rgba(123,143,217,0.15);\n    --ok:#5FD9A4;\n    --danger:#E2716B;\n    --radius:14px;\n    --footer-h:78px;\n  }\n  body.red{\n    --bg-0:#0a0000; --bg-1:#120202; --card:#1a0303; --card-2:#220505;\n    --line:rgba(255,107,107,0.12); --line-strong:rgba(255,107,107,0.2);\n    --text:#ff6b6b; --text-dim:#a34444; --moon:#ff8a5b; --moon-dim:rgba(255,138,91,0.15);\n    --nebula:#ff6b6b; --nebula-dim:rgba(255,107,107,0.15); --ok:#ff9d6b; --danger:#ff6b6b;\n  }\n  body.zoom-mode{ zoom:1.25; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;background:var(--bg-0);}\n  body{\n    font-family:'Inter',system-ui,sans-serif;\n    color:var(--text);\n    min-height:100vh;\n    background:\n      radial-gradient(ellipse 600px 300px at 15% -5%, rgba(123,143,217,0.10), transparent),\n      radial-gradient(ellipse 500px 260px at 90% 8%, rgba(232,181,100,0.07), transparent),\n      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);\n  }\n\n  header{\n    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;\n    border-bottom:1px solid var(--line-strong);\n    background:var(--bg-1);\n  }\n  .topline{display:flex; align-items:center; justify-content:space-between; gap:10px;}\n  .brand{display:flex; flex-direction:column; gap:2px; min-width:0;}\n  .kicker{font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; font-size:12.5px; letter-spacing:.04em; color:var(--moon); font-weight:600; text-transform:uppercase; white-space:nowrap;}\n  h1{\n    font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    font-weight:700;\n    font-size:20px;\n    line-height:1.15;\n    letter-spacing:-.01em;\n    margin:0;\n  }\n  header .sub{color:var(--text-dim); font-size:13px; line-height:1.5; margin:10px 0 0;}\n\n  main{padding:16px 16px calc(var(--footer-h) + 22px); max-width:640px; margin:0 auto;}\n\n  /* Top bar: language + reset */\n  .topbar{\n    display:flex;\n    align-items:center;\n    justify-content:flex-end;\n    gap:10px;\n    margin-bottom:14px;\n  }\n  .lang-switch{\n    display:flex;\n    background:var(--card-2);\n    border:1px solid var(--line);\n    border-radius:10px;\n    padding:3px;\n    gap:3px;\n    flex:1;\n  }\n  .lang-opt{\n    flex:1;\n    text-align:center;\n    padding:7px 4px;\n    font-family:'Inter',sans-serif;\n    font-size:12.5px; font-weight:600;\n    color:var(--text-dim);\n    background:none;\n    border:none;\n    border-radius:7px;\n    cursor:pointer;\n  }\n  .lang-opt.active{background:var(--moon-dim); color:var(--moon);}\n  .lang-opt:disabled{opacity:0.5; cursor:default;}\n\n  .reset-link{\n    display:flex; align-items:center; gap:4px;\n    background:none;\n    border:none;\n    color:var(--text-dim);\n    font-family:'Inter',sans-serif;\n    font-size:12px;\n    font-weight:600;\n    cursor:pointer;\n    padding:8px 4px;\n    white-space:nowrap;\n    flex-shrink:0;\n  }\n  .reset-link svg{width:13px; height:13px;}\n  .reset-link:active{color:var(--danger);}\n  .btn-ghost-home{\n    background:none; border:1px solid var(--line-strong); color:var(--text);\n    padding:8px 14px; border-radius:12px; font-size:13.5px; cursor:pointer;\n    font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  .btn-ghost-home:active{background:var(--card-2);}\n\n  /* Progress dots */\n  .progress-row{\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    gap:7px;\n    margin-bottom:18px;\n    flex-wrap:wrap;\n  }\n  .progress-dot{\n    width:9px; height:9px;\n    border-radius:50%;\n    border:1.5px solid var(--line-strong);\n    background:transparent;\n    padding:0;\n    cursor:pointer;\n    transition:all 0.2s ease;\n  }\n  .progress-dot.done{background:var(--nebula-dim); border-color:var(--nebula);}\n  .progress-dot.current{width:22px; border-radius:6px; background:var(--moon); border-color:var(--moon);}\n  .progress-dot.preview-active{background:var(--ok); border-color:var(--ok);}\n\n  /* Screens */\n  .screen{display:none; animation:fadeIn 0.25s ease;}\n  .screen.active{display:block;}\n  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }\n\n  .screen-head{\n    display:flex;\n    align-items:center;\n    gap:12px;\n    margin-bottom:16px;\n  }\n  .screen-emoji{\n    font-size:24px;\n    width:42px; height:42px;\n    display:flex; align-items:center; justify-content:center;\n    background:var(--card);\n    border:1px solid var(--line-strong);\n    border-radius:12px;\n    flex-shrink:0;\n  }\n  .screen-titles{flex:1; min-width:0;}\n  .screen-title{\n    font-family:'Space Grotesk',sans-serif;\n    font-weight:700;\n    font-size:19px;\n    line-height:1.2;\n  }\n  .screen-step{\n    font-family:'JetBrains Mono',monospace;\n    font-size:11.5px;\n    color:var(--text-dim);\n    margin-top:2px;\n  }\n  .screen-count{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    color:var(--bg-0);\n    background:var(--moon);\n    border-radius:20px;\n    padding:3px 10px;\n    min-width:22px;\n    text-align:center;\n    display:none;\n    flex-shrink:0;\n  }\n  .screen-count.show{display:inline-block;}\n\n  /* Description field */\n  .desc-head{\n    display:flex; align-items:center; justify-content:flex-end;\n    margin-bottom:10px;\n  }\n  .ai-btn{\n    display:flex; align-items:center; gap:6px;\n    background:var(--nebula-dim);\n    color:var(--nebula);\n    border:1px solid rgba(123,143,217,0.35);\n    border-radius:9px;\n    padding:8px 13px;\n    font-family:'Inter',sans-serif;\n    font-size:13px; font-weight:600;\n    cursor:pointer;\n    transition:opacity 0.15s ease;\n  }\n  .ai-btn:active{transform:scale(0.96);}\n  .ai-btn:disabled{opacity:0.55; cursor:default;}\n  .ai-btn svg{width:14px; height:14px;}\n  .ai-btn svg.spin{animation:spin 0.9s linear infinite;}\n  @keyframes spin{to{transform:rotate(360deg);}}\n\n  #descInput{\n    width:100%;\n    min-height:150px;\n    background:var(--card-2);\n    color:var(--text);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:14px;\n    font-family:'Inter',sans-serif;\n    font-size:15px;\n    line-height:1.55;\n    resize:vertical;\n    outline:none;\n  }\n  #descInput:focus{border-color:var(--nebula);}\n  .desc-hint{font-size:12.5px; color:var(--text-dim); margin-top:9px; line-height:1.5;}\n  .ai-error{font-size:12.5px; color:var(--danger); margin-top:8px; display:none;}\n  .ai-error.show{display:block;}\n  .undo-row{display:none; margin-top:10px;}\n  .undo-row.show{display:flex; gap:16px; flex-wrap:wrap;}\n  .refine-row{display:none; gap:8px; margin-top:12px; flex-wrap:wrap;}\n  .refine-row.show{display:flex;}\n  .refine-row input{\n    flex:1; min-width:180px;\n    background:var(--card-2);\n    border:1px solid var(--line-strong);\n    color:var(--text);\n    border-radius:9px;\n    padding:11px 12px;\n    font-family:'Inter',sans-serif;\n    font-size:13.5px;\n    outline:none;\n  }\n  .refine-row input:focus{border-color:var(--nebula);}\n  .refine-row input:disabled{opacity:0.6;}\n  .refine-row .ai-btn{flex-shrink:0;}\n  .undo-link{\n    background:none; border:none; color:var(--nebula);\n    font-size:12.5px; text-decoration:underline; text-underline-offset:2px;\n    cursor:pointer; padding:2px 0;\n  }\n  .undo-link:disabled{opacity:0.5; cursor:default;}\n\n  /* Item list */\n  .item-list{\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:4px 8px 8px;\n  }\n  .item-row{\n    display:flex;\n    align-items:flex-start;\n    gap:8px;\n    padding:11px 7px;\n    border-radius:9px;\n  }\n  .item-row:active{background:rgba(255,255,255,0.03);}\n  .item-row + .item-row{border-top:1px solid var(--line);}\n\n  .item-row input[type=\"checkbox\"],\n  .item-row input[type=\"radio\"]{\n    appearance:none;\n    -webkit-appearance:none;\n    width:20px; height:20px;\n    flex-shrink:0;\n    margin-top:1px;\n    border:1.5px solid rgba(232,236,244,0.28);\n    background:var(--card-2);\n    cursor:pointer;\n    position:relative;\n    transition:border-color 0.15s, background 0.15s;\n  }\n  .item-row input[type=\"checkbox\"]{border-radius:5px;}\n  .item-row input[type=\"radio\"]{border-radius:50%;}\n  .item-row input[type=\"checkbox\"]:checked,\n  .item-row input[type=\"radio\"]:checked{\n    border-color:var(--moon);\n    background:var(--moon-dim);\n  }\n  .item-row input[type=\"checkbox\"]:checked::after{\n    content:\"\";\n    position:absolute;\n    left:5.5px; top:1.5px;\n    width:6px; height:10px;\n    border:solid var(--moon);\n    border-width:0 2px 2px 0;\n    transform:rotate(45deg);\n  }\n  .item-row input[type=\"radio\"]:checked::after{\n    content:\"\";\n    position:absolute;\n    left:5px; top:5px;\n    width:8px; height:8px;\n    border-radius:50%;\n    background:var(--moon);\n  }\n\n  .item-label{flex:1; min-width:0;}\n  .item-text{\n    font-size:14.5px;\n    line-height:1.45;\n    display:block;\n    cursor:pointer;\n    word-break:break-word;\n  }\n  .item-icon{margin-right:3px;}\n  .item-account{color:var(--nebula); font-size:13.5px;}\n\n  .item-inputs{\n    display:none;\n    gap:6px;\n    margin-top:8px;\n    flex-wrap:wrap;\n  }\n  .item-inputs.active{display:flex;}\n  .item-inputs input[type=\"text\"]{\n    background:var(--card-2);\n    border:1px solid var(--line-strong);\n    color:var(--text);\n    border-radius:7px;\n    padding:6px 9px;\n    font-family:'JetBrains Mono',monospace;\n    font-size:12.5px;\n    width:78px;\n    outline:none;\n  }\n  .item-inputs input[type=\"text\"]:focus{border-color:var(--nebula);}\n  .input-suffix{font-size:12px; color:var(--text-dim); align-self:center;}\n\n  .item-actions{display:flex; gap:2px; flex-shrink:0; margin-top:1px;}\n  .icon-btn{\n    width:27px; height:27px;\n    display:flex; align-items:center; justify-content:center;\n    background:none; border:none;\n    color:var(--text-dim);\n    cursor:pointer;\n    border-radius:6px;\n  }\n  .icon-btn:active{background:rgba(255,255,255,0.06);}\n  .icon-btn svg{width:15px; height:15px;}\n  .icon-btn.delete:active{color:var(--danger);}\n  .icon-btn.edit:active{color:var(--moon);}\n\n  .edit-form{display:none; gap:6px; margin-top:8px; align-items:center; flex-wrap:wrap;}\n  .edit-form.active{display:flex;}\n  .edit-form input.edit-icon{\n    width:44px; text-align:center;\n    background:var(--card-2); border:1px solid var(--line-strong); color:var(--text);\n    border-radius:7px; padding:6px 4px; font-size:15px; outline:none;\n  }\n  .edit-form input.edit-text{\n    flex:1; min-width:120px;\n    background:var(--card-2); border:1px solid var(--line-strong); color:var(--text);\n    border-radius:7px; padding:6px 9px; font-size:13px; font-family:'Inter',sans-serif; outline:none;\n  }\n  .edit-form input:focus{border-color:var(--nebula);}\n  .edit-form-btns{display:flex; gap:6px; width:100%; margin-top:2px;}\n  .edit-note{font-size:11px; color:var(--text-dim); width:100%; margin-top:2px; line-height:1.4;}\n  .mini-btn{border:none; border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}\n  .mini-btn.save{background:var(--moon-dim); color:var(--moon);}\n  .mini-btn.cancel{background:rgba(255,255,255,0.05); color:var(--text-dim);}\n\n  .add-row{padding:10px 7px 6px;}\n  .add-trigger{\n    display:flex; align-items:center; gap:8px;\n    background:none; border:1px dashed var(--line-strong);\n    color:var(--text-dim);\n    border-radius:9px; padding:10px 11px; width:100%;\n    font-size:13.5px; font-family:'Inter',sans-serif; cursor:pointer;\n  }\n  .equipo-note{\n    display:flex; align-items:center; gap:8px;\n    background:var(--moon-dim); border:1px solid var(--moon);\n    color:var(--moon);\n    border-radius:9px; padding:10px 12px; width:100%;\n    font-size:12.5px; line-height:1.4; font-family:'Inter',sans-serif; cursor:pointer;\n    box-sizing:border-box;\n  }\n  .add-trigger svg{width:15px; height:15px; flex-shrink:0;}\n  .add-form{display:none; gap:6px; flex-wrap:wrap; align-items:center; padding:10px 4px 4px;}\n  .add-form.active{display:flex;}\n  .add-form input.add-icon{\n    width:44px; text-align:center;\n    background:var(--card-2); border:1px solid var(--line-strong); color:var(--text);\n    border-radius:7px; padding:8px 4px; font-size:15px; outline:none;\n  }\n  .add-form input.add-text{\n    flex:1; min-width:140px;\n    background:var(--card-2); border:1px solid var(--line-strong); color:var(--text);\n    border-radius:7px; padding:8px 9px; font-size:13.5px; font-family:'Inter',sans-serif; outline:none;\n  }\n  .add-form input:focus{border-color:var(--nebula);}\n\n  /* Tripod sub-heading (inside the combined screen) */\n  .sub-heading{\n    font-family:'Space Grotesk',sans-serif;\n    font-size:13px; font-weight:600;\n    color:var(--text-dim);\n    margin:18px 0 8px 4px;\n  }\n\n  /* Hashtags */\n  #hashtagInput{\n    width:100%;\n    background:var(--card-2);\n    border:1px solid var(--line);\n    color:var(--nebula);\n    border-radius:var(--radius);\n    padding:14px;\n    font-family:'JetBrains Mono',monospace;\n    font-size:14px;\n    outline:none;\n  }\n  #hashtagInput:focus{border-color:var(--nebula);}\n  .hashtag-hint{font-size:12.5px; color:var(--text-dim); margin-top:9px; line-height:1.5;}\n\n  .hashtag-presets-label{font-size:12px; color:var(--text-dim); margin:0 0 8px 2px;}\n  .hashtag-presets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}\n  .hashtag-preset-chip{\n    display:flex; align-items:center; gap:6px;\n    background:var(--card-2); border:1px solid var(--line); border-radius:999px;\n    padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--text);\n    cursor:pointer; font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  .hashtag-preset-chip:active{background:var(--moon-dim); border-color:var(--moon); color:var(--moon); transform:scale(0.97);}\n  .chip-edit{opacity:0.55; font-size:11px; margin-left:2px;}\n  .chip-edit:hover, .chip-edit:active{opacity:1;}\n\n  .preset-edit-overlay{\n    position:fixed; inset:0; background:rgba(6,10,20,.7);\n    display:none; align-items:flex-end; justify-content:center; z-index:200;\n  }\n  .preset-edit-overlay.open{display:flex;}\n  .preset-edit-card{\n    background:var(--card); border:1px solid var(--line-strong); border-radius:20px 20px 0 0;\n    padding:20px; width:100%; max-width:440px;\n  }\n  .preset-edit-title{font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; font-weight:700; font-size:15.5px; margin-bottom:12px;}\n  .preset-edit-textarea{\n    width:100%; box-sizing:border-box; background:var(--card-2); border:1px solid var(--line);\n    color:var(--nebula); border-radius:12px; padding:12px; font-family:'JetBrains Mono',monospace;\n    font-size:14px; outline:none; resize:none;\n  }\n  .preset-edit-textarea:focus{border-color:var(--nebula);}\n  .preset-edit-actions{display:flex; gap:10px; margin-top:14px;}\n  .preset-edit-cancel{\n    flex:1; padding:13px; border-radius:12px; border:1px solid var(--line-strong); background:var(--card-2);\n    color:var(--text-dim); font-weight:700; font-size:14px; cursor:pointer;\n  }\n  .preset-edit-save{\n    flex:1; padding:13px; border-radius:12px; border:none; background:var(--moon);\n    color:#1a1200; font-weight:700; font-size:14px; cursor:pointer;\n  }\n  .preset-edit-saved{\n    text-align:center; margin-top:10px; font-size:13px; font-weight:700; color:var(--ok);\n    opacity:0; transition:opacity 0.2s ease;\n  }\n  .preset-edit-saved.show{opacity:1;}\n  @media (min-width:640px){ .preset-edit-overlay{align-items:center;} .preset-edit-card{border-radius:20px;} }\n\n  /* Preview */\n  .preview{\n    background:var(--card);\n    border:1px solid var(--line-strong);\n    border-radius:var(--radius);\n    overflow:hidden;\n  }\n  .preview-head{\n    display:flex; align-items:center; justify-content:space-between;\n    padding:12px 14px;\n    border-bottom:1px solid var(--line);\n    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);\n  }\n  .preview-title{\n    font-family:'Space Grotesk',sans-serif;\n    font-size:13px; font-weight:600;\n    display:flex; align-items:center; gap:7px;\n    color:var(--text);\n  }\n  .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok);}\n  .copy-btn{\n    display:flex; align-items:center; gap:6px;\n    background:var(--moon-dim);\n    color:var(--moon);\n    border:1px solid rgba(232,181,100,0.3);\n    border-radius:9px;\n    padding:7px 12px;\n    font-family:'Inter',sans-serif;\n    font-size:13px; font-weight:600;\n    cursor:pointer;\n    transition:transform 0.12s ease, background 0.15s ease;\n  }\n  .copy-btn:active{transform:scale(0.96);}\n  .copy-btn.copied{background:rgba(95,217,164,0.16); color:var(--ok); border-color:rgba(95,217,164,0.35);}\n  .copy-btn svg{width:14px; height:14px;}\n\n  #output{\n    display:block;\n    width:100%;\n    min-height:220px;\n    max-height:80vh;\n    resize:vertical;\n    background:var(--card-2);\n    color:var(--text);\n    border:none;\n    padding:14px;\n    font-family:'JetBrains Mono',monospace;\n    font-size:12.5px;\n    line-height:1.65;\n    white-space:pre-wrap;\n    outline:none;\n    overflow-y:auto;\n  }\n  #output::placeholder{color:var(--text-dim);}\n\n  /* Fixed wizard footer */\n  .wizard-footer{\n    position:fixed;\n    left:0; right:0; bottom:0;\n    z-index:40;\n    display:flex;\n    gap:10px;\n    padding:12px 16px calc(12px + env(safe-area-inset-bottom));\n    background:rgba(9,13,24,0.88);\n    backdrop-filter:blur(10px);\n    -webkit-backdrop-filter:blur(10px);\n    border-top:1px solid var(--line-strong);\n  }\n  .footer-inner{\n    display:flex; gap:10px;\n    max-width:640px;\n    margin:0 auto;\n    width:100%;\n  }\n  .footer-btn{\n    border:none;\n    border-radius:12px;\n    font-family:'Space Grotesk',sans-serif;\n    font-weight:700;\n    font-size:14.5px;\n    cursor:pointer;\n    padding:14px;\n  }\n  .footer-btn:active{transform:scale(0.98);}\n  .footer-btn.back{\n    background:var(--card);\n    border:1px solid var(--line-strong);\n    color:var(--text-dim);\n    flex:0 0 84px;\n    display:none;\n    align-items:center;\n    justify-content:center;\n  }\n  .footer-btn.forward{\n    flex:1;\n    background:#d9a05c;\n    color:#1a1200;\n    font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    padding:15px;\n    font-size:15px;\n    border-radius:12px;\n  }\n  .footer-btn.back.full{flex:1;}\n\n  /* Save / load presets */\n  .preset-block{\n    margin-top:16px;\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    padding:14px;\n  }\n  .preset-trigger{\n    display:flex; align-items:center; gap:8px;\n    background:var(--nebula-dim);\n    color:var(--nebula);\n    border:1px solid rgba(123,143,217,0.35);\n    border-radius:9px;\n    padding:10px 13px;\n    font-family:'Inter',sans-serif;\n    font-size:13.5px; font-weight:600;\n    cursor:pointer;\n    width:100%;\n    justify-content:center;\n  }\n  .preset-trigger:active{transform:scale(0.98);}\n  .preset-trigger svg{width:15px; height:15px;}\n  .preset-save-form{display:none; gap:8px; margin-top:10px; flex-wrap:wrap;}\n  .preset-save-form.active{display:flex;}\n  .preset-save-form input{\n    flex:1; min-width:160px;\n    background:var(--card-2);\n    border:1px solid var(--line-strong);\n    color:var(--text);\n    border-radius:9px;\n    padding:10px 11px;\n    font-family:'Inter',sans-serif;\n    font-size:14px;\n    outline:none;\n  }\n  .preset-save-form input:focus{border-color:var(--nebula);}\n  .preset-msg{font-size:12.5px; color:var(--ok); margin-top:8px; display:none;}\n  .preset-msg.show{display:block;}\n  .preset-list{display:none; margin-top:10px; gap:0; flex-direction:column;}\n  .preset-list.active{display:flex;}\n  .preset-row{\n    display:flex; align-items:center; gap:8px;\n    padding:10px 4px;\n  }\n  .preset-row + .preset-row{border-top:1px solid var(--line);}\n  .preset-info{flex:1; min-width:0;}\n  .preset-name{font-size:14px; font-weight:600; color:var(--text);}\n  .preset-date{font-size:11.5px; color:var(--text-dim); margin-top:1px;}\n  .preset-use-btn{\n    background:var(--moon-dim); color:var(--moon);\n    border:none; border-radius:8px;\n    padding:7px 12px;\n    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;\n    cursor:pointer; flex-shrink:0;\n  }\n  .preset-empty{font-size:13px; color:var(--text-dim); padding:6px 4px;}\n\n  /* Home menu */\n  .home-hero{\n    text-align:center;\n    padding:18px 8px 28px;\n  }\n  .home-emoji{font-size:40px; margin-bottom:10px;}\n  .home-title{\n    font-family:'Space Grotesk',sans-serif;\n    font-weight:700;\n    font-size:21px;\n    margin-bottom:8px;\n  }\n  .home-subtitle{\n    font-size:13.5px;\n    color:var(--text-dim);\n    line-height:1.5;\n    max-width:42ch;\n    margin:0 auto;\n  }\n  .home-menu{display:flex; flex-direction:column; gap:12px;}\n  .primary-btn{\n    width:100%; padding:15px; border-radius:12px; border:none;\n    background:var(--moon); color:#1a1200; font-weight:700; font-size:15px;\n    cursor:pointer; font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  .primary-btn:active{filter:brightness(0.92); transform:scale(0.99);}\n  .home-card-icon{\n    font-size:24px;\n    width:48px; height:48px;\n    display:flex; align-items:center; justify-content:center;\n    background:rgba(26,18,0,0.15);\n    border-radius:13px;\n    flex-shrink:0;\n  }\n  .home-card-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}\n  .home-card-title{font-family:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; font-weight:700; font-size:15.5px; color:#1a1200;}\n  .home-card-desc{font-size:12.5px; color:#4a3418; line-height:1.4;}\n  .home-card-arrow{font-size:18px; color:#4a3418; flex-shrink:0;}\n\n  /* Manage screen */\n  .manage-section{\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:var(--radius);\n    margin-bottom:12px;\n    overflow:hidden;\n  }\n  .manage-section[open]{border-color:var(--line-strong);}\n  .manage-section summary{\n    list-style:none;\n    cursor:pointer;\n    display:flex;\n    align-items:center;\n    gap:10px;\n    padding:14px 15px;\n    font-family:'Space Grotesk',sans-serif;\n    font-weight:600;\n    font-size:14.5px;\n  }\n  .manage-section summary::-webkit-details-marker{display:none;}\n  .manage-summary-icon{font-size:17px;}\n  .manage-section .item-list{margin:0 8px 10px;}\n\n  @media (max-width:380px){\n    h1{font-size:20px;}\n    .screen-title{font-size:17px;}\n    .item-text{font-size:14px;}\n  }\n</style>\n</head>\n<body>\n\n<header>\n  <div class=\"topline\">\n    <div class=\"brand\">\n      <span class=\"kicker\" id=\"kickerText\">GENERADOR DE POST \u00b7 TU EQUIPO</span>\n      <h1 id=\"mainTitle\">Generador de texto para el post</h1>\n    </div>\n  </div>\n  <p class=\"sub\" id=\"headerSub\">Escribe el texto de tu publicaci\u00f3n y elige tu equipo real, paso a paso.</p>\n</header>\n\n<main>\n\n  <div class=\"topbar\">\n    <button class=\"btn-ghost-home\" id=\"homeBtn\" type=\"button\"><span id=\"homeLabel\">\u2190 Inicio</span></button>\n  </div>\n\n  <div class=\"progress-row\" id=\"progressDots\">\n    <button class=\"progress-dot\" data-index=\"0\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"1\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"2\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"3\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"4\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"5\" type=\"button\"></button>\n    <button class=\"progress-dot\" data-index=\"6\" type=\"button\"></button>\n  </div>\n\n  <div class=\"screens\">\n\n    <section class=\"screen active\" id=\"screen-home\">\n      <div class=\"home-menu\">\n        <button class=\"primary-btn\" id=\"homeNewBtn\" type=\"button\">\u2728 <span id=\"homeNewTitle\">Nueva publicaci\u00f3n</span></button>\n        <button class=\"primary-btn\" id=\"homeLoadBtn\" type=\"button\">\ud83d\udcc2 <span id=\"homeLoadTitle\">Cargar selecci\u00f3n guardada</span></button>\n      </div>\n    </section>\n\n    <section class=\"screen\" id=\"screen-loadpresets\">\n      <div class=\"screen-head\">\n        <span class=\"screen-emoji\">\ud83d\udcc2</span>\n        <div class=\"screen-titles\">\n          <div class=\"screen-title\" id=\"loadScreenTitle\">Cargar selecci\u00f3n guardada</div>\n        </div>\n      </div>\n      <div class=\"preset-list active\" id=\"loadPresetListFull\"></div>\n      <div class=\"preset-empty\" id=\"loadPresetEmptyMsg\" style=\"display:none;\">Todav\u00eda no tienes selecciones guardadas.</div>\n    </section>\n\n    <section class=\"screen\" id=\"screen-manage\">\n      <div class=\"screen-head\">\n        <span class=\"screen-emoji\">\ud83d\udee0\ufe0f</span>\n        <div class=\"screen-titles\">\n          <div class=\"screen-title\" id=\"manageScreenTitle\">Gestionar mi equipo</div>\n        </div>\n      </div>\n\n      <details class=\"manage-section\" open>\n        <summary><span class=\"manage-summary-icon\">\ud83d\udcf7</span><span id=\"manageTitleCamaras\">C\u00e1maras</span></summary>\n        <div class=\"item-list\" id=\"manage-camaras\"></div>\n      </details>\n      <details class=\"manage-section\">\n        <summary><span class=\"manage-summary-icon\">\ud83d\udd73\ufe0f</span><span id=\"manageTitleObjetivos\">Objetivos</span></summary>\n        <div class=\"item-list\" id=\"manage-objetivos\"></div>\n      </details>\n      <details class=\"manage-section\">\n        <summary><span class=\"manage-summary-icon\">\ud83d\udd2d</span><span id=\"manageTitleTripode\">Tr\u00edpode y accesorios</span></summary>\n        <div class=\"item-list\" id=\"manage-tripodes\"></div>\n        <div class=\"item-list\" id=\"manage-accesorios\" style=\"margin-top:10px;\"></div>\n      </details>\n      <details class=\"manage-section\">\n        <summary><span class=\"manage-summary-icon\">\u26ab</span><span id=\"manageTitleFiltros\">Filtros</span></summary>\n        <div class=\"item-list\" id=\"manage-filtros\"></div>\n      </details>\n      <details class=\"manage-section\">\n        <summary><span class=\"manage-summary-icon\">\ud83c\udf15</span><span id=\"manageTitleVarios\">Varios</span></summary>\n        <div class=\"item-list\" id=\"manage-varios\"></div>\n      </details>\n    </section>\n\n    <section class=\"screen\" id=\"screen-desc\" data-index=\"0\">\n      <div class=\"screen-head\">\n        <span class=\"screen-emoji\">\ud83d\udcdd</span>\n        <div class=\"screen-titles\">\n          <div class=\"screen-title\" id=\"descLabelText\">Descripci\u00f3n de la foto</div>\n          <div class=\"screen-step\" id=\"stepLabel-0\">Paso 1 de 7</div>\n        </div>\n      </div>\n      <div class=\"desc-head\">\n        <button class=\"ai-btn\" id=\"aiBtn\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" id=\"aiIcon\"><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8\"/></svg>\n          <span id=\"aiLabel\">Mejorar con IA</span>\n        </button>\n      </div>\n      <textarea id=\"descInput\" placeholder=\"Escribe una idea suelta o un borrador\u2026 la IA puede pulirlo por ti\"></textarea>\n      <div class=\"desc-hint\" id=\"descHintText\">Escribe aunque sea una idea r\u00e1pida y pulsa \u00abMejorar con IA\u00bb para convertirla en una descripci\u00f3n lista, en el idioma elegido arriba.</div>\n      <div class=\"ai-error\" id=\"aiError\"></div>\n      <div class=\"undo-row\" id=\"undoRow\">\n        <button class=\"undo-link\" id=\"regenBtn\">\ud83d\udd01 Generar otra versi\u00f3n</button>\n        <button class=\"undo-link\" id=\"undoBtn\">Deshacer mejora de la IA</button>\n      </div>\n      <div class=\"refine-row\" id=\"refineRow\">\n        <input type=\"text\" id=\"refineInput\" placeholder=\"Dile a la IA c\u00f3mo quieres el texto (ej. m\u00e1s corto, m\u00e1s po\u00e9tico\u2026)\" maxlength=\"200\">\n        <button class=\"ai-btn\" id=\"refineBtn\" type=\"button\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" id=\"refineIcon\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg>\n          <span
