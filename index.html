<style>
  :root{
    --void:#060a16;
    --panel:#0f1730;
    --panel-2:#141d3d;
    --line:#22305c;
    --star:#f2efe4;
    --dim:#8993b8;
    --brass:#d9a05c;
    --brass-dim:#8a6a3e;
    --nebula:#7c8fff;
    --ok:#6fcf8f;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  body.red{
    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;
    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20;
  }
  body.zoom-mode{ zoom:1.25; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--void); color:var(--star); font-family:var(--sans);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  .util-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .util-lang{display:flex; gap:4px;}
  .util-lang button{
    background:var(--void); border:1px solid var(--line); color:var(--dim);
    font-family:var(--sans); font-size:10.5px; font-weight:700; padding:5px 9px;
    border-radius:999px; cursor:pointer; line-height:1;
  }
  .util-lang button.active{background:var(--brass); border-color:var(--brass); color:var(--void);}
  .util-modes{display:flex; gap:5px;}
  .util-modes button{
    width:26px; height:26px; border-radius:50%; background:var(--void); border:1px solid var(--line);
    color:var(--dim); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .util-modes button.active{background:var(--brass); border-color:var(--brass); color:var(--void);}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;max-width:440px;max-height:80vh;overflow-y:auto;}
  .modal-close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;}
  .install-done-btn{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--star);font-size:14px;cursor:pointer;}
  .install-steps{list-style:none;margin:0;padding:0;}
  .install-steps li{display:flex;gap:10px;margin-bottom:12px;font-size:13.5px;line-height:1.5;color:var(--dim);}
  .install-steps li .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brass);color:var(--void);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .install-p{font-size:13.5px;color:var(--dim);line-height:1.6;margin:0 0 14px;}
  .install-btn-native{width:100%;padding:14px;border-radius:12px;border:none;background:var(--brass);color:var(--void);font-size:14.5px;font-weight:700;cursor:pointer;margin-bottom:14px;}
  @media (min-width:640px){ .modal-overlay{align-items:center;} .modal-card{border-radius:20px;} }

  #home{padding:16px 16px 24px; display:flex; flex-direction:column; flex:1;}
  .home-header{text-align:center; margin-bottom:4px;}
  .home-stars{font-size:9px; letter-spacing:.14em; color:var(--dim); font-weight:600; text-transform:uppercase;}
  .home-title{font-size:19px; font-weight:800; letter-spacing:-.01em; margin:4px 0 3px;}
  .home-sub{color:var(--dim); font-size:12px; line-height:1.45; margin:0 auto 16px; max-width:300px;}

  .tiles{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px 8px; padding:4px 4px 8px;}
  .tile{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:none; border:none; padding:0; cursor:pointer; color:inherit; gap:7px;
  }
  .tile:active .tile-glyph{transform:scale(.92);}
  .tile-glyph{
    width:68px; height:68px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-size:32px;
    box-shadow:0 3px 8px rgba(0,0,0,.35); transition:transform .12s ease;
  }
  .tile-body{width:100%;}
  .tile-body h3{
    margin:0; font-size:11px; font-weight:600; line-height:1.25; color:var(--star);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tile-body p{display:none;}
  .tile-arrow{display:none;}

  .home-footer{margin-top:auto; padding-top:20px; text-align:center;}
  .home-footer a{color:var(--brass); font-size:12px; text-decoration:none;}
  .home-footer .copyright{color:var(--dim); font-size:10px; margin-top:4px;}

  #tool-wrap{display:none; position:fixed; inset:0; background:var(--void); z-index:10; flex-direction:column;}
  #tool-topbar{
    display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:none;
  }
  #tool-back{
    display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--star); font-family:var(--sans); font-size:13px; font-weight:600;
    border-radius:10px; padding:8px 12px; cursor:pointer;
  }
  #tool-back:active{opacity:.7;}
  #tool-label{font-size:12.5px; color:var(--dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #tool-iframe-holder{flex:1; position:relative;}
  #tool-iframe-holder iframe{position:absolute; inset:0; width:100%; height:100%; border:none; background:var(--void); display:none;}
</style>
</head>
<body>
<div class="shell">

  <div class="util-bar">
    <div class="util-lang" id="langSwitch">
      <button data-lang="es">ES</button>
      <button data-lang="ca">CA</button>
      <button data-lang="en">EN</button>
    </div>
    <div class="util-modes" id="modeSwitch">
      <button id="kitNightBtn" title="Modo nocturno">🌙</button>
      <button id="kitZoomBtn" title="Zoom x2">🔍</button>
      <button id="kitInstallBtn" title="Acceso directo">📲</button>
    </div>
  </div>

  <div class="modal-overlay" id="installModal">
    <div class="modal-card">
      <button class="modal-close-x" id="installCloseBtn">✕</button>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span style="font-size:20px;">📲</span><h2 style="font-size:15px;font-weight:700;" id="installTitle">Acceso directo</h2></div>
      <div id="installBody"></div>
      <button class="install-done-btn" id="installDoneBtn">Entendido</button>
    </div>
  </div>

  <div id="home">
    <div class="home-header">
      <div class="home-stars">✦ &nbsp; ✧ &nbsp; ✦</div>
      <div class="home-title" id="shellTitle">Photo liveTools</div>
      <p class="home-sub" id="shellSub">Tus herramientas en un solo sitio: gestiona tu equipo, planifica la sesión, calcula la calibración y prepara la mochila.</p>
    </div>

    <div class="tiles">
      <button class="tile" data-tool="equipo">
        <div class="tile-glyph" style="background:linear-gradient(135deg,#3d9bd4,#1d5f8a);"><span style="transform:translateY(-8px);display:inline-block;">📷</span></div>
        <div class="tile-body">
          <h3 id="tileTitle-equipo">Mi equipo</h3>
          <p id="tileDesc-equipo">Tu stock de material: cámaras, objetivos, trípodes, trackers, filtros y más.</p>
        </div>
        <div class="tile-arrow">›</div>
      </button>

      <button class="tile" data-tool="photopack">
        <div class="tile-glyph" style="background:linear-gradient(135deg,#e8794f,#b8492a);">🎒</div>
        <div class="tile-body">
          <h3 id="tileTitle-photopack">Mochila</h3>
          <p id="tileDesc-photopack">Checklist de la mochila: elige de tu equipo lo que te llevas a cada salida.</p>
        </div>
        <div class="tile-arrow">›</div>

 cleanup(); closeModal(\"modalConfirm\"); }\n    okBtn.addEventListener(\"click\", onOk);\n    cancelBtn.addEventListener(\"click\", onCancel);\n  }\n\n  function applyI18n(){\n    document.title = \"Mi equipo \u2014 Stock de material\";\n    document.getElementById(\"appTitle\").textContent = t(\"app_title\");\n    document.getElementById(\"topbarEyebrow\").textContent = t(\"eyebrow_label\");\n    document.getElementById(\"introText\").textContent = t(\"intro\");\n    document.getElementById(\"searchInput\").placeholder = t(\"search_placeholder\");\n    document.getElementById(\"btnEdit\").textContent = editMode ? t(\"done_btn\") : t(\"edit_btn\");\n    document.getElementById(\"btnAddItem\").textContent = t(\"add_item_btn\");\n    document.getElementById(\"labelItemName\").textContent = t(\"label_name\");\n    document.getElementById(\"itemName\").placeholder = t(\"placeholder_name\");\n    document.getElementById(\"labelItemWeight\").textContent = t(\"label_weight\");\n    document.getElementById(\"itemWeight\").placeholder = t(\"placeholder_weight\");\n    document.getElementById(\"labelItemCategory\").textContent = t(\"label_category\");\n    document.getElementById(\"labelNewCatName\").textContent = t(\"label_newcat\");\n    document.getElementById(\"newCatName\").placeholder = t(\"placeholder_newcat\");\n    document.getElementById(\"labelItemSensor\").textContent = t(\"label_sensor\");\n    document.getElementById(\"labelItemFocal\").textContent = t(\"label_focal\");\n    document.getElementById(\"itemFocal\").placeholder = t(\"placeholder_focal\");\n    document.getElementById(\"labelItemFilterType\").textContent = t(\"label_filtertype\");\n    document.getElementById(\"btnCancelItem\").textContent = t(\"cancel_btn\");\n    document.getElementById(\"btnSaveItem\").textContent = t(\"save_btn\");\n    document.getElementById(\"confirmCancel\").textContent = t(\"cancel_btn\");\n    document.getElementById(\"confirmOk\").textContent = t(\"delete_btn\");\n    document.getElementById(\"helpTitle\").textContent = t(\"help_title\");\n    document.getElementById(\"helpBody\").innerHTML = t(\"help_body_html\");\n    document.getElementById(\"btnDeleteItems\").textContent = t(\"delete_items_btn\");\n    document.getElementById(\"btnResetApp\").textContent = t(\"reset_app_btn\");\n    document.getElementById(\"setupModalTitle\").textContent = t(\"setup_title\");\n    document.getElementById(\"setupModalHint\").textContent = t(\"setup_hint\");\n    document.getElementById(\"preloadBannerTitle\").textContent = t(\"setup_title\");\n    document.getElementById(\"preloadBannerSub\").textContent = t(\"preload_banner_sub\");\n    document.getElementById(\"btnSkipSetup\").textContent = t(\"setup_skip_btn\");\n    document.getElementById(\"btnPreloadExamplesLabel\").textContent = t(\"example_categories_btn\");\n    document.getElementById(\"btnRemoveExamplesLabel\").textContent = t(\"remove_examples_btn\");\n    document.getElementById(\"btnClearCatalogLabel\").textContent = t(\"clear_catalog_btn\");\n    document.getElementById(\"brandItemsHint\").textContent = t(\"brand_items_hint\");\n    document.getElementById(\"brandItemsCancelBtn\").textContent = t(\"cancel_btn\");\n    document.getElementById(\"brandItemsConfirmBtn\").textContent = t(\"brand_items_confirm_btn\");\n    renderCatalog();\n  }\n\n  // ---------- events ----------\n  document.getElementById(\"searchInput\").addEventListener(\"input\", renderCatalog);\n\n  document.getElementById(\"btnEdit\").addEventListener(\"click\", function(){\n    editMode = !editMode;\n    document.getElementById(\"btnEdit\").textContent = editMode ? t(\"done_btn\") : t(\"edit_btn\");\n    renderCatalog();\n  });\n\n  document.getElementById(\"btnAddItem\").addEventListener(\"click\", function(){\n    editingItemId = null;\n    document.getElementById(\"itemModalTitle\").textContent = t(\"item_modal_new\");\n    document.getElementById(\"itemName\").value = \"\";\n    document.getElementById(\"itemWeight\").value = \"\";\n    document.getElementById(\"newCatField\").style.display = \"none\";\n    document.getElementById(\"newCatName\").value = \"\";\n    document.getElementById(\"itemSensor\").value = \"1\";\n    document.getElementById(\"itemCrop\").value = \"1\";\n    document.getElementById(\"itemFocal\").value = \"\";\n    document.getElementById(\"itemFilterType\").value = \"RGB\";\n    var firstCat = state.categories[0] ? state.categories[0].id : null;\n    renderCategorySelect(firstCat);\n    updateItemTechFields(firstCat);\n    openModal(\"modalItem\");\n  });\n\n  document.getElementById(\"itemCategory\").addEventListener(\"change\", function(e){\n    document.getElementById(\"newCatField\").style.display = (e.target.value === \"__new__\") ? \"block\" : \"none\";\n    updateItemTechFields(e.target.value);\n  });\n  document.getElementById(\"itemSensor\").addEventListener(\"change\", function(){\n    updateItemTechFields(document.getElementById(\"itemCategory\").value);\n  });\n\n  document.getElementById(\"btnSaveItem\").addEventListener(\"click\", function(){\n    var name = document.getElementById(\"itemName\").value.trim();\n    var weight = parseFloat(document.getElementById(\"itemWeight\").value);\n    var catSel = document.getElementById(\"itemCategory\").value;\n    if(!name || isNaN(weight) || weight < 0){ alert(t(\"alert_need_name_weight\")); return; }\n    var catId = catSel;\n    if(catSel === \"__new__\"){\n      var newName = document.getElementById(\"newCatName\").value.trim();\n      if(!newName){ alert(t(\"alert_need_catname\")); return; }\n      catId = newName.toLowerCase().replace(/[^a-z0-9]+/g,\"-\") + \"-\" + uid().slice(0,4);\n      state.categories.push({id:catId, name:newName, icon:\"otros\"});\n    }\n    var techFields = {};\n    if(catId === \"camaras\"){\n      techFields.sensor = document.getElementById(\"itemSensor\").value;\n      techFields.customCrop = Number(document.getElementById(\"itemCrop\").value) || 1;\n    } else if(catId === \"objetivos\"){\n      var focalVal = Number(document.getElementById(\"itemFocal\").value);\n      var focalMatch = name.match(/(\\d+(?:[.,]\\d+)?)\\s*mm/i);\n      if(!focalVal && focalMatch) focalVal = Number(focalMatch[1].replace(\",\", \".\"));\n      techFields.focal = focalVal || undefined;\n    } else if(catId === \"filtros\"){\n      techFields.filterType = document.getElementById(\"itemFilterType\").value;\n    }\n    if(editingItemId){\n      var ci = catalogItem(editingItemId);\n      ci.name = name; ci.weight = weight; ci.category = catId;\n      delete ci.sensor; delete ci.customCrop; delete ci.focal; delete ci.filterType;\n      Object.assign(ci, techFields);\n    } else {\n      state.catalog.push(Object.assign({id:uid(), name:name, weight:weight, category:catId}, techFields));\n    }\n    save();\n    closeModal(\"modalItem\");\n    renderCatalog();\n  });\n\n  document.getElementById(\"catalogList\").addEventListener(\"click\", function(e){\n    var btn = e.target.closest(\"[data-action]\");\n    if(!btn) return;\n    var action = btn.getAttribute(\"data-action\");\n    var itemId = btn.getAttribute(\"data-item\");\n    if(action === \"edit-item\"){\n      var ci = catalogItem(itemId);\n      editingItemId = itemId;\n      document.getElementById(\"itemModalTitle\").textContent = t(\"item_modal_edit\");\n      document.getElementById(\"itemName\").value = ci.name;\n      document.getElementById(\"itemWeight\").value = ci.weight;\n      document.getElementById(\"newCatField\").style.display = \"none\";\n      document.getElementById(\"itemSensor\").value = ci.sensor || \"1\";\n      document.getElementById(\"itemCrop\").value = ci.customCrop || 1;\n      document.getElementById(\"itemFocal\").value = ci.focal || \"\";\n      document.getElementById(\"itemFilterType\").value = ci.filterType || \"RGB\";\n      renderCategorySelect(ci.category);\n      updateItemTechFields(ci.category);\n      openModal(\"modalItem\");\n    } else if(action === \"delete-item\"){\n      askConfirm(t(\"confirm_delete_item\"), function(){\n        state.catalog = state.catalog.filter(function(x){ return x.id !== itemId; });\n        save();\n        renderCatalog();\n      });\n    }\n  });\n\n  document.getElementById(\"btnHelp\").addEventListener(\"click\", function(){ openModal(\"modalHelp\"); });\n  document.getElementById(\"btnSettings\").addEventListener(\"click\", function(){ openModal(\"modalSettings\"); });\n  document.getElementById(\"btnDeleteItems\").addEventListener(\"click\", function(){\n    askConfirm(t(\"delete_items_confirm\"), function(){\n      state.catalog = [];\n      save();\n      applyI18n();\n    });\n  });\n  document.getElementById(\"btnResetApp\").addEventListener(\"click\", function(){\n    askConfirm(t(\"reset_confirm\"), function(){\n      state = freshState();\n      save();\n      applyI18n();\n    });\n  });\n\n  // ---------- preload / setup ----------\n  document.getElementById(\"btnPreloadBanner\").addEventListener(\"click\", function(){ openModal(\"modalSetup\"); });\n\n  (function buildBrandButtons(){\n    var wrap = document.getElementById(\"brandButtons\");\n    BRANDS.forEach(function(brand){\n      if (brand === \"Star Trackers\"){\n        var label = document.createElement(\"div\");\n        label.className = \"brand-section-label\";\n        label.textContent = \"Trackers\";\n        wrap.appendChild(label);\n      }\n      var btn = document.createElement(\"button\");\n      btn.className = \"choice-btn\" + (brand === \"Star Trackers\" ? \" tracker-btn\" : \"\");\n      var icon = brand === \"Star Trackers\" ? \"\ud83c\udf20\" : \"\ud83d\udcf7\";\n      btn.innerHTML = '<span class=\"choice-flag\">'+icon+'</span><span>'+esc(brand)+'</span>';\n      btn.addEventListener(\"click\", function(){\n        openBrandItemsModal(brand);\n      });\n      wrap.appendChild(btn);\n    });\n  })();\n\n  function updateToggleAllLabel(){\n    var boxes = document.querySelectorAll(\".brand-item-checkbox\");\n    var allChecked = boxes.length > 0 && Array.prototype.every.call(boxes, function(b){return b.checked;});\n    document.getElementById(\"btnToggleAllBrandItems\").textContent = allChecked ? t(\"deselect_all_btn\") : t(\"select_all_btn\");\n  }\n\n  function openBrandItemsModal(brand){\n    var brandValues = BRAND_GROUPS[brand] || [brand];\n    var rows = CAMERA_ROWS.filter(function(r){ return brandValues.indexOf(r.brand) !== -1; });\n    var bodies = rows.filter(function(r){ return r.type === \"Cuerpo\"; });\n    var lenses = rows.filter(function(r){ return r.type === \"Objetivo\"; });\n    var trackers = rows.filter(function(r){ return r.type === \"Tracker\"; });\n\n    function section(title, list, category, useFullWeight){\n      if (!list.length) return \"\";\n      var h = '<div style=\"font-weight:700;font-family:var(--font-display);font-size:12.5px;color:var(--text-dim);margin:10px 0 4px;\">'+esc(title)+'</div>';\n      list.forEach(function(r){\n        var weight = useFullWeight ? (parseWeightStr(r.weightFull) || parseWeightStr(r.weightBody)) : parseWeightStr(r.weightBody);\n        if (weight === null) return;\n        var name = r.brand + \" \" + r.model;\n        h += '<label style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);cursor:pointer;\">';\n        h += '<input type=\"checkbox\" class=\"brand-item-checkbox\" data-name=\"'+esc(name)+'\" data-weight=\"'+weight+'\" data-category=\"'+category+'\" style=\"width:18px;height:18px;accent-color:var(--accent);flex:none;\">';\n        h += '<span style=\"flex:1;font-size:14px;\">'+esc(name)+'</span>';\n        h += '<span style=\"font-size:12.5px;color:var(--text-dim);\">'+weight.toLocaleString(\"es-ES\")+' g</span>';\n        h += '</label>';\n      });\n      return h;\n    }\n\n    var html = section(categoryName({id:\"camaras\"}), bodies, \"camaras\", true)\n             + section(categoryName({id:\"objetivos\"}), lenses, \"objetivos\", false)\n             + section(categoryName({id:\"trackers\"}), trackers, \"trackers\", false);\n    document.getElementById(\"brandItemsTitle\").textContent = brand;\n    document.getElementById(\"brandItemsList\").innerHTML = html;\n    updateToggleAllLabel();\n    openModal(\"modalBrandItems\");\n  }\n\n  document.getElementById(\"brandItemsList\").addEventListener(\"change\", function(e){\n    if (e.target.classList.contains(\"brand-item-checkbox\")) updateToggleAllLabel();\n  });\n  document.getElementById(\"btnToggleAllBrandItems\").addEventListener(\"click\", function(){\n    var boxes = document.querySelectorAll(\".brand-item-checkbox\");\n    var allChecked = boxes.length > 0 && Array.prototype.every.call(boxes, function(b){return b.checked;});\n    boxes.forEach(function(b){ b.checked = !allChecked; });\n    updateToggleAllLabel();\n  });\n  function guessSensorForCamera(brand, model){\n    if(brand === \"Canon\"){\n      return /R7|R10|R50|R100/.test(model) ? \"1.6\" : \"1\";\n    }\n    if(brand === \"Sony\"){\n      return /6700|6400|6100|ZV-E10/.test(model) ? \"1.5\" : \"1\";\n    }\n    if(brand === \"Nikon\"){\n      return /Z50|Z\\s?fc|Z30/.test(model) ? \"1.5\" : \"1\";\n    }\n    if(brand === \"Fujifilm\"){\n      if(/^GFX/.test(model)) return null; // medium format, no exact match available\n      return \"1.5\";\n    }\n    if(brand === \"OM System\" || brand === \"Olympus\"){\n      return \"2\";\n    }\n    if(brand === \"Panasonic Lumix\"){\n      return /GH\\d|G9|G100/.test(model) ? \"2\" : \"1\";\n    }\n    if(brand === \"Sigma\"){\n      return /Quattro/.test(model) ? null : \"1\";\n    }\n    if(brand === \"Leica\"){\n      return \"1\";\n    }\n    return null;\n  }\n\n  document.getElementById(\"brandItemsConfirmBtn\").addEventListener(\"click\", function(){\n    var boxes = document.querySelectorAll(\".brand-item-checkbox:checked\");\n    var added = 0;\n    boxes.forEach(function(b){\n      var name = b.getAttribute(\"data-name\");\n      var weight = parseInt(b.getAttribute(\"data-weight\"), 10);\n      var category = b.getAttribute(\"data-category\");\n      if (findByDisplayName(state.catalog, name)) return;\n      var newItem = {id:uid(), name:name, weight:weight, category:category};\n      if(category === \"camaras\"){\n        var brandPart = name.split(\" \")[0] === \"Panasonic\" ? \"Panasonic Lumix\" : name.split(\" \")[0];\n        var brandMatch = [\"OM System\",\"Canon\",\"Sony\",\"Nikon\",\"Fujifilm\",\"Panasonic Lumix\",\"Sigma\",\"Leica\",\"Olympus\"].find(function(bn){ return name.indexOf(bn) === 0; });\n        var modelPart = brandMatch ? name.slice(brandMatch.length).trim() : name;\n        var guessed = guessSensorForCamera(brandMatch, modelPart);\n        if(guessed) newItem.sensor = guessed;\n      }\n      state.catalog.push(newItem);\n      added++;\n    });\n    save();\n    closeModal(\"modalBrandItems\");\n    closeModal(\"modalSetup\");\n    renderCatalog();\n    alert(tf(\"brand_items_added_msg\", {count:added}));\n  });\n\n  document.getElementById(\"btnPreloadExamples\").addEventListener(\"click\", function(){\n    EXAMPLE_ITEM_ROWS.forEach(function(row){\n      var key = row[0];\n      if (state.catalog.filter(function(ci){return ci.exampleKey===key;}).length) return;\n      state.catalog.push({id:uid(), exampleKey:key, name:row[1], weight:row[2], category:row[3]});\n    });\n    save();\n    closeModal(\"modalSetup\");\n    renderCatalog();\n    alert(t(\"example_added_msg\"));\n  });\n\n  document.getElementById(\"btnRemoveExamples\").addEventListener(\"click\", function(){\n    askConfirm(t(\"remove_examples_confirm\"), function(){\n      var exampleKeys = EXAMPLE_ITEM_ROWS.map(function(r){return r[0];});\n      var removeIds = state.catalog.filter(function(ci){return ci.exampleKey && exampleKeys.indexOf(ci.exampleKey)!==-1;}).map(function(ci){return ci.id;});\n      state.catalog = state.catalog.filter(function(ci){return removeIds.indexOf(ci.id)===-1;});\n      save();\n      closeModal(\"modalSetup\");\n      renderCatalog();\n      alert(t(\"remove_examples_msg\"));\n    });\n  });\n\n  document.getElementById(\"btnClearCatalog\").addEventListener(\"click\", function(){\n    askConfirm(t(\"clear_catalog_confirm\"), function(){\n      state.catalog = [];\n      save();\n      closeModal(\"modalSetup\");\n      renderCatalog();\n      alert(t(\"clear_catalog_msg\"));\n    });\n  });\n\n  // init\n  document.body.classList.toggle(\"night-mode\", !!state.settings.night);\n  document.body.classList.toggle(\"zoom-mode\", localStorage.getItem(\"kitZoom_v1\") === \"on\");\n  applyI18n();\n})();\n<\/script>\n</body>\n</html>\n" },

e; top:0; bottom:0; border-radius:7px; background: var(--gold); display:flex; align-items:center; padding: 0 8px; font-size: 10.5px; font-weight:600; color: var(--bg); white-space:nowrap; overflow:hidden; }\n.card-dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); display:inline-block; margin-right:8px; flex-shrink:0; }\n.progress-track{ background:#0D1122; border-radius:6px; height:8px; overflow:hidden; margin-top: 14px; }\n[data-mode=\"night\"] .progress-track{ background:#150303; }\n.progress-fill{ height:100%; border-radius:6px; background: var(--gold); }\n.progress-label{ font-size:11px; color:var(--text-faint); margin-top:5px; display:flex; justify-content:space-between; }\n.spec-toggle{ background:none; border:none; color: var(--gold); font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline; margin-top: 1rem; font-family:'Inter', sans-serif; }\n.s-stat-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }\n.s-stat-box{ background: #0D1122; border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; text-align:center; }\n[data-mode=\"night\"] .s-stat-box{ background: #150303; }\n.s-stat-box .s-icon{ font-size: 15px; margin-bottom: 4px; }\n.s-label{ font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }\n.s-value{ font-size: 18px; font-weight: 600; color: var(--gold); font-family:'Space Grotesk', sans-serif; }\n.s-alert{ color: var(--warn); font-size: 13px; margin: .9rem 0 0; }\n.spec-list{ margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); }\n.spec-row{ display:flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border-soft); }\n.spec-row:last-child{ border-bottom: none; }\n.spec-label{ color: var(--text-faint); }\n.spec-value{ color: var(--text); font-weight: 500; text-align: right; }\n.s-totals{ display:flex; gap: 22px; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 14px; padding: 1.1rem 1.3rem; margin-top: .5rem; }\n.t-label{ font-size: 11px; color: var(--text-faint); }\n.t-value{ font-size: 19px; font-weight: 600; color: var(--gold); font-family:'Space Grotesk', sans-serif; }\n\n/* ---- help modal ---- */\n.help-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200; }\n.help-card{ background: var(--panel); border:1px solid var(--border); border-radius:16px; padding:1.4rem 1.5rem; max-width:480px; width:100%; max-height:82vh; overflow-y:auto; }\n.help-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: .5rem; gap:10px; }\n.help-head h2{ margin:0; font-size:18px; color:#fff; }\n.help-body{ font-size:13.5px; line-height:1.65; color: var(--text-dim); }\n.help-body h3{ font-size:13px; color: var(--gold); margin: 1.1rem 0 .35rem; }\n.help-body h3:first-child{ margin-top:0; }\n.help-body p{ margin: 0 0 .5rem; }\n.help-body strong{ color: var(--text); font-weight:600; }\n\n@media (max-width: 560px){\n  .s-stat-grid{ grid-template-columns: repeat(2, 1fr); }\n}\n@media (max-width: 320px){\n  .field-row{ grid-template-columns: 1fr; }\n}\n.modal-overlay{\n  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;\n  display:flex; align-items:center; justify-content:center; padding: 20px;\n}\n.modal-box{\n  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;\n  padding: 1.5rem; max-width: 420px; width: 100%;\n}\n.modal-box p{ margin: 0 0 1.25rem; font-size: 14.5px; line-height: 1.6; color: var(--text); }\n.modal-actions{ display:flex; justify-content:flex-end; gap: 10px; }\n.modal-actions button{\n  border-radius: 8px; padding: 9px 16px; font-size: 13.5px; cursor:pointer; font-family:'Inter', sans-serif;\n  background: none; border: 1px solid var(--border-soft); color: var(--text-dim);\n}\n.modal-actions button:hover{ border-color: var(--gold); color: var(--gold); }\n.modal-actions button.btn-danger{ color: #ff8a8a; border-color: #4a2020; }\n.modal-actions button.btn-danger:hover{ background: #ff8a8a; color: var(--bg); }\n</style>\n\n<style id=\"unified-theme-override\">\n  :root{\n    --bg:#060a16;\n    --bg-arc: linear-gradient(180deg, #0a0f1f 0%, #0f1730 55%, #141d3d 100%);\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --border:#22305c;\n    --border-soft:#1a2547;\n    --text:#f2efe4;\n    --text-dim:#8993b8;\n    --text-faint:#5f6790;\n    --gold:#d9a05c;\n    --gold-dim:#8a6a3e;\n    --blue:#7c8fff;\n    --blue-dim:#2b3f5c;\n    --rose:#dd8098;\n    --rose-dim:#4c2c39;\n    --warn:#e4894a;\n    --ok:#6fcf8f;\n  }\n  *, *::before, *::after{\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n</style>\n<style id=\"unified-components-override\">\n  .big-add, .summary-btn{\n    background: var(--gold) !important;\n    border: none !important;\n    color: #1a1200 !important;\n    width: 100% !important;\n    display: flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    padding: 15px !important;\n    border-radius: 12px !important;\n    font-weight: 700 !important;\n    font-size: 15px !important;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n  .wizard-nav .nav-next{\n    background: var(--gold) !important;\n    border: none !important;\n    color: #1a1200 !important;\n    flex: 1 !important;\n    display: flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    padding: 15px !important;\n    border-radius: 12px !important;\n    font-weight: 700 !important;\n    font-size: 15px !important;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif !important;\n  }\n  .big-add:hover, .summary-btn:hover, .wizard-nav .nav-next:hover{\n    background: var(--gold) !important;\n    color: #1a1200 !important;\n    opacity:.92;\n  }\n  .wizard-nav button{ border-radius:12px !important; font-weight:700 !important; }\n  .tile, .cam-card, .history-item{ border-radius:16px !important; }\n  .icon-btn{ width:42px !important; height:42px !important; border-radius:50% !important; }\n</style>\n</head>\n<body>\n\n<!-- ============ HOME ============ -->\n<div id=\"view-home\" class=\"view active\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\" id=\"homeEyebrow\">Planificador de sesi\u00f3n</p><h1 id=\"homeTitle\">Planificar sesi\u00f3n astrofotograf\u00eda</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\" id=\"helpBtnHome\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\" id=\"homeSub\">Elige el tipo de sesi\u00f3n para empezar a planificarla, c\u00e1mara a c\u00e1mara.</p>\n    </div>\n  </div>\n  <main><div class=\"tile-list\" id=\"homeTiles\"></div></main>\n</div>\n\n<!-- ============ CONFIG (lista de c\u00e1maras) ============ -->\n<div id=\"view-config\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\" id=\"configEyebrow\">Planificador de sesi\u00f3n</p><h1 id=\"configTitle\">Tu sesi\u00f3n</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\" id=\"helpBtnConfig\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\" id=\"configSub\">Estas son las c\u00e1maras configuradas para esta sesi\u00f3n. A\u00f1ade tantas como necesites y genera el resumen cuando termines.</p>\n    </div>\n  </div>\n  <main>\n    <div class=\"topbar\">\n      <button class=\"btn-ghost\" id=\"backBtn\">\u2190 Inicio</button>\n      <button class=\"btn-ghost btn-danger\" id=\"resetBtn\">\u27f3 Nueva sesi\u00f3n</button>\n      <span class=\"type-badge\" id=\"typeBadge\"></span>\n    </div>\n    <div id=\"blockList\"></div>\n    <button class=\"summary-btn\" id=\"summaryBtn\">Generar resumen de la sesi\u00f3n</button>\n    <div class=\"history\" id=\"historyWrap\" style=\"display:none\">\n      <h2 id=\"historyWrapTitle\">Res\u00famenes generados en esta sesi\u00f3n</h2>\n      <div id=\"historyList\"></div>\n    </div>\n  </main>\n</div>\n\n<!-- ============ WIZARD (alta/edici\u00f3n de una c\u00e1mara) ============ -->\n<div id=\"view-wizard\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\" id=\"wizardEyebrow\">Nueva c\u00e1mara</p><h1 id=\"wizardTitle\">Configura tu c\u00e1mara</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\" id=\"helpBtnWizard\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\" id=\"wizardSub\">Rellena los datos paso a paso. Podr\u00e1s revisar y ajustar todo antes de guardar.</p>\n    </div>\n  </div>\n  <main>\n    <div class=\"stepper\" id=\"stepper\"></div>\n    <div id=\"wizardContent\"></div>\n    <div class=\"wizard-nav\">\n      <button class=\"nav-back\" id=\"wizardBack\">\u2190 Atr\u00e1s</button>\n      <button class=\"nav-next\" id=\"wizardNext\">Siguiente \u2192</button>\n    </div>\n  </main>\n</div>\n\n<!-- ============ SETTINGS ============ -->\n<!-- ============ SUMMARY ============ -->\n<div id=\"view-summary\" class=\"view\">\n  <div class=\"sky\">\n    <div class=\"sky-inner\">\n      <div class=\"topline\">\n        <div><p class=\"eyebrow\" id=\"summaryEyebrow\">Plan de la sesi\u00f3n</p><h1 id=\"summaryTitle\">Resumen para el terreno</h1></div>\n        <div class=\"icon-row\">\n          <button class=\"icon-btn help-icon\" title=\"Ayuda\" id=\"helpBtnSummary\">\u2753</button>\n        </div>\n      </div>\n      <p class=\"sub\" id=\"summaryMeta\"></p>\n    </div>\n  </div>\n  <main>\n    <div class=\"topbar\">\n      <button class=\"btn-ghost\" id=\"summaryBackBtn\">\u2190 Tu sesi\u00f3n</button>\n      <button class=\"btn-ghost\" id=\"summaryCopyBtn\">Copiar como texto</button>\n      <button class=\"btn-ghost\" id=\"summaryHomeBtn\" style=\"margin-left:auto\">Ir al inicio</button>\n    </div>\n    <div id=\"summaryContent\"></div>\n  </main>\n</div>\n\n<!-- ============ AYUDA ============ -->\n<div id=\"helpOverlay\" class=\"help-overlay\" style=\"display:none\">\n  <div class=\"help-card\">\n    <div class=\"help-head\">\n      <h2 id=\"helpMainTitle\">C\u00f3mo funciona</h2>\n      <button class=\"icon-btn\" id=\"helpClose\" title=\"Cerrar\">\u2715</button>\n    </div>\n    <div class=\"help-body\">\n      <h3 id=\"help1Title\">1. Elige el tipo de sesi\u00f3n</h3>\n      <p id=\"help1Text\">En el inicio eliges entre <strong>Panor\u00e1mica de V\u00eda L\u00e1ctea</strong> (varios paneles verticales que luego se unen) o <strong>Foto \u00fanica</strong> (un solo encuadre por c\u00e1mara).</p>\n\n      <h3 id=\"help2Title\">2. A\u00f1ade tus c\u00e1maras</h3>\n      <p id=\"help2Text\">En \"Tu sesi\u00f3n\" pulsa \"A\u00f1adir c\u00e1mara\" y rellena el asistente en 3 pasos: equipo (c\u00e1mara, objetivo, tipo de foto, filtro), montaje y horario (tr\u00edpode, tracker, hora de inicio/fin, paneles), y exposici\u00f3n (con un valor recomendado que puedes ajustar). Puedes tener varias c\u00e1maras a la vez, cada una con su propio horario.</p>\n\n      <h3 id=\"help3Title\">3. Da de alta tu equipo</h3>\n      <p id=\"help3Text\">Registra tus c\u00e1maras, objetivos, tr\u00edpodes, trackers y filtros desde Mi equipo (una sola vez); aqu\u00ed en el Planificador aparecer\u00e1n listos para elegir en cada c\u00e1mara sin escribirlos de nuevo. Un mismo elemento no se puede asignar a dos c\u00e1maras a la vez en la misma sesi\u00f3n.</p>\n\n      <h3 id=\"help4Title\">4. Genera el resumen</h3>\n      <p id=\"help4Text\">Cuando termines de configurar, pulsa \"Generar resumen de la sesi\u00f3n\". Ver\u00e1s la cronolog\u00eda de la noche y una ficha detallada por c\u00e1mara (horario, ajustes y n\u00famero de fotos) pensada para consultar en el terreno mientras disparas.</p>\n\n      <h3 id=\"help5Title\">Modo nocturno</h3>\n      <p id=\"help5Text\">El icono de luna cambia toda la app a tonos rojos para proteger tu visi\u00f3n nocturna mientras fotograf\u00edas.</p>\n\n      <h3 id=\"help6Title\">Reiniciar o empezar de nuevo</h3>\n      <p id=\"help6Text\">Desde el inicio puedes reiniciar la sesi\u00f3n actual (borra las c\u00e1maras pero mantiene el tipo) o elegir un tipo de sesi\u00f3n distinto para empezar de cero.</p>\n    </div>\n  </div>\n</div>\n\n<div id=\"confirmOverlay\" class=\"modal-overlay\" style=\"display:none\">\n  <div class=\"modal-box\">\n    <p id=\"confirmMessage\"></p>\n    <div class=\"modal-actions\">\n      <button id=\"confirmCancel\" class=\"btn-ghost\">Cancelar</button>\n      <button id=\"confirmOk\" class=\"btn-ghost btn-danger\">Confirmar</button>\n    </div>\n  </div>\n</div>\n\n<div id=\"nameOverlay\" class=\"modal-overlay\" style=\"display:none\">\n  <div class=\"modal-box\">\n    <p id=\"nameOverlayText\">\u00bfQuieres guardar esta sesi\u00f3n con un nombre? As\u00ed la reconocer\u00e1s f\u00e1cilmente en \"Tus sesiones\".</p>\n    <div class=\"field\">\n      <label id=\"nameOverlayLabel\">Nombre de la sesi\u00f3n (opcional)</label>\n      <input type=\"text\" id=\"nameInput\" placeholder=\"Ej. Salida al Montseny\">\n    </div>\n    <div class=\"modal-actions\">\n      <button id=\"nameSkip\" class=\"btn-ghost\">Ahora no</button>\n      <button id=\"nameSave\" class=\"btn-ghost\">Guardar</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* ---------- i18n ---------- */\nlet kitLang = \"es\";\ntry{ kitLang = localStorage.getItem(\"kitLang_v1\") || \"es\"; }catch(e){}\n\nconst I18N = {\n  es: {\n    homeEyebrow:\"Planificador de sesi\u00f3n\", h s eliminar aquesta sessi\u00f3 desada? Es perdran totes les seves c\u00e0meres.\",\n    insufficientShort:\"Temps insuficient per a una foto amb aquesta configuraci\u00f3\",\n    photosPerPanelSuffix:\" fotos/panell\", panelsSuffix:\" panells\", photosSuffix:\" fotos\", totalPhotosSuffix:\" fotos totals\",\n    addMoreCam:\"+ Afegeix una altra c\u00e0mera\",\n    editTitle:\"Edita\", deleteTitle:\"Elimina\",\n    historyMeta:\"{photos} fotos, {cams} c\u00e0mera(es)\", historyView:\"Veure\", historyDelete:\"Elimina\",\n    customSensor:\"Personalitzat\",\n    noneRegistered:\"No en tens cap registrat a El meu equip.\",\n    instructionPano:\"Dispara {n} fotos de {s}s a cadascun dels {p} panells (gira al seg\u00fcent panell quan completis les preses). Acaba abans de les {end}.\",\n    instructionUnica:\"Dispara {n} fotos de {s}s. Acaba abans de les {end}.\",\n    sensorNoCamShort:\"Full Frame (35mm) \u2014 x1 (sense c\u00e0mera registrada)\",\n    specSensor:\"Sensor\", specTotalPhotosBlock:\"Total de fotos del bloc\",\n    timelineStarts:\"comen\u00e7a\", timelineEnds:\"acaba\", statPhotos:\"Fotos\", statObjetivo:\"Objectiu\",\n    summaryGeneratedAt:\"{type} \u00b7 generat el {date}\", usedCapturePanel:\"Captura utilitzada per panell\",\n    summaryTxtHeader:\"RESUM DE LA SESSI\u00d3\", summaryTxtGenerated:\"Generat el\", summaryTxtChronology:\"Cronologia:\",\n    summaryTxtWarnInsufficient:\"AV\u00cdS: temps insuficient per a una foto.\",\n    summaryTxtTotal:\"TOTAL: {n} c\u00e0mera(es), {photos} fotos, {integ} d'integraci\u00f3 acumulada.\"\n  },\n  en: {\n    homeEyebrow:\"Session planner\", homeTitle:\"Plan astrophotography session\",\n    homeSub:\"Choose the session type to start planning it, camera by camera.\",\n    configEyebrow:\"Session planner\", configTitle:\"Your session\",\n    configSub:\"These are the cameras set up for this session. Add as many as you need and generate the summary when you're done.\",\n    backBtn:\"\u2190 Home\", resetBtn:\"\u27f3 New session\", summaryBtn:\"Generate session summary\",\n    historyWrapTitle:\"Summaries generated in this session\",\n    wizardSub:\"Fill in the details step by step. You'll be able to review and adjust everything before saving.\",\n    wizardBack:\"\u2190 Back\", wizardCancel:\"\u2715 Cancel\", wizardNext:\"Next \u2192\",\n    wizardSaveNew:\"Save camera\", wizardSaveEdit:\"Save changes\",\n    newCamera:\"New camera\", editCamera:\"Edit camera\",\n    summaryEyebrow:\"Session plan\", summaryTitle:\"Field summary\",\n    summaryBackBtn:\"\u2190 Your session\", summaryCopyBtn:\"Copy as text\", summaryHomeBtn:\"Go home\",\n    ayuda:\"Help\",\n    helpMainTitle:\"How it works\",\n    help1Title:\"1. Choose the session type\",\n    help1Text:'On the home screen choose between <strong>Milky Way panorama</strong> (several vertical panels stitched together later) or <strong>Single shot</strong> (one frame per camera).',\n    help2Title:\"2. Add your cameras\",\n    help2Text:'In \"Your session\" tap \"Add camera\" and fill in the 3-step wizard: <b>Gear</b> (camera, lens, tripod, photo type, tracking type, tracker, filter), <b>Parameters</b> (vertical panels, exposure per shot, interval between shots) and <b>Schedule</b> (start and end time). You can have several cameras at once, each with its own setup.',\n    help3Title:\"3. Register your gear\",\n    help3Text:\"Register your cameras, lenses, tripods, trackers and filters from My Gear (just once); here in the Planner they'll show up ready to pick for each camera without typing them again. The same item can't be assigned to two cameras at once in the same session.\",\n    help4Title:\"4. Generate the summary\",\n    help4Text:'When you\\'re done setting up, tap \"Generate session summary\". You\\'ll see the night\\'s timeline and a detailed card per camera (schedule, settings and photo count) designed to check in the field while you shoot.',\n    help5Title:\"Night mode and zoom\",\n    help5Text:\"Turn these on from the kit's home screen (the \ud83c\udf19 and \ud83d\udd0d icons up top) \u2014 they apply to all 6 tools at once. Night mode switches to red tones to protect your night vision.\",\n    help6Title:\"Reset or start over\",\n    help6Text:\"From the home screen you can reset the current session (clears the cameras but keeps the type) or choose a different session type to start from scratch.\",\n    confirmCancel:\"Cancel\", confirmOk:\"Confirm\",\n    nameOverlayText:'Want to save this session with a name? That way you\\'ll recognise it easily in \"Your sessions\".',\n    nameOverlayLabel:\"Session name (optional)\", nameInputPh:\"E.g. Montseny trip\",\n    nameSkip:\"Not now\", nameSave:\"Save\",\n    wizardStepEquipo:\"Gear\", wizardStepParams:\"Parameters\", wizardStepHorario:\"Schedule\",\n    newSession:\"New session\", yourSessions:\"Your sessions\",\n    typePano:\"Milky Way panorama\", typeUnica:\"Single shot\",\n    cameraCount:\" camera(s)\", inProgress:\" \u00b7 in progress\",\n    noCamerasYet:\"You haven't added any camera to this session yet.\",\n    addFirstCamera:\"+ Add your first camera\", addAnotherCamera:\"+ Add another camera\",\n    editIcon:\"\u270e\", deleteIcon:\"\u2715\", viewSummaryTitle:\"View summary\", deleteSessionTitle:\"Delete session\",\n    cameraName:\"Camera name\", cameraNamePh:\"Camera\",\n    fieldCamera:\"Camera (gear)\", fieldLens:\"Lens (gear)\", fieldFocal:\"Focal length (mm)\",\n    manualOpt:\"\u2014 manual \u2014\", noneOpt:\"\u2014 none \u2014\", chooseOpt:\"\u2014 Choose from your gear \u2014\",\n    sensorWithCam:\"Sensor: \", sensorWithCamSuffix:\" (set in My Gear).\",\n    sensorNoCam:\"No catalog camera selected: Full Frame (x1) will be used. Register your camera in My Gear to set its sensor.\",\n    fieldTripod:\"Tripod (gear)\", fieldPhotoType:\"Photo type\",\n    optRGB:\"RGB\", optHA:\"H\u03b1 (narrowband)\",\n    fieldMount:\"Tracking type\", optNoTrack:\"No tracking (fixed tripod)\", optTrack:\"Tracking (active tracker)\",\n    mountHint:\"This only affects the maximum exposure calculation before stars start trailing.\",\n    fieldTracker:\"Tracker (gear)\", fieldFilter:\"Filter (gear)\",\n    fieldPanels:\"Vertical panels\", fieldExposure:\"Exposure per shot (s)\", fieldGap:\"Interval between shots (s)\",\n    fieldPanelSwitch:\"Panel switch time (s)\", panelSwitchHint:\"Time it takes you to move the framing to the next panel. Leave it at 0 if you don't want to count it.\",\n    fieldStart:\"Start time\", fieldEnd:\"End time\",\n    timeHint:\"Adjust the schedule based on galactic-core visibility or the arch-height limit you want to avoid.\",\n    resDuration:\"Session duration\", resTimePerPanel:\"Time per panel\", resTimeAvail:\"Time available\",\n    resExposure:\"Exposure per shot\", resPhotosPerPanel:\"Photos per panel\", resPhotosToTake:\"Photos to take\",\n    resIntegration:\"Integration\", resTotalPhotos:\"Total photos\",\n    resWarnInsufficient:\"The available time isn't even enough for one photo with this exposure and interval \u2014 shorten the interval, lower the exposure, or extend the session.\",\n    equipCamera:\"\ud83d\udcf7 \", equipLens:\"\ud83d\udd0e \", equipNoCam:\"No camera registered\",\n    equipRGB:\"\ud83c\udf08 RGB\", equipHA:\"\ud83d\udd34 H\u03b1 (narrowband)\",\n    equipFilterPrefix:\"\ud83c\udf9a \", equipNoTrack:\"\u26f0\ufe0f No tracking\", equipTrack:\"\ud83c\udfaf Tracking\",\n    equipTripodPrefix:\"\ud83e\uddbf \", equipTrackerPrefix:\"\u2b50 \", equipPanelsSuffix:\" panels\",\n    yourSession:\"Your session\", chronologyTitle:\"Night timeline\", chronologyMulti:\" \u2014 who shoots when\",\n    camerasLabel:\"Cameras\", totalPhotosLabel:\"Total photos\", integrationLabel:\"Accumulated integration\",\n    viewDetails:\"View all details \u25be\", hideDetails:\"Hide details \u25b4\",\n    insufficientAlert:\"\u26a0\ufe0f There isn't enough time to complete a photo with this setup.\",\n    usedCapture:\"Capture used of available time\", copiedCheck:\"Copied \u2713\",\n    specName:\"Camera\", specCamera:\"Camera\", specLens:\"Lens\", specFocal:\"Focal length used\",\n    specPhotoType:\"Photo type\", specFilter:\"Filter\", specTripod:\"Tripod\", specTracker:\"Tracker\",\n    specMount:\"Tracking type\", specSchedule:\"Schedule\", specPanels:\"Vertical panels\",\n    specGap:\"Interval between shots\", specExposure:\"Exposure per shot\", specPhotosPerPanel:\"Photos per panel\",\n    specPhotosToTake:\"Photos to take\", specIntegrationPerPanel:\"Integration per panel\", specTotalIntegration:\"Total integration\",\n    specTotalPhotos:\"Total photos\", none:\"None\", noneF:\"None\",\n    confirmDeleteCamera:\"Remove this camera from the session?\",\n    confirmDeleteCameraNamed:'Delete \"{name}\"?',\n    confirmNewSession:\"Reset this session? All configured cameras will be lost.\",\n    confirmDeleteSession:\"Delete this saved session? All its cameras will be lost.\",\n    insufficientShort:\"Not enough time for a photo with this setup\",\n    photosPerPanelSuffix:\" photos/panel\", panelsSuffix:\" panels\", photosSuffix:\" photos\", totalPhotosSuffix:\" total photos\",\n    addMoreCam:\"+ Add another camera\",\n    editTitle:\"Edit\", deleteTitle:\"Delete\",\n    historyMeta:\"{photos} photos, {cams} camera(s)\", historyView:\"View\", historyDelete:\"Delete\",\n    customSensor:\"Custom\",\n    noneRegistered:\"You don't have any registered in My Gear.\",\n    instructionPano:\"Shoot {n} photos of {s}s on each of the {p} panels (move to the next panel once you finish). Finish before {end}.\",\n    instructionUnica:\"Shoot {n} photos of {s}s. Finish before {end}.\",\n    sensorNoCamShort:\"Full Frame (35mm) \u2014 x1 (no camera registered)\",\n    specSensor:\"Sensor\", specTotalPhotosBlock:\"Total photos in this block\",\n    timelineStarts:\"starts\", timelineEnds:\"ends\", statPhotos:\"Photos\", statObjetivo:\"Lens\",\n    summaryGeneratedAt:\"{type} \u00b7 generated on {date}\", usedCapturePanel:\"Capture used per panel\",\n    summaryTxtHeader:\"SESSION SUMMARY\", summaryTxtGenerated:\"Generated on\", summaryTxtChronology:\"Timeline:\",\n    summaryTxtWarnInsufficient:\"WARNING: not enough time for a photo.\",\n    summaryTxtTotal:\"TOTAL: {n} camera(s), {photos} photos, {integ} accumulated integration.\"\n  }\n};\nfunction t(key){ return (I18N[kitLang] && I18N[kitLang][key]) || I18N.es[key] || key; }\nfunction tf(key, vars){\n  let s = t(key);\n  Object.keys(vars).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); });\n  return s;\n}\n\nconst SENSORS = [\n  { label: 'Full Frame (35mm) \u2014 x1', value: '1' },\n  { label: 'APS-C Nikon/Sony/Fuji \u2014 x1.5', value: '1.5' },\n  { label: 'APS-C Canon \u2014 x1.6', value: '1.6' },\n  { label: 'Micro 4/3 \u2014 x2', value: '2' },\n  { label: 'Personalizado', value: 'custom' },\n];\n\nlet blocks = [];\nlet counter = 0;\nlet sessionType = null;\nlet sessionId = null;\nlet sessionName = null;\nlet summaryHistory = [];\nlet sessions = [];\nlet nightMode = false;\nlet catalog = { cameras: [], lenses: [], tripods: [], trackers: [], filters: [], customCategories: [] };\nlet settingsReturnView = 'home';\n\n/* wizard state */\nlet draftBlock = null;\nlet wizardStep = 1;\nlet wizardEditingId = null;\nfunction WIZARD_STEPS_FN(){ return [t('wizardStepEquipo'), t('wizardStepParams'), t('wizardStepHorario')]; }\n\n/* ---------- PERSISTENCE ---------- */\nfunction loadSessions(){\n  try{\n    const raw = localStorage.getItem('mw_sessions_v1');\n    if(raw) sessions = JSON.parse(raw) || [];\n  }catch(e){ sessions = []; }\n}\nfunction saveSessions(){ try{ localStorage.setItem('mw_sessions_v1', JSON.stringify(sessions)); }catch(e){} }\nfunction persistActiveSession(){\n  if(!sessionId) return;\n  const idx = sessions.findIndex(s => s.id === sessionId);\n  if(!blocks.length){\n    if(idx >= 0) sessions.splice(idx, 1);\n    return;\n  }\n  const record = { id: sessionId, type: sessionType, name: sessionName, blocks: JSON.parse(JSON.stringify(blocks)), counter, updatedAt: Date.now() };\n  if(idx >= 0) sessions[idx] = record; else sessions.push(record);\n}\nfunction syncSession(){ persistActiveSession(); saveSessions(); }\n\nconst PBL_CATEGORY_MAP = { camaras: 'cameras', objetivos: 'lenses', tripode: 'tripods', trackers: 'trackers', filtros: 'filters' };\nfunction loadCatalog(){\n  catalog = { cameras:[], lenses:[], tripods:[], trackers:[], filters:[], customCategories:[] };\n  try{\n    const raw = localStorage.getItem('equipoApp_v1');\n    if(!raw) return;\n    const pbl = JSON.parse(raw);\n    (pbl.catalog || []).forEach(ci => {\n      const type = PBL_CATEGORY_MAP[ci.category];\n      if(!type) return;\n      if(type === 'cameras') catalog.cameras.push({ id: ci.id, name: ci.name, sensor: ci.sensor || '1', customCrop: ci.customCrop || 1 });\n      else if(type === 'lenses') catalog.lenses.push({ id: ci.id, name: ci.name, focal: ci.focal || 0 });\n      else if(type === 'filters') catalog.filters.push({ id: ci.id, name: ci.name, type: ci.filterType || 'RGB' });\n      else catalog[type].push({ id: ci.id, name: ci.name });\n    });\n  }catch(e){}\n}\nfunction saveCatalog(){ /* el equipo se gestiona en Mi equipo; aqu\u00ed solo se lee */ }\nfunction applyNightMode(on, persist){\n  nightMode = on;\n  if(on) document.documentElement.setAttribute('data-mode', 'night');\n  else document.documentElement.removeAttribute('data-mode');\n  if(persist !== false){ try{ localStorage.setItem('mw_night_v1', on ? '1' : '0'); }catch(e){} }\n  document.querySelectorAll('.night-icon').forEach(btn => { btn.textContent = on ? '\u2600' : '\ud83c\udf19'; });\n}\nfunction loadNightPref(){\n  let on = false;\n  try{ on = localStorage.getItem('kitNight_v1') === 'on'; }catch(e){}\n  applyNightMode(on, false);\n}\n\n/* ---------- HELPERS ---------- */\nfunction escapeHtml(str){ return String(str).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction sessionMinutes(start, end){\n  if(!start || !end) return 0;\n  const [sh,sm] = start.split(':').map(Number);\n  const [eh,em] = end.split(':').map(Number);\n  let s = sh*60+sm, e = eh*60+em;\n  if(e <= s) e += 24*60;\n  return e - s;\n}\nfunction fmtHM(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h > 0 ? `${h}h ${m}m` : `${m}m`; }\nfunction fmtMS(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return m > 0 ? `${m}m ${s}s` : `${s}s`; }\nfunction catalogItem(type, id){ return catalog[type].find(x => x.id === id) || null; }\nfunction lensDisplayName(lens){\n  if(!lens) return '';\n  return /\\d+(?:[.,]\\d+)?\\s*mm\\b/i.test(lens.name) ? lens.name : `${lens.name} ${lens.focal}mm`;\n}\nfunction lensFocalDefault(lens){\n  if(!lens) return undefined;\n  const name = String(lens.name);\n  const rangeMatch = name.match(/(\\d+(?:[.,]\\d+)?)\\s*-\\s*(\\d+(?:[.,]\\d+)?)\\s*mm/i);\n  if(rangeMatch) return Number(rangeMatch[1].replace(',', '.'));\n  const singleMatch = name.match(/(\\d+(?:[.,]\\d+)?)\\s*mm/i);\n  if(singleMatch) return Number(singleMatch[1].replace(',', '.'));\n  return lens.focal || undefined;\n}\nfunction el(tag, attrs, children){\n  const e = document.createElement(tag);\n  for(const k in (attrs||{})){\n    const v = attrs[k];\n    if(v === null || v === undefined) continue;\n    if(k === 'class') e.className = v;\n    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);\n    else e.setAttribute(k, v);\n  }\n  (children||[]).forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));\n  return e;\n}\nfunction field(labelText, inputEl){ return el('div', {class:'field'}, [el('label', {}, [labelText]), inputEl]); }\nfunction selectWithValue(options, currentValue, onChange){\n  const select = el('select', {oninput: e => onChange(e.target.value)});\n  options.forEach(([value, label]) => select.appendChild(el('option', {value}, [label])));\n  select.value = currentValue || '';\n  return select;\n}\nconst BLOCK_FIELD_BY_TYPE = { cameras:'cameraId', lenses:'lensId', tripods:'tripodId', trackers:'trackerId', filters:'filterId' };\nfunction isItemUsedElsewhere(type, itemId, excludeBlockId){\n  if(!itemId) return false;\n  const field = BLOCK_FIELD_BY_TYPE[type];\n  if(!field) return false;\n  return blocks.some(b => b.id !== excludeBlockId && b[field] === itemId);\n}\nfunction catalogSelect(labelText, type, currentId, placeholder, onChange, excludeBlockId){\n  const available = catalog[type].filter(i => i.id === currentId || !isItemUsedElsewhere(type, i.id, excludeBlockId));\n  const options = [['', placeholder]].concat(available.map(i => [i.id, i.name]));\n  return field(labelText, selectWithValue(options, currentId, onChange));\n}\n\nfunction checkRow(text, checked, onClick){\n  return el('div', {class:'check-row-item' + (checked ? ' checked' : ''), onclick: onClick}, [\n    el('div', {class:'check-mark'}, [checked ? '\u2713' : '']),\n    el('div', {class:'check-row-label'}, [text]),\n  ]);\n}\nfunction catalogCheckList(labelText, type, currentId, placeholder, onChange, excludeBlockId){\n  const available = catalog[type].filter(i => i.id === currentId || !isItemUsedElsewhere(type, i.id, excludeBlockId));\n  const wrap = el('div', {class:'field'}, [el('label', {}, [labelText])]);\n  const list = el('div', {class:'check-list'});\n  list.appendChild(checkRow(placeholder, !currentId, () => onChange('')));\n  if(!available.length){\n    list.appendChild(el('div', {class:'check-list-empty'}, [t('noneRegistered')]));\n  }\n  available.forEach(i => {\n    list.appendChild(checkRow(i.name, i.id === currentId, () => onChange(i.id)));\n  });\n  wrap.appendChild(list);\n  return wrap;\n}\n\n/* ---------- BLOCK MODEL ---------- */\nfunction newBlock(overrides){\n  counter++;\n  return Object.assign({\n    id: 'b' + counter + '_' + Date.now(),\n    name: t('cameraNamePh') + ' ' + counter,\n    cameraId: '', lensId: '', tripodId: '', trackerId: '', filterId: '',\n    focal: 17,\n    type: 'RGB', mount: 'tripode', panels: 0,\n    start: '22:00', end: '23:00', gap: 0,\n    exposureSec: 0,\n    panelSwitchSec: 0,\n  }, overrides || {});\n}\nfunction defaultBlockForType(type){\n  if(type === 'panoramica') return newBlock({ focal:17, type:'RGB', mount:'tripode', panels:0, start:'22:00', end:'23:00', gap:0 });\n  return newBlock({ focal:24, type:'RGB', mount:'tripode', panels:0, start:'22:00', end:'23:00', gap:0 });\n}\nfunction getBlockCrop(b){\n  const cam = catalogItem('cameras', b.cameraId);\n  if(cam) return cam.sensor === 'custom' ? (Number(cam.customCrop) || 1) : Number(cam.sensor);\n  return 1;\n}\n\n/* ---------- CALCULATIONS ---------- */\nfunction computeBlock(b){\n  const panels = sessionType === 'unica' ? 1 : Math.max(1, Math.round(Number(b.panels)) || 1);\n  const totalMin = sessionMinutes(b.start, b.end);\n  const totalSec = totalMin * 60;\n  const panelChangeSec = sessionType === 'panoramica' ? Math.max(0, Number(b.panelSwitchSec) || 0) : 0;\n  const totalChangeSec = panels > 1 ? panelChangeSec * (panels - 1) : 0;\n  const availableSec = Math.max(0, totalSec - totalChangeSec);\n  const perPanelSec = availableSec / panels;\n  const exposure = Number(b.exposureSec) > 0 ? Number(b.exposureSec) : 15;\n  const gap = Math.max(0, Number(b.gap) || 0);\n  const cycle = exposure + gap;\n  const photosPerPanel = cycle > 0 ? Math.floor(perPanelSec / cycle) : 0;\n  const integrationPerPanel = photosPerPanel * exposure;\n  const totalPhotos = photosPerPanel * panels;\n  const insufficientTime = totalSec > 0 && photosPerPanel < 1;\n  return { totalMin, perPanelSec, exposure, photosPerPanel, integrationPerPanel, totalPhotos, insufficientTime, panels, totalChangeSec };\n}\n\n/* ---------- VIEW NAVIGATION ---------- */\nfunction showView(name){\n  ['home','config','wizard','summary'].forEach(v => document.getElementById('view-'+v).classList.toggle('active', v === name));\n  window.scrollTo({top:0});\n}\ bottom:6px;}\n  .field input[type=number], .field input[type=text], .field input[type=time]{\n    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--star);\n    font-family:var(--mono); font-size:17px; padding:12px 14px; border-radius:10px; outline:none;\n  }\n  .field input:focus{border-color:var(--brass);}\n  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}\n\n  .primary-btn{\n    width:100%; padding:15px; border-radius:12px; border:none; background:var(--brass);\n    color:#1a1200; font-weight:700; font-size:15px; cursor:pointer;\n  }\n  body.red .primary-btn{color:#1a0000;}\n  .back-link{font-size:13px; color:var(--dim); margin-bottom:14px; cursor:pointer; display:inline-flex; align-items:center; gap:4px;}\n\n  #session-view{display:none;}\n  .phase-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}\n  .phase-header h2{font-size:20px; margin:0;}\n  .phase-header .emoji{font-size:22px; margin-right:6px;}\n  .phase-desc{color:var(--dim); font-size:13px; line-height:1.55; margin:6px 0 18px;}\n\n  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}\n  .stat{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}\n  .stat .val{font-family:var(--mono); font-size:20px; font-weight:600; color:var(--brass);}\n  .stat .lbl{font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.35;}\n\n  .target-stat{display:flex; align-items:center; justify-content:space-between; gap:10px;}\n  .stepbtns{display:flex; gap:8px;}\n  .stepbtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--star); font-size:17px; cursor:pointer;}\n\n  .done-row{\n    background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:16px;\n    display:flex; align-items:center; gap:14px; margin-bottom:16px; cursor:pointer;\n  }\n  .done-row .checkbox{\n    width:32px; height:32px; border-radius:9px; border:2px solid var(--dim); flex:none;\n    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--void);\n  }\n  .done-row.done .checkbox{background:var(--ok); border-color:var(--ok);}\n  .done-row .done-title{font-weight:700; font-size:16px;}\n  .done-row.done .done-title{color:var(--dim); text-decoration:line-through;}\n  .done-row .done-sub{font-size:12px; color:var(--dim); margin-top:2px;}\n\n  .note{\n    font-size:12.5px; color:var(--dim); line-height:1.6; background:var(--panel-2);\n    border-left:3px solid var(--brass-dim); border-radius:8px; padding:10px 12px; margin-bottom:6px;\n  }\n\n  .howto{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px 14px 6px; margin-bottom:16px;}\n  .howto-title{font-size:13px; font-weight:700; margin-bottom:10px;}\n  .howto ol{list-style:none; margin:0; padding:0; counter-reset:step;}\n  .howto ol li{\n    counter-increment:step; display:flex; gap:10px; align-items:flex-start;\n    font-size:13px; color:var(--star); line-height:1.5; padding-bottom:12px;\n  }\n  .howto ol li::before{\n    content:counter(step); flex:none; width:20px; height:20px; border-radius:50%;\n    background:var(--brass-dim); color:var(--star); font-size:11px; font-weight:700;\n    display:flex; align-items:center; justify-content:center; font-family:var(--mono);\n  }\n\n  .summary-total{text-align:center; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line);}\n  .summary-total-val{font-family:var(--mono); font-size:27px; font-weight:700; color:var(--brass); letter-spacing:-.01em;}\n  .summary-total-lbl{font-size:11.5px; color:var(--dim); margin-top:1px;}\n  .summary-time-row{\n    display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--mono); font-size:12px;\n    color:var(--star); background:var(--panel-2); border:1px solid var(--line); border-radius:9px;\n    padding:7px 9px; margin-bottom:10px;\n  }\n  .summary-breakdown{display:flex; flex-direction:column; gap:0; margin-bottom:4px;}\n  .summary-breakdown > div{display:flex; align-items:center; justify-content:space-between; padding:6px 2px; border-bottom:1px solid var(--line); font-size:12.5px;}\n  .summary-breakdown > div:last-child{border-bottom:none;}\n  .summary-breakdown > div span:last-child{font-family:var(--mono); color:var(--dim);}\n  .resumen-actions{display:flex; flex-direction:column; gap:8px; margin-top:18px;}\n  .ghost-btn{width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--star); font-size:14px; cursor:pointer;}\n  .ghost-btn.danger{color:#ff8a8a; border-color:#4a2020;}\n\n  nav.tabs{\n    position:fixed; bottom:0; left:0; right:0; z-index:5; background:var(--panel);\n    border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); display:none;\n  }\n  nav.tabs .tabs-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}\n  nav.tabs button{\n    background:none; border:none; color:var(--dim); font-family:var(--sans); display:flex;\n    flex-direction:column; align-items:center; gap:3px; padding:6px 1px; border-radius:10px; cursor:pointer; font-size:10.5px;\n  }\n  nav.tabs button .ico{font-size:18px;}\n  nav.tabs button.active{color:var(--brass); background:var(--panel-2);}\n\n  .modal-overlay{position:fixed; inset:0; background:rgba(2,4,10,.72); display:none; align-items:center; justify-content:center; z-index:50; padding:24px;}\n  .modal-overlay.show{display:flex;}\n  .modal-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px 24px; max-width:360px; width:100%; text-align:center;}\n  .modal-card .modal-glyph{font-size:44px; margin-bottom:12px;}\n  .modal-card h3{margin:0 0 8px; font-size:19px; font-weight:700;}\n  .modal-card p{margin:0 0 22px; font-size:13.5px; color:var(--dim); line-height:1.6;}\n  .modal-card .primary-btn{margin-bottom:10px;}\n\n  .reorder-row{\n    display:flex; align-items:center; gap:12px; padding:12px 4px;\n    border-bottom:1px solid var(--line);\n  }\n  .reorder-row:last-child{border-bottom:none;}\n  .reorder-icon{font-size:20px; flex:none;}\n  .reorder-label{flex:1; font-weight:600; font-size:14px;}\n  .reorder-btns{display:flex; gap:6px;}\n  .reorder-btns button:disabled{opacity:.25; cursor:default;}\n</style>\n</head>\n<body>\n<div class=\"app\">\n  <header>\n    <div class=\"topline\">\n      <div class=\"brand\">\n        <span class=\"stars\" data-i18n=\"eyebrow\">SESI\u00d3N DE CALIBRACI\u00d3N</span>\n        <h1>Tomas calibraci\u00f3n astrofotograf\u00eda</h1>\n      </div>\n      <div class=\"header-actions\">\n        <button class=\"modebtn\" id=\"headerHelpBtn\" title=\"Ayuda\">\u2753</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"headerSub\" data-i18n=\"homeText\">Indica los par\u00e1metros de tus Lights y te genero el plan de Darks, Bias y Flats para calibrar tu sesi\u00f3n, con los tiempos totales.</p>\n  </header>\n\n  <div class=\"progress-wrap\" id=\"progressWrap\">\n    <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"></div></div>\n    <div class=\"progress-label\"><span id=\"progressText\">0 / 4</span><span id=\"progressPct\">0%</span></div>\n  </div>\n\n  <main>\n    <!-- HOME VIEW -->\n    <div id=\"home-view\">\n      <p class=\"section-label\" data-i18n=\"newSessionLabel\">Nueva sesi\u00f3n</p>\n      <button class=\"primary-btn\" id=\"startNewBtn\" data-i18n=\"homeBtn\">\ud83c\udf0c Nueva sesi\u00f3n</button>\n\n      <div class=\"history-list\" id=\"historyList\" style=\"display:none;\"></div>\n\n    </div>\n\n    <!-- HELP VIEW -->\n    <div id=\"help-view\" style=\"display:none;\">\n      <div class=\"back-link\" id=\"backFromHelp\"><span data-i18n=\"setupBack\">\u2039 Volver</span></div>\n      <div class=\"card\">\n        <h2 data-i18n=\"helpTitle\">C\u00f3mo funciona Tomas calibraci\u00f3n astrofotograf\u00eda</h2>\n      </div>\n      <div class=\"howto\">\n        <ol>\n          <li data-i18n=\"helpStep1\">Indica los par\u00e1metros de tus Lights: tiempo de exposici\u00f3n, ISO, apertura y cu\u00e1ntas fotos vas a hacer.</li>\n          <li data-i18n=\"helpStep2\">La app calcula autom\u00e1ticamente cu\u00e1ntas Darks, Bias y Flats necesitas y con qu\u00e9 ajustes hacerlos.</li>\n          <li data-i18n=\"helpStep3\">Ve marcando cada fase como hecha a medida que la completas; puedes reordenar el orden desde el Resumen.</li>\n          <li data-i18n=\"helpStep4\">Consulta en todo momento el tiempo total estimado de la sesi\u00f3n en la pesta\u00f1a Resumen.</li>\n        </ol>\n      </div>\n\n      <div class=\"card\">\n        <h2 data-i18n=\"helpInstallTitle\">\ud83d\udce6 Parte del kit Photo liveTools</h2>\n        <p class=\"sub\" data-i18n=\"helpInstallText\">Esta herramienta es una de las 6 que forman el kit. Guarda el archivo completo en tu dispositivo para abrirlo sin conexi\u00f3n cuando lo necesites.</p>\n      </div>\n    </div>\n\n    <!-- SETUP VIEW -->\n    <div id=\"setup-view\" style=\"display:none;\">\n      <div class=\"back-link\" id=\"backFromSetup\"><span data-i18n=\"setupBack\">\u2039 Volver</span></div>\n      <div class=\"card\">\n        <h2 data-i18n=\"setupTitle\">Par\u00e1metros de tus Lights</h2>\n        <p class=\"sub\" data-i18n=\"setupExplain\">Los Lights son las fotos normales que le haces al objeto (una galaxia, una nebulosa, la V\u00eda L\u00e1ctea...): las que despu\u00e9s apilar\u00e1s para conseguir la imagen final. A partir de estos datos calculo tus tomas de calibraci\u00f3n: Darks, Bias y Flats.</p>\n\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label data-i18n=\"lblExposure\">Tiempo exposici\u00f3n (s)</label>\n            <input type=\"number\" id=\"in-exposure\" placeholder=\"15\" min=\"0\" step=\"0.1\">\n          </div>\n          <div class=\"field\">\n            <label>ISO</label>\n            <input type=\"number\" id=\"in-iso\" placeholder=\"200\" min=\"0\">\n          </div>\n        </div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label data-i18n=\"lblNumLights\">N\u00ba de Lights</label>\n            <input type=\"number\" id=\"in-numlights\" placeholder=\"1\" min=\"0\">\n          </div>\n          <div class=\"field\">\n            <label data-i18n=\"lblAperture\">Apertura (n\u00ba f)</label>\n            <input type=\"text\" id=\"in-aperture\" placeholder=\"2.8\">\n          </div>\n        </div>\n        <div class=\"field\">\n          <label data-i18n=\"lblStartTime\">Hora de inicio (opcional)</label>\n          <input type=\"time\" id=\"in-starttime\">\n        </div>\n      </div>\n\n      <button class=\"primary-btn\" id=\"startBtn\" data-i18n=\"btnGenerate\">Generar plan de sesi\u00f3n</button>\n    </div>\n\n    <!-- SESSION VIEW -->\n    <div id=\"session-view\">\n      <div id=\"panel-resumen\"></div>\n      <div id=\"panel-lights\" style=\"display:none;\"></div>\n      <div id=\"panel-darks\" style=\"display:none;\"></div>\n      <div id=\"panel-bias\" style=\"display:none;\"></div>\n      <div id=\"panel-flats\" style=\"display:none;\"></div>\n    </div>\n  </main>\n\n  <nav class=\"tabs\" id=\"tabsNav\">\n    <div class=\"tabs-inner\" id=\"tabsInner\"></div>\n  </nav>\n\n  <div class=\"modal-overlay\" id=\"confirmModal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-glyph\">\ud83d\uddd1\ufe0f</div>\n      <h3 data-i18n=\"confirmTitle\">\u00bfEmpezar de cero?</h3>\n      <p data-i18n=\"confirmText\">Se borrar\u00e1 esta sesi\u00f3n y sus datos guardados en el tel\u00e9fono.</p>\n      <button class=\"primary-btn\" id=\"confirmYesBtn\" data-i18n=\"confirmYes\">S\u00ed, borrar y empezar</button>\n      <button class=\"ghost-btn\" id=\"confirmNoBtn\" data-i18n=\"confirmNo\">Cancelar</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"completeModal\">\n    <div class=\"modal-card\">\n      <div class=\"modal-glyph\">\ud83c\udf89</div>\n      <h3 data-i18n=\"completeTitle\">\u00a1Sesi\u00f3n completada!</h3>\n      <p data-i18n=\"completeText\">Has marcado como hechas las 4 fases: Lights, Darks, Bias y Flats. Ya puedes apilar tus im\u00e1genes.</p>\n      <button class=\"primary-btn\" id=\"modalFinishBtn\" data-i18n=\"btnFinishSession\">\u2705 Finalizar sesi\u00f3n</button>\n      <button class=\"ghost-btn\" id=\"modalCloseBtn\" data-i18n=\"completeClose\">Seguir en la sesi\u00f3n</button>\n      <button class=\"ghost-btn danger\" id=\"modalNewSessionBtn\" data-i18n=\"btnNewSession\">\ud83d\uddd1\ufe0f Empezar sesi\u00f3n nueva</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"reorderModal\">\n    <div class=\"modal-card\" style=\"text-align:left;\">\n      <h3 data-i18n=\"reorderTitle\" style=\"text-align:center;\">Reordenar sesi\u00f3n</h3>\n      <p data-i18n=\"reorderText\" style=\"text-align:center;\">Cambia el orden en el que quieres hacer las fases, por ejemplo si prefieres los Bias antes que los Flats.</p>\n      <div id=\"reorderList\"></div>\n      <button class=\"primary-btn\" id=\"reorderDoneBtn\" data-i18n=\"reorderDone\" style=\"margin-top:16px;\">Listo</button>\n    </div>\n  </div>\n\n  <div class=\"modal-overlay\" id=\"nameModal\">\n    <div class=\"modal-card\" style=\"text-align:left;\">\n      <h3 style=\"text-align:center;\" data-i18n=\"nameModalTitle\">\u00bfGuardar con un nombre?</h3>\n      <p style=\"text-align:center;\" data-i18n=\"nameModalText\">As\u00ed reconocer\u00e1s esta sesi\u00f3n en tus sesiones recientes.</p>\n      <div class=\"field\">\n        <label data-i18n=\"nameModalLabel\">Nombre de la sesi\u00f3n (opcional)</label>\n        <input type=\"text\" id=\"nameModalInput\" placeholder=\"Ej. Nebulosa de Ori\u00f3n\">\n      </div>\n      <button class=\"primary-btn\" id=\"nameModalSaveBtn\" data-i18n=\"nameModalSave\" style=\"margin-bottom:10px;\">Guardar</button>\n      <button class=\"ghost-btn\" id=\"nameModalSkipBtn\" data-i18n=\"nameModalSkip\">Ahora no</button>\n    </div>\n  </div>\n</div>\n\n<script>\n// ---------------------------------------------------------------------\n// i18n\n// ---------------------------------------------------------------------\nconst I18N = {\n  es: {\n    eyebrow: \"SESI\u00d3N DE CALIBRACI\u00d3N\",\n    homeText: \"Indica los par\u00e1metros de tus Lights y te genero el plan de Darks, Bias y Flats para calibrar tu sesi\u00f3n, con los tiempos totales.\",\n    newSessionLabel: \"Nueva sesi\u00f3n\",\n    homeBtn: \"\ud83c\udf0c Nueva sesi\u00f3n\",\n    homeFooterCredit: \"App creada por\",\n    homeCopyright: \"Todos los derechos reservados.\",\n    helpBtn: \"\u2753 C\u00f3mo funciona la app\",\n    historyTitle: \"\ud83d\udd58 Sesiones recientes\",\n    historyDelete: \"Eliminar\",\n    justNow: \"ahora mismo\",\n    minAgo: \"min\",\n    hAgo: \"h\",\n    dAgo: \"d\",\n    helpTitle: \"C\u00f3mo funciona Tomas calibraci\u00f3n astrofotograf\u00eda\",\n    helpStep1: \"Indica los par\u00e1metros de tus Lights: tiempo de exposici\u00f3n, ISO, apertura y cu\u00e1ntas fotos vas a hacer.\",\n    helpStep2: \"La app calcula autom\u00e1ticamente cu\u00e1ntas Darks, Bias y Flats necesitas y con qu\u00e9 ajustes hacerlos.\",\n    helpStep3: \"Ve marcando cada fase como hecha a medida que la completas; puedes reordenar el orden desde el Resumen.\",\n    helpStep4: \"Consulta en todo momento el tiempo total estimado de la sesi\u00f3n en la pesta\u00f1a Resumen.\",\n    helpInstallTitle: \"\ud83d\udce6 Parte del kit Photo liveTools\",\n    helpInstallText: \"Esta herramienta es una de las 6 que forman el kit. Guarda el archivo completo en tu dispositivo para abrirlo sin conexi\u00f3n cuando lo necesites.\",\n    helpIosTitle: \"En iPhone / iPad (Safari)\",\n    helpIosStep1: \"Abre esta p\u00e1gina con Safari.\",\n    helpIosStep2: \"Toca el icono de compartir (
