rChecklist(); renderCatalog(); save();\n  });\n\n  // ---------- share / export ----------\n  document.getElementById(\"btnUncheckAll\").addEventListener(\"click\", function(){\n    var list = activeList();\n    if (!list) return;\n    list.items.forEach(function(it){ it.packed = false; });\n    renderWeight(); renderChecklist(); renderCatalog(); save();\n  });\n\n  function renderBagModal(){\n    var list = activeList();\n    var packed = (list ? list.items : []).filter(function(it){ return it.packed; });\n    var total = 0;\n    var html = \"\";\n    if (!packed.length){\n      html = '<p style=\"color:var(--text-dim);\">'+t(\"bag_empty_text\")+'</p>';\n    } else {\n      html = '<div>';\n      packed.forEach(function(it){\n        var ci = catalogItem(it.itemId);\n        if (!ci) return;\n        var w = ci.weight * it.qty;\n        total += w;\n        html += '<div style=\"display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);\">';\n        html += '<span>'+esc(displayName(ci))+(it.qty>1?' \u00d7'+it.qty:'')+'</span>';\n        html += '<span style=\"color:var(--text-dim);font-variant-numeric:tabular-nums;\">'+w.toLocaleString(\"es-ES\")+' g</span>';\n        html += '</div>';\n      });\n      html += '<div style=\"display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid var(--accent);font-weight:800;font-family:var(--font-display);\">';\n      html += '<span>'+t(\"bag_total_label\")+'</span><span>'+total.toLocaleString(\"es-ES\")+' g</span></div></div>';\n    }\n    document.getElementById(\"bagModalTitle\").textContent = t(\"bag_title\") + (list ? \": \" + listDisplayName(list) : \"\");\n    document.getElementById(\"bagModalBody\").innerHTML = html;\n    document.getElementById(\"bagLuckyMsg\").textContent = t(\"bag_lucky_msg\");\n  }\n  document.getElementById(\"btnViewBag\").addEventListener(\"click\", function(){\n    renderBagModal();\n    openModal(\"modalBag\");\n  });\n\n  // ---------- tiny dependency-free PDF writer (no external libs, no print dialog) ----------\n  function pdfEscape(s){\n    s = String(s);\n    var out = \"\";\n    for (var i=0;i<s.length;i++){\n      var c = s.charCodeAt(i);\n      if (c > 255) continue; // drop characters the base PDF font can't render (emoji, etc.)\n      var ch = s[i];\n      if (ch === \"\\\\\" || ch === \"(\" || ch === \")\") out += \"\\\\\" + ch;\n      else out += ch;\n    }\n    return out;\n  }\n\n  function buildSimplePdfBlob(opts){\n    var pageWidth = 595, pageHeight = 842, marginX = 50, colX = pageWidth - marginX - 90;\n    var pages = [];\n    var cs = \"\";\n    var y = pageHeight - 60;\n\n    function flushPage(){ pages.push(cs); cs = \"\"; }\n    function ensureRoom(minY){ if (y < minY){ flushPage(); y = pageHeight - 60; } }\n    function text(str, x, yy, font, size){\n      cs += \"BT /\" + font + \" \" + size + \" Tf 1 0 0 1 \" + x.toFixed(1) + \" \" + yy.toFixed(1) + \" Tm (\" + pdfEscape(str) + \") Tj ET\\n\";\n    }\n    function hrule(yy){\n      cs += \"0.6 w\\n\" + marginX + \" \" + yy.toFixed(1) + \" m \" + (pageWidth - marginX) + \" \" + yy.toFixed(1) + \" l S\\n\";\n    }\n\n    text(opts.title || \"Mochila\", marginX, y, \"F2\", 18); y -= 20;\n    if (opts.subtitle){ text(opts.subtitle, marginX, y, \"F1\", 9); y -= 24; } else { y -= 10; }\n\n    if (!opts.rows.length){\n      text(opts.emptyText, marginX, y, \"F1\", 11);\n    } else {\n      text(opts.itemCol, marginX, y, \"F2\", 10);\n      text(opts.weightCol, colX, y, \"F2\", 10);\n      y -= 4; hrule(y); y -= 14;\n      opts.rows.forEach(function(r){\n        ensureRoom(70);\n        text(r.name, marginX, y, \"F1\", 10);\n        text(r.weight, colX, y, \"F1\", 10);\n        y -= 16;\n      });\n      ensureRoom(90);\n      y -= 2; hrule(y); y -= 18;\n      text(opts.totalLabel, marginX, y, \"F2\", 12);\n      text(opts.totalValue, colX, y, \"F2\", 12);\n      y -= 26;\n      if (opts.footer){ text(opts.footer, marginX, y, \"F1\", 11); }\n    }\n    flushPage();\n\n    var n = pages.length;\n    var fontRegNum = 3 + n + n;\n    var fontBoldNum = fontRegNum + 1;\n    var objs = {};\n    objs[1] = \"<< /Type /Catalog /Pages 2 0 R >>\";\n    var kids = [];\n    for (var i=0;i<n;i++){ kids.push((3+i)+\" 0 R\"); }\n    objs[2] = \"<< /Type /Pages /Kids [\"+kids.join(\" \")+\"] /Count \"+n+\" >>\";\n    for (var i=0;i<n;i++){\n      var pageObjNum = 3+i;\n      var contentObjNum = 3+n+i;\n      objs[pageObjNum] = \"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 \"+pageWidth+\" \"+pageHeight+\"] /Resources << /Font << /F1 \"+fontRegNum+\" 0 R /F2 \"+fontBoldNum+\" 0 R >> >> /Contents \"+contentObjNum+\" 0 R >>\";\n    }\n    for (var i=0;i<n;i++){\n      var contentObjNum = 3+n+i;\n      var stream = pages[i];\n      objs[contentObjNum] = \"<< /Length \"+stream.length+\" >>\\nstream\\n\"+stream+\"endstream\";\n    }\n    objs[fontRegNum] = \"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\";\n    objs[fontBoldNum] = \"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\";\n\n    var maxObjNum = fontBoldNum;\n    var body = \"%PDF-1.4\\n\";\n    var offsets = [0];\n    for (var num=1; num<=maxObjNum; num++){\n      offsets[num] = body.length;\n      body += num+\" 0 obj\\n\"+objs[num]+\"\\nendobj\\n\";\n    }\n    var xrefOffset = body.length;\n    body += \"xref\\n0 \"+(maxObjNum+1)+\"\\n0000000000 65535 f \\n\";\n    for (var num=1; num<=maxObjNum; num++){\n      var off = String(offsets[num]);\n      while (off.length < 10) off = \"0\" + off;\n      body += off+\" 00000 n \\n\";\n    }\n    body += \"trailer\\n<< /Size \"+(maxObjNum+1)+\" /Root 1 0 R >>\\nstartxref\\n\"+xrefOffset+\"\\n%%EOF\";\n\n    var bytes = new Uint8Array(body.length);\n    for (var i=0;i<body.length;i++){ bytes[i] = body.charCodeAt(i) & 0xFF; }\n    return new Blob([bytes], {type:\"application/pdf\"});\n  }\n\n  document.getElementById(\"btnExportBagPdf\").addEventListener(\"click\", function(){\n    try{\n      var list = activeList();\n      var packed = (list ? list.items : []).filter(function(it){ return it.packed; });\n      var listName = listDisplayName(list || {name:\"\"});\n      var dateStr = new Date().toLocaleDateString();\n      var total = 0;\n      var rows = [];\n      packed.forEach(function(it){\n        var ci = catalogItem(it.itemId);\n        if (!ci) return;\n        var w = ci.weight * it.qty;\n        total += w;\n        rows.push({ name: displayName(ci) + (it.qty > 1 ? \" x\" + it.qty : \"\"), weight: w.toLocaleString(\"es-ES\") + \" g\" });\n      });\n      var blob = buildSimplePdfBlob({\n        title: listName || \"Mochila\",\n        subtitle: \"Mochila - \" + t(\"print_generated_on\") + \" \" + dateStr,\n        rows: rows,\n        itemCol: t(\"print_item_col\"),\n        weightCol: t(\"print_weight_col\"),\n        totalLabel: t(\"print_total_row\"),\n        totalValue: total.toLocaleString(\"es-ES\") + \" g\",\n        footer: t(\"bag_lucky_msg\"),\n        emptyText: t(\"bag_empty_text\")\n      });\n      var url = URL.createObjectURL(blob);\n      var a = document.createElement(\"a\");\n      var fileSlug = (listName || \"mochila\").toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-+|-+$/g, \"\") || \"mochila\";\n      a.href = url; a.download = \"mochila-\" + fileSlug + \".pdf\";\n      document.body.appendChild(a); a.click(); document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n    }catch(e){\n      showInfo(t(\"pdf_lib_unavailable_msg\"));\n    }\n  });\n\n  document.getElementById(\"btnShare\").addEventListener(\"click\", function(){\n    var list = activeList();\n    if (!list){ return; }\n    var usedIds = {};\n    list.items.forEach(function(it){ usedIds[it.itemId] = true; });\n    var usedCatIds = {};\n    var catalogSubset = equipoCatalog.filter(function(ci){\n      if (!usedIds[ci.id]) return false;\n      usedCatIds[ci.category] = true;\n      return true;\n    }).map(function(ci){\n      var o = {id:ci.id, name:displayName(ci), weight:ci.weight, category:ci.category};\n      if (ci.i18nKey) o.i18nKey = ci.i18nKey;\n      return o;\n    });\n    var categorySubset = equipoCategories.filter(function(c){ return usedCatIds[c.id]; }).map(function(c){\n      return {id:c.id, name:categoryName(c), icon:c.icon};\n    });\n    var payload = {\n      app:\"photopack\", version:2,\n      list: {name:listDisplayName(list), items:list.items},\n      catalog: catalogSubset,\n      categories: categorySubset\n    };\n    document.getElementById(\"shareText\").value = JSON.stringify(payload, null, 0);\n    openModal(\"modalShare\");\n  });\n  document.getElementById(\"btnCopyShare\").addEventListener(\"click\", function(){\n    var ta = document.getElementById(\"shareText\");\n    ta.select();\n    try{ document.execCommand(\"copy\"); }catch(e){}\n    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});\n    var btn = document.getElementById(\"btnCopyShare\");\n    var old = btn.textContent; btn.textContent = t(\"copied_msg\");\n    setTimeout(function(){ btn.textContent = old; }, 1400);\n  });\n  document.getElementById(\"btnDownloadShare\").addEventListener(\"click\", function(){\n    var text = document.getElementById(\"shareText\").value;\n    var list = activeList();\n    var blob = new Blob([text], {type:\"application/json\"});\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url;\n    a.download = \"photopack-\" + (list ? listDisplayName(list).toLowerCase().replace(/[^a-z0-9]+/g,\"-\") : \"checklist\") + \".json\";\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  });\n\n  // ---------- import ----------\n  document.getElementById(\"btnImportHome\").addEventListener(\"click\", function(){\n    document.getElementById(\"importText\").value = \"\";\n    document.getElementById(\"importFile\").value = \"\";\n    openModal(\"modalImport\");\n  });\n  document.getElementById(\"importFile\").addEventListener(\"change\", function(e){\n    var file = e.target.files[0];\n    if (!file) return;\n    var reader = new FileReader();\n    reader.onload = function(){ document.getElementById(\"importText\").value = reader.result; };\n    reader.readAsText(file);\n  });\n  document.getElementById(\"btnDoImport\").addEventListener(\"click\", function(){\n    var raw = document.getElementById(\"importText\").value.trim();\n    if (!raw){ showInfo(t(\"alert_import_empty\")); return; }\n    var payload;\n    try{ payload = JSON.parse(raw); }catch(e){ showInfo(t(\"alert_import_invalid\")); return; }\n    if (!payload || !payload.list || !payload.catalog){ showInfo(t(\"alert_import_format\")); return; }\n\n    loadEquipo();\n    var equipoChanged = false;\n    (payload.categories || []).forEach(function(cat){\n      if (!categoryById(cat.id)){ equipoCategories.push({id:cat.id, name:cat.name, icon:cat.icon||\"otros\"}); equipoChanged = true; }\n    });\n\n    var idMap = {};\n    (payload.catalog || []).forEach(function(ci){\n      var existing = null;\n      if (ci.i18nKey) existing = equipoCatalog.filter(function(x){return x.i18nKey===ci.i18nKey;})[0];\n      if (!existing) existing = findByDisplayName(equipoCatalog, ci.name);\n      if (existing){ idMap[ci.id] = existing.id; }\n      else {\n        var newId = uid();\n        idMap[ci.id] = newId;\n        var newItem = {id:newId, name:ci.name, weight:ci.weight, category: categoryById(ci.category) ? ci.category : (equipoCategories[0]?equipoCategories[0].id:\"otros\")};\n        if (ci.i18nKey) newItem.i18nKey = ci.i18nKey;\n        equipoCatalog.push(newItem);\n        equipoChanged = true;\n      }\n    });\n    if (equipoChanged) saveEquipo();\n\n    var newItems = (payload.list.items || []).map(function(it){\n      return {itemId: idMap[it.itemId] || it.itemId, qty: it.qty || 1, packed: false};\n    });\n    var newList = {id: uid(), name: payload.list.name || t(\"imported_list_name\"), items: newItems};\n    state.lists.push(newList);\n    state.activeListId = newList.id;\n    save();\n    closeModal(\"modalImport\");\n    showAppView();\n    switchTab(\"checklist\");\n    renderAll();\n  });\n\n  // ---------- home screen navigation ----------\n  function showHome(){\n    renderBagList();\n    document.getElementById(\"homeScreen\").style.display = \"block\";\n    document.getElementById(\"app\").style.display = \"none\";\n  }\n  function showAppView(){\n    document.getElementById(\"homeScreen\").style.display = \"none\";\n    document.getElementById(\"app\").style.display = \"\";\n  }\n  document.getElementById(\"btnHome\").addEventListener(\"click\", showHome);\n  document.getElementById(\"btnOpenHelp\").addEventListener(\"click\", function(){ closeModal(\"modalSettings\"); openModal(\"modalHelp\"); });\n  document.getElementById(\"btnHelpTop\").addEventListener(\"click\", function(){ openModal(\"modalHelp\"); });\n\n  // ---------- init ----------\n  syncModeButtons();\n  renderAll();\n  showHome();\n})();\n<\/script>\n</body>\n</html>\n" },
  histograma: { label: 'Controlar histograma',               html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Controlar histograma</title>\n<style>\n  :root{\n    --void:#060a16;\n    --panel:#0f1730;\n    --panel-2:#141d3d;\n    --line:#22305c;\n    --star:#f2efe4;\n    --dim:#8993b8;\n    --brass:#d9a05c;\n    --brass-dim:#8a6a3e;\n    --nebula:#7c8fff;\n    --ok:#6fcf8f;\n    --warn:#e4894a;\n    --bad:#ff6b6b;\n    --radius:16px;\n    --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  body.red{\n    --void:#0a0000; --panel:#1a0303; --panel-2:#220505; --line:#4a0d0d;\n    --star:#ff6b6b; --dim:#a34444; --brass:#ff8a5b; --brass-dim:#8a3a20;\n    --nebula:#ff6b6b; --ok:#ff9d6b; --warn:#ff9d6b; --bad:#ff4d4d;\n  }\n  body.zoom-mode{ zoom:2; }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--void); color:var(--star); font-family:var(--sans);\n    -webkit-font-smoothing:antialiased; min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--sans);margin:0;}\n  button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent;}\n\n  .app{max-width:720px;margin:0 auto;}\n\n  header{\n    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;\n    background:var(--panel);border-bottom:1px solid var(--line);\n  }\n  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;}\n  .header-text{min-width:0;}\n  .eyebrow{color:var(--brass);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  header h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;}\n  header .sub{color:var(--dim);font-size:13px;line-height:1.5;margin:10px 0 0;}\n  .icon-row{display:flex;gap:8px;flex:none;}\n  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--star);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;}\n\n  .modal-overlay{position:fixed;inset:0;background:rgba(6,10,22,.7);display:none;align-items:flex-end;justify-content:center;z-index:50;}\n  .modal-overlay.open{display:flex;}\n  .modal-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;}\n  .modal-close-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;}\n  .ghost-btn{padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--star);font-size:14px;cursor:pointer;}\n  @media (min-width:640px){ .modal-overlay{align-items:center;} .modal-card{border-radius:20px;} }\n\n  main{padding:16px 16px 48px;}\n\n  /* Intro explainer */\n  .intro-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}\n  .intro-card-head .ic{font-size:20px;}\n  .intro-card-head h2{font-size:15px;font-weight:700;}\n  .modal-card p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--dim);}\n  .modal-card p:last-of-type{margin-bottom:0;}\n  .intro-bar-wrap{margin:14px 0 4px;}\n  .intro-bar{height:20px;border-radius:6px;background:linear-gradient(90deg,#000 0%,#666 50%,#fff 100%);border:1px solid var(--line);}\n  .intro-bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim);}\n  .intro-bar-labels span:first-child{display:flex;align-items:center;gap:4px;}\n  .intro-bar-labels span:last-child{display:flex;align-items:center;gap:4px;}\n\n  .tabs{display:flex;gap:6px;padding:0 16px;margin-bottom:14px;overflow-x:auto;}\n  .tab{\n    flex:none;background:var(--panel);border:1px solid var(--line);color:var(--dim);\n    border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;white-space:nowrap;\n  }\n  .tab.active{background:var(--brass);border-color:var(--brass);color:var(--void);}\n\n  .panel{display:none;}\n  .panel.active{display:block;}\n\n  .hist-chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 8px;margin-bottom:14px;}\n  .hist-chart-title{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}\n  .hist-chart-title .hint-tag{color:var(--brass);text-transform:none;letter-spacing:0;font-weight:600;white-space:nowrap;}\n  .hist-chart svg{display:block;width:100%;height:auto;}\n  .hist-chart svg .curve-fill{fill:var(--brass);opacity:.55;}\n  .hist-chart svg .curve-line{fill:none;stroke:var(--brass);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;}\n  .hist-chart svg .grid-line{stroke:var(--line);stroke-width:1;}\n  .hist-chart svg .base-line{stroke:var(--line);stroke-width:1.5;}\n  .hist-chart svg .zone-strip-neutral{fill:var(--panel-2);}\n  .hist-chart svg .zone-strip-good{fill:var(--ok);}\n  .hist-chart svg .zone-strip-bad{fill:var(--bad);}\n  .hist-chart svg .zone-strip-label{font-size:11px;font-weight:800;fill:var(--void);font-family:var(--sans);}\n  .hist-zone-labels{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px;}\n  .hist-zone-labels span{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.2;}\n  .hist-zone-labels span.key{color:var(--brass);font-weight:700;}\n  .legend-row{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}\n  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);}\n  .legend-dot{width:10px;height:10px;border-radius:3px;flex:none;}\n  .legend-dot.good{background:var(--ok);}\n  .legend-dot.bad{background:var(--bad);}\n\n  .guide-row{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;}\n  .guide-row.good{border-left-color:var(--ok);}\n  .guide-row.mid{border-left-color:var(--brass);}\n  .guide-row.bad{border-left-color:var(--bad);}\n  .guide-icon{font-size:18px;flex:none;line-height:1.4;}\n  .guide-text{font-size:13.5px;line-height:1.55;color:var(--star);}\n  .guide-text b{color:var(--star);}\n\n  .sentence-box{background:rgba(217,160,92,.1);border:1px solid var(--brass);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-size:13.5px;line-height:1.6;}\n  .sentence-box b{color:var(--brass);}\n\n  .compare-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}\n  .compare-label{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}\n  .compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}\n  .compare-cell{font-size:12.5px;line-height:1.4;}\n  .compare-cell .mode-tag{display:block;font-size:10.5px;font-weight:700;color:var(--brass);margin-bottom:3px;}\n\n  .final-box{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:6px;}\n  .final-box p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--dim);}\n  .final-box p:last-child{margin-bottom:0;}\n  .final-box b{color:var(--star);}\n</style>\n</head>\n<body>\n\n<div class=\"app\">\n  <header>\n    <div class=\"topline\">\n      <div class=\"header-text\">\n        <p class=\"eyebrow\" id=\"eyebrowText\">Gu\u00eda r\u00e1pida</p>\n        <h1 id=\"titleText\">Controlar histograma</h1>\n      </div>\n      <div class=\"icon-row\">\n        <button class=\"icon-btn\" id=\"infoBtn\" title=\"\u00bfQu\u00e9 es el histograma?\">\u2139\ufe0f</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"subText\">Compara la forma de tu histograma con la de referencia mientras haces la foto.</p>\n  </header>\n\n  <div class=\"modal-overlay\" id=\"infoModal\">\n    <div class=\"modal-card\">\n      <button class=\"modal-close-x\" id=\"infoCloseBtn\">\u2715</button>\n      <div class=\"intro-card-head\"><span class=\"ic\">\ud83d\udca1</span><h2>\u00bfQu\u00e9 es el histograma?</h2></div>\n      <p>Es un gr\u00e1fico que muestra tu c\u00e1mara: a la izquierda quedan las partes m\u00e1s <b style=\"color:var(--star)\">oscuras</b> de la foto, a la derecha las m\u00e1s <b style=\"color:var(--star)\">claras</b>. La altura de la curva indica cu\u00e1nta foto tiene ese tono.</p>\n      <p>No hay una forma \"perfecta\" \u00fanica: la forma buena cambia seg\u00fan lo que fotograf\u00edes. Aqu\u00ed tienes 3 formas de referencia \u2014 comp\u00e1ralas con el histograma que te muestra tu c\u00e1mara en la pantalla.</p>\n      <div class=\"intro-bar-wrap\">\n        <div class=\"intro-bar\"></div>\n        <div class=\"intro-bar-labels\">\n          <span>\u2b05\ufe0f Oscuro</span>\n          <span>Claro \u27a1\ufe0f</span>\n        </div>\n      </div>\n      <button class=\"ghost-btn\" id=\"infoDoneBtn\" style=\"width:100%;margin-top:16px;\">Entendido</button>\n    </div>\n  </div>\n\n  <main>\n    <div class=\"tabs\" id=\"tabs\" style=\"padding:0;margin-bottom:14px;\">\n      <button class=\"tab active\" data-tab=\"astro\">\ud83c\udf0c <span id=\"tabAstro\">V\u00eda L\u00e1ctea</span></button>\n      <button class=\"tab\" data-tab=\"sol\">\ud83c\udf05 <span id=\"tabSol\">Sol</span></button>\n      <button class=\"tab\" data-tab=\"paisaje\">\ud83c\udf33 <span id=\"tabPaisaje\">Paisaje</span></button>\n      <button class=\"tab\" data-tab=\"comparar\">\ud83d\udcca <span id=\"tabComparar\">Comparar</span></button>\n    </div>\n\n    <!-- ASTRO -->\n    <section class=\"panel active\" id=\"panel-astro\">\n      <div class=\"hist-chart\">\n        <div class=\"hist-chart-title\"><span>Forma de referencia</span><span class=\"hint-tag\">\ud83d\udc41\ufe0f comp\u00e1rala con tu c\u00e1mara</span></div>\n        <svg viewBox=\"0 0 400 148\" preserveAspectRatio=\"none\">\n          <line class=\"grid-line\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"160\" y1=\"0\" x2=\"160\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"240\" y1=\"0\" x2=\"240\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"base-line\" x1=\"0\" y1=\"128\" x2=\"400\" y2=\"128\"/>\n          <path class=\"curve-fill\" d=\"M0,128 L10,90 L30,40 L60,15 L90,12 L130,35 L170,65 L220,95 L280,115 L340,124 L400,128 Z\"/>\n          <path class=\"curve-line\" d=\"M0,128 L10,90 L30,40 L60,15 L90,12 L130,35 L170,65 L220,95 L280,115 L340,124 L400,128\"/>\n          <rect class=\"zone-strip-good\" x=\"0\" y=\"134\" width=\"160\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-neutral\" x=\"162\" y=\"134\" width=\"156\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-bad\" x=\"320\" y=\"134\" width=\"80\" height=\"12\" rx=\"3\"/>\n        </svg>\n        <div class=\"hist-zone-labels\">\n          <span>Oscuro</span><span class=\"key\">Sombra</span><span>Medio</span><span>Luz</span><span>Muy claro</span>\n        </div>\n        <div class=\"legend-row\">\n          <div class=\"legend-item\"><span class=\"legend-dot good\"></span>Zona buena</div>\n          <div class=\"legend-item\"><span class=\"legend-dot bad\"></span>Evita acumular aqu\u00ed</div>\n        </div>\n      </div>\n\n      <div class=\"guide-row good\">\n        <span class=\"guide-icon\">\u2705</span>\n        <div class=\"guide-text\"><b>Aqu\u00ed debe estar casi toda tu foto:</b> el cielo oscuro y las estrellas d\u00e9biles de la V\u00eda L\u00e1ctea.</div>\n      </div>\n      <div class=\"guide-row mid\">\n        <span class=\"guide-icon\">\ud83d\udfe1</span>\n        <div class=\"guide-text\"><b>Est\u00e1 bien que haya algo aqu\u00ed:</b> alguna estructura de la V\u00eda L\u00e1ctea y estrellas algo m\u00e1s brillantes.</div>\n      </div>\n      <div class=\"guide-row bad\">\n        <span class=\"guide-icon\">\ud83d\udeab</span>\n        <div class=\"guide-text\"><b>Evita que se acumule mucho aqu\u00ed:</b> si el lado derecho tiene un pico grande, el cielo pierde su aspecto natural de noche.</div>\n      </div>\n\n      <div class=\"sentence-box\">\ud83c\udfaf <b>En una frase:</b> la curva pegada a la izquierda, sin tocar el borde del todo.</div>\n    </section>\n\n    <!-- SOL -->\n    <section class=\"panel\" id=\"panel-sol\">\n      <div class=\"hist-chart\">\n        <div class=\"hist-chart-title\"><span>Forma de referencia</span><span class=\"hint-tag\">\ud83d\udc41\ufe0f comp\u00e1rala con tu c\u00e1mara</span></div>\n        <svg viewBox=\"0 0 400 148\" preserveAspectRatio=\"none\">\n          <line class=\"grid-line\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"160\" y1=\"0\" x2=\"160\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"240\" y1=\"0\" x2=\"240\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"base-line\" x1=\"0\" y1=\"128\" x2=\"400\" y2=\"128\"/>\n          <path class=\"curve-fill\" d=\"M0,126 L40,110 L90,80 L140,45 L190,22 L240,15 L290,25 L330,50 L365,75 L400,100 L400,128 L0,128 Z\"/>\n          <path class=\"curve-line\" d=\"M0,126 L40,110 L90,80 L140,45 L190,22 L240,15 L290,25 L330,50 L365,75 L400,100\"/>\n          <rect class=\"zone-strip-neutral\" x=\"0\" y=\"134\" width=\"138\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-good\" x=\"140\" y=\"134\" width=\"180\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-neutral\" x=\"322\" y=\"134\" width=\"46\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-bad\" x=\"370\" y=\"134\" width=\"30\" height=\"12\" rx=\"3\"/>\n        </svg>\n        <div class=\"hist-zone-labels\">\n          <span>Oscuro</span><span>Sombra</span><span class=\"key\">Medio</span><span class=\"key\">Luz</span><span>Muy claro</span>\n        </div>\n        <div class=\"legend-row\">\n          <div class=\"legend-item\"><span class=\"legend-dot good\"></span>Zona buena</div>\n          <div class=\"legend-item\"><span class=\"legend-dot bad\"></span>Evita acumular aqu\u00ed</div>\n        </div>\n      </div>\n\n      <div class=\"guide-row good\">\n        <span class=\"guide-icon\">\u2705</span>\n        <div class=\"guide-text\"><b>Aqu\u00ed debe estar casi toda tu foto:</b> el cielo y el paisaje iluminados por la luz del atardecer.</div>\n      </div>\n      <div class=\"guide-row mid\">\n        <span class=\"guide-icon\">\ud83d\udfe1</span>\n        <div class=\"guide-text\"><b>Est\u00e1 bien que haya algo aqu\u00ed:</b> las zonas de sombra (siluetas) y el propio sol, muy brillante.</div>\n      </div>\n      <div class=\"guide-row bad\">\n        <span class=\"guide-icon\">\ud83d\udeab</span>\n        <div class=\"guide-text\"><b>Evita que se acumule mucho aqu\u00ed:</b> si las nubes se juntan todas en el extremo derecho, pierdes su color y su forma para siempre.</div>\n      </div>\n\n      <div class=\"sentence-box\">\ud83c\udfaf <b>En una frase:</b> protege el cielo y las nubes \u2014 que el propio sol se queme un poco no pasa nada.</div>\n    </section>\n\n    <!-- PAISAJE -->\n    <section class=\"panel\" id=\"panel-paisaje\">\n      <div class=\"hist-chart\">\n        <div class=\"hist-chart-title\"><span>Forma de referencia</span><span class=\"hint-tag\">\ud83d\udc41\ufe0f comp\u00e1rala con tu c\u00e1mara</span></div>\n        <svg viewBox=\"0 0 400 148\" preserveAspectRatio=\"none\">\n          <line class=\"grid-line\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"160\" y1=\"0\" x2=\"160\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"240\" y1=\"0\" x2=\"240\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"grid-line\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"128\" stroke-dasharray=\"3,4\"/>\n          <line class=\"base-line\" x1=\"0\" y1=\"128\" x2=\"400\" y2=\"128\"/>\n          <path class=\"curve-fill\" d=\"M0,105 L40,65 L90,35 L150,20 L220,18 L290,28 L350,55 L400,95 L400,128 L0,128 Z\"/>\n          <path class=\"curve-line\" d=\"M0,105 L40,65 L90,35 L150,20 L220,18 L290,28 L350,55 L400,95\"/>\n          <rect class=\"zone-strip-bad\" x=\"0\" y=\"134\" width=\"30\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-neutral\" x=\"32\" y=\"134\" width=\"26\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-good\" x=\"60\" y=\"134\" width=\"280\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-neutral\" x=\"342\" y=\"134\" width=\"26\" height=\"12\" rx=\"3\"/>\n          <rect class=\"zone-strip-bad\" x=\"370\" y=\"134\" width=\"30\" height=\"12\" rx=\"3\"/>\n        </svg>\n        <div class=\"hist-zone-labels\">\n          <span>Oscuro</span><span class=\"key\">Sombra</span><span class=\"key\">Medio</span><span class=\"key\">Luz</span><span>Muy claro</span>\n        </div>\n        <div class=\"legend-row\">\n          <div class=\"legend-item\"><span class=\"legend-dot good\"></span>Zona buena</div>\n          <div class=\"legend-item\"><span class=\"legend-dot bad\"></span>Evita acumular aqu\u00ed</div>\n        </div>\n      </div>\n\n      <div class=\"guide-row good\">\n        <span class=\"guide-icon\">\u2705</span>\n        <div class=\"guide-text\"><b>Tu foto debe repartirse por casi todo el gr\u00e1fico:</b> sombras, medios tonos y luces, todos con algo de informaci\u00f3n.</div>\n      </div>\n      <div class=\"guide-row mid\">\n        <span class=\"guide-icon\">\ud83d\udfe1</span>\n        <div class=\"guide-text\"><b>Est\u00e1 bien tener un poco en los extremos:</b> algo de negro puro y algo de blanco puro es normal.</div>\n      </div>\n      <div class=\"guide-row bad\">\n        <span class=\"guide-icon\">\ud83d\udeab</span>\n        <div class=\"guide-text\"><b>Evita que se pegue del todo a un extremo:</b> perder\u00edas para siempre el detalle de las sombras o de las nubes.</div>\n      </div>\n\n      <div class=\"sentence-box\">\ud83c\udfaf <b>En una frase:</b> cuanto m\u00e1s ancha y repartida est\u00e9 la curva, mejor \u2014 aprovechas todo lo que tu c\u00e1mara puede captar.</div>\n    </section>\n\n    <!-- COMPARAR -->\n    <section class=\"panel\" id=\"panel-comparar\">\n      <div class=\"compare-row\">\n        <div class=\"compare-label\">Forma del histograma</div>\n        <div class=\"compare-grid\">\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf0c Astro</span>Pegado a la izquierda</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf05 Sol</span>Extendido</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf33 Paisaje</span>Ancho y repartido</div>\n        </div>\n      </div>\n      <div class=\"compare-row\">\n        <div class=\"compare-label\">Lo m\u00e1s importante</div>\n        <div class=\"compare-grid\">\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf0c Astro</span>Las sombras y estrellas d\u00e9biles</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf05 Sol</span>Las luces (nubes y cielo)</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf33 Paisaje</span>Un poco de todo</div>\n        </div>\n      </div>\n      <div class=\"compare-row\">\n        <div class=\"compare-label\">Lo que hay que evitar</div>\n        <div class=\"compare-grid\">\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf0c Astro</span>Pico grande a la derecha</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf05 Sol</span>Nubes todas quemadas</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf33 Paisaje</span>Pegarse del todo a un lado</div>\n        </div>\n      </div>\n      <div class=\"compare-row\">\n        <div class=\"compare-label\">Si algo se satura, \u00bfpasa algo?</div>\n        <div class=\"compare-grid\">\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf0c Astro</span>Una estrella suelta: no pasa nada</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf05 Sol</span>El propio sol: no pasa nada</div>\n          <div class=\"compare-cell\"><span class=\"mode-tag\">\ud83c\udf33 Paisaje</span>Mejor evitarlo en ambos lados</div>\n        </div>\n      </div>\n\n      <div class=\"final-box\">\n        <p>\ud83d\udccc <b>Resumen f\u00e1cil</b></p>\n        <p>\ud83c\udf0c <b>Astro:</b> todo a la izquierda, sin tocar los negros.</p>\n        <p>\ud83c\udf05 <b>Sol:</b> cuida las nubes y el cielo, el sol puede quemarse.</p>\n        <p>\ud83c\udf33 <b>Paisaje:</b> cuanto m\u00e1s ancho, mejor \u2014 sin pegarte a ning\u00fan lado.</p>\n      </div>\n    </section>\n  </main>\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  // shared kit settings\n  try{\n    if (localStorage.getItem(\"kitNight_v1\") === \"on\") document.body.classList.add(\"red\");\n  }catch(e){}\n  try{\n    if (localStorage.getItem(\"kitZoom_v1\") === \"on\") document.body.classList.add(\"zoom-mode\");\n  }catch(e){}\n\n  function openInfoModal(){ document.getElementById(\"infoModal\").classList.add(\"open\"); }\n  function closeInfoModal(){ document.getElementById(\"infoModal\").classList.remove(\"open\"); }\n  document.getElementById(\"infoBtn\").addEventListener(\"click\", openInfoModal);\n  document.getElementById(\"infoCloseBtn\").addEventListener(\"click\", closeInfoModal);\n  document.getElementById(\"infoDoneBtn\").addEventListener(\"click\", closeInfoModal);\n  document.getElementById(\"infoModal\").addEventListener(\"click\", function(e){\n    if (e.target.id === \"infoModal\") closeInfoModal();\n  });\n\n  document.getElementById(\"tabs\").addEventListener(\"click\", function(e){\n    var btn = e.target.closest(\".tab\");\n    if(!btn) return;\n    var key = btn.getAttribute(\"data-tab\");\n    document.querySelectorAll(\".tab\").forEach(function(b){ b.classList.toggle(\"active\", b === btn); });\n    document.querySelectorAll(\".panel\").forEach(function(p){ p.classList.toggle(\"active\", p.id === \"panel-\" + key); });\n  });\n})();\n<\/script>\n</body>\n</html>\n" }

const home = document.getElementById('home');
const toolWrap = document.getElementById('tool-wrap');
const holder = document.getElementById('tool-iframe-holder');
const toolLabel = document.getElementById('tool-label');
const backBtn = document.getElementById('tool-back');

const iframeCache = {};

function getIframe(key){
  if (iframeCache[key]) return iframeCache[key];
  const iframe = document.createElement('iframe');
  holder.appendChild(iframe);
  iframe.srcdoc = TOOLS[key].html;
  iframeCache[key] = iframe;
  return iframe;
}

function openTool(key){
  Object.values(iframeCache).forEach(f => f.style.display = 'none');
  const wasCached = !!iframeCache[key];
  const iframe = getIframe(key);
  iframe.style.display = 'block';
  toolLabel.textContent = TOOLS[key].label;
  home.style.display = 'none';
  toolWrap.style.display = 'flex';
  if (wasCached && key === 'via_lactea'){
    try{
      if (iframe.contentWindow && typeof iframe.contentWindow.goToHome === 'function'){
        iframe.contentWindow.goToHome();
      }
    }catch(e){}
  }
}

function goHome(){
  toolWrap.style.display = 'none';
  home.style.display = 'flex';
}

document.querySelectorAll('.tile').forEach(btn => {
  btn.addEventListener('click', () => openTool(btn.dataset.tool));
});
backBtn.addEventListener('click', goHome);

}

function applyShellI18n(){
  const lang = getKitLang();
  const dict = SHELL_I18N[lang] || SHELL_I18N.es;
  document.getElementById('shellTitle').textContent = dict.title;
  document.getElementById('shellSub').textContent = dict.sub;
  document.getElementById('backBtnLabel').textContent = dict.back;
  Object.keys(dict.tiles).forEach(key => {
    const t = dict.tiles[key];
    const titleEl = document.getElementById('tileTitle-' + key);
    const descEl = document.getElementById('tileDesc-' + key);
    if (titleEl) titleEl.textContent = t.title;
    if (descEl) descEl.textContent = t.desc;
    if (TOOLS[key]) TOOLS[key].label = t.title;
  });
  if (!home.style.display || home.style.display === 'flex') {
    // home visible, nothing else to refresh
  } else if (toolWrap.style.display === 'flex') {
    // currently inside a tool: keep the breadcrumb label in sync too
    const activeKey = Object.keys(iframeCache).find(k => iframeCache[k].style.display !== 'none');
    if (activeKey) toolLabel.textContent = dict.tiles[activeKey].title;
  }
}

function setKitLang(lang){
  try{ localStorage.setItem(KIT_LANG_KEY, lang); }catch(e){}
  Object.keys(iframeCache).forEach(key => {
    holder.removeChild(iframeCache[key]);
    delete iframeCache[key];
  });
  syncLangSwitch();
  applyShellI18n();
}
function syncLangSwitch(){
  const current = getKitLang();
  document.querySelectorAll('#langSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === current);
  });
}
document.querySelectorAll('#langSwitch button').forEach(btn => {
  btn.addEventListener('click', () => setKitLang(btn.dataset.lang));
});
syncLangSwitch();
applyShellI18n();

// ---- unified night mode + zoom for all tools ----
const KIT_NIGHT_KEY = 'kitNight_v1';
const KIT_ZOOM_KEY = 'kitZoom_v1';
function getKitNight(){ try{ return localStorage.getItem(KIT_NIGHT_KEY) === 'on'; }catch(e){ return false; } }
function getKitZoom(){ try{ return localStorage.getItem(KIT_ZOOM_KEY) === 'on'; }catch(e){ return false; } }

function refreshOpenIframes(){
  Object.keys(iframeCache).forEach(key => {
    holder.removeChild(iframeCache[key]);
    delete iframeCache[key];
  });
}

function syncModeSwitch(){
  document.getElementById('kitNightBtn').classList.toggle('active', getKitNight());
  document.getElementById('kitZoomBtn').classList.toggle('active', getKitZoom());
  document.body.classList.toggle('red', getKitNight());
  document.body.classList.toggle('zoom-mode', getKitZoom());
}
document.getElementById('kitNightBtn').addEventListener('click', () => {
  try{ localStorage.setItem(KIT_NIGHT_KEY, getKitNight() ? 'off' : 'on'); }catch(e){}
  refreshOpenIframes();
  syncModeSwitch();
});
document.getElementById('kitZoomBtn').addEventListener('click', () => {
  try{ localStorage.setItem(KIT_ZOOM_KEY, getKitZoom() ? 'off' : 'on'); }catch(e){}
  refreshOpenIframes();
  syncModeSwitch();
});
syncModeSwitch();
</script>
