 y marca el check cuando termines esa tanda de fotos; la app pasa sola a la siguiente.\",\n    helpStep4: \"En Resumen puedes ver la duraci\u00f3n total de la sesi\u00f3n, la hora estimada de fin, y reordenar las fases si lo prefieres.\",\n    recommendedWord: \"Recomendado\",\n    shotsToTake: \"tomas a hacer\",\n    confirmTitle: \"\u00bfEmpezar de cero?\",\n    confirmText: \"Se borrar\u00e1 esta sesi\u00f3n y sus datos guardados en el tel\u00e9fono.\",\n    confirmYes: \"S\u00ed, borrar y empezar\",\n    confirmNo: \"Cancelar\",\n    completeTitle: \"\u00a1Sesi\u00f3n completada!\",\n    completeText: \"Has marcado como hechas las 4 fases: Lights, Darks, Bias y Flats. Ya puedes apilar tus im\u00e1genes.\",\n    completeClose: \"Seguir en la sesi\u00f3n\"\n  },\n  ca: {\n    eyebrow: \"SESSI\u00d3 DE CALIBRACI\u00d3\",\n    homeText: \"Indica els par\u00e0metres dels teus Lights i et genero el pla de Darks, Bias i Flats per calibrar la teva sessi\u00f3, amb els temps totals.\",\n    newSessionLabel: \"Nova sessi\u00f3\",\n    homeBtn: \"\ud83c\udf0c Nova sessi\u00f3\",\n    homeFooterCredit: \"App creada per\",\n    homeCopyright: \"Tots els drets reservats.\",\n    helpBtn: \"\u2753 Com funciona l'app\",\n    historyTitle: \"\ud83d\udd58 Sessions recents\",\n    historyDelete: \"Elimina\",\n    justNow: \"ara mateix\",\n    minAgo: \"min\",\n    hAgo: \"h\",\n    dAgo: \"d\",\n    helpTitle: \"Com funciona Tomas calibraci\u00f3n astrofotograf\u00eda\",\n    helpStep1: \"Indica els par\u00e0metres dels teus Lights: temps d'exposici\u00f3, ISO, obertura i quantes fotos far\u00e0s.\",\n    helpStep2: \"L'app calcula autom\u00e0ticament quants Darks, Bias i Flats necessites i amb quins ajustos fer-los.\",\n    helpStep3: \"V\u00e9s marcant cada fase com a feta a mesura que la completes; pots reordenar l'ordre des del Resum.\",\n    helpStep4: \"Consulta en tot moment el temps total estimat de la sessi\u00f3 a la pestanya Resum.\",\n    helpInstallTitle: \"\ud83d\udc Stat: \"Obertura\",\n    lblTotalTime: \"Temps total\",\n    doneDone: \"Fet\",\n    donePending: \"Pendent \u2014 toca per marcar\",\n    darksDesc: \"Fotos amb la tapa de l'objectiu posada. Eliminen el soroll t\u00e8rmic del sensor.\",\n    lblExposureSame: \"Exposici\u00f3 (igual que Lights)\",\n    lblIsoSame: \"ISO (igual que Lights)\",\n    lblApertureNoAffect: \"Obertura (no influeix, tapa posada)\",\n    lblEstTime: \"Temps estimat\",\n    howtoTitle: \"\ud83d\udcdd Com es fa\",\n    darksStep1: \"Tapa l'objectiu amb la tapa f\u00edsica (no val apuntar a alguna cosa fosca).\",\n    darksStep4: \"Intenta que la temperatura ambient sigui semblant a la dels Lights.\",\n    darksStep5: \"No cal mantenir el mateix enquadrament ni l'enfocament.\",\n    biasDesc: \"Tamb\u00e9 anomenades \\\"Offset\\\". Tapa posada i l'exposici\u00f3 m\u00e9s r\u00e0pida que permeti la teva c\u00e0mera. Eliminen el soroll de lectura del sensor.\",\n    biasStep1: \"Tapa l'objectiu amb la tapa f\u00edsica.\",\n    biasStep3: \"Posa l'exposici\u00f3 m\u00e9s r\u00e0pida que permeti la teva c\u00e0mera (p. ex. 1/4000s o m\u00e9s r\u00e0pida).\",\n    biasStep4: \"L'obertura i la temperatura no influeixen en aquest tipus de presa.\",\n    lblMinExposure: \"Exposici\u00f3 m\u00ednima\",\n    lblApertureNoInfluence: \"Obertura (tapa posada)\",\n    apertureNoInfluenceVal: \"No influeix\",\n    flatsDesc: \"Il\u00b7luminaci\u00f3 uniforme (panell, cel de l'alba o samarreta blanca sobre l'objectiu). Corregeixen vinyetatge i pols.\",\n    flatsStep1: \"No canvi\u00efs l'enquadrament ni l'enfocament respecte als Lights.\",\n    flatsStep4: \"Ajusta el temps d'exposici\u00f3 fins que l'histograma quedi aproximadament al 50%.\",\n    lblApertureSameLights: \"Obertura (igual que Lights)\",\n    lblExposureApprox: \"Exposici\u00f3 aprox. (ajusta a l'histograma)\",\n    resumenTitle: \"Resum de la sessi\u00f3\",\n    resumenDesc: \"Temps total estimat per fer totes les fotos d'aquesta nit.\",\n    totalLabel: \"durada total estimada\",\n    btnStartPrefix: \"Comen\u00e7a per\",\n    btnEditParams: \"\u270f\ufe0f Edita els par\u00e0metres dels Lights\",\n    btnFinishSession: \"\u2705 Finalitza la sessi\u00f3\",\n    nameModalTitle: \"Vols desar-la amb un nom?\",\n    nameModalText: \"Aix\u00ed reconeixer\u00e0s aquesta sessi\u00f3 a les teves sessions recents.\",\n    nameModalLabel: \"Nom de la sessi\u00f3 (opcional)\",\n    nameModalSave: \"Desa\",\n    nameModalSkip: \"Ara no\",\n    btnNewSession: \"\ud83d\uddd1\ufe0f Comen\u00e7a una sessi\u00f3 nova\",\n    btnReorder: \"\ud83d\udd00 Reordena la sessi\u00f3\",\n    reorderTitle: \"Reordena la sessi\u00f3\",\n    reorderText: \"Canvia l'ordre en qu\u00e8 vols fer les fases, per exemple si prefereixes els Bias abans que els Flats.\",\n    reorderDone: \"Fet\",\n    helpStep1: \"Indica els par\u00e0metres amb qu\u00e8 fotografiar\u00e0s (Lights): temps d'exposici\u00f3, ISO, obertura i quantes fotos far\u00e0s.\",\n    helpStep2: \"L'app calcula autom\u00e0ticament com fer les teves preses de calibraci\u00f3: Darks, Bias i Flats, amb els seus par\u00e0metres i temps.\",\n    helpStep3: \"Ves a cada pestanya (Lights, Darks, Bias, Flats) i marca la casella quan acabis aquella tanda de fotos; l'app passa sola a la seg\u00fcent.\",\n    helpStep4: \"A Resum pots veure la durada total de la sessi\u00f3, l'hora estimada de fi, i reordenar les fases si ho prefereixes.\",\n    recommendedWord: \"Recomanat\",\n    shotsToTake: \"preses a fer\",\n    confirmTitle: \"Vols comen\u00e7ar de zero?\",\n    confirmText: \"S'esborrar\u00e0 aquesta sessi\u00f3 i les seves dades desades al tel\u00e8fon.\",\n    confirmYes: \"S\u00ed, esborra i comen\u00e7a\",\n    confirmNo: \"Cancel\u00b7la\",\n    completeTitle: \"Sessi\u00f3 completada!\",\n    completeText: \"Has marcat com a fetes les 4 fases: Lights, Darks, Bias i Flats. Ja pots apilar les teves imatges.\",\n    completeClose: \"Continua a la sessi\u00f3\"\n  },\n  en: {\n    eyebrow: \"CALIBRATION SESSION\",\n    homeText: \"Enter your Lights settings and I'll generate the Darks, Bias and Flats plan to calibrate your session, with total timings.\",\n    newSessionLabel: \"New session\",\n    homeBtn: \"\ud83c\udf0c New session\",\n    homeFooterCredit: \"App made by\",\n    homeCopyright: \"All rights reserved.\",\n    helpBtn: \"\u2753 How the app works\",\n    historyTitle: \"\ud83d\udd58 Recent sessions\",\n    historyDelete: \"Delete\",\n    justNow: \"just now\",\n    minAgo: \"min ago\",\n    hAgo: \"h ago\",\n    dAgo: \"d ago\",\n    helpTitle: \"How Tomas calibraci\u00f3n astrofotograf\u00eda works\",\n    helpStep1: \"Enter your Lights settings: exposure time, ISO, aperture and how many shots you'll take.\",\n    helpStep2: \"The app automatically works out how many Darks, Bias and Flats you need and what settings to use.\",\n    helpStep3: \"Mark each phase as done as you complete it; you can reorder the sequence from the Summary.\",\n    helpStep4: \"Check the estimated total session time any time in the Summary tab.\",\n    helpInstallTitle: \"\ud83d\udcf1 Add to your home screen\",\n    helpInstallText: \"This way you can open the app like a normal app, without searching for it in the browser.\",\n    helpIosTitle: \"On iPhone / iPad (Safari)\",\n    helpIosStep1: \"Open this page in Safari.\",\n    helpIosStep2: \"Tap the Share icon (the square with an arrow pointing up) in the bottom bar.\",\n    helpIosStep3: \"Scroll down and tap \\\"Add to Home Screen\\\".\",\n    helpIosStep4: \"Tap \\\"Add\\\" in the top right.\",\n    helpAndroidTitle: \"On Android (Chrome)\",\n    helpAndroidStep1: \"Open this page in Chrome.\",\n    helpAndroidStep2: \"Tap the three-dot menu in the top right.\",\n    helpAndroidStep3: \"Tap \\\"Add to Home screen\\\" or \\\"Install app\\\".\",\n    helpAndroidStep4: \"Confirm by tapping \\\"Add\\\" or \\\"Install\\\".\",\n    setupBack: \"\u2039 Back\",\n    setupTitle: \"Your Lights settings\",\n    setupExplain: \"Lights are the normal shots you take of the object (a galaxy, a nebula, the Milky Way...): the ones you'll stack to get the final image. From these settings I'll calculate your calibration frames: Darks, Bias and Flats.\",\n    lblExposure: \"Exposure time (s)\",\n    lblNumLights: \"Number of Lights\",\n    lblAperture: \"Aperture (f-number)\",\n    lblStartTime: \"Start time (optional)\",\n    btnGenerate: \"Generate session plan\",\n    alertMissing: \"Fill in at least the exposure time and number of Lights.\",\n    tabResumen: \"Summary\",\n    progressPhrase: \"phases\",\n    lightsDesc: \"The normal shots of the object: a galaxy, a nebula, the Milky Way... RAW and manual mode. This is the base you'll stack to get the final image.\",\n    lblExposureStat: \"Exposure\",\n    lblSensitivity: \"Sensitivity\",\n    lblApertureStat: \"Aperture\",\n    lblTotalTime: \"Total time\",\n    doneDone: \"Done\",\n    donePending: \"Pending \u2014 tap to mark\",\n    darksDesc: \"Shots taken with the lens cap on. They remove the sensor's thermal noise.\",\n    lblExposureSame: \"Exposure (same as Lights)\",\n    lblIsoSame: \"ISO (same as Lights)\",\n    lblApertureNoAffect: \"Aperture (doesn't matter, cap on)\",\n    lblEstTime: \"Estimated time\",\n    howtoTitle: \"\ud83d\udcdd How to do it\",\n    darksStep1: \"Cap the lens with the physical lens cap (pointing at something dark doesn't work).\",\n    darksStep4: \"Try to match the ambient temperature you had for the Lights.\",\n    darksStep5: \"You don't need to keep the same framing or focus.\",\n    biasDesc: \"Also called \\\"Offset\\\" frames. Lens cap on, fastest shutter speed your camera allows. They remove the sensor's read noise.\",\n    biasStep1: \"Cap the lens with the physical lens cap.\",\n    biasStep3: \"Set the fastest shutter speed your camera allows (e.g. 1/4000s or faster).\",\n    biasStep4: \"Aperture and temperature don't matter for this frame type.\",\n    lblMinExposure: \"Minimum exposure\",\n    lblApertureNoInfluence: \"Aperture (cap on)\",\n    apertureNoInfluenceVal: \"No effect\",\n    flatsDesc: \"Even, uniform lighting (light panel, dawn sky, or a white t-shirt over the lens). They correct vignetting and dust spots.\",\n    flatsStep1: \"Don't change the framing or focus from the Lights.\",\n    flatsStep4: \"Adjust the exposure time until the histogram sits at about 50%.\",\n    lblApertureSameLights: \"Aperture (same as Lights)\",\n    lblExposureApprox: \"Approx. exposure (adjust to the histogram)\",\n    resumenTitle: \"Session summary\",\n    resumenDesc: \"Estimated total time to take every shot tonight.\",\n    totalLabel: \"estimated total duration\",\n    btnStartPrefix: \"Start with\",\n    btnEditParams: \"\u270f\ufe0f Edit Lights settings\",\n    btnFinishSession: \"\u2705 Finish session\",\n    nameModalTitle: \"Save with a name?\",\n    nameModalText: \"This way you'll recognize this session in your recent sessions.\",\n    nameModalLabel: \"Session name (optional)\",\n    nameModalSave: \"Save\",\n    nameModalSkip: \"Not now\",\n    btnNewSession: \"\ud83d\uddd1\ufe0f Start a new session\",\n    btnReorder: \"\ud83d\udd00 Reorder session\",\n    reorderTitle: \"Reorder session\",\n    reorderText: \"Change the order you want to do the phases in, e.g. if you'd rather do Bias before Flats.\",\n    reorderDone: \"Done\",\n    helpStep1: \"Enter the settings you'll shoot with (Lights): exposure time, ISO, aperture and how many shots you'll take.\",\n    helpStep2: \"The app automatically works out how to take your calibration frames: Darks, Bias and Flats, with their settings and timings.\",\n    helpStep3: \"Go to each tab (Lights, Darks, Bias, Flats) and tick it off once you've taken that batch of shots; the app moves on to the next one for you.\",\n    helpStep4: \"In Summary you can see the total session length, the estimated finish time, and reorder the phases if you prefer.\",\n    recommendedWord: \"Recommended\",\n    shotsToTake: \"shots to take\",\n    confirmTitle: \"Start from scratch?\",\n    confirmText: \"This session and its data saved on the phone will be deleted.\",\n    confirmYes: \"Yes, delete and start\",\n    confirmNo: \"Cancel\",\n    completeTitle: \"Session complete!\",\n    completeText: \"You've marked all 4 phases done: Lights, Darks, Bias and Flats. You're ready to stack your images.\",\n    completeClose: \"Continue in the session\"\n  }\n};\nfunction t(key, vars){\n  let str = (I18N[state.lang] && I18N[state.lang][key]) || I18N.es[key] || key;\n  if(vars){\n    Object.keys(vars).forEach(k=>{ str = str.replace(new RegExp('\\\\{'+k+'\\\\}','g'), vars[k]); });\n  }\n  return str;\n}\nfunction applyTranslations(){\n  document.documentElement.lang = state.lang;\n  document.querySelectorAll('[data-i18n]').forEach(el=>{\n    el.textContent = t(el.getAttribute('data-i18n'));\n  });\n}\n\n// ---------------------------------------------------------------------\n// State\n// ---------------------------------------------------------------------\nconst STORAGE_KEY = 'calibra-session-v1';\n\nfunction defaultState(){\n  return {\n    exposure: 15, iso: 200, aperture: '2.8', numLights: 1, startTime: '',\n    biasExposureInput: '1/4000', flatsExposureInput: '1/100',\n    darksTarget: 20, biasTarget: 50, flatsTarget: 30,\n    phaseOrder: ['lights','darks','flats','bias'],\n    progress: { lights:false, darks:false, bias:false, flats:false },\n    started: false,\n    redMode: false,\n    lang: 'es',\n    history: []\n  };\n}\n\nlet state = load();\ntry{\n  const kitLang = localStorage.getItem('kitLang_v1');\n  if(kitLang){ state.lang = kitLang; }\n  const kitNight = localStorage.getItem('kitNight_v1');\n  if(kitNight){ state.redMode = (kitNight === 'on'); }\n}catch(e){}\ntry{ document.body.classList.toggle('zoom-mode', localStorage.getItem('kitZoom_v1') === 'on'); }catch(e){}\nlet view = state.started ? 'session' : 'home'; // 'home' | 'setup' | 'session'\n\nfunction load(){\n  try{\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if(raw){\n      const s = Object.assign(defaultState(), JSON.parse(raw));\n      if(typeof s.aperture === 'string' && /^f\\//i.test(s.aperture.trim())){\n        s.aperture = s.aperture.trim().replace(/^f\\//i, '');\n      }\n      return s;\n    }\n  }catch(e){}\n  return defaultState();\n}\nfunction save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }\n\nfunction nowHHMM(){\n  const d = new Date();\n  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');\n}\n\n// ---- Recent sessions history (last 5) ----\nfunction historySnapshot(){\n  return {\n    exposure: state.exposure, iso: state.iso, aperture: state.aperture, numLights: state.numLights,\n    darksTarget: state.darksTarget, biasTarget: state.biasTarget, flatsTarget: state.flatsTarget,\n    phaseOrder: state.phaseOrder.slice(), savedAt: Date.now()\n  };\n}\nfunction pushHistory(){\n  state.history = state.history || [];\n  state.history.unshift(historySnapshot());\n  state.history = state.history.slice(0,5);\n}\nfunction relTime(ts){\n  const diff = Math.max(0, Date.now() - ts);\n  const min = Math.floor(diff/60000);\n  if(min < 1) return t('justNow');\n  if(min < 60) return `${min} ${t('minAgo')}`;\n  const h = Math.floor(min/60);\n  if(h < 24) return `${h} ${t('hAgo')}`;\n  const d = Math.floor(h/24);\n  return `${d} ${t('dAgo')}`;\n}\nfunction renderHistoryList(){\n  const el = document.getElementById('historyList');\n  if(!el) return;\n  const hist = state.history || [];\n  if(!hist.length){ el.style.display = 'none'; el.innerHTML = ''; return; }\n  el.style.display = 'block';\n  el.innerHTML = `<div class=\"history-title\">${t('historyTitle')}</div><div class=\"session-list\">` + hist.map((h,i)=>{\n    const params = `${h.exposure}s \u00b7 ISO ${h.iso} \u00b7 ${h.numLights} Lights${h.aperture ? ' \u00b7 f/'+h.aperture : ''}`;\n    const title = h.name ? h.name : params;\n    const sub = h.name ? (params + ' \u00b7 ' + relTime(h.savedAt)) : relTime(h.savedAt);\n    return `\n    <div class=\"session-row\">\n      <div class=\"session-row-main\" onclick=\"loadHistory(${i})\">\n        <span class=\"dot\"></span>\n        <div class=\"body\">\n          <h3>${title}</h3>\n          <p>${sub}</p>\n        </div>\n      </div>\n      <div class=\"session-row-actions\">\n        <button onclick=\"deleteHistory(${i})\" aria-label=\"${t('historyDelete')}\">\u2715</button>\n      </div>\n    </div>`;\n  }).join('') + '</div>';\n}\nfunction loadHistory(i){\n  const h = (state.history || [])[i];\n  if(!h) return;\n  state.exposure = h.exposure;\n  state.iso = h.iso;\n  state.aperture = h.aperture;\n  state.numLights = h.numLights;\n  state.darksTarget = h.darksTarget;\n  state.biasTarget = h.biasTarget;\n  state.flatsTarget = h.flatsTarget;\n  state.phaseOrder = h.phaseOrder.slice();\n  state.startTime = nowHHMM();\n  state.progress = { lights:false, darks:false, bias:false, flats:false };\n  state.started = true;\n  pushHistory();\n  save();\n  goSession('resumen');\n}\nfunction deleteHistory(i){\n  state.history.splice(i,1);\n  save();\n  renderHistoryList();\n}\n\n// ---- Red night-vision mode ----\nfunction applyRedMode(){\n  document.body.classList.toggle('red', state.redMode);\n}\n\n// ---- Navigation between the three screens ----\nfunction goHome(){ view = 'home'; render(); }\nfunction goHelp(){ view = 'help'; render(); }\nfunction goSetup(){ fillSetupForm(); view = 'setup'; render(); }\nfunction goSession(tab){ view = 'session'; render(); showTab(tab || 'resumen'); }\n\ndocument.getElementById('startNewBtn').addEventListener('click', goSetup);\ndocument.getElementById('headerHelpBtn').addEventListener('click', goHelp);\ndocument.getElementById('backFromHelp').addEventListener('click', goHome);\ndocument.getElementById('backFromSetup').addEventListener('click', ()=>{\n  if(state.started) goSession('resumen'); else goHome();\n});\n\n// ---- Setup form <-> state ----\nfunction fillSetupForm(){\n  document.getElementById('in-exposure').value = state.exposure;\n  document.getElementById('in-iso').value = state.iso;\n  document.getElementById('in-numlights').value = state.numLights;\n  document.getElementById('in-aperture').value = state.aperture;\n  document.getElementById('in-starttime').value = state.startTime || nowHHMM();\n}\n\ndocument.getElementById('startBtn').addEventListener('click', ()=>{\n  const exposure = parseFloat(document.getElementById('in-exposure').value) || 0;\n  const iso = parseInt(document.getElementById('in-iso').value) || 0;\n  const numLights = parseInt(document.getElementById('in-numlights').value) || 0;\n  const aperture = document.getElementById('in-aperture').value.trim();\n  const startTime = document.getElementById('in-starttime').value;\n\n  if(!exposure || !numLights){\n    alert(t('alertMissing'));\n    return;\n  }\n\n  const wasStarted = state.started;\n  const paramsChanged = exposure !== state.exposure || iso !== state.iso;\n  state.exposure = exposure;\n  state.iso = iso;\n  state.numLights = numLights;\n  state.aperture = aperture;\n  state.startTime = startTime;\n  state.biasTarget = state.biasTarget || 50;\n  state.started = true;\n\n  if(!wasStarted || paramsChanged){\n    state.progress = { lights:false, darks:false, bias:false, flats:false };\n  }\n  pushHistory();\n  save();\n  goSession('resumen');\n});\n\n// ---- Helpers ----\nfunction fmtDuration(s){\n  if(s < 30) return '< 1 min';\n  let totalMin = Math.round(s/60);\n  const h = Math.floor(totalMin/60);\n  const m = totalMin%60;\n  if(h > 0) return m > 0 ? `${h}h ${m}min` : `${h}h`;\n  return `${m} min`;\n}\nfunction parseExpToSeconds(str, fallback){\n  if(!str) return fallback;\n  str = str.trim();\n  if(str.includes('/')){\n    const [n,d] = str.split('/').map(parseFloat);\n    if(d) return n/d;\n  }\n  const v = parseFloat(str);\n  return isNaN(v) ? fallback : v;\n}\nfunction displayExp(raw){\n  raw = (raw||'').trim();\n  if(!raw) return '\u2014';\n  return raw.endsWith('s') ? raw : raw + 's';\n}\nfunction dispAperture(){ return state.aperture ? 'f/' + state.aperture : '\u2014'; }\nfunction biasExpSeconds(){ return parseExpToSeconds(state.biasExposureInput, 1/4000); }\nfunction flatsExpSeconds(){ return parseExpToSeconds(state.flatsExposureInput, 1/100); }\nfunction phaseSeconds(phase){\n  if(phase==='lights') return state.numLights*state.exposure;\n  if(phase==='darks') return state.darksTarget*state.exposure;\n  if(phase==='bias') return state.biasTarget * biasExpSeconds();\n  if(phase==='flats') return state.flatsTarget*flatsExpSeconds();\n  return 0;\n}\n\nfunction toggleDone(phase){\n  state.progress[phase] = !state.progress[phase];\n  const justCompleted = state.progress[phase];\n  save();\n  renderPanel(phase);\n  updateProgressBar();\n  checkSessionComplete();\n  if(justCompleted){\n    const idx = state.phaseOrder.indexOf(phase);\n    if(idx > -1 && idx < state.phaseOrder.length - 1) showTab(state.phaseOrder[idx+1]);\n  }\n}\nfunction changeTarget(phase, delta, min, max){\n  let v = (state[phase+'Target']||0) + delta;\n  v = Math.max(min, Math.min(max, v));\n  state[phase+'Target'] = v;\n  save();\n  renderPanel(phase);\n  renderPanel('resumen');\n  updateProgressBar();\n}\n\nfunction doneRowHTML(phase, target, label){\n  const done = !!state.progress[phase];\n  return `<div class=\"done-row ${done?'done':''}\" onclick=\"toggleDone('${phase}')\">\n    <div class=\"checkbox\">${done?'\u2713':''}</div>\n    <div>\n      <div class=\"done-title\">${target} ${label}</div>\n      <div class=\"done-sub\">${done?t('doneDone'):t('donePending')}</div>\n    </div>\n  </div>`;\n}\nfunction targetStepper(phase, min, max){\n  const v = state[phase+'Target'];\n  return `<div class=\"stat target-stat\" style=\"grid-column:1/-1;\">\n    <div>\n      <div class=\"val\" style=\"font-size:17px;\">${v} ${t('shotsToTake')}</div>\n      <div class=\"lbl\">${t('recommendedWord')}: ${min}\u2013${max}</div>\n    </div>\n    <div class=\"stepbtns\">\n      <button class=\"stepbtn\" onclick=\"changeTarget('${phase}',-1,${min},${max})\">\u2013</button>\n      <button class=\"stepbtn\" onclick=\"changeTarget('${phase}',1,${min},${max})\">+</button>\n    </div>\n  </div>`;\n}\n\n// ---- Phase order (tabs + auto-advance + reorder) ----\nconst PHASE_META = {\n  lights: {icon:'\ud83c\udf0c', label:'Lights'},\n  darks:  {icon:'\ud83c\udf11', label:'Darks'},\n  flats:  {icon:'\ud83c\udf1f', label:'Flats'},\n  bias:   {icon:'\u26ab', label:'Bias'}\n};\nlet currentTab = 'resumen';\n\nfunction renderTabsNav(){\n  const inner = document.getElementById('tabsInner');\n  let html = `<button data-tab=\"resumen\" class=\"${currentTab==='resumen'?'active':''}\"><span class=\"ico\">\u23f1\ufe0f</span><span data-i18n=\"tabResumen\">${t('tabResumen')}</span></button>`;\n  state.phaseOrder.forEach(p=>{\n    const m = PHASE_META[p];\n    html += `<button data-tab=\"${p}\" class=\"${currentTab===p?'active':''}\"><span class=\"ico\">${m.icon}</span>${m.label}</button>`;\n  });\n  inner.innerHTML = html;\n  inner.querySelectorAll('button').forEach(b=>{\n    b.addEventListener('click', ()=>showTab(b.dataset.tab));\n  });\n}\n\nfunction movePhase(phase, dir){\n  const idx = state.phaseOrder.indexOf(phase);\n  const newIdx = idx + dir;\n  if(newIdx < 0 || newIdx >= state.phaseOrder.length) return;\n  [state.phaseOrder[idx], state.phaseOrder[newIdx]] = [state.phaseOrder[newIdx], state.phaseOrder[idx]];\n  save();\n  renderReorderList();\n  renderTabsNav();\n  renderPanel('resumen');\n}\n\nfunction renderReorderList(){\n  const el = document.getElementById('reorderList');\n  el.innerHTML = state.phaseOrder.map((p,i)=>{\n    const m = PHASE_META[p];\n    return `<div class=\"reorder-row\">\n      <span class=\"reorder-icon\">${m.icon}</span>\n      <span class=\"reorder-label\">${m.label}</span>\n      <div class=\"reorder-btns\">\n        <button class=\"stepbtn\" onclick=\"movePhase('${p}',-1)\" ${i===0?'disabled':''}>\u2191</button>\n        <button class=\"stepbtn\" onclick=\"movePhase('${p}',1)\" ${i===state.phaseOrder.length-1?'disabled':''}>\u2193</button>\n      </div>\n    </div>`;\n  }).join('');\n}\nfunction showReorderModal(){\n  renderReorderList();\n  document.getElementById('reorderModal').classList.add('show');\n}\nfunction hideReorderModal(){ document.getElementById('reorderModal').classList.remove('show'); }\ndocument.getElementById('reorderDoneBtn').addEventListener('click', hideReorderModal);\n\n// ---- Panels ----\nfunction renderPanel(phase){\n  const el = document.getElementById('panel-'+phase);\n  if(!el) return;\n\n  if(phase === 'resumen'){\n    const lightsSec = phaseSeconds('lights');\n    const darksSec = phaseSeconds('darks');\n    const biasSec = phaseSeconds('bias');\n    const flatsSec = phaseSeconds('flats');\n    const totalSec = lightsSec + darksSec + biasSec + flatsSec;\n\n    let endTimeHTML = '';\n    if(state.startTime){\n      const [h,m] = state.startTime.split(':').map(Number);\n      const start = new Date(); start.setHours(h,m,0,0);\n      const end = new Date(start.getTime() + totalSec*1000);\n      const endStr = end.toTimeString().slice(0,5);\n      const dayNote = end.getDate() !== start.getDate() ? ' (+1)' : '';\n      endTimeHTML = `<div class=\"summary-time-row\"><span>\ud83d\udd58 ${state.startTime}</span><span>\u2192</span><span>\ud83c\udfc1 ${endStr}${dayNote}</span></div>`;\n    }\n\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\u23f1\ufe0f</span>${t('resumenTitle')}</h2></div>\n      <p class=\"phase-desc\">${t('resumenDesc')}</p>\n      <div class=\"card\" style=\"padding:20px;\">\n        <div class=\"summary-total\">\n          <div class=\"summary-total-val\">${fmtDuration(totalSec)}</div>\n          <div class=\"summary-total-lbl\">${t('totalLabel')}</div>\n        </div>\n        ${endTimeHTML}\n        <div class=\"summary-breakdown\">\n          ${state.phaseOrder.map(p=>`<div><span>${PHASE_META[p].icon} ${PHASE_META[p].label}</span><span>${fmtDuration(phaseSeconds(p))}</span></div>`).join('')}\n        </div>\n      </div>\n      <div class=\"resumen-actions\">\n        <button class=\"primary-btn\" id=\"startLightsBtn\">${PHASE_META[state.phaseOrder[0]].icon} ${t('btnStartPrefix')} ${PHASE_META[state.phaseOrder[0]].label}</button>\n        <button class=\"ghost-btn\" id=\"reorderBtn\">${t('btnReorder')}</button>\n        <button class=\"ghost-btn\" id=\"editParamsBtn\">${t('btnEditParams')}</button>\n        <button class=\"ghost-btn danger\" id=\"newSessionBtn\">${t('btnNewSession')}</button>\n      </div>\n    `;\n    document.getElementById('startLightsBtn').addEventListener('click', ()=>showTab(state.phaseOrder[0]));\n    document.getElementById('reorderBtn').addEventListener('click', showReorderModal);\n    document.getElementById('editParamsBtn').addEventListener('click', goSetup);\n    document.getElementById('newSessionBtn').addEventListener('click', showConfirmModal);\n  }\n\n  if(phase === 'lights'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf0c</span>Lights</h2></div>\n      <p class=\"phase-desc\">${t('lightsDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${state.exposure}s</div><div class=\"lbl\">${t('lblExposureStat')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblSensitivity')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureStat')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(state.numLights*state.exposure)}</div><div class=\"lbl\">${t('lblTotalTime')}</div></div>\n      </div>\n      ${doneRowHTML('lights', state.numLights, 'Lights')}\n    `;\n  }\n\n  if(phase === 'darks'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf11</span>Darks</h2></div>\n      <p class=\"phase-desc\">${t('darksDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${state.exposure}s</div><div class=\"lbl\">${t('lblExposureSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureNoAffect')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(state.darksTarget*state.exposure)}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('darksStep1')}</li>\n          <li>${t('darksStep4')}</li>\n          <li>${t('darksStep5')}</li>\n        </ol>\n      </div>\n      ${targetStepper('darks', 10, 30)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('darks', state.darksTarget, 'Darks')}\n    `;\n  }\n\n  if(phase === 'bias'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\u26ab</span>Bias</h2></div>\n      <p class=\"phase-desc\">${t('biasDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${displayExp(state.biasExposureInput)}</div><div class=\"lbl\">${t('lblMinExposure')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${t('apertureNoInfluenceVal')}</div><div class=\"lbl\">${t('lblApertureNoInfluence')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(phaseSeconds('bias'))}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('biasStep1')}</li>\n          <li>${t('biasStep3')}</li>\n          <li>${t('biasStep4')}</li>\n        </ol>\n      </div>\n      ${targetStepper('bias', 20, 100)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('bias', state.biasTarget, 'Bias')}\n    `;\n  }\n\n  if(phase === 'flats'){\n    el.innerHTML = `\n      <div class=\"phase-header\"><h2><span class=\"emoji\">\ud83c\udf1f</span>Flats</h2></div>\n      <p class=\"phase-desc\">${t('flatsDesc')}</p>\n      <div class=\"stat-grid\">\n        <div class=\"stat\"><div class=\"val\">${displayExp(state.flatsExposureInput)}</div><div class=\"lbl\">${t('lblExposureApprox')}</div></div>\n        <div class=\"stat\"><div class=\"val\">ISO ${state.iso}</div><div class=\"lbl\">${t('lblIsoSame')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${dispAperture()}</div><div class=\"lbl\">${t('lblApertureSameLights')}</div></div>\n        <div class=\"stat\"><div class=\"val\">${fmtDuration(phaseSeconds('flats'))}</div><div class=\"lbl\">${t('lblEstTime')}</div></div>\n      </div>\n      <div class=\"howto\">\n        <div class=\"howto-title\">${t('howtoTitle')}</div>\n        <ol>\n          <li>${t('flatsStep1')}</li>\n          <li>${t('flatsStep4')}</li>\n        </ol>\n      </div>\n      ${targetStepper('flats', 20, 40)}\n      <div style=\"height:12px;\"></div>\n      ${doneRowHTML('flats', state.flatsTarget, 'Flats')}\n    `;\n  }\n}\nfunction renderAllPanels(){ ['resumen','lights','darks','bias','flats'].forEach(renderPanel); }\n\nfunction updateProgressBar(){\n  const phases = ['lights','darks','bias','flats'];\n  const doneCount = phases.filter(p=>state.progress[p]).length;\n  const pct = Math.round(100*doneCount/phases.length);\n  document.getElementById('progressFill').style.width = pct + '%';\n  document.getElementById('progressText').textContent = `${doneCount} / ${phases.length} ${t('progressPhrase')}`;\n  document.getElementById('progressPct').textContent = pct + '%';\n}\n\n// ---- Tabs ----\nfunction showTab(name){\n  currentTab = name;\n  ['resumen','lights','darks','bias','flats'].forEach(p=>{\n    document.getElementById('panel-'+p).style.display = (p===name)?'block':'none';\n  });\n  document.querySelectorAll('nav.tabs button').forEach(b=>{\n    b.classList.toggle('active', b.dataset.tab===name);\n  });\n  window.scrollTo(0,0);\n}\n\n// ---- Completion modal ----\nfunction checkSessionComplete(){\n  const phases = ['lights','darks','bias','flats'];\n  if(phases.every(p=>state.progress[p])) showCompleteModal();\n}\nfunction showCompleteModal(){ document.getElementById('completeModal').classList.add('show'); }\nfunction hideCompleteModal(){ document.getElementById('completeModal').classList.remove('show'); }\ndocument.getElementById('modalCloseBtn').addEventListener('click', hideCompleteModal);\ndocument.getElementById('modalFinishBtn').addEventListener('click', ()=>{\n  hideCompleteModal();\n  showNameModal();\n});\ndocument.getElementById('modalNewSessionBtn').addEventListener('click', ()=>{\n  hideCompleteModal();\n  showConfirmModal();\n});\n\n// ---- Save session with an optional name ----\nfunction showNameModal(){\n  document.getElementById('nameModalInput').value = '';\n  document.getElementById('nameModal').classList.add('show');\n  setTimeout(() => { document.getElementById('nameModalInput').focus(); }, 60);\n}\nfunction hideNameModal(){ document.getElementById('nameModal').classList.remove('show'); }\nfunction finishWithName(name){\n  if(name && state.history && state.history.length){ state.history[0].name = name; }\n  state.started = false;\n  save();\n  renderHistoryList();\n  goHome();\n}\ndocument.getElementById('nameModalSaveBtn').addEventListener('click', ()=>{\n  const val = document.getElementById('nameModalInput').value.trim();\n  hideNameModal();\n  finishWithName(val || null);\n});\ndocument.getElementById('nameModalSkipBtn').addEventListener('click', ()=>{\n  hideNameModal();\n  finishWithName(null);\n});\ndocument.getElementById('nameModalInput').addEventListener('keydown', e=>{\n  if(e.key === 'Enter') document.getElementById('nameModalSaveBtn').click();\n});\n\n// ---- Custom confirm modal (native confirm() can be silently blocked in webviews) ----\nfunction showConfirmModal(){ document.getElementById('confirmModal').classList.add('show'); }\nfunction hideConfirmModal(){ document.getElementById('confirmModal').classList.remove('show'); }\ndocument.getElementById('confirmNoBtn').addEventListener('click', hideConfirmModal);\ndocument.getElementById('confirmYesBtn').addEventListener('click', ()=>{\n  hideConfirmModal();\n  const keepHistory = state.history;\n  const keepLang = state.lang;\n  const keepRed = state.redMode;\n  state = defaultState();\n  state.history = keepHistory;\n  state.lang = keepLang;\n  state.redMode = keepRed;\n  save();\n  goHome();\n});\n\n// ---- Master render ----\nfunction render(){\n  applyRedMode();\n  applyTranslations();\n  document.getElementById('home-view').style.display = view==='home' ? 'flex' : 'none';\n  document.getElementById('help-view').style.display = view==='help' ? 'block' : 'none';\n  document.getElementById('setup-view').style.display = view==='setup' ? 'block' : 'none';\n  document.getElementById('session-view').style.display = view==='session' ? 'block' : 'none';\n  document.getElementById('tabsNav').style.display = view==='session' ? 'block' : 'none';\n  document.getElementById('progressWrap').style.display = view==='session' ? 'block' : 'none';\n\n  if(view==='home'){\n    renderHistoryList();\n  }\n  if(view==='session'){\n    renderTabsNav();\n    renderAllPanels();\n    updateProgressBar();\n  }\n  window.scrollTo(0,0);\n}\n\nrender();\n<\/script>\n</body>\n</html>\n" },
  photopack:  { label: 'Mochila',                            html: "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Mochila\">\n<meta name=\"theme-color\" content=\"#0A0D10\">\n<title>Mochila \u2014 Checklist de fotograf\u00eda</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#0A0D10;\n    --surface:#12171B;\n    --surface-2:#1A2126;\n    --border:#262F35;\n    --text:#EAEFEA;\n    --text-dim:#889199;\n    --accent:#FF7A29;\n    --accent-ink:#241000;\n    --warn:#FFC24B;\n    --danger:#FF5D5D;\n    --radius:10px;\n    --font-display:'Sora',sans-serif;\n    --font-body:'Inter',sans-serif;\n    --tap:44px;\n    color-scheme: dark;\n  }\n  body.night-mode{\n    --bg:#0F0303;\n    --surface:#1B0505;\n    --surface-2:#250707;\n    --border:#3A0C0C;\n    --text:#FF7A6E;\n    --text-dim:#8F4238;\n    --accent:#FF4433;\n    --accent-ink:#180200;\n    --warn:#FF5A3C;\n    --danger:#FF3B2E;\n  }\n\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--bg);\n    color:var(--text);\n    font-family:var(--font-body);\n    -webkit-font-smoothing:antialiased;\n    min-height:100vh;\n    transition:background .25s ease,color .25s ease;\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  h1,h2,h3{font-family:var(--font-display);margin:0;}\n  button{font-family:var(--font-body);cursor:pointer;}\n  input,select,textarea{font-family:var(--font-body);}\n\n  #app{max-width:1100px;margin:0 auto;padding:0 0 48px;}\n\n  /* Topbar */\n  .topbar{\n    display:flex;align-items:center;justify-content:space-between;\n    padding:18px 16px 10px;\n    padding-top:max(18px, calc(env(safe-area-inset-top) + 14px));\n  }\n  .brand{display:flex;align-items:center;gap:8px;}\n  .brand-mark{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:30px;height:30px;border-radius:50%;\n    background:var(--accent);color:var(--accent-ink);\n    font-size:14px;font-weight:800;font-family:var(--font-display);\n  }\n  .brand h1{font-size:19px;font-weight:700;letter-spacing:-0.01em;}\n  .brand h1 .accent{color:var(--accent);}\n  .mode-toggles{display:flex;gap:6px;}\n  .icon-btn{\n    width:var(--tap);height:var(--tap);border-radius:50%;\n    border:1px solid var(--border);background:var(--surface);\n    color:var(--text-dim);font-size:17px;\n    display:flex;align-items:center;justify-content:center;\n    transition:border-color .15s, color .15s, background .15s;\n  }\n  .icon-btn.on{border-color:var(--accent);color:var(--accent);background:var(--surface-2);}\n  .icon-btn:active{transform:scale(.94);}\n\n  /* List bar */\n  .list-bar{\n    padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;\n  }\n  select#listSelect{\n    flex:1 1 180px;min-width:140px;\n    background:var(--surface);color:var(--text);\n    border:1px solid var(--border);border-radius:8px;\n    padding:10px 12px;font-size:14.5px;font-weight:600;\n  }\n  .list-actions{display:flex;gap:6px;flex-wrap:wrap;}\n  .ghost-btn{\n    background:transparent;border:1px solid var(--border);color:var(--text-dim);\n    border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600;\n    white-space:nowrap;\n  }\n  .ghost-btn:hover{border-color:var(--accent);color:var(--text);}\n  .primary-btn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;}\n  .accent-btn{\n    background:var(--accent);color:var(--accent-ink);border:none;\n    border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700;\n  }\n  .accent-btn:active{transform:scale(.97);}\n\n  /* Weight panel */\n  .weight-panel{padding:4px 16px 14px;}\n  .weight-numbers{\n    display:flex;align-items:baseline;gap:6px;font-family:var(--font-display);\n    font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text);\n  }\n  .weight-numbers .sep{color:var(--text-dim);font-weight:400;}\n  #weightMax{color:var(--text-dim);font-weight:500;}\n  .items-count{margin-left:auto;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--text-dim);}\n  .weight-bar{\n    height:9px;border-radius:999px;background:var(--surface-2);\n    border:1px solid var(--border);overflow:hidden;\n  }\n  .weight-fill{\n    height:100%;width:0%;background:var(--accent);\n    transition:width .35s cubic-bezier(.2,.8,.2,1), background .3s;\n    border-radius:999px;\n  }\n  .weight-fill.warn{background:var(--warn);}\n  .weight-fill.danger{background:var(--danger);}\n\n  /* Tabs (mobile) */\n  .tabs{display:none;}\n  .tab{\n    flex:1;padding:12px;border-radius:999px;border:1.5px solid var(--border);\n    background:var(--surface);color:var(--text-dim);font-weight:700;font-size:14px;\n    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;\n  }\n  .tab.active{\n    background:var(--accent);color:var(--accent-ink);border-color:var(--accent);\n    box-shadow:0 3px 12px rgba(0,0,0,.28);\n    transform:translateY(-1px);\n  }\n\n  .checklist-list-title{\n    font-family:var(--font-display);font-weight:800;font-size:19px;\n    color:var(--text);margin:2px 0 14px;letter-spacing:-0.01em;\n    display:flex;align-items:center;gap:8px;\n  }\n\n  main.panels{padding:0 16px;}\n  .panel{display:none;}\n  .panel.active{display:block;}\n\n  /* Category groups */\n  details.category{\n    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n    border-radius:0 var(--radius) var(--radius) 0;margin-bottom:10px;overflow:hidden;\n  }\n  details.category[open] summary{border-bottom:1px solid var(--border);}\n  summary.category-head{\n    list-style:none;cursor:pointer;padding:13px 14px;\n    display:flex;align-items:center;gap:10px;\n    font-family:var(--font-display);font-weight:700;font-size:14px;\n  }\n  summary.category-head::-webkit-details-marker{display:none;}\n  .cat-icon{width:19px;height:19px;flex:none;color:var(--accent);}\n  .cat-name{flex:1;}\n  .cat-meta{font-family:var(--font-body);font-weight:500;font-size:12.5px;color:var(--text-dim);}\n  .chevron{width:14px;height:14px;color:var(--text-dim);transition:transform .2s;flex:none;}\n  details[open] .chevron{transform:rotate(90deg);}\n\n  .item-row{\n    display:flex;align-items:center;gap:10px;padding:11px 14px;\n    border-top:1px solid var(--border);\n  }\n  .item-row:first-of-type{border-top:none;}\n  .item-name{flex:1;font-size:14.5px;font-weight:500;}\n  .item-weight{font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}\n\n  .row-add{\n    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--accent);font-size:17px;font-weight:700;\n    display:flex;align-items:center;justify-content:center;flex:none;\n  }\n  .row-add:active{transform:scale(.9);}\n  .row-edit-actions{display:flex;gap:6px;flex:none;}\n  .row-edit-actions button{\n    width:30px;height:30px;border-radius:7px;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text-dim);font-size:13px;\n  }\n\n  /* Checklist row */\n  .check-row{\n    display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border);\n  }\n  .check-row:first-of-type{border-top:none;}\n  .check-row.packed .item-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}\n  .checkbox{\n    width:23px;height:23px;border-radius:7px;border:2px solid var(--border);\n    flex:none;display:flex;align-items:center;justify-content:center;\n    color:var(--accent-ink);font-size:14px;font-weight:900;\n  }\n  .check-row.packed .checkbox{background:var(--accent);border-color:var(--accent);}\n  .qty-stepper{display:flex;align-items:center;gap:6px;flex:none;}\n  .qty-stepper button{\n    width:26px;height:26px;border-radius:50%;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;\n  }\n  .qty-stepper span{min-width:16px;text-align:center;font-size:13px;font-weight:600;}\n  .row-remove{\n    width:28px;height:28px;flex:none;border-radius:7px;border:none;background:transparent;\n    color:var(--text-dim);font-size:17px;\n  }\n  .row-remove:hover{color:var(--danger);}\n\n  .empty-state{padding:36px 20px;text-align:center;color:var(--text-dim);}\n  .empty-state .em-icon{font-size:26px;display:block;margin-bottom:8px;}\n  .empty-state p{margin:0;font-size:13.5px;line-height:1.5;}\n\n  .catalog-toolbar{display:flex;gap:8px;margin-bottom:12px;}\n  #searchInput{\n    flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);\n    border-radius:8px;padding:11px 13px;font-size:14px;\n  }\n  #searchInput::placeholder{color:var(--text-dim);}\n\n  .tip-banner{\n    margin:18px 16px 0;padding:13px 14px;border-radius:8px;\n    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n    font-size:12.5px;color:var(--text-dim);line-height:1.55;\n    display:flex;gap:10px;align-items:flex-start;\n  }\n  .tip-banner b{color:var(--text);}\n  .tip-close{background:none;border:none;color:var(--text-dim);font-size:16px;margin-left:auto;flex:none;}\n\n  /* Modal */\n  .modal-overlay{\n    position:fixed;inset:0;background:rgba(3,5,6,.72);\n    display:none;align-items:flex-end;justify-content:center;z-index:50;\n    backdrop-filter:blur(2px);\n  }\n  .modal-overlay.open{display:flex;}\n  .modal{\n    background:var(--surface);border:1px solid var(--border);\n    border-radius:16px 16px 0 0;width:100%;max-width:480px;\n    padding:20px;max-height:88vh;overflow-y:auto;position:relative;\n  }\n  @media(min-width:640px){\n    .modal-overlay{align-items:center;}\n    .modal{border-radius:14px;}\n  }\n  .modal h2{font-size:17px;margin-bottom:14px;}\n  .field{margin-bottom:13px;}\n  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}\n  .field input,.field select,.field textarea{\n    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);\n    border-radius:8px;padding:10px 12px;font-size:14.5px;\n  }\n  .field textarea{min-height:90px;resize:vertical;font-family:var(--font-body);}\n  .modal-actions{display:flex;gap:8px;margin-top:16px;}\n  .modal-actions button{flex:1;padding:12px;border-radius:999px;font-weight:700;font-size:14px;}\n  .modal-actions .cancel{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;}\n  .modal-actions .confirm{background:var(--accent);border:none;color:var(--accent-ink);}\n  .modal-close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:18px;}\n  .modal-sub{font-size:12.5px;color:var(--text-dim);margin:-8px 0 14px;line-height:1.5;}\n  .share-json{\n    width:100%;min-height:120px;background:var(--surface-2);border:1px solid var(--border);\n    color:var(--text-dim);border-radius:8px;padding:10px;font-size:11.5px;font-family:monospace;\n  }\n\n  /* Zoom mode */\n  body.zoom-mode{ zoom:2; }\n  ::-webkit-scrollbar{width:8px;}\n  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}\n\n  #printArea{display:none;}\n  @media print{\n    body *{visibility:hidden;}\n    #printArea, #printArea *{visibility:visible;}\n    #printArea{\n      display:block;position:absolute;top:0;left:0;width:100%;\n      padding:24px;color:#111;background:#fff;font-family:Arial,sans-serif;\n    }\n    #printArea h1{font-size:20px;margin:0 0 4px;}\n    #printArea .print-sub{font-size:12px;color:#555;margin:0 0 16px;}\n    #printArea table{width:100%;border-collapse:collapse;font-size:13px;}\n    #printArea th,#printArea td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;}\n    #printArea th:last-child,#printArea td:last-child{text-align:right;}\n    #printArea tfoot td{font-weight:bold;border-top:2px solid #111;border-bottom:none;}\n    #printArea .print-footer{margin-top:18px;font-size:12px;color:#555;}\n  }\n\n  .home-screen{\n    min-height:100vh;background:var(--bg);\n  }\n  #homeScreen .topbar{display:flex;flex-direction:column;align-items:stretch;padding:calc(18px + env(safe-area-inset-top)) 16px 14px;}\n  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto;width:100%;}\n  .sub{color:var(--text-dim);font-size:13px;line-height:1.5;margin:10px auto 0;max-width:720px;width:100%;box-sizing:border-box;}\n  .home-content{padding:4px 20px 40px;max-width:720px;margin:0 auto;}\n  .topbar-text{min-width:0;}\n  .eyebrow{color:var(--accent);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 .3rem;text-transform:uppercase;}\n  .home-inner{width:100%;max-width:360px;text-align:center;}\n  .home-mark{width:56px;height:56px;font-size:22px;border-radius:50%;margin:0 auto 14px;}\n  .topbar-text h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.01em;}\n  .home-content .modal-sub{margin:0 0 20px;font-size:13.5px;}\n  .home-btn{\n    width:100%;display:flex;align-items:center;gap:12px;text-align:left;\n    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);\n    border-radius:0 12px 12px 0;padding:15px;margin-top:10px;color:var(--text);font-size:15px;font-weight:600;\n  }\n  .home-btn:active{transform:scale(.98);}\n  .home-btn-icon{font-size:18px;width:24px;flex:none;text-align:center;}\n  .home-btn-sub{display:block;font-size:11.5px;font-weight:500;color:var(--text-dim);margin-top:1px;}\n\n  .choice-btn{\n    display:flex;align-items:center;gap:10px;width:100%;text-align:left;\n    padding:14px;border-radius:8px;border:1px solid var(--border);\n    background:var(--surface-2);color:var(--text);font-size:15px;font-weight:600;margin-bottom:8px;\n  }\n  .choice-btn.active{border-color:var(--accent);color:var(--accent);}\n  .choice-flag{width:22px;text-align:center;flex:none;font-size:15px;}\n  .cat-badge{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:22px;height:16px;border-radius:3px;background:var(--accent);color:var(--accent-ink);\n    font-size:9px;font-weight:800;letter-spacing:0.02em;\n  }\n  .home-disclaimer{margin-top:22px;font-size:11px;color:var(--text-dim);line-height:1.5;}\n  .bag-card{\n    background:var(--surface);border:1px solid var(--border);border-radius:16px;\n    padding:12px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;\n  }\n  .bag-card-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;padding:2px 0;}\n  .bag-card-icon{font-size:20px;flex:none;}\n  .bag-card-body{flex:1;min-width:0;}\n  .bag-card-name{font-weight:700;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n  .bag-card-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}\n  .bag-card-arrow{color:var(--text-dim);font-size:16px;flex:none;}\n  .bag-card-actions{display:flex;gap:5px;flex:none;}\n  .bag-card-actions button{width:29px;height:29px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12.5px;}\n  .back-link-btn{\n    background:var(--surface-2);border:1px solid var(--border);color:var(--text);\n    border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;margin-bottom:12px;\n  }\n  .home-disclaimer a{color:var(--accent);text-decoration:none;font-weight:700;}\n  .home-disclaimer a:hover{text-decoration:underline;}\n</style>\n\n<style id=\"unified-theme-override\">\n  :root{\n    --bg:#060a16;\n    --surface:#0f1730;\n    --surface-2:#141d3d;\n    --border:#22305c;\n    --text:#f2efe4;\n    --text-dim:#8993b8;\n    --accent:#d9a05c;\n    --accent-ink:#1a1200;\n    --warn:#e4894a;\n    --danger:#ff5d5d;\n    --font-display:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --font-body:-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  }\n</style>\n<style id=\"unified-components-override\">\n  .accent-btn, .modal-actions .confirm, .modal-actions .cancel{\n    border-radius: 12px !important;\n  }\n  .home-btn{\n    border: 1px solid var(--border) !important;\n    border-left: 1px solid var(--border) !important;\n    border-radius: 16px !important;\n    background: var(--surface) !important;\n  }\n  .home-btn-icon{\n    width:44px !important; height:44px !important;\n    border-radius:12px !important;\n    background: var(--surface-2) !important;\n    display:flex !important; align-items:center !important; justify-content:center !important;\n    font-size:20px !important;\n  }\n</style>\n</head>\n<body>\n\n<div id=\"homeScreen\" class=\"home-screen\" style=\"display:none;\">\n  <div class=\"topbar\">\n    <div class=\"topline\">\n      <div class=\"topbar-text\">\n        <p class=\"eyebrow\" id=\"homeEyebrow\">Tu mochila</p>\n        <h1 id=\"homeAppName\">Mochila<span class=\"accent\">.</span></h1>\n      </div>\n      <div class=\"mode-toggles\">\n        <button id=\"btnHomeHelp\" class=\"icon-btn\" title=\"Ayuda\">\u2753</button>\n      </div>\n    </div>\n    <p class=\"sub\" id=\"homeSubtitle\"></p>\n  </div>\n  <div class=\"home-content\">\n\n    <button class=\"primary-btn\" id=\"btnCreateBag\">\u2795 <span id=\"btnCreateBagLabel\">Crear mochila nueva</span></button>\n\n    <div id=\"bagListWrap\" style=\"margin-top:18px;text-align:left;\"></div>\n\n    <button class=\"ghost-btn\" id=\"btnImportHome\" style=\"width:100%;margin-top:6px;\"></button>\n  </div>\n</div>\n\n<div id=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <button id=\"btnHome\" class=\"icon-btn\" title=\"Inicio\" style=\"margin-right:2px;\">\u2302</button>\n      <span class=\"brand-mark\">\ud83c\udf92</span>\n      <h1 id=\"topbarAppName\">Mochila<span class=\"accent\">.</span></h1>\n    </div>\n    <div class=\"mode-toggles\">\n      <button id=\"btnHelpTop\" class=\"icon-btn\" title=\"Ayuda\">\u2754</button>\n      <button id=\"btnSettings\" class=\"icon-btn\" title=\"Ajustes\">\u2699</button>\n    </div>\n  </header>\n\n  <main class=\"panels\">\n    <section id=\"panelChecklist\" class=\"panel active\">\n      <button class=\"ghost-btn back-link-btn\" id=\"btnBackToBags\">\u2039 <span id=\"btnBackToBagsLabel\">Mochilas</span></button>\n      <div id=\"checklistListTitle\" class=\"checklist-list-title\"></div>\n      <div class=\"weight-panel\" style=\"padding:0 0 14px;\">\n        <div class=\"weight-numbers\">\n          <span id=\"weightCurrent\">0</span> g <span class=\"sep\">/</span> <span id=\"weightMax\">8000</span> g\n          <span id=\"itemsCount\" class=\"items-count\"></span>\n        </div>\n        <div class=\"weight-bar\"><div id=\"weightFill\" class=\"weight-fill\"></div></div>\n      </div>\n      <button id=\"btnAddItemsToBag\" class=\"primary-btn\" style=\"margin-bottom:10px;\"></button>\n      <div style=\"display:flex;justify-content:flex-end;margin-bottom:8px;\">\n        <button id=\"btnUncheckAll\" class=\"ghost-btn\"></button>\n      </div>\n      <div id=\"checklistContent\"></div>\n      <button id=\"btnViewBag\" class=\"primary-btn\" style=\"margin-top:14px;\"></button>\n      <button id=\"btnShare\" class=\"ghost-btn\" style=\"width:100%;margin-top:8px;\"></button>\n    </section>\n    <section id=\"panelCatalog\" class=\ class=\"confirm\" id=\"btnDownloadFullExport\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: full backup import -->\n<div class=\"modal-overlay\" id=\"modalFullImport\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalFullImport\">\u2715</button>\n    <h2 id=\"fullImportTitle\"></h2>\n    <p class=\"modal-sub\" id=\"fullImportHint\"></p>\n    <div class=\"field\">\n      <input type=\"file\" id=\"fullImportFile\" accept=\"application/json,.json\">\n    </div>\n    <div class=\"field\">\n      <textarea class=\"share-json\" id=\"fullImportText\"></textarea>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCancelFullImport\" data-close=\"modalFullImport\"></button>\n      <button class=\"confirm\" id=\"btnDoFullImport\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: share/export -->\n<div class=\"modal-overlay\" id=\"modalShare\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalShare\">\u2715</button>\n    <h2 id=\"shareModalTitle\"></h2>\n    <p class=\"modal-sub\" id=\"shareModalHint\"></p>\n    <textarea class=\"share-json\" id=\"shareText\" readonly></textarea>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCopyShare\"></button>\n      <button class=\"confirm\" id=\"btnDownloadShare\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: import -->\n<div class=\"modal-overlay\" id=\"modalImport\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalImport\">\u2715</button>\n    <h2 id=\"importModalTitle\"></h2>\n    <p class=\"modal-sub\" id=\"importModalHint\"></p>\n    <div class=\"field\">\n      <input type=\"file\" id=\"importFile\" accept=\"application/json,.json\">\n    </div>\n    <div class=\"field\">\n      <textarea class=\"share-json\" id=\"importText\"></textarea>\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCancelImport\" data-close=\"modalImport\"></button>\n      <button class=\"confirm\" id=\"btnDoImport\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: generic prompt (rename/new list) -->\n<div class=\"modal-overlay\" id=\"modalPrompt\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalPrompt\">\u2715</button>\n    <h2 id=\"promptTitle\">Nombre</h2>\n    <div class=\"field\">\n      <input type=\"text\" id=\"promptInput\">\n    </div>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnCancelPrompt\" data-close=\"modalPrompt\"></button>\n      <button class=\"confirm\" id=\"promptConfirm\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: view backpack summary -->\n<div class=\"modal-overlay\" id=\"modalBag\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalBag\">\u2715</button>\n    <h2 id=\"bagModalTitle\"></h2>\n    <div id=\"bagModalBody\" style=\"font-size:14px;line-height:1.6;\"></div>\n    <p id=\"bagLuckyMsg\" style=\"margin-top:16px;font-weight:700;color:var(--accent);text-align:center;\"></p>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"btnExportBagPdf\">\ud83d\udda8\ufe0f <span id=\"btnExportBagPdfLabel\"></span></button>\n      <button class=\"confirm\" data-close=\"modalBag\" id=\"bagCloseBtn\"></button>\n    </div>\n  </div>\n</div>\n\n<div id=\"printArea\"></div>\n\n<!-- Modal: help -->\n<div class=\"modal-overlay\" id=\"modalHelp\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalHelp\">\u2715</button>\n    <h2 id=\"helpModalTitle\"></h2>\n    <div id=\"helpModalBody\" style=\"font-size:14px;line-height:1.6;color:var(--text);\"></div>\n    <div class=\"modal-actions\">\n      <button class=\"confirm\" data-close=\"modalHelp\" id=\"helpCloseBtn\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: generic confirm (replaces window.confirm, which some in-app browsers block) -->\n<div class=\"modal-overlay\" id=\"modalConfirm\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalConfirm\">\u2715</button>\n    <h2 id=\"confirmTitle\"></h2>\n    <p class=\"modal-sub\" id=\"confirmMessage\" style=\"margin-top:0;\"></p>\n    <div class=\"modal-actions\">\n      <button class=\"cancel\" id=\"confirmCancelBtn\" data-close=\"modalConfirm\"></button>\n      <button class=\"confirm\" id=\"confirmYesBtn\"></button>\n    </div>\n  </div>\n</div>\n\n<!-- Modal: generic info (replaces window.alert) -->\n<div class=\"modal-overlay\" id=\"modalInfo\">\n  <div class=\"modal\">\n    <button class=\"modal-close-x\" data-close=\"modalInfo\">\u2715</button>\n    <p class=\"modal-sub\" id=\"infoMessage\" style=\"margin-top:0;\"></p>\n    <div class=\"modal-actions\">\n      <button class=\"confirm\" id=\"infoOkBtn\" data-close=\"modalInfo\"></button>\n    </div>\n  </div>\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var STORAGE_KEY = \"photopackApp_v1\";\n  var uid = function(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); };\n\n  // ---------- i18n ----------\n  var I18N = {\n    es: {\n      doc_title:\"Mochila \u2014 Checklist de fotograf\u00eda\",\n      nav_home:\"Inicio\", nav_zoom:\"Ampliar interfaz\", nav_night:\"Modo noche / astro\", nav_settings:\"Ajustes\",\n      home_subtitle:\"Tu checklist de material fotogr\u00e1fico, con el peso siempre bajo control.\",\n      home_checklist:\"Checklist\", home_checklist_sub:\"Marca lo que llevas y ve el peso\",\n      btn_create_bag:\"Crear mochila nueva\", bag_list_empty:\"Todav\u00eda no tienes ninguna mochila. Crea una para empezar a a\u00f1adir material.\",\n      bag_items_label:\"\u00edtems\", btn_back_to_bags:\"Mochilas\", btn_add_items:\"\u2795 A\u00f1adir \u00edtems\", btn_back_to_bag:\"Volver\",\n      home_catalog:\"Mi equipo\", home_catalog_sub:\"Todo tu material disponible\",\n      home_setup:\"Precargar \u00edtems\", home_setup_sub:\"Marca de c\u00e1mara o material de ejemplo\",\n      home_settings:\"Configuraci\u00f3n\", home_lang:\"Idioma\",\n      app_name:\"Mochila\", eyebrow_label:\"Tu mochila\",\n      home_help:\"Ayuda\", help_title:\"\u00bfC\u00f3mo funciona Mochila?\",\n      help_body_html:'<p><b>1. Precarga tu material.</b> En \"Precargar \u00edtems\" eliges tu marca de c\u00e1mara (o \u00edtems de ejemplo) y se meten en tu Mi equipo con su peso.</p><p><b>2. A\u00f1ade lo que te lleves.</b> Ve a \"Mi checklist\" \u2192 pesta\u00f1a Mi equipo, y toca \u201c+\u201d en cada cosa que quieras llevar a esta salida.</p><p><b>3. Marca lo que ya est\u00e1 en la mochila.</b> Toca la casilla \u2713 de cada \u00edtem cuando lo metas de verdad \u2014 el peso total se va sumando solo. Con \"Desmarcar todo\" lo dejas todo a cero de golpe para volver a empezar.</p><p><b>4. Consulta el resumen.</b> El bot\u00f3n \"Ver mochila\" te muestra solo lo que llevas marcado y el peso total, y desde ah\u00ed puedes tocar \ud83d\udda8\ufe0f para exportarlo a PDF.</p><p><b>5. Crea varias listas.</b> Una checklist por tipo de salida (nocturna, viaje, etc.). Puedes duplicarlas, renombrarlas o compartirlas con otra persona.</p><p><b>6. Haz una copia de seguridad.</b> En \u2699 Configuraci\u00f3n \u2192 \"Exportar todo (backup)\" generas un c\u00f3digo con TODO tu cat\u00e1logo, listas y ajustes; en otro dispositivo usas \"Importar todo\" para tenerlo igual all\u00ed. Es la forma de pasar tus datos entre m\u00f3viles, ya que no se sincronizan solos.</p><p><b>7. Inst\u00e1lala como app en tu pantalla de inicio.</b><br>\ud83d\udcf1 <b>iPhone (Safari):</b> toca el bot\u00f3n Compartir (el cuadrado con la flecha hacia arriba) \u2192 \u201cA\u00f1adir a pantalla de inicio\u201d.<br>\ud83e\udd16 <b>Android (Chrome):</b> toca el men\u00fa \u22ee (arriba a la derecha) \u2192 \u201cA\u00f1adir a pantalla de inicio\u201d o \u201cInstalar aplicaci\u00f3n\u201d.</p><p>Todo se guarda solo en tu m\u00f3vil, sin necesidad de internet.</p>',\n      help_close_btn:\"Entendido\",\n      list_new:\"+ Nueva\", list_dup:\"Duplicar\", list_ren:\"Renombrar\", list_del:\"Eliminar\",\n      share_btn:\"Compartir / exportar\", import_btn:\"Importar\",\n      tab_checklist:\"Mi checklist\", tab_catalog:\"Mi equipo\", adding_to_label:\"A\u00f1adiendo a:\",\n      go_to_equipo_btn:\"\ud83e\uddf0 Gestionar mi equipo\", empty_equipo_text:\"Todav\u00eda no tienes equipo. A\u00f1\u00e1delo en Mi equipo.\",\n      uncheck_all_btn:\"Desmarcar todo\",\n      view_bag_btn:\"Ver mochila\", bag_title:\"Tu mochila\",\n      bag_empty_text:\"No has marcado ning\u00fan \u00edtem todav\u00eda. Toca la casilla \u2713 de lo que ya llevas en la mochila.\",\n      bag_total_label:\"Peso total\",\n      bag_lucky_msg:\"\u00a1Suerte con la salida fotogr\u00e1fica! \ud83d\udcf8\",\n      export_pdf_btn:\"Exportar a PDF\", print_generated_on:\"Generado el\",\n      print_item_col:\"\u00cdtem\", print_weight_col:\"Peso\", print_total_row:\"Peso total\",\n      pdf_lib_unavailable_msg:\"No se ha podido generar el PDF. Int\u00e9ntalo de nuevo.\",\n      search_placeholder:\"Buscar objetivo, filtro, bater\u00eda\u2026\", add_item_btn:\"+ \u00cdtem\",\n      catalog_edit_btn:\"Editar\", catalog_done_btn:\"Hecho\",\n      in_backpack:\"en la mochila\", in_your_list:\"\u00b7 en tu lista\",\n      empty_checklist_html:'Esta mochila est\u00e1 vac\u00eda.<br>Toca <b style=\"color:var(--text)\">A\u00f1adir \u00edtems</b> para elegir de tu equipo.',\n      empty_catalog_text:\"No hay \u00edtems que coincidan.\",\n      tip_banner_html:'<b>Inst\u00e1lala como app:</b> en iPhone, abre esta p\u00e1gina en Safari \u2192 bot\u00f3n Compartir \u2192 \u201cA\u00f1adir a pantalla de inicio\u201d. En Android, abre en Chrome \u2192 men\u00fa \u22ee \u2192 \u201cA\u00f1adir a pantalla de inicio\u201d. Se guarda todo en tu m\u00f3vil, sin conexi\u00f3n.',\n      item_modal_new:\"Nuevo \u00edtem\", item_modal_edit:\"Editar \u00edtem\",\n      label_name:\"Nombre\", label_weight:\"Peso (gra  de veritat \u2014 el pes total es va sumant sol. Amb \"Desmarca-ho tot\" ho deixes tot a zero de cop.</p><p><b>4. Consulta el resum.</b> El bot\u00f3 \"Veure motxilla\" et mostra nom\u00e9s el que tens marcat i el pes total, i des d\\'all\u00e0 pots tocar \ud83d\udda8\ufe0f per exportar-ho a PDF.</p><p><b>5. Crea diverses llistes.</b> Una checklist per tipus de sortida (nocturna, viatge, etc.). Les pots duplicar, reanomenar o compartir amb alg\u00fa altre.</p><p><b>6. Fes una c\u00f2pia de seguretat.</b> A \u2699 Configuraci\u00f3 \u2192 \"Exporta-ho tot (c\u00f2pia de seguretat)\" generes un codi amb TOT el teu cat\u00e0leg, llistes i ajustos; en un altre dispositiu fas servir \"Importa-ho tot\" per tenir-ho igual all\u00e0. \u00c9s la manera de passar les teves dades entre m\u00f2bils, ja que no se sincronitzen soles.</p><p><b>7. Instal\u00b7la-la com a app a la pantalla d\\'inici.</b><br>\ud83d\udcf1 <b>iPhone (Safari):</b> toca el bot\u00f3 Compartir (el quadrat amb la fletxa cap amunt) \u2192 \u201cAfegeix a la pantalla d\\'inici\u201d.<br>\ud83e\udd16 <b>Android (Chrome):</b> toca el men\u00fa \u22ee (a dalt a la dreta) \u2192 \u201cAfegeix a la pantalla d\\'inici\u201d o \u201cInstal\u00b7la l\\'aplicaci\u00f3\u201d.</p><p>Tot es desa nom\u00e9s al teu m\u00f2bil, sense necessitat d\\'internet.</p>',\n      help_close_btn:\"Ent\u00e8s\",\n      list_new:\"+ Nova\", list_dup:\"Duplicar\", list_ren:\"Reanomenar\", list_del:\"Eliminar\",\n      share_btn:\"Compartir / exportar\", import_btn:\"Importar\",\n      tab_checklist:\"La meva checklist\", tab_catalog:\"El meu equip\", adding_to_label:\"Afegint a:\",\n      go_to_equipo_btn:\"\ud83e\uddf0 Gestionar el meu equip\", empty_equipo_text:\"Encara no tens equip. Afegeix-lo a El meu equip.\",\n      uncheck_all_btn:\"Desmarca-ho tot\",\n      view_bag_btn:\"Veure motxilla\", bag_title:\"La teva motxilla\",\n      bag_empty_text:\"Encara no has marcat cap \u00edtem. Toca la casella \u2713 del que ja portes a la rol.\",\n      home_checklist:\"Checklist\", home_checklist_sub:\"Check off what you're bringing and see the weight\",\n      btn_create_bag:\"Create new bag\", bag_list_empty:\"You don't have any bags yet. Create one to start adding gear.\",\n      bag_items_label:\"items\", btn_back_to_bags:\"Bags\", btn_add_items:\"\u2795 Add items\", btn_back_to_bag:\"Back\",\n      home_catalog:\"My Gear\", home_catalog_sub:\"All your available gear\",\n      home_setup:\"Preload items\", home_setup_sub:\"Camera brand or example gear\",\n      home_settings:\"Settings\", home_lang:\"Language\",\n      app_name:\"Backpack\", eyebrow_label:\"Your backpack\",\n      home_help:\"Help\", help_title:\"How does Backpack work?\",\n      help_body_html:'<p><b>1. Preload your gear.</b> In \"Preload items\" pick your camera brand (or example gear) and it\\'s added to your My Gear with its weight.</p><p><b>2. Add what you\\'re taking.</b> Go to \"My checklist\" \u2192 My Gear tab, and tap \u201c+\u201d on everything you want for this outing.</p><p><b>3. Check off what\\'s already packed.</b> Tap the \u2713 box on each item once it\\'s actually in the bag \u2014 the total weight adds up automatically. \"Uncheck all\" resets everything to zero at once.</p><p><b>4. Check the summary.</b> The \"View backpack\" button shows only what you\\'ve checked and the total weight, and from there you can tap \ud83d\udda8\ufe0f to export it to PDF.</p><p><b>5. Create several lists.</b> One checklist per type of outing (night shoot, trip, etc). You can duplicate, rename, or share them with someone else.</p><p><b>6. Make a backup.</b> In \u2699 Settings \u2192 \"Export everything (backup)\" you get a code with your ENTIRE catalog, lists and settings; on another device use \"Import everything\" to have the same there. That\\'s how you move your data between phones, since it doesn\\'t sync automatically.</p><p><b>7. Install it as an app on your home screen.</b><br>\ud83d\udcf1 <b>iPhone (Safari):</b> tap the log || [];\n      equipoCategories = s.categories || equipoDefaultCategories();\n      equipoSettings = s.settings || equipoSettings;\n    }catch(e){ equipoCatalog = []; equipoCategories = equipoDefaultCategories(); }\n  }\n\n  function saveEquipo(){\n    try{ localStorage.setItem(EQUIPO_STORAGE_KEY, JSON.stringify({categories:equipoCategories, catalog:equipoCatalog, settings:equipoSettings})); }catch(e){}\n  }\n\n  function freshState(){\n    return {\n      lists: [],\n      activeListId: null,\n      settings: { maxWeight: 8000, glove:false, night:false, lang:\"es\" }\n    };\n  }\n\n  function load(){\n    try{\n      var raw = localStorage.getItem(STORAGE_KEY);\n      if (!raw) return freshState();\n      var s = JSON.parse(raw);\n      if (!s.lists) return freshState();\n      delete s.catalog; delete s.categories;\n      return s;\n    }catch(e){ return freshState(); }\n  }\n  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }\n\n  var state = load();\n  try{\n    var kitLang = localStorage.getItem(\"kitLang_v1\");\n    if (kitLang){ state.settings.lang = kitLang; }\n    var kitNight = localStorage.getItem(\"kitNight_v1\");\n    if (kitNight){ state.settings.night = (kitNight === \"on\"); }\n    var kitZoom = localStorage.getItem(\"kitZoom_v1\");\n    if (kitZoom){ state.settings.glove = (kitZoom === \"on\"); }\n  }catch(e){}\n  loadEquipo();\n\n  // ---------- helpers ----------\n  function activeList(){\n    var l = state.lists.filter(function(x){return x.id===state.activeListId;})[0];\n    if (!l){ l = state.lists[0]; state.activeListId = l ? l.id : null; }\n    return l;\n  }\n  function catalogItem(id){ return equipoCatalog.filter(function(x){return x.id===id;})[0]; }\n  function categoryById(id){ return equipoCategories.filter(function(x){return x.id===id;})[0]; }\n  function esc(s){\n    return String(s).replace(/[&<>\"']/g, function(c){\n      return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c];\n    });\n  }\n  function displayName(ci){ return ci.i18nKey ? t(ci.i18nKey) : ci.name; }\n  var SENSOR_LABELS = {\n    \"1\":\"Full Frame (35mm) \u2014 x1\", \"1.5\":\"APS-C Nikon/Sony/Fuji \u2014 x1.5\",\n    \"1.6\":\"APS-C Canon \u2014 x1.6\", \"2\":\"Micro 4/3 \u2014 x2\"\n  };\n  function itemSpecText(ci){\n    if (ci.category === \"camaras\" && ci.sensor){\n      return ci.sensor === \"custom\" ? (\"Personalizado (x\" + (Number(ci.customCrop)||1) + \")\") : (SENSOR_LABELS[ci.sensor] || \"\");\n    }\n    if (ci.category === \"objetivos\" && ci.focal){\n      return ci.focal + \"mm\";\n    }\n    if (ci.category === \"filtros\" && ci.filterType){\n      return ci.filterType === \"HA\" ? \"H\u03b1\" : ci.filterType;\n    }\n    return \"\";\n  }\n  function categoryName(cat){\n    var key = \"cat_\"+cat.id;\n    return (I18N.es[key] !== undefined) ? t(key) : cat.name;\n  }\n  function listDisplayName(l){ return l.nameKey ? t(l.nameKey) : l.name; }\n  function findByDisplayName(catalog, name){\n    for (var i=0;i<catalog.length;i++){ if (displayName(catalog[i])===name) return catalog[i]; }\n    return null;\n  }\n\n  // ---------- rendering: bag list (home screen) ----------\n  function renderBagList(){\n    var wrap = document.getElementById(\"bagListWrap\");\n    if (!wrap) return;\n    if (!state.lists.length){\n      wrap.innerHTML = '<div class=\"empty-state\"><span class=\"em-icon\">\ud83c\udf92</span><p>'+t(\"bag_list_empty\")+'</p></div>';\n      return;\n    }\n    var html = \"\";\n    state.lists.forEach(function(l){\n      var total = 0;\n      l.items.forEach(function(it){\n        var ci = catalogItem(it.itemId);\n        if (ci) total += ci.weight * it.qty;\n      });\n      html += '<div class=\"bag-card\">';\n      html += '<div class=\"bag-card-main\" data-action=\"open-bag\" data-id=\"'+l.id+'\">';\n      html += '<div class=\"bag-card-icon\">\ud83c\udf92</div>';\n      html += '<div class=\"bag-card-body\"><div class=\"bag-card-name\"
